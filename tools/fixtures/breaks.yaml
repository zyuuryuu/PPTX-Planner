# 見本(tools/fixtures/mini)を壊す差分の一覧。tools/selftest.py が、見本の写しに当てて使う。
#   cases    検査のIDごとの壊し方。当てると、その検査が不合格(警告の検査は警告)になる
#   format   書式と参照の確かめ(台帳にない)が誤りを出す壊し方。expect は、出る誤りの文の一部
#   records  検査の記録と実行の記録の書式の確かめ(check.py --records)が誤りを出す壊し方
# edits の1件は、次のいずれか。
#   {file, old, new}    old をちょうど1か所、new に置き換える
#   {file, delete: true} ファイルを消す
#   {file, write}       ファイルを、この文面で書く
# stage は、複数の工程で使う検査(KX)を当てる工程。item は、不合格になる対象。見本のままでも不合格の行がある検査(工程8)に書く。
