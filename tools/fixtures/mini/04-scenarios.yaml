- scenario: main-reader
  expected: 各章の出口で、定めた到達点の通りの状態になる。最後に、つながりにくい主な原因が経費精算システムの入れ替えによる問い合わせの増加であると述べられる。未回答の疑問がない
- scenario: skeptic
  expected: 「問い合わせが増えたのは、社員が増えたためではないか」に、付録で答えを得る
- scenario: summary-only
  expected: 応答率が下がったことと、その原因が問い合わせの増加であることを述べられる
- scenario: titles-and-points
  expected: 章の要点から結論を、節の要点から章の要点を、スライドの要点から節の要点を述べられる。題に重複がない
- scenario: mid-entry
  start: ch2
  expected: 第2章の入口の状態を、章扉と、第1章のまとめから得られる
- scenario: talk-through
  applicable: false
  reason: 配布して読ませる資料で、口頭の発表をしない
- scenario: past-feedback
  applicable: false
  reason: 過去に受けた指摘がない
