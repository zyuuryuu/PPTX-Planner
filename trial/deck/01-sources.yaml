  statement: NIST SP 800-61 Rev.2 は、指定時間内にチームが応答しない場合のエスカレーションの手順を定めるよう推奨し、例として、最初の連絡を繰り返し、15分ほど待って応答がなければインシデント対応チームの管理者など上位へ上げ、応答があるまで繰り返すとしていた
  kind: fact
