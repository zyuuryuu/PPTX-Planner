- id: F104
  statement: ホスト型IDPSは、単一ホストの特性とそのホスト内のイベントを不審な活動について監視する。監視しうる特性の例として、そのホスト宛のネットワーク通信、システムログ、実行中のプロセス、アプリケーション活動、ファイルへのアクセスと変更、システムとアプリケーションの設定変更が挙げられている
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 第2章 IDPS技術の種類(Host-Based)
  as_of: 2007-02
  quote: Host-Based, which monitors the characteristics of a single host and the events occurring within that host for suspicious activity. Examples of the types of characteristics a host-based IDPS might monitor are network traffic (only for that host), system logs, running processes, application activity, file access and modification, and system and application configuration changes.
  qualifiers:
  - 原文は 'might monitor' と 'Examples'(監視しうるものの例であり、必ず監視するものではない)
