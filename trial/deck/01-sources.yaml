- id: F109
  statement: ファイアウォールは、ルータと同様にポリシーに基づいて通信を許可または遮断するが、通信の検査にはるかに高度な方法を用いる。状態の追跡と内容の検査もできる。ルータよりも複雑なポリシーと詳細な活動ログを持つ傾向がある
  kind: fact
  source: NIST SP 800-92 Guide to Computer Security Log Management
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software(Firewalls)
  as_of: 2006-09
  quote: Like routers, firewalls permit or block activity based on a policy; however, firewalls use much more sophisticated methods to examine network traffic. Firewalls can also track the state of network traffic and perform content inspection. Firewalls tend to have more complex policies and generate more detailed logs of activity than routers.
  qualifiers:
  - 原文は 'tend to'(傾向がある)
  - 2006年版
  - SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)
