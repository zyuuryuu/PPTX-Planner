- id: F701
  statement: SIEM製品は、ログ分析を行う1台以上のログサーバと、ログを保存する1台以上のデータベースサーバを持つ。多くのSIEM製品は、ログ生成元からログを集める2つの方法に対応する
  kind: fact
  source: NIST SP 800-92 Guide to Computer Security Log Management
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf  3.4 Security Information and Event Management Software (p.3-9)
  as_of: 2006-09
  quote: 'Security information and event management (SIEM) software is a relatively new type of centralized logging software compared to syslog. SIEM products have one or more log servers that perform log analysis, and one or more database servers that store the logs. Most SIEM products support two ways of collecting logs from log generators:'
  qualifiers:
