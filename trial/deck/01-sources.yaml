  locator: https://learn.microsoft.com/en-us/defender-xdr/investigate-alerts  節 "Manage alert status and classification"
  as_of: 2026-11-09
  quote: True positive with a type of threat. Use this classification for alerts that accurately indicate a real threat. [...] Informational, expected activity with a type of activity. Use this option for alerts that are technically accurate, but represent normal behavior or simulated threat activity. You generally want to ignore these alerts but expect them for similar activities in the future where the activities are triggered by actual attackers or malware. Use the options in this category to classify alerts for security tests, red team activity, and expected unusual behavior from trusted apps and users. False positive for types of alerts that were created even when there's no malicious activity or for a false alarm. Use the options in this category to classify alerts that are mistakenly identified as normal events or activities as malicious or suspicious. Unlike alerts for 'Informational, expected activity', which can also be useful for catching real threats, you generally don't want
    to see these alerts again.
