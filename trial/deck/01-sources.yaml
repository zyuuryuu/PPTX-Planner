  statement: NIST SP 800-61 Rev.2 は、侵入検知システムが誤検知を出すことがあり、指標は理想的には個々に正当かを評価すべきであり、指標が正確でもインシデントが起きたとは限らず、ある事象が実際にインシデントかどうかの判断は判断の問題である場合があり、他の担当者と協力して決める必要がある場合があると述べていた
