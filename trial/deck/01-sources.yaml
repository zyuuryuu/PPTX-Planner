- id: F112
  statement: アプリケーションでしか記録できない情報が多く、そのためアプリケーションログは、アプリケーション関連のセキュリティインシデント、監査、遵守の取り組みに特に有用である。一方、アプリケーションログは独自形式であることが多く、内容が文脈に依存することが多いため、確認に多くの資源が要る
  kind: fact
  source: NIST SP 800-92 Guide to Computer Security Log Management
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.3 Applications
  as_of: 2006-09
  quote: Much of this information, particularly for applications that are not used through unencrypted network communications, can only be logged by the applications, which makes application logs particularly valuable for application-related security incidents, auditing, and compliance efforts. However, these logs are often in proprietary formats that make them more difficult to use, and the data they contain is often highly context-dependent, necessitating more resources to review their contents.
  qualifiers:
  - 「アプリケーション側でしか記録できない」のは、特に暗号化されていないネットワーク通信を通じて使われないアプリケーションの情報(原文 'particularly for applications that are not used through unencrypted network communications')
  - 原文は 'often'(〜が多い)
  - 2006年版
