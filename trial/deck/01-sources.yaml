  locator: https://learn.microsoft.com/en-us/azure/sentinel/false-positives  節 "False positive causes and prevention"
  as_of: 2026-07-02
  quote: 'Even in a correctly built analytics rule, false positives often stem from specific entities like users or IP addresses that should be excluded from the rule. Common scenarios include: Normal activities by certain users, usually service principals (automated identities used by applications and services), show a pattern that seems suspicious. Intentional security scanning activity coming from known IP addresses is detected as malicious. [...] Automation rules [...] Keep an audit trail. Exceptions immediately and automatically close created incidents, recording the reason for the closure and comments. [...] Allow applying exceptions for a limited time. For example, maintenance work might trigger false positives that outside the maintenance timeframe would be true incidents.'
  qualifiers:
