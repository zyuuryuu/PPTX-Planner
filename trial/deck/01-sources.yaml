  locator: https://cdn.nca.gov.sa/api/files/public/upload/e0790c91-e283-4349-995b-eca0639bb989_Standard_EDR_Template_en_.pdf  3 Data Analysis and Threat Pattern Identification, 3-3〜3-7 (下端の番号 p.8、PDF の9ページ目)
  as_of: 2023-11
  quote: 3-3 EDR solution must identify threat patterns based on aggregated data from all endpoints, rather than a single one. 3-4 EDR solution must compare new dataset patterns to the previous ones, in order to identify previously unknown or known malicious activities. 3-5 EDR solution must provide behavioral threat detection capabilities. 3-6 EDR solution must use globally accessible knowledge databases concerning cybersecurity threat categorization (e.g., MITRE ATT&CK globally accessible knowledge base of adversary tactics and techniques based on real-world observations). 3-7 EDR solution must assign risk scorings and categorize cyber-threats based on criticality and confidence. Criticality estimates the impact on the cyber environment of a potentially ineffective detection. Confidence means how likely it is that the detection is valid and not a false-positive.
