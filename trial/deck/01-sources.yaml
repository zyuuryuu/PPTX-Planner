- id: F700
  statement: ログ管理基盤は通常3層からなる。第1層はログデータを生成するホストで、ネットワーク経由で第2層のログサーバにログを渡すもの、サーバが認証してログを取得できるようにするものがある。第2層は第1層からログデータを受け取るログサーバで、転送はリアルタイムかほぼリアルタイム、または定期的な一括で行われる。ログデータはログサーバ自身か、別のデータベースサーバに保存される
  kind: fact
  source: NIST SP 800-92 Guide to Computer Security Log Management
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf  3.1 Architecture (p.3-1)
  as_of: 2006-09
  quote: 'A log management infrastructure typically comprises the following three tiers: Log Generation. The first tier contains the hosts that generate the log data. Some hosts run logging client applications or services that make their log data available through networks to log servers in the second tier. Other hosts make their logs available through other means, such as allowing the servers to authenticate to them and retrieve copies of the log files. Log Analysis and Storage. The second tier is composed of one or more log servers that receive log data or copies of log data from the hosts in the first tier. The data is transferred to the servers either in a real-time or near-real-time manner, or in occasional batches based on a schedule or the amount of log data waiting to be transferred. Servers that receive log data from multiple log generators are sometimes called collectors or aggregators. Log data may be stored on the log servers themselves or on separate database servers.'
  qualifiers:
  - 2006年版
  - ログ管理基盤(log management infrastructure)一般の記述で、SIEMに限らない
  - 原文は 'typically'(通常)
  - 第3層(ログの監視のコンソール)の記述は quote に含めていない
  - 箇条の記号を除いて連結した
  origin: NIST SP 800-92
