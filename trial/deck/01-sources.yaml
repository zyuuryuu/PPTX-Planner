- id: F113
  statement: 複数の時間帯にシステムを持つ組織は、記録された時刻を単一の時間帯に変換する必要があることが多い。システムの時計が互いにずれている場合は、ずれたログ源の記録時刻を加減する必要が生じうる
  kind: fact
  source: NIST SP 800-92 Guide to Computer Security Log Management
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 第3章 脚注24
  as_of: 2006-09
  quote: Normalizing times is often particularly challenging. Organizations with systems in multiple time zones often need to convert all logged times to a single time zone. Also, systems’ clocks might not be in sync with each other, so it might be necessary to add or subtract times from the log entries recorded by out-of-sync sources.
  qualifiers:
  - 原文は、時間帯の変換には 'often need'(多い)、時計のずれの補正には 'might be necessary'(必要になりうる)
  - SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)
