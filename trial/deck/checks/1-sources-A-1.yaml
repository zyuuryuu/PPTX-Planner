        加えるなら「1つ以上の戦術に、得られる結果に応じて」の限定も要る。
    c4: 合格
    c5: 合格
  - id: F118
    判定: 不合格
    c1: {判定: 合格, 理由: "Behavioral Analytics Development の項に実在"}
    c2: 合格
    c3:
      判定: 不合格
      引用: ["statement: 攻撃者が使うツールに依存しない、振る舞いに基づく検知分析"]
      理由: "「ツールに依存しない」は quote にない。直前の段落 \"...that is agnostic or independent of specific tools that may be used.\" にあり、そこでは may not rely on と弱く書かれている"
    c4: 合格
    c5: 合格
  - id: F119
    判定: 不合格
    c1: {判定: 合格, 理由: "/resources/ の Detections and Analytics に実在"}
    c2: 合格
