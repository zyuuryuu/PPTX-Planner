    判定: 不合格
    c1: {判定: 合格, 理由: "RS.MA R1、R2 に実在。quote は R1 のラベル \"R1:\" を省き、R2 のラベルは残している(軽い表記の差)"}
    c2:
      判定: 不合格
      理由: >
        R2 の続き "This set can range from simple to incredibly complex, depending on the needs and maturity of an organization." を落としている。
        要因の集合は組織の必要と成熟度により変わるという限定である。
    c3: 合格
    c4:
      判定: 不合格
      引用: ["qualifiers: 要因の具体例の続きは本文の次の行にある"]
      理由: >
        次の行は具体例ではなく上の成熟度の文で、具体例は N2 "Examples of possible risk evaluation factors include asset criticality, functional impact of the incident,
        data impact of the incident, stage of observed activity, threat actor characterization, and recoverability." にある。
        R1 の理由「資源に限りがあるため」も statement、qualifiers にない(軽い)。
    c5: 合格
