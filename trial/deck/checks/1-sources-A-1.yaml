      理由: >
        同じ行の続き "Detection may not always be possible for a given (sub-)technique and should be documented as such." を落としている。
        また Detection は * の付く必須項目で、記述は vendor agnostic にすると続く。
    c3: 合格
    c4: {判定: 不合格, 理由: "検知が可能とは限らないという限定が qualifiers にない"}
    c5: 合格
  - id: F300
    判定: 不合格
    c1: {判定: 合格, 理由: "3.2.6節に実在"}
    c2: 合格
    c3: {判定: 不合格, 理由: "「機能への影響・情報への影響・復旧の難しさ」は quote にない(quote は such as the following: で終わる)。軽い"}
    c4:
