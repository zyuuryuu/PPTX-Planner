    c4: {判定: 合格, 理由: "内容は合うが、書式の不備で1つの限定が3項目に割れている"}
    c5: {判定: 不合格, 理由: "頁の表示は \"Last updated April 2024\""}
  - id: F120
    判定: 不合格
    c1: {判定: 合格, 理由: "Table 2 の Detection* の行に実在"}
    c2:
