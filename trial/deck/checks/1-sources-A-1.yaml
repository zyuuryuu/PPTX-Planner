      引用: ["quote: Incidents should not be handled on a first-come, first-served basis as a result of resource limitations."]
      理由: "理由の「資源に限りがあるため」が statement にも qualifiers にもない(軽い)"
    c5: {判定: 不合格, 理由: "SP 800-61r2 は 2025-04-03 撤回(r3 に置き換え)。qualifiers にも as_of にもない"}
  - id: F301
    判定: 不合格
    c1: 合格
    c2: 合格
    c3:
      判定: 不合格
      引用: ["statement: 優先順位の要因は、...の3つ", "出典: handling should be prioritized based on the relevant factors, such as the following:"]
      理由: >
        出典は例示で、3つに限っていない。また quote は機能への影響の文だけで、情報への影響(CIA)と復旧のしやすさは quote にない。重い。
    c4: {判定: 合格, 理由: "qualifiers は quote の範囲を正しく述べている"}
    c5: {判定: 不合格, 理由: "SP 800-61r2 の撤回が書かれていない"}
  - id: F302
    判定: 不合格
    c1: 合格
    c2: 合格
    c3:
      判定: 不合格
      引用: ["quote: some incidents may not have smooth recovery paths and may need to be queued for a more strategic-level response", "statement: 復旧の道筋がないものは、より戦略的なチームに回すことがある"]
      理由: >
        smooth(円滑な)が落ち、「道筋がない」になっている。「チームに回す」は quote の後の例
        "the team may transfer part of the responsibility ... to a more strategic-level team" から取ったもので、そこでも責任の一部(part of)である。軽い。
    c4: 合格
    c5: {判定: 不合格, 理由: "SP 800-61r2 の撤回が書かれていない"}
  - id: F303
    判定: 合格
