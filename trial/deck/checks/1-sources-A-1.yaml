    c4: 合格
    c5: {判定: 合格, 理由: "\"Last updated Sep 15, 2026\" と一致"}
  - id: F307
    判定: 不合格
    c1: {判定: 合格, 理由: "Table 3-5 に実在"}
    c2:
      判定: 不合格
      理由: >
        表の前の本文を落としている:
        "Note that the actual steps performed may vary based on the type of incident and the nature of individual incidents.
        For example, if the handler knows exactly what has happened based on analysis of indicators (Step 1.1), there may be no need to perform Steps 1.2 or 1.3 ...
        it does not dictate the exact sequence of steps that should always be followed."
        qualifiers は最後の文だけを挙げている。合格条件は quote を広げることを求める。
    c3: {判定: 合格, 理由: "「順に並べ」は表の並びの記述として正しい。ただし 1.4 は \"As soon as the handler believes an incident has occurred\" の条件付き"}
    c4: {判定: 不合格, 理由: "「手順はインシデントの種類で変わる」「1.2、1.3 は不要な場合がある」がない"}
    c5: {判定: 不合格, 理由: "SP 800-61r2 の撤回が書かれていない"}
