name: 探索の計画の検査(分類の軸の検査、十分性、観点の包含、参考)
target: trial/deck/01-plan.yaml
upstream: trial/deck/00-brief.md
judge: Claude Sonnet 5.5 (claude-sonnet-5-5)
round: 1
summary:
  分類の軸の検査: {不合格: 10, 合格: 14, 判定できない: 0}   # 6問 x 4条件 = 24
  不合格の内訳: {Q0: 2, Q1: 1, Q2: 4, Q3: 0, Q4: 0, Q5: 3}
  十分性: 合格(補足4件)
  観点の包含: 合格

axis_check:
  Q0:
    axis: 研修資料の分解(前提となる知識、手順、判断の基準、誤りやすい点)と、解析を行う状況
    children: [Q1, Q2, Q3, Q4, Q5]
    基準を一言で言えるか:
      判定: 不合格
      引用: "研修資料の分解(前提となる知識、手順、判断の基準、誤りやすい点)と、解析を行う状況"
      理由: >
        基準が2つ「と」でつながれている。前半は資料の型(training)の分解に沿った
        「資料に必要な内容の種類」、後半は「解析を行う状況」で、基準が別である。
        Q5はこの後半だけから生まれた子で、前半の基準では説明できない。
    子は同じ水準か:
      判定: 合格
      引用: "Q1 一次解析を行うために、新人が新たに知る必要があることは何か / Q5 一次解析は、どんな状況で行われるか"
      理由: >
        どれも「研修資料に載せる内容の種類」として並べられる。ただし、Q5は
        Q0の問い(何をどの順で確かめ、何を基準に決めるか)への直接の部分ではなく、背景である。
        この点は水準の不一致とまでは言えないため、合格とする。
    重なりがないか:
      判定: 不合格
      引用:
        - "Q2.2 誤検知かどうかの判定は、一次解析のどの段階で、何を確かめて行うとされているか(Q2の下)"
        - "Q3.1 アラートを誤検知として閉じてよい条件は、何とされているか(Q3の下)"
        - "Q4.1 実際の攻撃を誤検知として閉じてしまう誤りは、どんな状況で起きるとされているか(Q4の下)"
        - "Q5.3 誤検知が多いことは、解析者の判断にどんな影響を与えるとされているか(Q5の下)"
      理由: >
        (1) Q2.2とQ3.1は、どちらも「誤検知と判定する条件」を問うており、答えが同じ文書の
        同じ記述になる。1つの問いが Q2 と Q3 の2つの枝に入る。
        (2) Q5.3の答え(誤検知の多さが判断を鈍らせ、見逃しにつながる)は、Q4.1の答え
        (実際の攻撃を閉じてしまう状況)とほぼ同じ内容になる。Q4とQ5の2つの枝に入る。
    子の数が軸から決まっているか:
      判定: 合格
      引用: "前提となる知識、手順、判断の基準、誤りやすい点 + 解析を行う状況 → 子5つ(Q1〜Q5)"
      理由: >
        軸の括弧内に挙げた項目と子が1対1に対応する(型の分解の「何ができるようになるか」は
        Q0そのものとブリーフの目的が担う)。ただし、軸の基準自体が2つ混ざっているため
        (上の「一言で言えるか」を参照)、5という数が1つの基準から決まるとは言えない。
        項目の対応が取れていることだけを理由に合格とした。

  Q1:
    axis: ブリーフで説明が要るとした項目(アラートを出す仕組み、端末の記録、攻撃の手口の体系、ログの見方)
    children: [Q1.1, Q1.2, Q1.3, Q1.4]
    基準を一言で言えるか:
      判定: 合格
      引用: "ブリーフで説明が要るとした項目"
      理由: 「ブリーフが未習とした項目」と一言で言える。ブリーフの「次は知らないため、資料で説明する」の5項目のうち「解析の進め方そのもの」はQ2以降が担うため除いてある。
    子は同じ水準か:
      判定: 合格
      引用: "Q1.1 SIEM / Q1.2 EDR / Q1.3 攻撃の手口の体系 / Q1.4 ログの種類"
      理由: どれも「新人が知る必要のある1つの知識の領域」で、粒度が揃っている。
    重なりがないか:
      判定: 不合格
      引用:
        - "Q1.2 EDRは、端末で何を記録し、何を根拠にアラートを出すか"
        - "Q1.4 一次解析で確かめるログには、どんな種類があり、それぞれから何が分かるか"
      理由: >
        EDRが端末で記録するものは、一次解析で確かめるログの1種類である。Q1.2の「何を記録するか」の答えは
        Q1.4の答えの一部になる。軸の文言でも「端末の記録」と「ログの見方」が別項目になっているが、
        問いの文面では範囲が切り分けられていない(Q1.4を「SIEMやEDR以外のログ」などに限る必要がある)。
    子の数が軸から決まっているか:
      判定: 合格
      引用: "アラートを出す仕組み、端末の記録、攻撃の手口の体系、ログの見方 → 4"
      理由: 軸の4項目と子の4つが対応し、抜けも余分もない。

  Q2:
    axis: 手順の範囲(全体の順序、その中の誤検知の判定、1件を調べる範囲)
    children: [Q2.1, Q2.2, Q2.3]
    基準を一言で言えるか:
      判定: 不合格
      引用: "手順の範囲(全体の順序、その中の誤検知の判定、1件を調べる範囲)"
      理由: >
        「手順の範囲」は括弧内の3項目を束ねる名前にとどまり、3つを同じ物差しで分ける基準になっていない。
        「全体の順序」は並びの話、「誤検知の判定」は手順の中の1段階、「1件を調べる範囲」は深さや時間の話で、
        物差しがそれぞれ違う。
    子は同じ水準か:
      判定: 不合格
      引用:
        - "Q2.1 公開されている一次解析(トリアージ)の手順は、何をどの順で確かめるとしているか"
        - "Q2.2 誤検知かどうかの判定は、一次解析のどの段階で、何を確かめて行うとされているか"
      理由: Q2.2はQ2.1の手順の一部(1段階)である。全体と、その部分が兄弟として並んでいる。
    重なりがないか:
      判定: 不合格
      引用:
        - "Q2.1 ... 何をどの順で確かめるとしているか"
        - "Q2.2 ... 何を確かめて行うとされているか"
      理由: >
        Q2.1の答え(全体の手順)は、誤検知の判定の段階を含む。Q2.2の答えはQ2.1の答えに含まれるため、
        重なる。さらに、Q2.2はQ3.1(閉じてよい条件)とも重なる(Q0の欄を参照)。
    子の数が軸から決まっているか:
      判定: 不合格
      引用: "全体の順序、その中の誤検知の判定、1件を調べる範囲 → 子3つ"
      理由: >
        軸が基準を示さず子を列挙しているだけで、3つであることの根拠が軸にない。
        同じ手順のうち「判定以外の段階(情報の補強、影響の評価など)」を子にしない理由も軸からは言えない。

  Q3:
    axis: 3つの判断
    children: [Q3.1, Q3.2, Q3.3]
    基準を一言で言えるか:
      判定: 合格
      引用: "3つの判断"
      理由: 「ブリーフが定める判断の選択肢(閉じる/調査を続ける/上に上げる)」と言える。「3つの判断」は数の表現だが、ブリーフの目的に3つが明記されており、基準を特定できる。
    子は同じ水準か:
      判定: 合格
      引用: "Q3.1 閉じてよい条件 / Q3.2 調査を続ける場合に追加で確かめること / Q3.3 上に上げる条件"
      理由: >
        3つとも「1つの判断を選ぶときの基準」を問う。Q3.2の文面は「条件」ではなく「追加で確かめること」で
        聞き方が少し違うが、判断ごとの基準という水準は揃っている。
    重なりがないか:
      判定: 合格
      引用: "Q3.1 / Q3.2 / Q3.3"
      理由: 3つの判断は互いに排他的で、子の間の重なりはない。他の枝との重なり(Q3.1とQ2.2)は、Q0の欄で指摘した。
    子の数が軸から決まっているか:
      判定: 合格
      引用: "閉じる/調査を続ける/上に上げる → 3"
      理由: ブリーフの3つの判断と子が1対1に対応する。

  Q4:
    axis: 誤りの向き(閉じるべきでないものを閉じる、上げなくてよいものを上げる)
    children: [Q4.1, Q4.2]
    基準を一言で言えるか:
      判定: 合格
      引用: "誤りの向き"
      理由: 「判断を誤る向き」と言える。
    子は同じ水準か:
      判定: 合格
      引用: "Q4.1 実際の攻撃を誤検知として閉じてしまう誤り / Q4.2 上に上げなくてよいアラートまで上げてしまう誤り"
      理由: どちらも「1つの誤り方が起きる状況」を問うており、水準が揃っている。
    重なりがないか:
      判定: 合格
      引用: "Q4.1 / Q4.2"
      理由: 誤りの向きが逆で、子の間に重なりはない。Q4.1とQ5.3の重なりは、Q0の欄で指摘した。
    子の数が軸から決まっているか:
      判定: 合格
      引用: "閉じるべきでないものを閉じる、上げなくてよいものを上げる → 2"
      理由: >
        軸が挙げる2つの向きと子が対応する。軸が2向きに限っていること自体は、十分性の欄(補足3)で別に挙げる。
        軸の範囲内では、抜けも余分もない。

  Q5:
    axis: 届くアラートの量と、その中身
    children: [Q5.1, Q5.2, Q5.3]
    基準を一言で言えるか:
      判定: 合格
      引用: "届くアラートの量と、その中身"
      理由: 「届くアラートの性質(量と中身)」と一言で言える。
    子は同じ水準か:
      判定: 不合格
      引用:
        - "Q5.1 SOCの解析者1人が受けるアラートの量は、どの程度か"
        - "Q5.2 SOCに届くアラートのうち、誤検知はどの程度の割合を占めるか"
        - "Q5.3 誤検知が多いことは、解析者の判断にどんな影響を与えるとされているか"
      理由: Q5.1とQ5.2はアラートの性質(量、中身)の実態を問う。Q5.3は、その性質が解析者に与える影響を問うており、アラートの性質ではなく結果である。水準が違う。
    重なりがないか:
      判定: 不合格
      引用:
        - "Q5.3 誤検知が多いことは、解析者の判断にどんな影響を与えるとされているか"
        - "Q4.1 実際の攻撃を誤検知として閉じてしまう誤りは、どんな状況で起きるとされているか"
      理由: Q0の欄に同じ。Q5.3の答えは、Q4.1の答えと重なる。
    子の数が軸から決まっているか:
      判定: 不合格
      引用: "届くアラートの量と、その中身 → 子3つ"
      理由: >
        軸から決まるのは「量」と「中身」の2つ。Q5.3は軸のどちらにも当たらない余分な子である。
        一方、「中身」は誤検知の割合だけで足りるか(真のアラートの種類や重大度の分布を含めなくてよいか)も
        軸からは決まらない。

sufficiency:
  判定: 合格
  引用: "Q0 新人がアラートを受けてから「誤検知として閉じる/調査を続ける/上に上げる」を決めるまでに、何をどの順で確かめ、何を基準に決めればよいか"
  理由: >
    「何をどの順で確かめ」はQ2.1(Q2.2、Q2.3が補う)、「何を基準に決めるか」はQ3.1〜Q3.3、
    受講者の3つの懸念のうち「誤検知ばかり」はQ5、「間違って閉じるのが怖い」はQ4.1とQ3.1、
    「どこまで調べたら上げてよいか」はQ2.3とQ3.3で、末端の問いが答えられれば、ブリーフの問いに答えられる。
    不足は、問いに答えられなくなる欠落ではなく、資料の質に関わる補足である。次を挙げる(補足)。
  補足:
    - 補足1: >
        上げるときに何を添えて渡すか(エスカレーションの記載事項)を問う末端がない。Q3.3は「上げる条件」だけで、
        「上げる」という判断を実行するときの中身は問われていない。ブリーフは上げた後の工程を範囲外とするが、
        上げる時点の記載は範囲内と読める。
    - 補足2: >
        「閉じる」判断の記録と、閉じた後の見直しの仕組み(後から再開できる、二重確認がある)を問う末端がない。
        最も重い懸念「間違って閉じるのが怖い」に対する安心の材料はこの種の事実で、Q4.1は誤りの状況を問うだけである。
    - 補足3: >
        Q4が、「上に上げるべきなのに調査を続けてしまう(上げ遅れ)」を問わない。Q4の軸が「閉じる」と「上げる」の
        2向きに限られているため。ブリーフの懸念3「どこまで調べたら上げてよいか」の裏にある誤りで、
        3つの判断のうち「調査を続ける」の誤りだけが探索から落ちている。
    - 補足4: >
        複数のアラートが同時に届くときの優先順位の付け方は、どの末端にも当たらない(Q5.1は量の統計のみ)。
        Q2.1の中で扱われる可能性はあるが、問いの文面からは読めない。

perspectives:
  判定: 合格
  定義: "研修資料の perspectives: [受講者が陥りやすい誤り] (docs/deck-types.md)"
  引用:
    - "Q4.1 ... perspective: 受講者が陥りやすい誤り"
    - "Q4.2 ... perspective: 受講者が陥りやすい誤り"
  理由: 定義の観点は1つで、Q4.1とQ4.2が含んでいる。

reference_not_scored:
  末端の問いの文面が結論を前提にしていないか:
    - 問い: Q5.3
      引用: "誤検知が多いことは、解析者の判断にどんな影響を与えるとされているか"
      指摘: 影響があること(誤検知の多さが判断を悪くすること)を前提にした聞き方になっている。「影響があるか。あるなら、どんな影響か」とすれば、影響なしの答えも取れる。
    - 問い: Q4.1
      引用: "実際の攻撃を誤検知として閉じてしまう誤りは、どんな状況で起きるとされているか"
      指摘: 誤りが起きる状況があることを前提にしているが、問いの性質上、許容できる範囲と読める。
    - 問い: Q4.2
      引用: "上に上げなくてよいアラートまで上げてしまう誤りは、どんな状況で起きるとされているか"
      指摘: Q4.1と同様。さらに「上げすぎ」が誤りとして扱われること自体が前提になっている。
    - 問い: Q2.2
      引用: "誤検知かどうかの判定は、一次解析のどの段階で、何を確かめて行うとされているか"
      指摘: 誤検知の判定が、手順の中の独立した段階として存在することを前提にしている。段階として置かれない手順もあり得る。
    - 問い: Q3.1、Q3.3
      引用: '"閉じてよい条件は、何とされているか" / "上に上げる(エスカレーションする)条件は、何とされているか"'
      指摘: 条件が定められていることを前提にしている。「条件が定められているか」から聞けば、定められていない答えも取れる(軽微)。
    - 問い: Q5.1、Q5.2
      指摘: 前提なし。
  重要度の付け方:
    - 問い: Q3.2
      引用: "priority: low"
      指摘: 3つの判断の1つなのに low。「調査を続ける」の基準は、ブリーフの懸念3(どこまで調べたら)に直結する。仮説ごとに答えが分かれるかを確かめられないが、重さの面で疑問がある。
    - 問い: Q2.3
      引用: "priority: low"
      指摘: 懸念3「どこまで調べたら上に上げていいのか分からない」に直接答える問いである。Q3.3が high で、Q2.3が low なのは、釣り合いが取れていない可能性がある。
    - 問い: Q4.2
      指摘: Q4.1が high で、Q4.2が low。誤りの向きを対にした問いで重要度が違う。重い懸念に合わせた付け方なら理解できる。
    - 備考: 仮説の一覧(01-hypotheses.yaml)は読まない決まりのため、「予想される答えが分かれる」基準での判定はしていない。上の指摘は、ブリーフの懸念との対応だけを根拠にした。
    - 問い: Q5.2
      引用: "priority: high"
      指摘: 数値の統計の問いで high。どの仮説でも答えが同じになる問いは low とする定義に照らすと、仮説を見ないと判断できない。

direction_to_fix:   # 検査の対象は変えない。直し方の提案のみ
  - Q0: axis を「ブリーフの目的から決まる4つの内容(前提、手順、基準、誤り)」に絞り、Q5を別の基準で置くか、Q5をQ0の子から外して背景としてQ1〜Q4の中に入れる。
  - Q2: 「手順の段階」(確認の順に並ぶ段階)で分けるか、Q2.1だけにして、Q2.2をQ3に寄せる。Q2.3は「調べる深さの目安」としてQ3.3の下に移す案がある。
  - Q3.1とQ2.2の統合。
  - Q5.3はQ4.1に統合して、Q5を「量」と「中身」の2つにする。
  - Q1.4は「SIEMやEDR以外を含めて一次解析で見るログの種類」と範囲を切る。
