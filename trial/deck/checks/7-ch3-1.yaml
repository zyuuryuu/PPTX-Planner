check: 工程7の重大な検査(裏付けのない文、限定の残存)
definition:
- docs/writing.md「検査」の節「検査セッションが判断するもの」の「裏付けのない文」「限定の残存」
- docs/checks.md「重大な検査」の工程7の2行(スライドの文に、裏付けのない文がない / スライドの文が、事実の限定を落としていない)
- 依頼の追加の定め: 案(公開資料から組み立てた部分)と、このSOCの運用(依頼者のSOCの規則)の区別が文で崩れていれば、裏付けのない文として扱う
target:
  file: trial/deck/07-slides/ch3.yaml
  commit: e8124ae   # eda8038 以降。e8124ae は描画の道具の変更で、ch3.yaml と作業票は eda8038 から変わっていない
  slides: [ch3-s1, ch3-s2, ch3-s3, ch3-s4, ch3-s5, ch3-s6, ch3-s7, ch3-s9, ch3-s10, ch3-s11, ch3-s16, ch3-s12, ch3-s13, ch3-s14]
  excluded: [ch3-s15, ch3-s17]   # 承認済みの型の見本
  upstream: trial/deck/work/ch3.md(章の主張、スライドごとのストーリーラインと立証の設計、使う事実の全文、仕組みの定義の S-newbie-ops の部分、語彙)
inspector: claude-opus-5-5
assumptions:
- '{F403} は台帳の value と unit で「12-20分」に、{F207} は「0.01%」に置き換わるものとして読んだ。'
- ストーリーラインの source は見出しの下に描かれるため、そこにある限定は残っているとみなした(依頼の指示)。見出しも画面に出るため、見出しにある限定も残っているとみなした。見出しの文そのものは判定していない。
- 文ごとの判定は、そのスライドの立証の設計の facts だけを裏付けとした(writing.md の「スライド仕様と、そのスライドが使う事実だけを渡す」)。ほかのスライドの事実なら裏付けられる場合は、その旨を reason に書いた。語彙の定義(terms.yaml)と同じ内容の文は、言葉の定義として合格とした。
- 限定の残存は、スライドの単位で、事実の qualifiers が画面かノートに残るかを見た。qualifiers のうち、引用の写し方の記録(「写した」「連結した」「区切りを付けた」「省略した」)と、依頼者の同意の経緯の記録は、主張の範囲を限るものではないため対象外とした(items に「対象外」と書いた)。
- flowchart(ch3-s13)は、labels に加え、描画で載る仕組みの定義のつながりの label(行き先の札)と「案の基準」の印も文として判定した。
- 出典の原文は開いていない(照合は依頼されていない)。事実の quote と qualifiers を正とした。
- 'D015(trial/deck/decisions.md。検査の後に PM から補足として届いた)を当て直した: 講義の決まり(案、運用)を述べる文の裏付けは、その決まりを述べるスライドのIDとし、事実から決まりが導かれるように言い切る文は不合格とする。14枚の決まりの文は、どれもその決まりを述べるスライドの上にあり(ch3-s4、s5、s6、s9、s11〜s14、s16 の takeaway、body、notes)、ほかのスライドの決まりを事実から導く形で言い切る文はなかった。このため判定は変わらない。ch3-s1 の takeaway(事実を理由に講義が案を作るとする文)は、すでに不合格としている。ch3-s13 notes「迷っている状態は…扱う」は決まりを述べるスライドそのもの(運用の印)の文で、D015 のスライドIDによる裏付けが自身を指すため、判定できないのままにした(依頼者の証言 F005、F006 にこの決まりはない)。'

summary:
  counts_note: 文ごとの2条件(134文×2=268件)と、スライドごとの限定の判定(14件)を合わせた282件
  fail: 15
  undeterminable: 6
  pass: 261
  main_findings:
  - ch3-s13 の限定の残存: 30分の持ち時間が「配属から3か月」の新人のもので、測って決めた値ではないこと(F005)が、画面にもノートにもない。
  - ch3-s13 notes「上げると決めるところまでが、新人が1人で行う判断。」は、章の主張 C3 の反論への応答で「この資料では」とする講義の位置づけで、運用の印のスライドでこのSOCの規則として読める(案と運用の区別の崩れ)。
  - ch3-s10 caveat「見直しの材料は、閉じるときに残した記録」は、運用の枠にあるが、このスライドの事実(F004、F318)では裏付けられない。F008(このスライドの facts にない)なら裏付けられる。ノートは同じことを「この講義は…使う」と講義の選択として書いており、枠と食い違う。
  - ch3-s1 takeaway「公的な順序は1つに決まっていない」は、スライドが示す食い違い(公的な文書1つと民間の解説1つ)と合わない。
  - ch3-s3 takeaway「民間の解説とは逆に」は、民間の解説の順(F312)がこのスライドの facts になく、裏付けられない。
  - ch3-s14 notes「全て上げれば、上げる件数は多くなる」は、1つのSOC(論文のSOC)の割合を、このSOCに当てはめている。限定の残存では、F207 の期間と分類不能(Unknown 23.72%)がこのスライドにない。

