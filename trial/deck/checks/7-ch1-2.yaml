判定:
- スライド: ch1-s2
  sources: []
  出典の行: なし
  裏付けに使った見出しと定義:
    ch3-s5: 案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる
    ch3-s11: このSOCでは、配属から3か月の新人の持ち時間は1件30分で、過ぎたら見たことを付けて上げる
    ch3-s13: このSOCでは、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる
    ch3-s17: 配属から3か月の新人は、重大度 High 以上か攻撃の試みなら上げ、一覧なら閉じ、残りは調べる(出典の行「このSOCの運用…調べる中で誤検知と言える基準は案」)
    T-investigate: 閉じるか上げるかを決めるために、持ち時間の中でログなどを確かめ続ける
    T-timebox: 新人が1件のアラートを調べてよい時間。このSOCでは配属から3か月は1件30分(defined_in ch3-s11)
    T-proposal: 公開資料の材料から、この講義が組み立てた基準。公的な基準でも、このSOCの運用でもない
  文:
  - 箇所: body.text(2文目)
    引用: 案として、誤検知は、根拠をもって誤検知と言えるものだけを閉じる
    前回の引用: 誤検知は、根拠をもって誤検知と言えるものだけを閉じる
    裏付け: 合格
    限定: 合格
    理由: >-
      裏付け: 内容は前回と同じで、ch3-s5 の見出しで裏付けられる。「案として」を足したことで、ch3-s5 の印とも一致した。
      限定: ch3-s5 の印「案として」が文頭に残った。「案として」は1文目の句点の後に置かれ、2文目だけにかかるため、
      1文目(ch3-s6、このSOCの運用)まで案と読まれることはなく、案と運用の区別(T-proposal)が映した画面で残る。
      ch3-s17 の出典の行「調べる中で誤検知と言える基準は案」とも合う。
      新しい問題: 見当たらない。notes[1]「閉じてよい2つの条件を順に読み上げ、どちらも「だけ」が付くことを強調する」は、
      2文目も「だけ」を含むため、引き続き文と食い違わない。
  - 箇所: body.caveat
    引用: どちらとも言えないものは閉じずに調べ、持ち時間まで調べても迷うなら上げる
    前回の引用: どちらとも言えないものは閉じず、迷ったら上げる
    裏付け: 合格
    限定: 合格
    理由: >-
      裏付け: 「閉じずに調べ」は ch3-s17「残りは調べる」と T-investigate(閉じるか上げるかを決めるために、持ち時間の中で確かめ続ける)で、
      「持ち時間まで調べても迷うなら上げる」は ch3-s13(30分調べても閉じる根拠がなく迷うなら上げる)と ch3-s11(過ぎたら上げる)、
      T-timebox(このSOCでは配属から3か月は1件30分)で裏付けられる。見出しより強い言い切りや広い言い切りはない。
      限定: 前回落ちていた ch3-s13 の条件(調べた上で、時間の区切りまで迷うなら上げる)が、「調べ」「持ち時間まで調べても」として残った。
      前回指摘した「調べずにすぐ上げると読める」点と、ch3-s17「残りは調べる」との食い違いは、解消した。
      数値「30分」は書かれていないが、「持ち時間」の定義(T-timebox)がこのSOCの30分を指すため、条件の値は語を通じて保たれていると判断した。
      ch3-s13 の印「このSOCでは」は文にないが、持ち時間はこのSOCが決めた値として定義された語であり、公的な基準や案としては読めない
      (前回、body.text 1文目の「リーダーが作った一覧」を同じ理由で合格としたのと揃えた)。
      ch3-s13、ch3-s11 の対象「配属から3か月の新人」も文にないが、T-timebox の定義が新人を対象とし、受講者が新人であるため、範囲は広がっていない。
      新しい問題: 裏付けと限定の検査では見当たらない。
      補足(判定は変えない。この検査の範囲外): 「持ち時間」は T-timebox で defined_in ch3-s11 の語で、ch1 では定義の前に使われる。
      受講者が ch1 の時点で値を知らなくても条件の形(時間を区切って調べ、それでも迷えば上げる)は読めるが、
      語の初出と定義の順を確かめる検査が別にあれば、そちらで扱う事項である。ノートで「持ち時間は第3章(ch3-s11)で扱う」と送る書き方もある。
