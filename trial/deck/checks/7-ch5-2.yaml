    quote: '誤検知と言う根拠は、検知の条件かデータのどこが誤りかで示す'
    source_quote: 'ch3-s5 headline: 案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる'
    reason: ch3-s5 の2つの理由(検知の条件の誤り、データの誤り)と同じ範囲になった。案であることは s4 の mark 案と notes で示される
