    verdict: 不合格
    previous: ch5-1-U2
    quote: '防がれた記録は、上げるときに添える証拠になります(ch3-s15)。'
    context_quote: 'ch5-s6 body.mark: 運用。notes 1文目: ch3-s14 の規則を当てはめます。このSOCの運用です。'
    source_quote: 'ch3-s15 headline: 案として、上げるときは、出どころとID、調べた経過、証拠、判定の仮説、次の手順を添える(body.mark: 案、items[2]: 集めた証拠)'
    reason: >-
      IDが添えられ、導出は確かめられた(防がれた記録は、ch3-s15 の「集めた証拠」に当たる)。
      ただし ch3-s15 の印は案で、ch5-s6 は印が運用、ノートも直前に「このSOCの運用です」と言う。添える項目が案であることがどこにも示されず、運用の決まりとして読める。
      前回の U2 の提案(「そのスライドが案なら、案と示す」)のうち後半が満たされていない。前回の ch5-1-F2、F3(ch5-s8)と同じ種類の食い違いで、そちらは直っている
    suggestion: '「上げるときに添える証拠になります。添える項目は案です(ch3-s15)。」のように、案と示す'

