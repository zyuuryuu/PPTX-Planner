検査の名前: 型の見本の検査
工程: 6 表現設計(docs/stages/06-patterns.md の合格条件「見本」のうち検査セッションが行うもの)
回: 1
対象:
  成果物: trial/deck/06-samples/*.png(10枚)、06-samples/*.yaml
  上流: trial/deck/06-patterns.yaml、trial/deck/05-proof.yaml(見本の id の focus、holds、show)、trial/deck/style.yaml の common、tools/check.py の PATTERN_IMPLIES
  コミット: 71cb5a74a94c411b323d0a0140233a0ae9f52759(ブランチの先にある d0f1136、3a948d7 の変更は見ていない)
判定者: 検査セッション(モデルの識別子は記載しない。依頼元への連絡に記す)
手順の記録: >-
  先に10枚の画像だけを見て、(a) 読み取れる関係、(b) 最初に目が行く場所、(c) 消しても情報が失われない要素を書いた(下の「画像だけの読み取り」)。
  その後で 06-patterns.yaml、05-proof.yaml、06-samples/*.yaml、style.yaml を読んで判定した。
  docs/visual-grammar.md は含意の語彙の表と、その直後の手がかりの表(配置、囲みと線)まで先に読んだ。
  文字の大きさは、画像から測らず、生成元の trial/deck/06-samples/src/samples.py の font-size(px)を、style.yaml の換算(1pt = 4/3 px)で下限と比べた。
  下限の px: 見出し 32、出典の行 21.3、本文 24、図の中の文字 21.3、図の注記 18.7。
  「最初に目が行く場所」は1人の検査者の見立てで、視線の計測ではない。

件数:
  不合格: 16   # 形からの読み取り4、focus 3、消せる要素5、共通の規則4
  判定できない: 1
  合格: 18     # 消せる要素の合格の1項目は5枚分として数えた

画像だけの読み取り:
  # 型の情報を読む前に書いた答え。判定の根拠として引用する
  architecture-diagram:
    関係: 左の枠の中は connected と ordered(端末→エージェント→中央のデータベースの流れ)。右は Defender for Endpoint とセンサー、アラートが connected。「持つ」の矢印も流れ(ordered)に読める。右下の破線の一覧はセンサーの近くにあり、センサーと grouped(センサーが集める記録)に読める。左右の2つの枠は横に並び comparable、equal-weight に読める
    最初に目が行く場所: 見出しの後、太い黒枠の左の枠
    消しても失われない要素: 下端の帯の結論が、見出しの前半(端末の振る舞いの記録を継続して集め)とほぼ同じ
  cause-chain:
    関係: causal、ordered(左から右、「ので」)
    最初に目が行く場所: 右端の濃い灰色の塗りに白い太字の「誤検知」。左端の太枠は2番目
    消しても失われない要素: なし(「ので」は style.yaml の因果の表記の規約)
  er-diagram:
    関係: 左から右の流れ(ordered)と connected。「問い合わせる」の矢印だけが右から左を向き、分析ルールから集めたデータへ何かが渡るように読める
    最初に目が行く場所: 右端の太枠の「アラート」
    消しても失われない要素: アラートの下の「ルールが探すものを見つけた」は見出しの言い換え(説明として残す理由はある)
  flowchart:
    関係: ordered(左から右に順に確かめる)、connected。色で行き先が grouped(赤=上げる、青=閉じる)。太枠の2つのひし形が emphasized
    最初に目が行く場所: 橙の塗りの「調べる」と、赤の札(すぐ上げる、上げる)。太枠のひし形はその後
    消しても失われない要素: 図の上の「運用 / 配属から3か月の新人」の「配属から3か月の新人」は見出しの冒頭と同じ
  pie-chart:
    関係: partition、proportional。太枠の橙の扇形が emphasized
    最初に目が行く場所: 太枠の橙の扇形と、太字の凡例「攻撃の試み 27%以上(下限)」
    消しても失われない要素: 凡例の下の「ネットワークの検知のアラート 約1,443万件の内訳(著者らの分類)」は出典の行と同じ情報
    気付いた点: 円の下端が切れている(図の領域で切り取られている)。円の扇形は 27%、49% を確定値として描く
  plain-list:
    関係: 太い黒枠で5項目が grouped。縦の並びで ordered(弱)。枠全体が emphasized
    最初に目が行く場所: 太い黒枠の一覧
    消しても失われない要素: 一覧を囲む太い黒枠(囲みの名前は上の札と見出しで足りており、枠は情報を足さない)
  statement:
    関係: 引用(主)と、太枠の但し書き(emphasized)。main-and-sub
    最初に目が行く場所: 太枠の「推定であり、確認された原因ではない」。引用の中の太字(のであれば、可能性がある)も目を引く
    消しても失われない要素: 太枠の但し書きは、出典の行の「確認された原因ではない」と同じ
  step-flow:
    関係: ordered(1→2、矢印)。左の3つが partition、右の3つが partition。左右の行が揃い、同じ高さの項目どうしが対応する(誤検知→閉じる、想定内の検知→調べる、攻撃の疑い→上げる)と強く読める
    最初に目が行く場所: 塗りの濃い色の帯(左右の6つ)。とくに青と赤
    消しても失われない要素: 番号(1.、2.)と矢印が同じ順序を二重に示す(軽微)
  table:
    関係: 行が comparable、列が同じ観点。太枠の「調べ方」の列が emphasized
    最初に目が行く場所: 太枠の「調べ方」の列
    消しても失われない要素: 出典の行が、表の出典の列、調べ方の列、値の列とほぼ同じ内容を繰り返す
  tree:
    関係: hierarchical(ATT&CK→戦術→技術)、connected。戦術の縦の並びに ordered(弱)。右の破線の案の枠は線でつながらず、どこに付くかは文で読む
    最初に目が行く場所: 太枠の「実行」
    消しても失われない要素: なし
    気付いた点: 案の枠の最後の行が、破線の枠の下端に重なる

判定:
# ---------- 形からの読み取り(implies と偽の含意) ----------
- 見本: architecture-diagram(ch2-s3)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 不合格
  引用: 'PATTERN_IMPLIES: architecture-diagram: ["connected"] / 画像: Defender for Endpoint →(持つ)→ センサー / style.yaml arrows: 実線の矢印: 流れ(次の段に進む、データが渡る、行き先に進む) / 画像: 破線の一覧「集める振る舞いの記録」がセンサーの真下に置かれ、注記「製品やアラートとの経路は出典にない」'
  理由: >-
    connected は読み取れる。偽の含意が2つある。(1)「持つ」は所有の関係だが、実線の矢印で描かれ、style.yaml の規約では流れ(データが渡る、次の段に進む)と読まれる。
    (2) 記録の一覧をセンサーのすぐ下に近づけて置いたため、近さ(grouped)でセンサーとつながって読める。注記は経路がないと言っており、形と注記が食い違う。
  直し方の案: 「持つ」は矢印でなく線(または入れ子)で示す。記録の一覧は製品の部品から離して置く。
- 見本: cause-chain(ch2-s8)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 合格
  引用: 'PATTERN_IMPLIES: cause-chain: ["causal", "ordered"] / 画像: 太い矢印と「ので」で3つの箱を左から右につなぐ'
  理由: 読み取った causal、ordered が implies と一致する。ほかの関係を強く読ませない。
- 見本: er-diagram(ch2-s1)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 不合格
  引用: 'PATTERN_IMPLIES: er-diagram: ["connected"] / 画像: 分析ルール →(問い合わせる)→ 集めたデータ(右から左の矢印) / style.yaml flow_direction: 左から右(時間、手順、因果、データの流れ)、arrows: 実線の矢印: 流れ(…データが渡る…)'
  理由: >-
    connected は読み取れるが、4つの箱が1列に並び矢印でつながるため、ordered の流れとして強く読める(implies にない)。
    その流れの中で「問い合わせる」の矢印だけが右から左を向き、実線の矢印の規約では「分析ルールから集めたデータへデータが渡る」と読める。実際はルールがデータを読む向きで、偽の含意になる。
  直し方の案: 問い合わせの関係を矢印でなく、ラベル付きの線にする。または、ルールを集めたデータの下に置いて流れの列から外す。
- 見本: flowchart(ch3-s17)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 合格
  引用: 'PATTERN_IMPLIES: flowchart: ["ordered", "connected"] / 画像: ひし形を左から右に順に並べ、「いいえ」で次へ、「はい」で下の行き先へ'
  理由: 読み取った ordered、connected が implies と一致する。色による行き先の grouped は style.yaml の色の割り当て(閉じる、上げる)どおりで、偽の含意ではない。
- 見本: pie-chart(ch2-s6)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 合格
  引用: 'PATTERN_IMPLIES: pie-chart: ["partition", "proportional"] / 画像: 凡例「攻撃の試み 27%以上(下限)」「想定内の検知 49%以上(下限)」'
  理由: >-
    partition、proportional が読み取れ、implies と一致する。注意点: 扇形は 27%、49% を確定値の大きさで描くため、proportional は下限の値を確定値のように見せる。
    下限であることは凡例にだけあり、円の上にはない(05-proof.yaml の show は「27%と49%が下限であることを帯に書く」)。偽の含意とまでは言えないため合格とし、指摘に残す。
- 見本: plain-list(ch3-s15)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 不合格
  引用: 'PATTERN_IMPLIES: plain-list: [] / 05-proof.yaml ch3-s15 relation_reason: 添える項目の一覧で、項目の間に順序や比較の関係がない / 画像: 5項目の一覧全体を太い黒枠(5px)で囲む'
  理由: >-
    implies は空だが、太い黒枠は style.yaml で強調の印であり、一覧全体が emphasized に読める。全体を強調すると、どこにも注目点がないのと同じで、強調の印の意味が薄まる。
    縦の並びの ordered(弱)は列挙の慣習の範囲で、問題にしない。
  直し方の案: 太枠をやめる(囲むなら細い線か背景)。強調するなら「5項目そろえる」点を1か所で示す。
- 見本: statement(ch4-s2)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 合格
  引用: 'PATTERN_IMPLIES: statement: ["emphasized"] / 画像: 太枠の「推定であり、確認された原因ではない」'
  理由: emphasized が読み取れ、implies と一致する。引用と但し書きの main-and-sub は内容どおりで、偽の含意ではない。
- 見本: step-flow(ch1-s1)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 不合格
  引用: '画像: 左「誤検知 / 想定内の検知 / 攻撃の疑い」と右「閉じる / 調べる / 上げる」が同じ高さで1対1に並ぶ / 05-proof.yaml ch3-s17 show: 3 一覧にある→想定内の検知として記録して閉じる、4 どれでもない→調べる(30分まで)。調べる中で、誤検知と根拠をもって言えた→誤検知として記録して閉じる'
  理由: >-
    implies の ordered(1→2)は読み取れる。ただし左右の項目を同じ高さに並べたため、「誤検知→閉じる、想定内の検知→調べる、攻撃の疑い→上げる」という行ごとの対応(connected、comparable)を強く読ませる。
    資料自身の流れ図(ch3-s17)では、想定内の検知は閉じ、調べるのは「どれでもない」ものであり、行ごとの対応は偽の含意である。新人に誤った対応を覚えさせるおそれがある。
  直し方の案: 右の3つを左と高さをずらす、横1列にする、または左右で数と並びが対応しないことが分かる形にする。行き先の色の塗りをやめ、1段目と2段目の順だけを示す。
- 見本: table(ap-s1)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 合格
  引用: 'PATTERN_IMPLIES: table: ["comparable"] / 画像: 値の列「1日 約13,764件」「5,000件未満が45%」「1日平均 4,484件」/ 太枠の「調べ方」の列'
  理由: >-
    行の comparable が読み取れ、implies と一致する。注意点: 値の列は右揃えの数値で、同じ尺度で比べられるように見えるが、2行目は分布(5,000件未満が45%)で単位が違う。
    結論(調べ方をそろえないと比べられない)は太枠の「調べ方」の列が支えており、偽の含意とまでは言えない。
- 見本: tree(ch2-s5)
  条件: 形からの読み取りが implies と合い、偽の含意がない
  判定: 合格
  引用: 'PATTERN_IMPLIES: tree: ["hierarchical"] / 05-proof.yaml ch2-s5 holds: [hierarchical, connected]'
  理由: >-
    hierarchical と connected が読み取れ、implies(と holds)に合う。戦術の縦の並びの ordered(弱)は、例示の4つが攻撃の段階の順に並ぶことと矛盾せず、強くもない。
    参考(本条件の対象外): show の「当てはめた戦術から、優先度の要因『活動の段階』へ矢印(案)」の矢印は画像になく、案の枠は線でつながっていない。

# ---------- 最初に目が行く場所と focus ----------
- 見本: architecture-diagram(ch2-s3)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: EDRは端末の振る舞いを継続して集め、製品は脅威を検知するとアラートを作ること(2つをつなぐ経路は示さない) / 画像: 太い黒枠の左の枠'
  理由: 目が行くのは太枠の左の枠(集める流れ)で、focus の前半に合う。後半(アラートを作る)は2番目に読まれる。
- 見本: cause-chain(ch2-s8)
  条件: 最初に目が行く場所が focus と合う
  判定: 不合格
  引用: 'focus: 原因が検知の条件の側にあること / highlight: chain[0] / 画像: 右端の「誤検知」は濃い灰色(#6B7280)の塗りに白の太字28px、左端の「検知のルールが緩く書かれている」は太枠に太字24px'
  理由: 最も目を引くのは、塗りが濃く文字も大きい右端の「誤検知」(結果)で、focus の原因(左端)ではない。太枠の強調が、塗りの強さに負けている。
  直し方の案: 「誤検知」の塗りを薄くする(色の割り当ては枠の線や小さな印で保つ)か、原因の箱を最も強く見せる。
- 見本: er-diagram(ch2-s1)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: アラートは、ルールが探すものを見つけたときに出す知らせであること / 画像: 太枠に太字26pxの「アラート」'
  理由: 目が行くのは「アラート」の箱で、focus に合う。
- 見本: flowchart(ch3-s17)
  条件: 最初に目が行く場所が focus と合う
  判定: 不合格
  引用: 'focus: 上げる条件を先に確かめ、閉じるのは一覧にあるか、調べて誤検知と言えたときだけであること / highlight: 上げる条件の2つの分かれ目(重大度、攻撃の試み)を先に確かめる順 / 画像: 橙の塗りの「調べる」(太字22px)、赤・青の塗りの札6つ、太枠のひし形2つ'
  理由: >-
    最初に目が行くのは、塗りの強い橙の「調べる」と赤の札で、太枠のひし形は白地のため後になる。focus の「上げる条件を先に確かめる順」は、強い塗りの行き先(8つの彩色要素)に埋もれる。
    「閉じるのは…ときだけ」も、青の札2つが離れて置かれ、形からは目に入りにくい。
  直し方の案: 行き先の札の塗りを弱める(枠線の色だけにする等)か、太枠を1か所にして上げる条件の2つを1つのまとまりとして示す。
- 見本: pie-chart(ch2-s6)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: 誤検知でも想定内でもない攻撃の試みの帯(27%以上) / 画像: 太枠の橙の扇形、太字の凡例'
  理由: '目が行くのは太枠の橙の扇形で、focus に合う。参考: 円の中に「誤検知」の区分はなく、結論の帯の「誤検知でも想定内でもない」の「誤検知」は図の上で確かめられない(内容の検査の対象)。'
- 見本: plain-list(ch3-s15)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: 5項目そろえて渡すこと / 画像: 太枠の5項目の一覧、上の札「案 上げるときに添える5項目」'
  理由: 目が行くのは5項目の一覧で、focus に合う。ただし「そろえて渡す」は形ではなく札の文で伝わる。
- 見本: statement(ch4-s2)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: これが推定であること / 画像: 太枠の「推定であり、確認された原因ではない」'
  理由: 目が行くのは太枠の但し書きで、focus に合う。引用の中の太字(のであれば、可能性がある)も同じ点を指しており、focus と食い違わない(強調の数の問題は common で扱う)。
- 見本: step-flow(ch1-s1)
  条件: 最初に目が行く場所が focus と合う
  判定: 不合格
  引用: 'focus: 分けてから決める、という2段の順 / highlight: steps[0] / 画像: 6つの彩色の帯(灰、青緑、橙、青、茶、赤)、2つの枠の間の細い矢印1本、左の枠の太枠'
  理由: >-
    最初に目が行くのは彩色の6つの帯で、個々の区分と行き先に目が行く。focus の「2段の順」を担うのは細い矢印1本と番号で、目立たない。
    また highlight の steps[0](1段目だけの太枠)は、2段の順という focus とずれている。
  直し方の案: 帯の塗りを無彩色にし、2つの段と矢印を図の主役にする。強調は使わないか、順(矢印)に置く。
- 見本: table(ap-s1)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: 調べ方と値が出典ごとに違うこと / 画像: 太枠の「調べ方」の列'
  理由: 目が行くのは調べ方の列で、focus の前半に合う。値の違いは隣の列で続けて読まれる。
- 見本: tree(ch2-s5)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: アラートの活動を戦術に当てはめると、攻撃のどの段階かを言えること / 画像: 太枠の「実行」'
  理由: 目が行くのは当てはめた戦術「実行」で、focus に合う。

# ---------- 消しても情報が失われない要素 ----------
- 見本: architecture-diagram, cause-chain, er-diagram, step-flow, tree
  条件: 消しても情報が失われない要素がない
  判定: 合格
  理由: >-
    消せる要素は見つからなかった。architecture-diagram の下端の帯は見出しの前半と近いが、takeaway は style.yaml(takeaway_on_slide: true)で必ず置く要素のため数えない。
    er-diagram の「ルールが探すものを見つけた」、step-flow の番号と矢印の重なりは軽微で、説明や読む順を助けるため不合格にしない。
- 見本: flowchart(ch3-s17)
  条件: 消しても情報が失われない要素がない
  判定: 不合格
  引用: '画像: 図の上の「運用」の札と「配属から3か月の新人」 / 見出し: 配属から3か月の新人は、重大度が高いか…'
  理由: 「配属から3か月の新人」は見出しの冒頭と同じ文で、消しても情報は失われない。05-proof.yaml の show が「図の上に『配属から3か月の新人』」を求めているが、見出しが同じことを言う以上、画像上は重複である。運用の札(このSOCの運用の印)は残す意味がある。
- 見本: pie-chart(ch2-s6)
  条件: 消しても情報が失われない要素がない
  判定: 不合格
  引用: '画像: 「ネットワークの検知のアラート 約1,443万件の内訳(著者らの分類)」 / 出典の行: 1つのSOCのネットワークの検知(Zeek)の2020年12月〜2022年7月のアラート約1,443万件を著者らが分類'
  理由: 凡例の下の1行は、出典の行と同じ情報で、消しても失われない。
- 見本: plain-list(ch3-s15)
  条件: 消しても情報が失われない要素がない
  判定: 不合格
  引用: '画像: 5項目を囲む太い黒枠(border:5px solid #111827) / style.yaml rules P008: 意味のない囲みを使わない'
  理由: 囲みの名前は上の札「上げるときに添える5項目」が担っており、太枠は情報を足さない。強調の印としても、全体を囲むため注目点を示さない。
- 見本: statement(ch4-s2)
  条件: 消しても情報が失われない要素がない
  判定: 不合格
  引用: '出典の行: 米上院商務委員会の多数党スタッフの報告(2014年)。確認された原因ではない / 太枠: 推定であり、確認された原因ではない'
  理由: 「確認された原因ではない」が出典の行と太枠の両方にあり、どちらか一方は消しても情報が失われない。focus の担い手は太枠なので、出典の行の側を消すのが自然。
- 見本: table(ap-s1)
  条件: 消しても情報が失われない要素がない
  判定: 不合格
  引用: '出典の行: Yangら(USENIX Security 2024。1つのSOCの2020年12月〜2022年7月。自動遮断の後に解析者が扱った件数)、Alahmadiら(USENIX Security 2022。SOC実務者20人の回答)、Vectra AI の調査(2023年、自己申告で1日平均4,484件) / 表: 実測(自動遮断の後に解析者が扱った件数)、回答(自己申告)、1日平均 4,484件'
  理由: 出典の行の括弧の中(調べ方、人数、値)は、表の出典、調べ方、値の列と重なる。出典の行は文献の特定(著者、会議、年)だけで足りる。

# ---------- 資料に共通の規則(style.yaml common) ----------
- 条件: 文字の大きさの下限(font_min)
  判定: 不合格
  対象: architecture-diagram、flowchart、pie-chart、er-diagram、tree、cause-chain
  引用: 'style.yaml common.font_min: figure_text: 16pt(=21.3px)、note: 14pt(=18.7px)、body: 18pt(=24px) / samples.py: arrow() のラベル font-size="19"、diamond() fs=20'
  理由: 図の中の文字が 21.3px 未満のものが多い。注記の扱いでも 18.7px 未満のものがある。
  内訳:
  - 'architecture-diagram: 矢印のラベル「持つ」「作る」19px、「Defender for Endpoint」「センサー」「中央のデータベース」20px、「集める振る舞いの記録」と一覧の4項目 19px(図の中の文字 21.3px 未満)。「製品やアラートとの経路は出典にない」17px(注記の 18.7px も下回る)'
  - 'flowchart: ひし形の文字 20px、「いいえ」「はい」「30分で根拠なし」19px、「想定内の検知として記録して閉じる」「見たことを付けて上げる」19px、「誤検知として記録して閉じる」18px、「30分まで」18px、「誤検知と根拠をもって言えた」19px、「案の基準」17px(注記の下限も下回る)'
  - 'pie-chart: 「0.01%(細すぎて見えない)」18px(注記の下限も下回る)'
  - 'er-diagram: 「問い合わせる」20px(図の中の文字)。図の下の1行「1つのSOCの…0.01%(10枚目で詳しく)」22px は本文なら 24px 未満'
  - 'tree: 「戦術(なぜ)の例」「技術(どのように)の例」「コマンドの実行」と案の枠の本文 20px、「案」18px'
  - 'cause-chain: 「ので」21px(21.3px をわずかに下回る)'
  注記: 06-patterns.md では文字の大きさは機械の検査の条件でもある。本件は生成元の値から読んだもので、描画後の測定ではない。
- 条件: 色の割り当て(同じ対象は同じ色。割り当てた色を別の対象に使わない)
  判定: 不合格
  対象: step-flow
  引用: 'style.yaml common.colors: 攻撃の試み: #EA580C / samples.py step-flow: (''攻撃の疑い'', C[''攻撃の試み''])'
  理由: >-
    step-flow は「攻撃の疑い」(一次解析の区分)に「攻撃の試み」(Yangらの分類、pie-chart の区分)の色を使っている。2つが同じ対象ならば呼び方が食い違い、違う対象ならば割り当てた色を別の対象に使っている。どちらでも規則に反する。
    軽微: flowchart の強調しないひし形の線(#6B7280)は「誤検知」の色と同じ値である。
- 条件: 強調は1枚に1か所(太い黒の枠と太字)
  判定: 不合格
  対象: statement、flowchart、cause-chain
  引用: 'style.yaml common.emphasis: 注目させる点だけを、太い黒(#111827)の枠と太字で示す。…1枚に1か所'
  理由: >-
    statement: 太枠の但し書きに加え、引用の中の「のであれば」「可能性がある」を太字にしており、強調が3か所ある。
    flowchart: 太枠と太字のひし形が2つある(highlight も2つの分かれ目を指す)。
    cause-chain: 太枠の原因の箱に加え、「誤検知」を太字28pxにしている(塗りも濃い)。
    参考: どの見本でも、行き先の札、図の見出し(architecture-diagram の「EDRの要件の例(NCA)」など)、tree の根「ATT&CK」に、強調でない太字を使っている。太字を強調の印と決めた規則と合わず、強調の印が弱まる。
- 条件: 1枚で使う色相の数(max_hues_per_slide 4、灰色と黒を除く)
  判定: 判定できない
  対象: step-flow
  引用: 'style.yaml common.max_hues_per_slide: 4 / step-flow の塗り: #0E7490、#EA580C、#2563EB、#B45309、#DC2626(灰の #6B7280 を除く)'
  理由: >-
    割り当てた色の数では5つで上限を超える。色相で数えると #EA580C(約21°)と #B45309(約26°)はほぼ同じ橙系で、4つになる。style.yaml は色相の数え方(色の数か、色相の幅か)を定めていないため判定できない。
    flowchart は青、茶(橙系)、赤、紫の4つで上限内、ほかの見本は上限内。
    参考: 橙(攻撃の試み)と茶(調べる)は色相が近く、step-flow のように同じ画面に並ぶと区別が弱い。
- 条件: 定位置(positions、flow_direction、arrows)
  判定: 不合格
  対象: er-diagram、architecture-diagram、cause-chain、plain-list、pie-chart
  引用: 'style.yaml common: flow_direction: 左から右(…データの流れ) / arrows: 実線の矢印: 流れ / positions: source_line: 見出しのすぐ下、note: 図の左下'
  理由: >-
    er-diagram: 「問い合わせる」の矢印が右から左を向き、流れの向きの規則に反する(形からの読み取りの指摘と同じ箇所)。
    architecture-diagram: 「持つ」(所有)に実線の矢印を使い、矢印の意味(流れ)の規則に反する。
    cause-chain、plain-list: 見出しが1行なのに、出典の行が見出しから約60px離れて置かれ、「見出しのすぐ下」になっていない(生成元が見出しの字数から2行と見積もるため)。
    pie-chart: 注記「ネットワークの検知のアラート 約1,443万件の内訳」が図の左下でなく凡例の下にある(軽微)。

描画上の問題(本検査の条件の外。機械の診断の対象):
- 'pie-chart: 円の下端が図の領域(高さ360px)で切れている。中心 y=205、半径165で下端が370になり、領域を超える'
- 'tree: 案の破線の枠の最後の行「優先度の要因『活動の段階』に使う」が、枠の下端の線に重なる'

主な指摘:
- 'step-flow: 左右の項目を同じ高さに並べ、誤検知→閉じる、想定内の検知→調べる、攻撃の疑い→上げる、という偽の対応を読ませる(流れ図 ch3-s17 と食い違う)。最初に目が行くのも彩色の帯で、focus の「2段の順」ではない'
- 'er-diagram、architecture-diagram: 矢印の向きと意味が style.yaml の規約に反し、偽の含意を生む(問い合わせるの逆向きの矢印、「持つ」の矢印、記録の一覧の近さ)'
- 'cause-chain、flowchart: 塗りの強い要素が太枠の強調に勝ち、最初に目が行く場所が focus と合わない'
- '文字の大きさ: 図の中の文字に 17〜20px が多く、下限(16pt=21.3px、注記 14pt=18.7px)を下回る'
- '重複: statement の但し書きと出典の行、table の出典の行と表、pie-chart の注記と出典の行、flowchart の「配属から3か月の新人」と見出し、plain-list の太枠'
