検査の名前: question
対象: trial/deck/00-brief.md の「答えるべき問い」
定義: docs/stages/00-brief.md の「合格条件」(答えるべき問いの3条件)
判定者: claude-sonnet-5-5
回: 1
問い(引用): "新人がアラートを受けてから「誤検知として閉じる/調査を続ける/上に上げる」を決めるまでに、何をどの順で確かめればよいか"
条件:
  - 条件: 問いが1つである
    判定: 合格
    引用: "何をどの順で確かめればよいか"
    理由: 疑問文は1文で、確かめる対象と順序を1つの手順として尋ねている。「何を」と「どの順で」は1つの答え(順序付きの確認手順)で同時に埋まるため、独立した2問とは読まない。
  - 条件: 答えの形が決まっている
    判定: 合格
    形: どうやるか(手順)
    引用: "何をどの順で確かめればよいか"
    理由: 答えは、確認項目を順に並べた手順になる。はい/いいえ、選択、量の形ではなく「どうやるか」に当たる。
  - 条件: 答えが、目的に書いた行動につながる
    判定: 合格
    引用:
      問い: "「誤検知として閉じる/調査を続ける/上に上げる」を決めるまでに"
      目的: "届いたアラートを見て、誤検知として閉じる、調査を続ける、上に上げる、のいずれかを1人で決められるようにする"
    理由: 問いの終点(3択の決定)と、目的の行動(同じ3択を1人で決める)が同じ語で一致している。手順が分かれば、目的の行動に進める。
    留意: 目的は「1人で決められる」まで求める。問いの答えが確認の順序だけで、各段階で3択のどれに倒すかの基準を含まない場合、行動には届かない。問いの文言は基準を除外していないので不合格にはしない。
要約(判定ではない): >
  アラートの一次解析を初めて任される新人3人に、SOCのリーダーが、配属後3か月で自力で対応を決められるようにするための講義資料。
  届いたアラートについて、何をどの順で確かめれば、閉じる・続ける・上げるのどれにするか決められるか、を答える。
  受講者はネットワーク・サーバー運用の経験者で、セキュリティ製品は未経験。
気づいた点(参考。合否に含めない):
  - 状態の食い違い: 「読み手の立場と懸念」は状態が確定だが、本文に「立場は、教わる側として中立と置いた(全体の確認で依頼者に示す)」とあり、立場は未確認の推定に読める。
  - 状態が推定のまま残る項目がある(資料の型、副次的な読み手)。合格条件の「推定のまま残る項目がない」に未達の見込み。
  - 「90分の講義を2回」は、同じ内容を2回行うのか、2回で1つの内容を分けるのかが読めない。50枚の上限の置き方が変わる。
  - 「公開されている資料を調べて使う」とあるが、受講者が使うSIEM・EDRの製品名が書かれていない。製品固有の画面や用語をどこまで扱うかが決まらない。
  - 最も重い懸念「間違って閉じるのが怖い」への答えは、問いが手順なので、閉じてよい条件の基準が答えに入るかどうかで決まる。問いの文言からは明確でない。
  - 習得の確認は講義内の演習だけで、目的の「配属から3か月」の達成確認は資料の外。ブリーフに明記されており矛盾ではない。
