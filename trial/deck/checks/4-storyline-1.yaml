検査の名前: 見出しが、根拠の事実の限定を落としていない(工程4の重大な検査、1回目)。あわせて見出しの数値と evidence の値の一致(手で確認)
対象: trial/deck/04-storyline.yaml(コミット 49a88e24)の全てのスライドの headline と source
判定者: claude-opus-5-5(検査セッション)
上流: 01-sources.yaml(各スライドの evidence が指す事実の statement、value、quote、qualifiers、source、as_of、kind。F205 は ch2-s7 の「だけ」を確かめるため metric で検索して見た)、terms.yaml、decisions.md(D001、D002、D004、D005、D006)、docs/stages/04-storyline.md の合格条件、docs/checks.md の重大な検査
判定の約束: D006。見出しと source を合わせて限定が落ちていなければ合格。ただし意味の範囲を変える限定(1つのSOC、自己申告、下限、案、このSOCの運用、「通常」「なりうる」などの度合い、調べた範囲での「ない」)は見出し自体に要る
件数: {合格: 28, 不合格: 8, 判定できない: 0, 対象外: 1}
件数の数え方: 本論と付録の evidence のあるスライド31枚を1件ずつ、ch5 は答えのスライド4枚を問いのスライドと組にして4件、数値の照合を1件。ch1-s1 は evidence がなく対象外
項目:
  - 項目: ch1-s1
    判定: 対象外
    理由: from は Q0、evidence がない。講義の到達目標で、事実の限定の検査の対象にならない

  - 項目: ch1-s2
    判定: 合格
    引用: 「1つのSOCの実測では、誤検知でも想定内の検知でもない攻撃の試みが27%以上あった」
    対比: F207 qualifiers「1つのSOC」「27%と49%は下限」
    理由: 1つのSOC、下限(以上)が見出しにある。測定の対象(Zeek のネットワークの検知)、期間、件数は source にある。攻撃の試みは条件どおりに攻撃に反応したもので、terms の誤検知(条件の誤り)とも想定内の検知とも違う(F220 の定義とも合う)

  - 項目: ch2-s1
    判定: 合格
    引用: 「アラートは、検知の仕組みが探すものを見つけたときの知らせで、本物の攻撃とは限らない」
    対比: F709 qualifiers「製品の定義(Microsoft Sentinel)」、F619「製品の定義(Microsoft Defender for Endpoint)」。terms.yaml T-alert「検知の仕組みが、決められた条件に合うイベントを見つけて出す知らせ。この時点では本物の攻撃かどうかは分からない」
    理由: 前半は2つの製品の定義を一般のアラートに広げているが、依頼者が決めた語の定義(T-alert)と同じ内容で、資料が定める語の定義として述べている。「限らない」は、F207(1つのSOC、真の攻撃は0.01%)の1例で言える弱い言い方で、広がっていない
    備考: 同じ製品の文書を根拠にする ch2-s3、ch3-s4 は「製品の例では」と書いている。この見出しが一般の定義として通るのは、根拠が terms の定義だからである。evidence が製品の文書だけなので、2回目の検査で製品の範囲を一般に広げたと判定される余地がある。source に「語の定義は依頼者が決めたもの」と分かる書き方をすれば、食い違いがなくなる

  - 項目: ch2-s2
    判定: 合格
    引用: 「SIEMは、最も一般的にはルールで複数のログの記録値を照合し、重要なイベントを特定する」
    対比: F101「最も一般的なのは…ルールベース相関」、qualifiers「ルール以外の相関もある」「2006年版」。F100
    理由: 度合い(最も一般的には)が見出しにあり、ルール以外の相関と2006年は source にある

  - 項目: ch2-s3
    判定: 合格
    引用: 「EDRは端末の振る舞いの記録を継続して集め、製品の例では脅威を検知するとアラートを作る」
    対比: F615「端末のデータのリアルタイムで継続的な監視と収集」、F618(製品)「振る舞いのテレメトリを継続的に集め」
    理由: 後半は「製品の例では」を残している。前半の EDR 一般の記述は OMB の覚書(F615)で裏付けられる
    備考: 「振る舞いの記録」の語は製品の文書(F618)のもので、OMB の文は「端末のデータ」である。意味の範囲は大きく変わらないと判断した。F619 の「全ての操作を記録する仕組みではない」に反する書き方(全てを記録する)にはなっていない

  - 項目: ch2-s4
    判定: 不合格
    引用: 「ログの種類ごとに分かることが違い、認証のログからは接続元、利用者、成否、日時が分かる」/ source「NIST SP 800-92(2006年)。「通常は記録する」の記述」
    対比: F108 quote「typically log each authentication attempt」、qualifiers「「通常は」(typically)の記述」
    理由: 「通常は」の度合いが見出しから落ち、「分かる」と言い切っている。source には残っているが、D006 は「通常」などの度合いを見出し自体に要るとしている。認証のログによっては記録しない項目がありうるのに、必ず分かると読める
    直し方の案: 「認証のログには、通常、接続元、利用者、成否、日時が記録される」のように「通常」を見出しに入れる

  - 項目: ch2-s5
    判定: 合格
    引用: 「ATT&CKは攻撃者の目的と方法の知識ベースで、検知の分析を作る助けになりうる」
    対比: F114、F116(戦術は why)、F125(技術は how)、F119 qualifiers「「ATT&CK can help」(助けになりうる)」
    理由: 「なりうる」が見出しにある。目的と方法は戦術と技術の言い換えとして合う。版は source にある

  - 項目: ch2-s6
    判定: 合格
    引用: 「1つのSOCの実測では、侵害に至った攻撃は0.01%、攻撃の試みは27%以上、想定内は49%以上」
    対比: F207 qualifiers「1つのSOC」「27%と49%は下限」「分類不能(Unknown)が23.72%残る」
    理由: 1つのSOC、下限が見出しにある。分類不能が約24%残ることは source にある。「侵害に至った攻撃」は terms の T-true-attack-share の定義と合う。良性のトリガーを「想定内」と呼ぶのは terms の T-expected-detection と合う

  - 項目: ch2-s7
    判定: 合格
    引用: 「「8割が誤検知」に近い値は、調べた範囲ではベンダーの調査の自己申告(83%)だけだった」
    対比: F204 qualifiers「ベンダーの調査」「解析者の自己申告」「「誤検知」の定義は示されていない」
    理由: 調べた範囲、ベンダー、自己申告が見出しにある。定義が示されていないことは source にある。台帳で metric が誤検知の割合の事実は F204(83%)と F205(99%、1人の解析者の発言)で、80% に近いのは F204 だけである。F001(依頼者の実感、80%)は調べた出典ではないので「だけ」と食い違わない

  - 項目: ch2-s8
    判定: 合格
    引用: 「出典の言う誤検知の原因には、緩いシグネチャや、学習期間に見なかった保守作業がある」
    対比: F208(NIDS、2003年)、F210(異常検知型、might / likely)、F214 qualifiers「インタビュー参加者の一部の認識」
    理由: 「出典の言う誤検知」と source の「原文の false positive」で、terms の誤検知(想定内を含まない)と違う語であることを示している。「原因には…がある」は、原因になりうるものを挙げる言い方で、度合いを強めていない
    備考: 保守作業の例は異常検知型の検知の話で、緩いシグネチャの一方は一部の解析者の認識である。source に文書名はあるが、検知の方式の違いは書かれていない。意味の範囲は変わらないと判断した

  - 項目: ch2-s9
    判定: 合格
    引用: 「1つのSOCの実測では、社内の脆弱性スキャンや外部の診断が想定内の検知を起こしていた」
    対比: F215、F221、F216、F217(いずれも qualifiers「1つのSOC」)
    理由: 1つのSOCが見出しにある。外部の診断を想定内の検知とすることは、terms の T-expected-detection(委託したペネトレーションテスト)と T-benign-pentest-count に合う

  - 項目: ch3-s1
    判定: 合格
    引用: 「何から確かめるかは出典で食い違う。NISTはインシデントの確認を深刻度の見積もりより前に置く」/ source「(2025年。インシデントの報告の扱い)」
    対比: F303 qualifiers「対象は「インシデント報告」」
    理由: NIST の対象がインシデントの報告であることは、見出しの「インシデントの確認」と source にある
    備考: 問いは「1件のアラート」で、NIST の対象(インシデントの報告)と民間の解説の対象(アラート)は同じではない。「食い違う」は D002 で決めた前提だが、対象が違う2つを食い違いと呼んでいることは、読み手に見えにくい

  - 項目: ch3-s2
    判定: 合格
    引用: 「閉じる・調べる・上げるの線は調べた公的な文書になく、この講義の基準は案である」
    対比: F600 qualifiers「誤検知として閉じる条件そのものは定めていない」、F610「要因は例示」
    理由: 「調べた」(調べた範囲での「ない」)と「案」が見出しにある
    備考: ch3 の基準の一部は、このSOCの運用(F002、F003、F004。kind は testimony)である。「この講義の基準は案である」は運用の部分まで案と呼んでいる。主張を弱める向きのずれで、限定を落としてはいないが、ch3-s6、ch3-s10、ch3-s14 と並べると食い違って見える

  - 項目: ch3-s3
    判定: 不合格
    引用: source「NIST SP 800-61 Rev.3(2025年)、CyberDefenders(SOC解析者の訓練事業者)の解説(2026年)。標準や公的文書ではないの材料から組み立てた案」
    対比: F303、F305 の source は NIST SP 800-61 Rev.3(qualifiers「優先度の区分は High」)。F312 などの CyberDefenders は qualifiers「訓練事業者のブログで公的機関・標準ではない」
    理由: 見出しは「案として」があり合格だが、source の行が崩れている。「標準や公的文書ではないの材料から組み立てた案」は日本語として成り立たず、文字どおり読むと NIST を含む材料の全てが標準や公的文書ではないと述べている。NIST SP 800-61 は公的な文書であり、出典の性質を取り違えている。D006 では source が限定の置き場になるので、source の誤りは見出しの検査の対象になる
    直し方の案: 「NIST SP 800-61 Rev.3(2025年)と、CyberDefenders の解説(2026年。標準や公的文書ではない)から組み立てた案」
    備考: ch3-s12、ch3-s15 の source も「標準や公的文書ではない、Security Scientist の…」と、区切りが崩れている。意味は読み取れるので不合格にはしていない

  - 項目: ch3-s4
    判定: 合格
    引用: 「製品の例では、アラートは分析ルールがデータに問い合わせて出し、関わる利用者や端末を含む」
    対比: F709、F710(製品の定義、Microsoft Sentinel)
    理由: 「製品の例では」が見出しにある

  - 項目: ch3-s5
    判定: 合格
    引用: 「案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる」
    対比: F605(False Positive – incorrect alert logic / incorrect data)、F220、terms T-false-positive
    理由: 「案として」がある。2つの条件は Sentinel の分類と terms の誤検知の定義に合う。事実と同じ強さの言い切りにはなっていない

  - 項目: ch3-s6
    判定: 不合格
    引用: 「このSOCでは、想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけである」
    対比: F002 statement「依頼者のSOCの運用では、新人が自分で閉じてよいのは、誤検知と、リーダーが事前に一覧にした想定内の活動…に当てはまるものだけである」
    理由: 証言の規則は「新人が自分で」閉じてよい範囲を決めたもので、だれに当てはまる規則かが見出しから落ちている(source は「このSOCの運用」だけ)。見出しは、このSOCではだれであれ一覧にない想定内の検知を閉じられない、と読め、証言より範囲が広い。同じ章の ch3-s10、ch3-s14 は「新人が」「配属から最初の3か月は」を残している
    直し方の案: 「このSOCでは、新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけである」

  - 項目: ch3-s7
    判定: 不合格
    引用: 「NISTは、優先度を資産の重要度、影響、活動の段階などで付けるよう推奨する」/ source「NIST SP 800-61 Rev.3(2025年)。要因は例示で、組み合わせは組織が決める」
    対比: F610 quote「Incident triage, prioritization, escalation…should all be based on a set of risk evaluation factors」。terms T-incident「調べた結果、実際に侵害や被害がある、と判断したもの」(not に T-alert)
    理由: NIST の推奨はインシデントの優先度付けについてであり、見出しと source のどちらにも「インシデント」がない。問いは「優先度は何で付けるのか」で、前後(ch3-s3)はアラートの優先度の話なので、NIST がアラートの優先度の付け方を推奨していると読める。この資料ではインシデントとアラートを別の語として定めており(terms)、対象が変わる。ch3-s1 は source に「インシデントの報告の扱い」と書いて対象を残している
    直し方の案: 「NISTは、インシデントの優先度を…推奨する」とするか、source に「インシデントの扱い」を足す。対象の限定は見出しに入れるほうが確実

  - 項目: ch3-s8
    判定: 合格
    引用: 「案として、SIEMが付けた深刻度は判断の材料にとどめ、判断の代わりにしない」
    対比: F306 qualifiers「セキュリティ訓練事業者のブログで、公的機関・標準ではない」
    理由: 「案として」があり、source に標準でないことがある

  - 項目: ch3-s9
    判定: 合格
    引用: 「案として、閉じるときは、発火した内容、調べたこと、証拠、下した判断を記録する」
    対比: F318
    理由: 「案として」があり、記録の4項目は F318 と合う

  - 項目: ch3-s10
    判定: 合格
    引用: 「このSOCでは、新人が閉じたアラートは後で見直される」
    対比: F004(testimony)qualifiers「依頼者のSOCの運用」「資料には「閉じたものは後で見直される」程度に書く(依頼者の指定)」
    理由: 「このSOCでは」と「新人が」があり、依頼者が指定した書き方の範囲に収まる

  - 項目: ch3-s11
    判定: 合格
    引用: 「調べた公的な文書に持ち時間の目安はない。実務者の解説の1件は12〜20分を目安とする」
    対比: F403 qualifiers「Tier 1の場合」「実務者向けの解説記事で標準や公的文書ではない」「根拠となる調査や数値の出典は記事中で確認できていない」
    理由: 「調べた」と「解説の1件」が見出しにあり、標準でないことと根拠の調査がないことは source にある
    備考: 「Tier 1の場合」が見出しにも source にもない。受講者の新人が一次の担当であれば意味の範囲は変わらないと判断したが、受講者の Tier はこの検査で渡された材料からは確かめていない。source に「Tier 1 の目安」と足すと確実になる。また「公的な文書にない」の裏付けは evidence(F403)には含まれず、F403 自体は「ない」を示さない

  - 項目: ch3-s12
    判定: 合格
    引用: 「案として、重要な資産での疑い、横展開の証拠、時間切れ、守備範囲の超過のどれかなら上げる」
    対比: F406「上げる条件の例として、重要資産での真陽性またはその疑い、…」、F407
    理由: 「案として」がある。4つの条件は F406、F407 と合う

  - 項目: ch3-s13
    判定: 不合格
    引用: 「迷ったときは上げる。有志の手順書も、判断に迷うときは上げる側に倒すとする」
    対比: decisions.md D004「「迷ったら上げる」の根拠は標準ではない有志の手順書(F405)と、主張 C3 の案である。案であることは要約の文には書かず、中のスライドで示す」。F405 qualifiers「有志のSOP集で標準や公的文書ではない」
    理由: 1文目「迷ったときは上げる」は、案であることも、このSOCの運用であることも示さずに言い切っている。根拠は有志の手順書と案で、D004 は案であることを中のスライドで示すとしたが、それを示すべきこのスライドに「案」がない。「有志の手順書も」の「も」は、1文目が別の確かな根拠を持つように読ませる。evidence の F401(NIST SP 800-61 Rev.2)は撤回済みの版で(qualifiers「撤回済みの版」)、source にそのことがない
    直し方の案: 「案として、迷ったときは上げる。有志の手順書も、迷うときは上げる側に倒すとする」。F401 を残すなら source に「撤回済みの Rev.2」を足す

  - 項目: ch3-s14
    判定: 合格
    引用: 「このSOCでは、配属から最初の3か月は、侵害に至らなかった攻撃の試みも全て上げる」
    対比: F003(testimony)qualifiers「依頼者のSOCの運用」「配属から最初の3か月」
    理由: このSOCの運用と期間が見出しにある

  - 項目: ch3-s15
    判定: 合格
    引用: 「案として、上げるときは、出どころとID、調べた経過、証拠、判定の仮説、次の手順を添える」
    対比: F413、F414
    理由: 「案として」があり、5つの項目は F413 と合う

  - 項目: ch4-s1
    判定: 合格
    引用: 「2013年のTargetの侵害では、緊急のアラートが出たが対応がなかったと報告されている」
    対比: F500 qualifiers「Bloomberg Businessweekの報道を引用した記述」「2013年の1事案」
    理由: 「報告されている」で伝聞であることを残し、報道を引いた記述であることは source にある

  - 項目: ch4-s2
    判定: 不合格
    引用: 「米上院の報告は、警報が頻繁だったため誤検知とみなされた可能性があると推定している」
    対比: F501 quote「It is possible that Target staff could have viewed this alert as a false positive if the system was frequently alarming.」、statement「頻繁に警報が鳴る状況なら誤検知とみなした可能性がある」
    理由: 報告は「頻繁に警報が鳴っていたなら」という仮定の上で可能性を述べており、警報が頻繁だったとは述べていない。見出しは「警報が頻繁だったため」と、仮定を事実の前提に変えている。推定であることは残っているが、推定の条件が落ちている
    直し方の案: 「米上院の報告は、警報が頻繁に鳴っていたなら、誤検知とみなされた可能性があると推定している」

  - 項目: ch4-s3
    判定: 合格
    引用: 「ベンダーの調査では、IT専門職の56%が、過去の誤検知を理由にアラートを無視したと答えた」
    対比: F506 qualifiers「自己申告」「調査会社がセキュリティ製品のベンダー」「RSA Conference 2018で、IT専門職179人…SOC分析者に限らない」
    理由: ベンダー、IT専門職、「答えた」(自己申告)が見出しにあり、人数と場は source にある。誤検知が原文の false positive であることも source にある

  - 項目: ap-s1
    判定: 不合格
    引用: 「届く量は出典で大きく違い、1日約13,764件の実測と、1日平均4,484件の自己申告がある」
    対比: F201 qualifiers「1つのSOC」「第2期(2020-12〜2022-07)」、statement「自動遮断(BHR)で…処理されたアラートは約44.9%…それを除いても解析者が処理するアラートは1日あたり約13,764件残った」
    理由: 13,764件が1つのSOCの実測であることが見出しにない(source にはある)。D006 は1つのSOCであることを見出し自体に要るとしている。また、13,764件は自動遮断の後に解析者に残った件数で、SOC に届いた件数ではない(F207 の quote ではそのSOCの1日のアラートは24K〜134K)。「届く量」は terms の T-alerts-per-day(SOCに1日に届くアラートの件数)と合わない。source の「(自動遮断の後)」だけでは、見出しの「届く量」の読み違いを防げない
    直し方の案: 「届く量は出典で大きく違い、1つのSOCで解析者に残った1日約13,764件の実測と、1日平均4,484件の自己申告がある」。字数が50字を超える場合は、「1つのSOCの実測」を残し、「解析者に残った」を source に移す

  - 項目: ap-s2
    判定: 合格
    引用: 「上げるのが遅れる誤りを直接測った公開の調査は見つからなかった」
    対比: F508、F509 qualifiers「上げるのが遅れる誤りを直接測った結果ではない」「実際のエスカレーション遅れの測定ではない」
    理由: 「見つからなかった」で調べた範囲の「ない」になっている

  - 項目: ap-s3
    判定: 合格
    引用: 「上げすぎる誤りの割合を測った調査は見つからなかった」
    対比: F510 qualifiers「上げ過ぎの割合は未測定」
    理由: 同上

  - 項目: ch5-s1 と ch5-s2(演習1)
    判定: 合格
    引用: '「演習1の答え: 一覧にある承認済みのスキャンに当てはまるため、想定内の検知として記録して閉じる」'
    対比: ch3-s6「このSOCでは、想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけである」
    理由: 一覧にあることを閉じる理由にしており、ch3-s6 と合う

  - 項目: ch5-s3 と ch5-s4(演習2)
    判定: 合格
    引用: '「演習2の答え: 検知の条件が無害な活動に反応した誤検知として、根拠を記録して閉じる」'
    対比: ch3-s5「案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる」、terms T-false-positive(緩すぎるルール)
    理由: 緩く書かれたルール(検知の条件の誤り)を根拠に誤検知として閉じており、ch3-s5 と terms の定義に合う。管理ツールの通信は想定内の検知とも読めるが、ルールが緩いことを問題の前提に置いているので、terms では誤検知になる

  - 項目: ch5-s5 と ch5-s6(演習3)
    判定: 合格
    引用: '「演習3の答え: 侵害に至らなかった攻撃の試みであり、このSOCでは最初の3か月は全て上げる」'
    対比: ch3-s14「このSOCでは、配属から最初の3か月は、侵害に至らなかった攻撃の試みも全て上げる」
    理由: このSOCの運用であることと期間を残しており、ch3-s14 と合う

  - 項目: ch5-s7 と ch5-s8(演習4)
    判定: 不合格
    引用: '「演習4: 重要なサーバで、一覧にない見慣れないプロセスが動いたアラートが届いた」/「演習4の答え: 閉じずに調べ、正当と確かめられなければ、経過と証拠を添えて上げる」'
    対比: ch3-s12「案として、重要な資産での疑い、横展開の証拠、時間切れ、守備範囲の超過のどれかなら上げる」
    理由: 問題は「重要なサーバ」での見慣れないプロセスで、ch3-s12 の「重要な資産での疑い」に当たると読める。ch3-s12 では、それだけで上げる条件になる。答えは、まず調べ、正当と確かめられなければ上げるとしており、重要な資産であることを使っていない(重要でないサーバでも同じ答えになる)。新人は、重要な資産での疑いはすぐ上げるのか、調べてから上げるのかを、ch3 と演習で違って受け取る。「疑い」がどの時点で生じるかを ch3-s12 が定めていないことが原因で、食い違いの程度は解釈による
    直し方の案: 答えを「重要な資産での疑いに当たるため、調べ終える前に、経過と証拠を添えて上げる」とするか、ch3-s12 の側で「疑い」を「正当と確かめられないとき」と定める。どちらにするかは設計の判断

  - 項目: 見出しの中の数値と evidence の値の一致(手で確認)
    判定: 合格
    理由: 次を照合し、全て一致した。ch1-s2 の27%(F207)、ch2-s6 の0.01%・27%・49%(F207)、ch2-s7 の83%(F204)、ch3-s11 の12〜20分(F403)、ch3-s14 の3か月(F003)、ch4-s1 の2013年(F500)、ch4-s3 の56%(F506)、ap-s1 の13,764件(F201)と4,484件(F203)。source の数値も照合した。約1,443万件(F207 の14,429,534件)、約24%(23.72%)、2,000人(F204)、179人と2018年(F506)、v20.1(F114)はいずれも合う
    備考: ch2-s7 の「8割」は依頼者の仮説の引用で、evidence の値ではない

全体の所見:
  - 主な不合格は3つの型に分かれる。(1)度合いや条件の脱落: 'ch2-s4(通常)、ch4-s2(頻繁だったなら)。(2)だれ・何についての規則かの脱落: ch3-s6(新人)、ch3-s7(インシデント)、ap-s1(1つのSOC、解析者に残った件数)。(3)案であることの脱落: ch3-s13'
  - source の行の書きぶりが一部崩れている(ch3-s3 は意味を取り違えるため不合格、ch3-s12、ch3-s15 は読み取れるため備考)
  - この検査は1回目である。docs/checks.md により、2回目は別のモデルで行う
