# 検査: 工程5 立証の設計(運用の流れ図 ch3-s17 の再検査)
name: 工程5 運用の流れ図(ch3-s17)の再検査(前回 5-proof-5 の不合格の解消と、直したことによる新しい問題)
target:
  commit: b8a1624e311a6bb5866f1d3c7ed0ec23c79538a7
  previous_commit: 62bfacd9706e607ab263f8a7ef1bc7b1f381384f
  files:
    - 'trial/deck/01-model.yaml(basis: operation の要素・つながり・場面 S-newbie-ops、冒頭のコメント)'
    - trial/deck/04-storyline.yaml(ch3-s17)
    - trial/deck/05-proof.yaml(ch3-s17)
  reference:
