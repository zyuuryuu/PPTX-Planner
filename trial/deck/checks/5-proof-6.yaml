    - trial/deck/decisions.md の D011
    - 04-storyline.yaml と 05-proof.yaml の ch3-s5、s6、s11、s13、s14、s16
inspector: Claude Sonnet 5.5
summary:
  pass: 7
  fail: 3
  cannot_judge: 0
  main_findings:
    - 【重大】ch3-s13 は「30分調べても閉じる根拠がなく迷うなら上げる」の分かれ方を案とし、ch3-s17 は同じ分かれ目(R-op-inv-esc)を運用(proposal 空)とし、案の印は誤検知の側だけに付ける。同じ分かれ目に2枚のスライドが違う区分を付けている。
    - 順(order)と運用の範囲は F006、F007 に収まった。誤検知を調べる段の中に置いたことは、D011 とモデルの note に記録され、運用として偽っていない。前回の 1-4、1-5、1-6 の不合格は解消。
    - '軽微: 冒頭コメントの basis: operation の定義が「F002〜F005」のまま(F006、F007 を使っているのに)。R-op-fp のラベルの「記録して」は証言になく、proposal の範囲にも入っていない。'
  note: 前回の F004 未使用の指摘は、直していない箇所のため再掲しない。

checks:
  # ===== 1. 運用の要素・つながり・順が F002、F003、F005、F006、F007 の範囲か =====
  - id: 1-1
    condition: 要素(E-newbie、D-op-alert、A-close、A-investigate、A-escalate)に、証言にない内容がない
    verdict: 合格
    quote:
      - 'A-close name: 閉じる / evidence: [F002]'
      - 'A-investigate name: 調べる(30分まで) / evidence: [F005]'
      - 'E-newbie name: 配属から3か月の新人 / evidence: [F002, F003, F005]'
    reason: 前回不合格だった A-close の「記録(して終える)」が外れ、F002 の「閉じてよい」の範囲になった。ほかの要素は F003、F005 と一致する。

  - id: 1-2
    condition: 上げる・閉じる・調べるへの4本(R-op-severe、R-op-attempt、R-op-list、R-op-other)の条件と順(order 1〜4)が証言の範囲内
    verdict: 合格
    quote:
      - 'R-op-severe condition: 重大度が高い / order: 1'
      - 'R-op-attempt condition: 侵害に至らなかった攻撃の試み(配属から3か月) / order: 2'
      - 'R-op-list condition: リーダーの一覧にある活動に当てはまる / order: 3'
      - 'R-op-other condition: 上の3つのどれにも当たらない / order: 4'
      - 'F007: 上げる条件(重大度が高い、攻撃の試み)を先に確かめ、上げる側に倒す。一覧にある作業でも重大度が高く出たものは上げる'
      - 'F006: それ以外→30分調べて、根拠がなければ上げる'
    reason: >
      順は F007(選択肢 A に依頼者が同意)と一致する。「それ以外」は F006 にある。前回不合格の、証言にない順序と、
      重なる条件の行き先は、F007 で確かめられた範囲に収まった。重なる場合に「最初に当たった道に進む」という note の言い方は、
      F007 の「上げる側に倒す」を一般化したもので、4本の範囲では F007 と矛盾しない。

  - id: 1-3
    condition: 案の部分が proposal に分けて書かれ、運用として書かれていない(R-op-fp、R-op-inv-esc)
    verdict: 不合格
    severity: 軽微
    quote:
      - 'R-op-fp label: 誤検知として記録して閉じる / proposal: 誤検知と言える基準(ch3-s5)'
      - 'F002: 誤検知と、…一覧にした想定内の活動…に当てはまるものだけ(閉じてよい)'
      - 'ch3-s13 show: 分かれ方が案であることを示す: ある→記録して閉じる'
    reason: >
      「根拠をもって言える」の基準は proposal に分かれ、R-op-inv-esc の「30分たっても閉じる根拠がない」は F006(根拠がなければ上げる)の範囲で、
      proposal 空は妥当。残る問題は R-op-fp のラベルの「記録して」: F002、F006 は「閉じる」までで、「記録して」は案(D002、ch3-s13 が案とする)に由来する。
      proposal の記述は「基準」だけで、「記録して」を含まない。前回 A-close の名前で指摘した点の残りである。
    suggestion: ラベルを「誤検知として閉じる」にするか、proposal に「記録して閉じる」を含める。

  - id: 1-4
    condition: 冒頭コメントが、運用の部分の証言の範囲を正しく述べている
    verdict: 不合格
    severity: 軽微
    quote:
      - '# basis: … operation(依頼者のSOCの運用。依頼者の証言 F002〜F005。工程5で設計セッションが足した)'
      - '# このSOCの運用(依頼者の証言 F002〜F007)(relations の見出しコメント)'
      - 'S-newbie-ops evidence: [F002, F003, F005, F006, F007]'
    reason: >
      order、proposal、route の説明は足されたが、operation の定義の「F002〜F005」が直っていない。要素・つながり・場面は F006、F007 を根拠にしており、
      コメント内で範囲が食い違う。
    suggestion: 「F002〜F007」にそろえる。

  - id: 1-5
    condition: 誤検知の判定を調べる段の中に置いたこと(F006 と違う置き場所)が、D011 とモデルに記録され、運用として偽っていない
    verdict: 合格
    quote:
      - 'D011: 依頼者の言葉(F006)は誤検知を最初の段に置いていたが、誤検知の判定には調べることが要るため、調べる段の中に置いた。…受け入れた影響: 依頼者の言った流れと、誤検知の置き場所が違う。依頼者に流れ図を見せるときに、この違いを示して確かめる'
      - 'R-op-fp note: 依頼者は誤検知と言えるものを最初の段で閉じるとしたが、…調べる段の中に置いた(D011)'
      - 'S-newbie-ops note: 誤検知と言える基準は案で、調べる段の中に置いた(D011)'
    reason: >
      置き場所の違いは、決定記録、つながりの note、場面の note の3か所に書かれ、運用の証言とは区別されている。依頼者の確認は未了と D011 に残る
      (依頼者に見せる時に確かめる)。この確認の結果は検査できないが、記録として偽ってはいない。
      なお ch3-s17 の source は置き場所の違いに触れず、案の印(2-3)に頼る。

  # ===== 2. ch3-s17 が証言と案の限定を落としていないか =====
  - id: 2-1
    condition: 見出しが、証言と案の限定(配属から3か月、30分まで、案の印)を落としていない
    verdict: 合格
    quote:
      - 'headline: 配属から3か月の新人は、重大度が高いか攻撃の試みなら上げ、一覧なら閉じ、残りは30分まで調べる'
    reason: >
      「配属から3か月」と「30分まで」が入り、見出しは案の部分(誤検知の基準)を断定していない(運用の範囲だけを述べる)。
      前回不合格の、案を運用として言い切る点と、重なりが消えて見える点は、「重大度が高いか攻撃の試みなら上げ、一覧なら閉じ」という F007 の順どおりの並びで解消している。

  - id: 2-2
    condition: source が、証言と案の限定を落としていない
    verdict: 合格
    quote:
      - 'source: このSOCの運用(上げる条件から順に確かめる)。調べる中で誤検知と言える基準は案'
      - 'evidence: F002, F003, F005, F006, F007'
    reason: >
      運用と案の別、順の出所(F007)が書かれている。「3か月」と「30分」は見出しと show にあり、source になくても全体で落ちていない。
      軽微な留意: 誤検知を調べる段の中に置いたこと(1-5)は source に書かれていない。show の案の印が付く分かれ目に含まれるため、落としたとは判定しない。

  - id: 2-3
    condition: 'show が証言と案の限定を落とさず、real: true の view(S-newbie-ops、要素4つ)と合う'
    verdict: 合格
    quote:
      - "show: …1 重大度が高い→すぐ上げる、2 攻撃の試み→上げる、3 一覧にある→閉じる、4 どれでもない→調べる(30分まで)。調べる中で、誤検知と根拠をもって言えた→記録して閉じる(この分かれ目に「案」の印)、30分たっても根拠がない→見たことを付けて上げる。図の上に「配属から3か月の新人」"
      - 'view: scenario: S-newbie-ops / elements: D-op-alert, A-close, A-investigate, A-escalate'
    reason: >
      show の6本の道は、場面の6本(R-op-severe、attempt、list、other、fp、inv-esc)と順・ラベルが対応する。3か月は図の上の見出し、30分は「調べる(30分まで)」で保たれ、
      案の印は誤検知の分かれ目に付く(F006 の qualifier「基準は案」と一致)。E-newbie は view の要素に入らないが、show が図の上の文字として扱い、モデルの要素と食い違わない。
      プレビューは検査の対象外。show の文面と view の対応だけを判定した。

  # ===== 3. 他の ch3 のスライドとの矛盾 =====
  - id: 3-1
    condition: ch3-s13 と矛盾しない
    verdict: 不合格
    severity: 重大
    quote:
      - 'ch3-s13 headline: 案として、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる'
      - 'ch3-s13 show: 30分の時点(このSOCの運用)で「閉じる根拠があるか」で分かれる流れ。分かれ方が案であることを示す: ある→記録して閉じる、なく迷う→閉じずに上げる'
      - 'ch3-s17 show: 誤検知と根拠をもって言えた→記録して閉じる(この分かれ目に「案」の印)、30分たっても根拠がない→見たことを付けて上げる'
      - "R-op-inv-esc proposal: ''(空 = 全て運用)"
    reason: >
      同じ分かれ目(30分の時点で、根拠があれば閉じ、なければ上げる)を、s13 は「分かれ方が案」とし、s17 は閉じる側だけに案の印を付け、上げる側を運用として描く。
      聴衆が s13 の後に s17 を見ると、同じ分岐が案から運用に変わって見える。F006(根拠がなければ上げる = 依頼者の運用)が後から出たため、
      s13 の「案」の範囲が広すぎる可能性があるが、s13 の「迷うなら」は F006 にない語で、どちらが正しいかは設計側が決める。2枚のスライドで区分が一致していない点を不合格とした。
    suggestion: s13 の案を「誤検知と根拠をもって言える基準」に限り、上げる側は運用(F006)とするか、s17 の上げる側も案の印にするかを決めてそろえる。

  - id: 3-2
    condition: ch3-s5、s6、s11、s14、s16 と矛盾しない
    verdict: 合格
    quote:
      - 'ch3-s5: 案として、…根拠をもって言えるときだけ、誤検知として閉じる'
      - 'ch3-s6: 想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけ'
      - 'ch3-s11: 配属から3か月の新人の持ち時間は1件30分で、過ぎたら見たことを付けて上げる'
      - 'ch3-s14: 配属から3か月の新人は攻撃の試みも全て上げ'
      - 'ch3-s16: 重大度が高いアラートは30分を待たずにすぐ上げる'
    reason: >
      s5(誤検知の案)は R-op-fp の proposal と、s6(一覧)は R-op-list と、s11(30分)は A-investigate と R-op-inv-esc と、s14(攻撃の試み)は R-op-attempt と、
      s16(すぐ上げる)は R-op-severe と一致する。s17 の順(重大度、攻撃の試み、一覧)は、どのスライドの規則とも矛盾しない。
      前回の「閉じる道が2つになる」食い違いは、誤検知を調べる段の中に置いたため解消している(s13、D008 と整合)。
