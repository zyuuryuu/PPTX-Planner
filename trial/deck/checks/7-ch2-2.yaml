    引用: '{F204}と答えた回答者は、ベンダーが委託した調査会社が選んだ、従業員1,000人超の組織の解析者に限られる'
    裏付け: 合格
    限定: 合格
    理由: >-
      F204 の qualifiers「Sapio Research(Vectra委託)の2023年3〜4月の調査。対象は従業員1,000人超の組織の IT security analysts 2,000人」で裏付けられる。
      数値 1,000 は F204 の value ではないが、ch2-s7 の sources にある F204 の qualifiers にそのまま書かれた数値で、同じ文に {F204} の参照があるため、D016 の条件を満たす。
      事実の本文にない数値(計算した値など)は使っていない。
      補足(判定は変えない): 「調査会社が選んだ」は、qualifiers の「Sapio Research の調査。対象は…」を、調査会社が回答者を選んだと言い換えたもので、選び方そのものは事実に書かれていない。
      「ベンダーが委託した調査会社の調査で、対象は…」とすれば事実の言い方に近い。
      また「{F204}と答えた回答者」は、回答者の一人ひとりが83%と答えたとも読めるが、前回合格した notes[2]「解析者が答えた{F204}」と同じ言い方で、quote の「they say 83%」とも矛盾しない。
  - 箇所: notes[6](前回の notes[5])
    引用: Yangらの論文は、想定内の検知を、組織の環境で業務上正当で許容される挙動によって説明される、正しく反応したアラートと定義し、一般に言う誤検知(悪いルール、エラー、誤った設定などで、無害な挙動に誤って反応したアラート)とは違うと述べる
    前回: 裏付け不合格(一般的な用法の誤検知を論文自身の定義として述べていた)
    裏付け: 合格
    限定: 合格
    理由: >-
      F220 の quote「Benign triggers [4] are correctly fired alerts, explained by business-justified, acceptable behaviors in the organization's environment」
      「This definition is different from the generic "false positives" which usually refer to alerts that are incorrectly fired on benign behaviors (e.g., due to bad rules, errors, or misconfigurations)」と一致する。
      論文が定義したのは想定内の検知で、誤検知は「一般に言う」(generic、usually refer to)として述べる形になった。F220 の statement とも一致する。
      F220 の限定「論文中の用語の定義」は「定義し」に残る。
    前回の指摘: 解消

