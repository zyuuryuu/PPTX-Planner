# 工程4 ストーリーライン 検査: 見出しが、根拠の事実の限定を落としていない(重大な検査)
name: 見出しが、根拠の事実の限定を落としていない
stage: 4
round: 2
target: trial/deck/04-storyline.yaml(コミット 49a88e24866a83a2511bdaa0fb20362feec9e87d)の全スライドの headline と source
upstream: trial/deck/01-sources.yaml(evidence が指す52件の事実の statement、quote、qualifiers、source、as_of)、trial/deck/decisions.md D006、trial/deck/terms.yaml
inspector: claude-sonnet-5-5
criteria: |
  D006 に従い、限定は見出しと source を合わせて落ちていなければ合格とする。ただし、意味の範囲を変える限定
  (1つのSOC、自己申告、下限、案、このSOCの運用、「通常」「なりうる」などの度合い、調べた範囲での「ない」)は、
  見出し自体に必要とする。「案として」の見出しは出典の事実と同じ強さで言い切っていないか、「このSOCでは」の見出しは
  依頼者の証言(kind: testimony)に照らす。ch5 は限定の検査の対象外とし、ch3 との食い違いだけを見る。
  数値は evidence の値と手で照合した。
summary:
  slides_total: 40
  pass: 33
  fail: 6
  cannot_judge: 1
  fail_ids: [ch2-s4, ch3-s6, ch3-s11, ch3-s13, ch4-s2, ap-s1]
  cannot_judge_ids: [ch1-s1]
  number_check: 見出しの数値は全て evidence の値と一致した(27、0.01、49、83、56、12〜20、13,764、4,484、3か月、2013)。ap-s1 の13,764件は値は一致するが、何の件数かに問題がある(ap-s1 を参照)。
  source_line_years: source の年は全て as_of と一致した。

results:
- id: ch1-s1
  verdict: 判定できない
  headline: 届いたアラートを、閉じる・調べる・上げるのどれにするか、根拠とともに1人で決められる
  reason: evidence も source もなく、事実を述べる見出しではない(講義の到達目標)。照合先がないため限定の落ちは確かめられない。事実の主張は含まない。対象外に近い。

- id: ch1-s2
  verdict: 合格
  evidence: [F207]
  reason: 「1つのSOCの実測では」「27%以上」(下限)が見出しにある。F207 の qualifiers(1つのSOC、27%は下限)と一致。27 は値と一致。

- id: ch2-s1
  verdict: 合格
  evidence: [F709, F619, F207]
  reason: |
    「本物の攻撃とは限らない」は否定の度合いが弱く、F207(0.01%)と整合する。source に Microsoft Learn(Sentinel、Defender for Endpoint)と
    1つのSOCの実測が出ている。
  note: |
    F709、F619 の qualifiers は「製品の定義」である。見出しは製品の定義を一般のアラートの定義として述べているが、
    語彙表 T-alert の定義(依頼者が決めた)と同じなので、限定の落ちとはしない。

- id: ch2-s2
  verdict: 合格
  evidence: [F100, F101]
  reason: |
    「最も一般的には」(F101 の most common)を見出しに残している。2006年とルール以外の相関があることは source にある。
  note: F101 は「ログ管理ソフトウェア一般」の記述で、SIEM に結びつけたのは F100。見出しの結びつけは F100 で支えられる。

- id: ch2-s3
  verdict: 合格
  evidence: [F615, F618, F619]
  reason: 「製品の例では」が、アラートを作るという後半の節に付いている。OMB と Microsoft の出どころが source にある。
  note: |
    前半の「振る舞いの記録」は F618(Defender for Endpoint の製品の記述)の語で、F615(OMB)は「端末のデータ」と述べるだけ。
    EDR 一般の記述として読める書き方だが、source に Microsoft Learn(Defender for Endpoint の文書)があるので、D006 の範囲では合格とした。

- id: ch2-s4
  verdict: 不合格
  evidence: [F108, F110, F107, F111]
  headline_quote: 認証のログからは接続元、利用者、成否、日時が分かる
  fact_quote: 'F108: "Authentication servers ... typically log each authentication attempt, including its origin, username, success or failure, and date and time."(qualifiers: 「通常は」(typically)の記述)'
  reason: |
    F108 は typically(通常は)の記述だが、見出しは「分かる」と言い切り、「通常」が見出しにない。「通常」は D006 が見出し自体に残すとする度合いの語。
    source に「「通常は記録する」の記述」と書いてあるが、D006 では見出しに必要。F107(typically)、F111(often)も同様に度合いの語が付く。
  suggestion: 「認証のログからは、通常、接続元、利用者、成否、日時が分かる」。

- id: ch2-s5
  verdict: 合格
  evidence: [F114, F116, F125, F119]
  reason: 「なりうる」が見出しにある(F119 の "can help")。MITRE の公式サイトと v20.1 は source にある。

- id: ch2-s6
  verdict: 合格
  evidence: [F207]
  reason: |
    「1つのSOCの実測では」、「27%以上」「49%以上」(下限)が見出しにある。0.01%、27、49 は値と一致。
    分類できないものが約24%残ることは source にあり、見出しの3つの数値が示す範囲は変わらない。
  note: 「想定内」は語彙表で「想定内の検知」(出典の benign trigger)。見出しの略し方は語の定義と合う。

- id: ch2-s7
  verdict: 合格
  evidence: [F204, F220]
  reason: |
    「調べた範囲では」(「ない」の範囲)、「ベンダーの調査」、「自己申告」、83% が見出しにある。F204 の値と一致。
    F205(99%、1人の解析者の発言)と F001(依頼者の実感)は、「8割に近い値」の調査には当たらないので、「だけだった」と矛盾しない。
  note: 「誤検知」の定義が示されていないことは source にある。

- id: ch2-s8
  verdict: 合格
  evidence: [F208, F210, F214]
  reason: 「出典の言う誤検知」「原因には…がある」と、範囲を狭く言っている。原文の false positive であることが source にある。
  note: |
    F210 は異常検知型 IDPS の記述、F208 は NIDS の記述だが、見出しにも source にもその限定がない。
    「原因には…がある」という存在の形なので、不合格とはしない。source に「異常検知型」を足すとよい。

- id: ch2-s9
  verdict: 合格
  evidence: [F215, F221, F216, F217]
  reason: 「1つのSOCの実測では」が見出しにある。「社内の脆弱性スキャン」「外部の診断」は F215、F221 と一致。

- id: ch3-s1
  verdict: 合格
  evidence: [F303, F312]
  reason: |
    NIST の主張は F303 と一致。「インシデントの報告の扱い」(F303 の qualifiers)と、民間の解説であることが source にある。
  note: 「食い違う」は2つの出典を並べた設計側の読みで、F312 の段階の順は各段の見出しによる(F312 の qualifiers)。

- id: ch3-s2
  verdict: 合格
  evidence: [F600, F610]
  reason: 「調べた公的な文書に」(「ない」の範囲)と「案である」が見出しにある。
  note: |
