name: 独立した導出(第1回)
target: trial/deck/00-brief.md の「答えるべき問い」
upstream:
  - trial/deck/00-brief.md
  - trial/deck/01-sources.yaml(verified が true の事実。stance の欄と answers の欄は読んでいない)
  - trial/deck/terms.yaml
definitions:
  - docs/stages/02-claims.md の合格条件「独立した導出」(依頼文による。文書そのものは読んでいない)
not_read:
  - trial/deck/01-hypotheses.yaml
  - trial/deck/01-plan.yaml
  - trial/deck/02-answers.yaml
  - trial/deck/decisions.md
  - trial/deck/journal.md
  - trial/deck/checks/ のほかのファイル
judge: Claude Opus 5.5 (claude-opus-5-5)
round: 1

question: >
  新人がアラートを受けてから「誤検知として閉じる/調査を続ける/上に上げる」を決めるまでに、
  何をどの順で確かめ、何を基準に決めればよいか

# 1. 台帳の事実だけから書いた答え(5文)
answer:
  - no: 1
    text: >
      アラートを受けたら、まず、どの検知の仕組みのどのルールが、どの利用者・端末・アドレスに反応したのか
      (既知のパターンとの一致か、平常からの逸脱か、件数の閾値か)を確かめ、資産の重要度、攻撃の段階、
      脅威インテリジェンスとの一致、業務上の文脈で優先度を付ける。SIEM が付けた点数は判断の材料であり、結論ではない。
    facts: [F709, F710, F102, F103, F321, F610, F305, F306]
  - no: 2
    text: >
      次に、アラートが示す活動が実際に起きたのか、正当な活動で説明できるのかを、同じ端末の OS のログ、
      認証のログ、EDR の記録など別のログとの突き合わせと、平常時との比較で確かめる。
    facts: [F308, F604, F307, F312, F111, F108, F110, F311, F616, F101]
  - no: 3
    text: >
      検知の条件そのものが誤っていたなら誤検知として閉じる。条件どおりに反応したが、承認された活動や想定内の活動
      (社内の脆弱性スキャン、委託したペネトレーションテスト、既知の IP アドレスからのスキャン、変えられない旧式のシステムなど)
      だと分かったなら、想定内の検知として閉じる。どちらも、何が発火し、何を調べ、何を根拠に決めたかを記録する
      (想定内の検知は、ルールの調整や除外の候補として残す)。
    facts: [F315, F609, F607, F605, F220, F213, F215, F221, F606, F217, F318, F324, F600]
  - no: 4
    text: >
      本物の攻撃かその疑いがあり、重要な資産や複数の端末に及ぶとき、自分の守備範囲や権限を超えるとき、
      持ち時間(Tier 1 で 12〜20 分が一般的とする解説がある)のうちに判定できないときは、経過、集めた証拠、
      いまの仮説、次に勧める手順を付けて上に上げる。迷ったら上げる側に倒し、最も重大なものは調べ終える前に上げて、
      調査は並行して進める。
    facts: [F406, F407, F403, F405, F404, F413, F414, F401, F604]
  - no: 5
    text: >
      調査を続けるのは、持ち時間と権限の範囲のうちで、閉じるにも上げるにも証拠が足りず、
      追加のデータで決着が付く見込みがあるときに限る。
    facts: [F315, F403, F407]

# 2. 答えの各部分の確かさ
certainty:
  - part: 確かめる順序(何が反応したか → 優先度 → 証拠集め → 判定 → 上げる/記録)
    level: 複数の出典があるが、順序が食い違う
    sources: [F312, F307, F303, F613]
    note: >
      7段階の順序を示すのは訓練事業者のブログ(F312)だけで、そこでは優先度付けが証拠集めより先。
      NIST SP 800-61r3(F303、F613)は「起きたかの予備的な確認」を深刻度の見積りより先に置く。
      NIST SP 800-61r2(F307、撤回済み)は分析→相関の探索→調査→記録→優先度付けの順だが、
      「常にこの順序を守るものではない」と述べる。NIST の2つはどちらも対象がインシデント(報告)で、
      アラート1件の選別に当てはめるのは推測。答えの1文目で優先度付けを先に置いたのは F312 と F321 に依った判断で、
      NIST の順序とは合わない。
  - part: 優先度の要因(資産の重要度、攻撃の段階、脅威インテリジェンス、業務上の文脈、影響)
    level: 複数の独立した出典がある
    sources: [F321, F610, F305, F301, F319, F320, F410]
    note: >
      NIST(r2、r3)と訓練事業者のブログで要因が重なる。ただし NIST はインシデントの優先度の要因として述べている。
      SIEM の点数を結論にしないという点は F306 の1つだけ。
  - part: 別のログとの突き合わせと平常時との比較で指標が正当かを確かめる
    level: 複数の出典があるが、どれもアラートの一次解析を直接の対象にしていない
    sources: [F308, F604, F311, F111, F312]
    note: >
      F308/F604(NIST r2、撤回済み。「理想的には」付き)、F311(CISA。インシデントの技術分析)、
      F111(NIST SP 800-92。OS のログはセキュリティソフトの検知の後に参照されることが多い)。
      どのアラートでどのログのどの項目を見るか、の具体は台帳にない。
  - part: 誤検知と想定内の検知を分け、どちらも閉じる
    level: 複数の出典がある(公的な標準ではない)
    sources: [F315, F605, F607, F609, F220, F213]
    note: >
      閉じる扱いを示すのは訓練事業者のブログ(F315)と製品の文書(F605、F607、F609)。製品の文書同士で、
      想定内の検知の分類の名前が一致しない(F607 は Informational, expected activity、F609 は True positive)。
      誤検知と想定内の検知の区別そのものは学術論文(F220、F213)にもある。公的な標準(NIST)は誤検知の定義(F314、F603)と
      「既知の誤検知を考慮する」(F600)までで、閉じてよい条件を述べていない。
  - part: 想定内の検知の具体例(社内スキャン、委託したペンテスト、既知の IP、旧式のシステム)
    level: 複数の出典がある
    sources: [F215, F221, F217, F606, F607]
    note: Yang らの例(F215、F221、F217)は1つの SOC の実測。Microsoft の文書(F606、F607)にも同種の例がある。
  - part: 閉じたアラートも記録を残す、記録の中身
    level: 1つの出典だけ(閉じたアラートについて)
    sources: [F318]
    note: >
      閉じたアラートの記録を求めるのは訓練事業者のブログ(F318)だけ。NIST(F316、F322、F412)の記録の規定は
      インシデントが対象で、閉じたアラートには直接当たらない。
  - part: 上げる条件(重要資産での本物の疑い、複数ホスト、守備範囲・権限の超過、持ち時間切れ)
    level: 複数の出典があるが、どれも標準や公的文書ではない
    sources: [F406, F407, F405, F401, F604, F409]
    note: >
      F406(実務者向けの解説記事、広告あり)、F407(企業ブログ)、F405(有志の SOP のひな形)。
      NIST は判定が判断の問題になり協力が要る場合がある(F401、F604)、報告の要件は組織の方針で定める(F409)と述べるだけで、
      閾値は示さない。
  - part: 持ち時間の数値(12〜20 分)、P2 は 30 分
    level: それぞれ1つの出典だけ
    sources: [F403, F404]
    note: >
      F403 は記事中に根拠が示されていない。F404 は組織ごとに差し替えるひな形の値。
      NIST の 15 分(F411、F614)は応答がない場合の待ち時間で、分析の結果で上げる時間ではないため使っていない。
  - part: 迷ったら上げる側に倒す、最重大は先に上げて並行して調べる
    level: 1つの出典だけ
    sources: [F405]
    note: 有志の SOP のひな形。
  - part: 上げるときに付ける情報(経過、証拠、仮説、次の手順、テンプレート)
    level: 複数の出典がある(公的な標準ではない)
    sources: [F413, F414, F412]
    note: F413(解説記事)と F414(企業ブログ)が重なる。F412(NIST r2)はインシデント記録の項目。
  - part: 調査を続ける条件
    level: 1つの出典だけ。ほぼ推測
    sources: [F315, F403]
    note: >
      F315 は、証拠が足りないときは「上位にエスカレーションするか追加のデータを待つ」とするだけで、
      どちらを選ぶかの基準はない。「持ち時間と権限の範囲のうち」という限定は、F403 と F407 から私が組み合わせた推測。

# 3. 台帳から言えないこと(答えるために足りない事実)
gaps:
  - 何がそろえば誤検知(または想定内の検知)として閉じてよいか、という証拠の基準。F315 の注記にも「閉じるための証拠の基準の一覧は同ページにない」とある。読み手の最も重い懸念(間違って閉じるのが怖い)に直接答える事実がない。
  - アラートの種類ごとに、どのログのどの項目をどの順で見るか。台帳にはログの種類ごとの記録内容(F105〜F112)はあるが、確かめる手順にはつながっていない。
  - 「攻撃の試み」(侵害に至らなかった攻撃。F207 で 27% 以上)を、閉じるのか上げるのか。台帳に扱いを述べた事実がない。
  - 調査を続けるか上げるかの境目。持ち時間の数値は1つの記事(F403)だけで、根拠が示されていない。
  - 組織に固有の情報。資産の重要度の一覧、承認済みのスキャンやペンテストの予定、既知の例外の一覧、重大度の定義、上げる先と連絡の手順。公開資料にはなく、ブリーフでは社内の手順書は古いため使わないとされている。資料に載せられるのは「これを確かめる」という形までで、中身は SOC ごとに要る。
  - 段階を飛ばすと誤分類が増える(F312)、記録を見直すチームは改善する(F325)の裏付けとなる測定。どちらも解説者の主張。
  - 新人(経験の浅い分析者)の判定の誤り方。F504 は経験者を含む 12 人の正答率で、新人の誤りの傾向や、誤って閉じたものと上げすぎたものの内訳は台帳にない。
  - 重複したアラートやまとめられたアラート(F619、F709 の製品の「インシデント」)を新人がどう扱うか。

notes:
  - 答えはアラートの一次解析を問うが、NIST と CISA の事実の多くはインシデント(報告)を対象にしている。答えの1〜2文目で NIST をアラートの選別に当てはめた箇所は、その分だけ推測を含む。
  - 製品の文書(Microsoft Sentinel、Defender)の事実は、ブリーフが製品名を出さないとしているため、答えでは分類の考え方の裏付けとしてだけ使った。
  - F001(依頼者の実感で 8 割が誤検知と想定内の検知)と F207(1つの SOC で良性のトリガー 49% 以上)は、答えの順序や基準には使っていない。問いに対しては背景の事実であり、手順の根拠ではないため。
