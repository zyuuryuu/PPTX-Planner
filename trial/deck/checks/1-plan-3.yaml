name: 探索の計画の再検査(分類の軸の検査、第3回)
target: trial/deck/01-plan.yaml
upstream: trial/deck/00-brief.md
previous: trial/deck/checks/1-plan-2.yaml
definitions:
  - docs/checks.md(分類の軸の検査)
  - docs/rework.md(不合格のときの手順の5)
judge: Claude Sonnet 5.5 (claude-sonnet-5-5)
round: 3

summary:
  前回の不合格6件: {解消: 6, 未解消: 0}
  直した箇所で新しく生じた問題: なし
  不合格: 0
  判定できない: 0

previous_failures:
  - 指摘: Q1.1 基準を一言で言えるか
    判定: 合格(解消)
    引用:
      - "question: SOCに届くアラートは、どんな性質を持つか"
      - "axis: アラートの性質(生成の根拠、届く件数、誤検知の割合)"
    理由: >
      基準は「アラートの性質」の1つになった。「と」でつないだ2つの基準はなくなり、
      括弧内の3項目は性質の側面として並ぶ。問いの文面も1つの問いになった。
  - 指摘: Q1.1 子の数が軸から決まっているか
    判定: 合格(解消)
    引用:
      - "axis: アラートの性質(生成の根拠、届く件数、誤検知の割合)"
      - "Q1.1.1 何を根拠に生成するか / Q1.1.2 量はどの程度か / Q1.1.3 誤検知の割合はどの程度か"
    理由: 軸の3項目(生成の根拠、届く件数、誤検知の割合)と子3つが1対1に対応する。
  - 指摘: Q3 重なりがないか(Q3.2とQ3.3.2)
    判定: 合格(解消)
    引用:
      - "Q3.2 判断を保留して調査を続ける場合、何をどこまで確かめるとされているか(調べる範囲や時間の目安を含む)"
    理由: >
      Q3.3.2 は削除され、「どこまで調べるか」は Q3.2 だけが問う。Q3.2 と Q3.3 の間で
      同じ問いが2つの枝に入る状態はなくなった。
  - 指摘: Q3.3 子は同じ水準か
    判定: 合格(解消)
    引用:
      - "axis: 判断の前と後(上げる条件、上げるときに渡すもの)"
      - "Q3.3.1 上げる条件 / Q3.3.3 上げるときに添えて渡すもの"
    理由: 前と後に1つずつで、軸の項目と子が同じ水準でそろう。Q3.1 と同じ形になった。
  - 指摘: Q3.3 重なりがないか(Q3.3.1とQ3.3.2)
    判定: 合格(解消)
    引用: "Q3.3.1 アラートを上に上げる条件は、何とされているか / Q3.3.3 上に上げるときに、何を添えて渡すとされているか"
    理由: Q3.3.2 の削除により、条件と深さの重なりは消えた。残る2つは判断の前の条件と後の引き渡しで、答えが重ならない。
  - 指摘: Q3.3 子の数が軸から決まっているか
    判定: 合格(解消)
    引用: "判断の前と後(上げる条件、上げるときに渡すもの) → 子2つ"
    理由: 軸の2項目と子2つが対応する。

new_problem_check:   # 直した箇所(Q1.1、Q3.2、Q3.3、Q3.3.2の削除)の範囲だけ
  Q1.1:
    判定: 問題なし
    理由: 問いと軸が1つの基準に収まり、Q1 の子(アラート、記録、手口の分類)の水準とも合う。Q1.1.1 と Q1.2 は問う対象が分かれたまま。
  Q3.2:
    判定: 問題なし
    引用: "Q3.2 ... (調べる範囲や時間の目安を含む)"
    理由: >
      末端で、Q3 の子3つの1つとして同じ水準にある。evidence_type(SOCの運用の指針、業界の調査)は問いに合う。
      範囲や時間の目安への答えが「ここまでで決まらなければ上げる」の形になる場合、
      Q3.3.1 の答えと近づく余地はある。ただし問いの文面は「調査を続ける間に確かめること」と「上げる条件」で
      切り分けられており、Q3.3.2 の時のように同じ問いが2つの枝に入る形ではないため、不合格とはしない。
  Q3.3:
    判定: 問題なし
    理由: Q3.1(前と後)と形がそろった。
  参考:
    - 子のIDが Q3.3.1、Q3.3.3 で、Q3.3.2 が欠番になっている。分類の軸の検査の対象外で、判定には影響しない。必要なら振り直してよい。
