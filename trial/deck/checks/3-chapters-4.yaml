検査の名前: 章の message が主張より強い・広いことを述べていない(重大な検査。再検査、1回)
対象: trial/deck/03-chapters.yaml(コミット 5e3a1a2b)の ch3 message の最後の文(運用の出どころ)と、ch5 の slides_reason
判定者: 検査セッション(モデル名は記載しない)
上流: 02-claims.yaml の C3、01-sources.yaml の F002〜F004(stance は読んでいない)
前回の指摘: trial/deck/checks/3-chapters-3.yaml(ch3 の出どころの「リーダー」への変更と、ch5 の枚数の理由の食い違い)
件数: {合格: 2, 不合格: 0, 判定できない: 0}
項目:
  - 条件: 1. ch3 の最後の文で、運用の出どころが1つのSOC(依頼者)の証言だと分かる
    判定: 合格
    引用: 「この講義を行うSOCの運用(依頼者であるリーダーが同意し、または行っているもの)」
    出典: F002(依頼者のSOCの運用、依頼者が同意した案)、F003(依頼者のSOCの運用)、F004(依頼者のSOCの運用)は、いずれも「依頼者(SOCのリーダー)が、自分のSOCの運用として述べた」証言
    理由: 「この講義を行うSOC」と「依頼者であるリーダー」により、出どころが1つのSOCの依頼者だと分かる。前回の指摘の「リーダーの運用」で一般のリーダーにも読めた点は解消した。
  - 条件: 2. C3 の「依頼者が同意した運用」と「依頼者のSOCの運用」の区別と食い違わないか
    判定: 合格
    引用: C3「依頼者が同意した運用(新人が閉じてよいのは誤検知と一覧にある想定内の活動だけ)と、依頼者のSOCの運用(攻撃の試みは最初の3か月は全て上げる、閉じたものは後で見直される)を、公開資料とは分けて示す」/ ch3「公開資料の案とは分けて、…(依頼者であるリーダーが同意し、または行っているもの)として、新人が閉じてよいのは誤検知とリーダーが一覧にした想定内の活動だけで、攻撃の試みは最初の3か月は全て上げ、閉じたものは後で見直されることを示す」
    理由: 食い違いはない。「公開資料の案とは分けて」は C3 の「公開資料とは分けて」と合う。「閉じてよいのは…だけ」(同意した運用)と「攻撃の試みは…全て上げ、閉じたものは後で見直される」(行っている運用)は、「同意し、または行っている」で両方を含む。
    備考: 両者を1つの括弧にまとめたため、どこまでが同意で、どこまでが実際の運用かは文面では分からない。C3 は2つを分けて示すよう求めており、読み手が区別できないことは弱点。ただし、主張より強いことにはなっていない。直すなら「依頼者が同意した運用と、依頼者のSOCの運用として」と分けて書く案がある(この判定では必須にしない)。
  - 条件: 3. 主張より強いこと、広いことを述べていない(ch3 最後の文)
    判定: 合格
    引用: 「閉じたものは後で見直されること」/「攻撃の試みは最初の3か月は全て上げ」
    出典: F004 の資料の書き方の指定「資料には『閉じたものは後で見直される』程度に書く(依頼者の指定)」、F003「配属から最初の3か月の新人には、侵害に至らなかった攻撃の試みを全て上げさせる」
    理由: 「閉じたものは後で見直される」は依頼者の指定の文言どおりで、頻度(およそ週1回)は書かれていないので強くない。「攻撃の試み」は、F003 の「侵害に至らなかった」を落としているが、C3 自体が同じ語を修飾なしで使っており、C3 から広がっていない。「最初の3か月」は F003 の「配属から最初の3か月」と合う。「新人が閉じてよいのは…だけ」は F002 の限定と一致する。
  - 条件: 4. ch5 の slides(10)と slides_reason が合うか
    判定: 合格
    引用: slides: 10 / slides_reason「架空のアラート1件につき問題と解説の2枚を4件分(8枚)と、章扉、章のまとめ(講義全体のまとめを兼ねる)の2枚を充てる」
    理由: 8枚(4件×2枚)と2枚(章扉、章のまとめ)で合計10枚。slides の 10 と一致する。前回の指摘の「残り2枚の用途が書かれていない」は、章扉と章のまとめを書いたことで解消した。
件数の内訳と範囲: 上の2か所以外は判定していない。ch1〜ch4 の他の文と、ほかの枚数は見ていない。
