# 検査: 見出しの復元(工程5。docs/stages/05-proof.md の合格条件)
検査の名前: restore
工程: 5
回: 1
対象:
  復元の元: trial/deck/05-proof.yaml(コミット 9a72668e565cb61d3babe49b0a2a87d54584c378)
  比べる先: trial/deck/04-storyline.yaml の headline(同コミット)
判定者: claude-haiku-5-5
手順の守り方:
  - 最初に 05-proof.yaml だけを読み、40枚の見出しを1文(50字以内)で書いた(作業用の控え: 検査セッションの scratchpad)。
  - その後で 04-storyline.yaml を読んだ。preview/ と checks/ は読んでいない。
  - facts の中身(01-sources.yaml)と view の要素(01-model.yaml)は引いていない。判断は show、focus、holds、relation_reason、axis で行った。
条件: 立証から復元した見出しの意味が、04-storyline の headline と一致するか(1枚ずつ)
判定の基準:
  - 一致: 核心の主張が同じ。立証に書かれていない限定を見出しが足している場合は、注として書く。
  - 不一致: 言いたいことが違う、立証と食い違う、限定の形が違う、強さが違う。
  - 判定できない: 立証に、見出しの内容を確かめる記述がない。
集計:
  一致: 20
  不一致: 12
  判定できない: 8(ch5 の全8枚)
主な指摘:
  - 立証に「案」の表示がなく、見出しは「案として」と書く(6枚)。ch3-s5、ch3-s9、ch3-s12、ch3-s13、ch3-s15 と、ch3-s7(限定の違い)。立証の一部には「(案)」がある(ch2-s5、ch3-s3、ch3-s4)ので、表示の扱いが揃っていない。
  - ch5 の8枚は、立証が架空の内容も演習の答えも書いていない。見出しを復元できず、判定できない。立証の show が「答えがたどった分かれ目を強調する」とだけ書いている。
  - ap-s1 は、1つのSOCの実測の「自動遮断の後 約13,764件」を、見出しが「1日約13,764件」と限定なしに書く。
  - ch3-s1 は、民間の解説の最初の段が立証では「分類」、見出しでは「優先付け」。どちらかが誤り。
