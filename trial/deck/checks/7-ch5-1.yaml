      ただし、渡されていない ch3 のスライド(上げる条件、優先度など)に量に関わる規則がないことは確かめられない。
    suggestion: 「(ch3-s6)」を添えるか、「閉じるかは、宛先の数ではなく、一覧の行に当てはまるかで決まります」のように ch3-s6 の範囲で言う
