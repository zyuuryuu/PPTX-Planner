    source_quote: 'ch3-s6 headline: このSOCでは、新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけ'
    reason: >-
      ch3-s6 の限定「想定内の検知として」を落としている。「一覧にある活動だけ閉じる」は、一覧にない活動はどんな理由でも閉じない、と読める。
      これは ch3-s5(誤検知として閉じてよい)と、同じスライドの text「誤検知と根拠をもって言えなければ、見たことを付けて上げる」(言えれば閉じる)と食い違う。
    suggestion: '「ch3-s6(想定内の検知として閉じてよいのは一覧にある活動だけ)」のように限定を残す'
  - id: ch5-1-F2
    slide: ch5-s8
    field: body.text(2文目)と body.mark
    verdict: 不合格
    quote: '持ち時間の中で調べ、誤検知と根拠をもって言えなければ、見たことを付けて上げる(mark: 運用)'
