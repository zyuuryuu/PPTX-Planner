      ch3-s5 headline: 案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる
    reason: >-
      判断の流れ自体は ch3-s6、s11、s13 から導ける。ただし「誤検知と根拠をもって言える」の基準は案(ch3-s5)で、参照先の ch3-s13 も、その部分を案として描き分けている。
