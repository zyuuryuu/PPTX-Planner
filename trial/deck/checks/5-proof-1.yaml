検査の名前: 工程5 立証設計の検査セッションの条件(重大な検査 real の申告の1回目と、holds、主張の種類、除去の検査、分類の軸の検査、限定、演習)
対象: trial/deck/05-proof.yaml(コミット 9a72668e、40枚)
判定者: Claude Opus 5.5(検査セッション。モデルID claude-opus-5-5)
上流: 04-storyline.yaml(見出し、evidence、source)、01-model.yaml、01-sources.yaml(05-proof の facts にある事実の statement、quote、qualifiers、locator を開いた)、terms.yaml、decisions.md(D001〜D008)
基準: docs/stages/05-proof.md の合格条件、docs/vocabulary.md、docs/visual-grammar.md の含意の語彙と問い、docs/checks.md の除去の検査と分類の軸の検査
範囲の外: 機械の検査の項目(facts の台帳との照合、evidence の包含、view の要素の実在など)。見出しの復元。出典そのものを開いての照合(台帳の quote と locator で判断した)
件数: {合格: 0, 不合格: 7, 判定できない: 0}
項目:
  - 項目: 1.【重大】real の申告が正しい(全40枚)
    判定: 不合格
    指摘:
      - 箇所: ch2-s3
        引用:
          - '05-proof ch2-s3 show「端末→EDRのセンサー→振る舞いの記録(…)→検知→アラート(製品の例: Microsoft Defender for Endpoint)」、focus「端末の振る舞いを継続して集めた記録から、アラートが作られること」、holds [connected, ordered]'
          - '01-model.yaml の冒頭「出典で裏付けられず、つながりを登録しなかった箇所(図では途切れとして示す必要がある): EDR(Microsoft Defender for Endpoint): テレメトリがどこからどこへ集められるか(出典は集める主体だけを書く)。集めたテレメトリが検知に使われる経路、テレメトリの保存場所、センサーの置き場所」'
          - '01-model.yaml S-mde の note「テレメトリの収集が検知の前に来ることは出典に書かれていないため、含めない」'
        理由: real true の view が見せるものと合わない。show の「端末→センサー→記録→検知→アラート」の連鎖のうち、端末→センサー、センサー→記録、記録→検知のつながりは仕組みの定義にない(定義が「途切れとして示す」とした箇所そのもの)。view の relations は R-mde-sensor(E-mde がセンサーを含む)と R-mde-alert(E-mde がアラートを作る)で、どちらも起点の E-mde が elements にない。「検知」に当たる要素も MDE の側にない(D-edr-detection は NCA の要件の系統)。E-endpoint のつながりは NCA の E-edr-agent とだけある。focus は、定義が裏付けがないとした「記録からアラートが作られる」をそのまま注目させる点にしている
        直し方の案: view の範囲(E-mde、センサー、テレメトリ、アラート)を、つながりのない箇所を途切れとして描く前提で show を書き直し、focus を出典にあること(継続して集める、検知するとアラートを作る)に限る。連鎖を描くなら、調査依頼を出す
      - 箇所: ch2-s2
        引用:
          - '05-proof ch2-s2 show「複数のログの発生源(OS、セキュリティソフト、アプリケーション)→SIEMのサーバ→重要なイベント」、view.elements [E-src-os, E-src-secsw, E-src-app, E-siem-server, D-significant-event]、scenario: S-siem-agent'
          - '01-model.yaml S-siem-agent: steps [R-agent-server, R-server-significant]、note「発生源からエージェントへの段は出典にない」。R-agent-server は from: E-siem-agent'
          - '01-model.yaml R-os-source、R-secsw-source、R-app-source は kind: example_of、to: E-log-source'
        理由: show の「発生源→SIEMのサーバ」の矢印が、選んだ場面にない。S-siem-agent の最初の段は E-siem-agent→E-siem-server で、E-siem-agent は elements にない。発生源からエージェントへの段は定義が「出典にない」とする。E-src-os などは E-log-source の例としてだけ定義され、SIEMサーバとのつながりを持たない。発生源→サーバを直接つなぐのはエージェントなしの場面(R-source-server-push、E-log-source が起点)である
        直し方の案: エージェントなしの場面(S-siem-agentless-push か pull)と E-log-source を使い、OS などは E-log-source の例として添える。エージェント型を見せるなら、E-siem-agent を入れ、発生源からエージェントへの段を途切れとして描く
      - 箇所: ch2-s1
        引用:
          - '05-proof ch2-s1 show「製品の例(Microsoft Sentinel)で、集めたデータ→分析ルール→アラートのつながり。アラートの先に、1つのSOCの実測の3つの区分(…)を小さく添える」、view.relations に R-sentinel-source-data'
          - '01-model.yaml R-sentinel-source-data: from: E-sentinel-source、to: D-sentinel-data'
          - '01-model.yaml 冒頭「出典は4系統。混ぜずに、要素とつながりを出典の系統ごとに分けて登録した」。F207 origin「同SOCのZeekアラートログ(著者らが実測)」'
        理由: (1) view の R-sentinel-source-data の起点 E-sentinel-source が elements になく、show にもデータソースがない。view と show が合わない。(2) Sentinel のアラートの「先に」、Zeek を使う別のSOCの実測の区分をつなぐと、Sentinel のアラートがその割合で分かれるように読める。このつながりは仕組みの定義になく、系統を混ぜないとする定義の方針にも反する
        直し方の案: E-sentinel-source を elements に足すか、relations から外す。実測の区分は、Sentinel の図とつながない別の囲みにし、別のSOC(ネットワークの検知)のものであることを書く
      - 箇所: ch3-s11(と、その時間の線に矢印を足す ch3-s16)
        引用:
          - '05-proof ch3-s11 show「1件のアラートの時間の線: 0分 調べ始める → 30分 決められなければ、見たことを付けて上げる」、real の項目なし'
          - 'F005「依頼者のSOCでは、配属から最初の3か月の新人は、1件のアラートを30分まで調べ、過ぎたらそこまでに見たことを付けて上げる」'
          - '05-proof.md 4「実在の仕組み、業務、組織、画面を写すスライドでは、real を true とし…主張の種類の区分は問わない」'
        理由: 実在のSOCの業務(運用の手順)を時間の線として写す図で、real を申告していない。仕組みの定義に、このSOCの運用の要素や場面はない。05-proof.md は「定義にないものが必要になったら、描かずに調査依頼を出す」とする
        直し方の案: 実在の業務として real true にして、仕組みの定義に運用の場面を足す(依頼者の証言 F005 を出典とする)か、図にせず規則の1文(statement)で見せる。どちらにするかは設計セッションが決める
      - 箇所: ch3-s5
        引用:
          - '05-proof ch3-s5 show「誤検知として閉じてよい理由を2つに分ける: 検知の条件の誤り、データの誤り(製品の閉じるときの分類の例)」、real の項目なし'
          - 'F605「Microsoft Sentinel では、インシデントを閉じるときに分類の選択が必須で、選択肢は…「False Positive(アラートの論理が誤り)」「False Positive(データが誤り)」…」'
        理由: 実在の製品の画面の選択肢(閉じるときの分類)を図に写すことを show が述べているが、real を申告していない。仕組みの定義に閉じるときの分類はない
        直し方の案: 製品の分類を出典の行か注にとどめ、図に写さない。写すなら real true とし、定義に足す
      - 箇所: ch4-s1(関連して ch4-s2)
        引用:
          - '05-proof ch4-s1「real: false」、show「2013年のTargetの侵害の時間の線: 持ち出し用のマルウェアの導入→検知製品の緊急のアラート→対応なし(報告の記述)」'
          - 'F500「侵入検知製品FireEyeはデータ持ち出し用マルウェアの導入のたびに緊急アラートを出したが、Targetのセキュリティチームは反応せず…」'
        理由: 実在の組織(Target のセキュリティチーム)と実在の製品(FireEye)の、実際の事案での動きを写す図を、false と申告している。false とした理由の記録がない。仕組みの定義にこの事案はない。ch4-s2 も同じ組織の職員の振る舞い(の推定)を写す
        直し方の案: real true とし、定義に事案の場面を足す(F500 を出典とする)か、出来事の写しではなく報告の記述の引用として見せる。「出来事の時間の線は仕組みの写しに当たらない」と解するなら、その解釈を判断の記録に残す。重大な検査のため、2回目の結果と合わせて判断する
    合格とした境界の例:
      - 'ch1-s1、ch1-s2、ch3-s3、ch3-s4、ch3-s13、ch5 の答えの流れ図: この講義の案の手順で、実在の業務の写しではないとみなした(ch1-s2 の show に「この講義の案」とある)'
      - 'ch3-s6、ch3-s10、ch3-s14、ap-s2、ap-s3: 図を使わない言い切りで、写す図がない'
      - 'ch5 の問題の表示(exhibit): 架空のアラートで、架空と明記するとある。実在の製品の画面に似せるかは show から分からないため、似せる場合は工程6で見直す'
      - 'ch2-s4(ログの種類の表)、ch2-s5(ATT&CK の2層): 仕組みのつながりではなく、出典の分類と記述を並べる表と概念の構造とみなした'
  - 項目: 2. holds の申告が正しい
    判定: 不合格
    指摘:
      - 箇所: ch2-s3
        引用: 'holds [connected, ordered]。01-model.yaml S-mde の note「テレメトリの収集が検知の前に来ることは出典に書かれていないため、含めない」'
        理由: 記録→検知→アラートの ordered は、仕組みの定義が裏付けがないとした順序である
      - 箇所: ch2-s7
        引用:
          - 'show「「誤検知の割合」を述べる2つの出典を並べた表。調べ方(自己申告か実測か)、「誤検知」の定義、値」、holds [comparable, distinct-kinds]'
          - 'F207 は真の攻撃0.01%、攻撃の試み27%、良性のトリガー49%。F220 は良性のトリガーを一般の誤検知と「異なる」とする'
        理由: comparable の問い「全ての項目を同じ観点で述べているか」にいいえ。Yangら(F207、F220)は誤検知の割合を述べていない。表の「値」の列を Yangら の行で埋めると、別の指標(良性のトリガー49%など)を誤検知の割合と並べることになる。空欄にすると、表にする条件(全ての行を全ての列の観点で述べられる)を満たさない
        直し方の案: Yangら の行は「誤検知と想定内の検知を分けて数えた。誤検知だけの割合は示していない」と書けるよう列を決め直す
      - 箇所: ch3-s4
        引用: 'show「1. アラートを出したルールの条件を読む 2. アラートに含まれる利用者や端末を見る 3. 元のログと照らす」、holds [ordered]'
        理由: ordered の問い「入れ替えると意味が変わるか」に、1と2の間はいいえ。見出し「ルールの条件と、含まれる利用者や端末を、元のログと照らす」も1と2の順を述べていない。順序があるのは、1と2の後に3が来ることだけである
      - 箇所: ch3-s7
        引用: 'show「優先度の要因(…)を並べ、その横にSIEMの深刻度を「要因の1つの材料」として置く」、holds []'
        理由: show は深刻度と要因の間に関係(深刻度が要因の材料になる)を描くが、holds が空である。また F306 は深刻度を「人の判断への入力」とし、要因の1つの材料とは述べていない。描く関係の裏付けもない
      - 箇所: ch3-s16
        引用: 'show「規則の1文。前のスライドの時間の線の0分の位置から「すぐ上げる」の矢印」、holds []'
        理由: 時間の線の上の位置と矢印は ordered を描く。holds が空と食い違う
      - 箇所: ch3-s2
        引用:
          - 'holds [partition, distinct-kinds]、axis「線を決めたのは誰か」、show「案(公開資料の材料から組み立てたもの)と、このSOCの運用(リーダーが決めたもの)」'
          - 'ch3-s13 見出し「案として、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる」(30分は F005、このSOCの運用)'
          - 'D002「決めたこと: 案A …」「決めた人と日付: 依頼者」。F002 qualifiers「設計セッションが示した案に依頼者が同意したもの」'
        理由: partition の問いのうち「2つの項目に入るものはないか」にいいえと言えない。ch3-s13 の線は案と運用の両方を含む。また「決めたのは誰か」では分かれない(案もリーダーである依頼者が採った。運用の F002 も設計セッションの案に依頼者が同意したもの)
      - 箇所: ch2-s1
        引用: 'holds [connected, ordered]、show「アラートの先に、1つのSOCの実測の3つの区分…を小さく添える」'
        理由: Sentinel のアラートと、別のSOC(Zeek)の区分との間に connected は成り立たない(条件1の ch2-s1 と同じ)
    補足(不合格の根拠にしていない):
      - 'ch1-s1: show は3つの区分を並べるが、holds は [ordered] だけ。見出し「3つに分け」が全体を分ける関係を述べるなら、partition か distinct-kinds が欠けている(書かないことは成り立たない関係を書くことではないが、工程6で含意の欠落になりうる)'
      - 'ap-s1: comparable。F202 は1日の量ではなく、5,000件未満と答えた回答者の割合で、ほかの2行(件数)と指標が違う。「調べ方を列に入れる」で観点を揃えられる見込みがあるとみなした'
      - 'ch2-s6: partition。0.01+27+49+23.72 はほぼ100で、分類できないものを残りとして書くため、漏れはないとみなした。F218(情報提供目的のアラート250万件超)が4つの区分のどこに入るかは台帳から分からず、確かめていない'
      - 'ch4-s2: causal。報告の推定の連鎖で、確認された因果ではない。show が全体に「推定(仮定)」の枠を置くため、推定の中身として成り立つとみなした'
  - 項目: 3. 主張の種類(relation)が見出しと合う。statement と list の relation_reason が妥当
    判定: 不合格
    指摘:
      - 箇所: ch3-s16
        引用:
          - '見出し「このSOCでは、重大度が高いアラートは30分を待たずにすぐ上げる」'
          - 'relation: statement、relation_reason「このSOCの運用の規則を1つ述べるスライドで、比べる対象も順序もない」、show「…前のスライドの時間の線の0分の位置から「すぐ上げる」の矢印」'
        理由: 理由の「順序もない」と、show が時間の線と矢印で順序(30分を待たない)を見せることが食い違う。見出しは「30分を待たずに」と、前の規則との前後を述べている
      - 箇所: ch2-s4
        引用: '見出し「アラートの詳細はOSのログで確かめることが多く、認証のログは通常、接続元と成否を残す」、relation: item-comparison'
        理由: 見出しは、OSのログの使われ方と、認証のログの中身の2つを述べ、項目どうしの大小や優劣を述べていない(「AはBより大きい、最も多いのはA」に当たらない)。表で比べる観点(そこから分かること)は、見出しの前半(確かめることが多い)を立証しない
      - 箇所: ch5-s1、ch5-s3、ch5-s5、ch5-s7
        引用:
          - 'relation: exhibit、show「演習Nの架空のアラートの表示…架空であることを明記する」'
          - 'vocabulary.md「実物の提示(画面、写真、文書の抜粋などを見せる)」。visual-grammar.md「画像を載せる: 実物である(強)…作り物の画面を実物として見せない」'
        理由: exhibit は実物を見せる種類で、架空の表示は実物ではない。語彙に架空の題材の種類がないため、例外として扱うなら判断の記録が要る(D007 は否定の検査の例外だけを定める)
    補足(不合格の根拠にしていない):
      - 'ch2-s5: 見出し「ATT&CKの戦術で、アラートの活動が攻撃のどの段階かを表し、優先度の材料にする」は、当てはめと使い道を述べ、「AはBとCに分かれる」の構造とは言いにくい。show の中心が戦術と技術の2層なら、見出しとずれる'
      - 'ch3-s4: 見出しは順を述べないが relation は process(条件2の指摘と同じ根)'
      - 'ch3-s7: relation_reason「要因の間に順序や重みの定めがない」は要因どうしについては妥当。ただし見出しの「SIEMの深刻度だけでなく」は、1つの基準と複数の要因の対比で、理由はこの部分に触れていない'
      - 'ch3-s14: relation_reason は「規則を1つ」とするが、show は規則と溢れたときの扱いの2文。見出しも2つの部分からなる'
      - '合格とした例: ch2-s9、ch3-s9、ch3-s12、ch3-s15 の list の理由、ch3-s6、ch3-s10、ap-s2、ap-s3 の statement の理由は、見出しと show に照らして妥当'
  - 項目: 4. スライド内の要素が除去の検査を通る。show が focus に関係しない要素を含まない
    判定: 不合格
    指摘:
      - 箇所: ch2-s4
        引用: 'show「ログの種類(OSのログ、認証のログ、マルウェア対策ソフトのログ)ごとに…」、focus「アラートの詳細を確かめる先として、OSのログが多く使われること」、見出しにマルウェア対策ソフトのログは出ない'
        理由: マルウェア対策ソフトのログの行(F107)は、抜いても見出しも focus も成り立つ
      - 箇所: ch2-s9
        引用:
          - 'show「…定期の内部の脆弱性スキャン、外部のベンダーの診断、内部で運用する外部ドメイン、変更が難しい古いシステム」、focus「どれも業務上正当な活動で、ルールは正しく反応していること」'
          - 'F217「SSLの弱い鍵・弱い暗号・旧版に関するアラートは、主にレガシーシステムに起因し、変更が難しい、または無視して安全と判断されていた」'
        理由: 見出しは「社内の脆弱性スキャンや外部の診断」で、後の2項目は抜いても見出しが成り立つ。さらに「変更が難しい古いシステム」は活動ではなく、F217 は業務上正当な活動とは述べていない(変更が難しい、無視して安全と判断)。focus の「どれも業務上正当な活動」に合わない
      - 箇所: ch3-s1
        引用:
          - '見出し「NISTは報告の確認を、民間の解説は優先付けを先に置く」'
          - 'show「民間の解説(アラート: 分類→優先付け→調べる)」、focus「最初の段が出典で違うこと」'
          - 'F312 qualifiers「7段階の名称と順序…1 Alert Ingestion and Centralization、2 Categorization、3 Prioritization、4 Investigation…」'
        理由: show で民間の解説の最初の段は「分類」で、focus はそれを NIST の「確認」と比べる。見出しが述べるのは「優先付けを(確認より)先に置く」ことで、focus と見出しの述べていることが違う。読み手は「分類と確認の違い」を読み取る
    補足(不合格の根拠にしていない):
      - 'ch2-s5: 技術(どのように)の層は、見出し(戦術で段階を表す)からは抜いても成り立つ。戦術の意味(なぜ)を対比で示す役と見て、指摘にしなかった'
  - 項目: 5. 項目をまとめるスライドが分類の軸の検査を通る
    判定: 不合格
    指摘:
      - 箇所: ch2-s4
        引用:
          - 'axis「ログの種類」、show「OSのログ、認証のログ、マルウェア対策ソフトのログ」'
          - 'F108 locator「2.1.1 Security Software(Authentication Servers)」、F107 locator「2.1.1 Security Software(Antimalware Software)」、F110・F111 locator「2.1.2 Operating Systems」。F105「Security software logs … Operating system logs … application logs」'
        理由: 項目が同じ水準でない。出典の分け方では、OSのログはセキュリティソフトのログ、アプリケーションのログと並ぶ上位の種類で、認証サーバとマルウェア対策ソフトはセキュリティソフトの下位の例である
      - 箇所: ch2-s9
        引用: 'show の4項目「定期の内部の脆弱性スキャン、外部のベンダーの診断、内部で運用する外部ドメイン、変更が難しい古いシステム」'
        理由: 項目が同じ水準でない。2つは活動、1つは設定(外部ドメインを内部のIPで運用)、1つはシステムの状態である
      - 箇所: ch3-s2
        引用: 'axis「線を決めたのは誰か」'
        理由: 軸で分かれない(条件2の ch3-s2 と同じ)。案も運用も依頼者が採ったもので、ch3-s13 は両方に入る。show の書き方(公開資料の材料から組み立てたもの/このSOCの運用)に合わせるなら、軸は「出どころ」になる
      - 箇所: ch4-s3
        引用:
          - 'axis「無視したことがあるか(自己申告)」、show「アラートを無視したことがあると答えた56%」'
          - '見出し「…56%が、過去の誤検知を理由にアラートを無視したと答えた」。F506「過去の誤検知の経験を理由にアラートを無視したことがあると答えた」'
        理由: 軸が「過去の誤検知を理由に」を落としている。残りの44%には、ほかの理由で無視した人が入りうるため、軸どおりの「無視したことがない」にはならない
    合格とした例:
      - 'ch2-s6(アラートが何によるものか)、ch2-s7・ch3-s1・ap-s1(出典)、ch3-s5(誤りがどこにあるか。2つは F605 の2つの False Positive に対応)、ch3-s9・ch3-s15(出典の1文の項目をそのまま並べる)、ch3-s12(上げる条件の並列)、ch3-s7(要因。ただし深刻度は別の水準として離して置く前提)、ch2-s5(2層は水準の違いを示す構造)'
  - 項目: 6. show が見出しの限定を図の上で落とさない見込みがある
    判定: 不合格
    指摘:
      - 箇所: ch3-s5、ch3-s7、ch3-s9、ch3-s12、ch3-s13、ch3-s15
        引用:
          - '見出しはどれも「案として」で始まる'
          - 'show に「案」の語がない(例: ch3-s9「閉じるときに記録する4項目…を記録の書式の形で並べる」、ch3-s15「…引き継ぎの書式の形で並べる」)'
          - '比較: ch1-s2「(この講義の案)」、ch2-s5「矢印(案)」、ch3-s3「2段の手順(案)」、ch3-s4「根拠の確かめ方の3段(案)」'
        理由: 同じ「案」の見出しで、show に案の印を書く枚と書かない枚がある。書式の形や製品の分類の例(ch3-s5)を添えると、図が標準や製品の定めに見える。D001 は「組み立てた基準は…「案」であることが分かるように示す」「立証の設計で、案と事実を区別する見せ方が要る」とする
      - 箇所: ch3-s13
        引用: 'show「30分の時点で「閉じる根拠があるか」で分かれる」、見出し「案として、30分調べても…」'
        理由: 30分はこのSOCの運用(F005)で、分かれ方は案(F405)である。show は運用と案の区別を図の上で示さない。D008 は依頼者が「運用と案の区別がつかない」と指摘した経緯を記録している
      - 箇所: ch2-s1
        引用: 'show「1つのSOCの実測の3つの区分(侵害に至った攻撃、攻撃の試み、想定内の検知)を小さく添える」'
        理由: F207 の限定(27%と49%は下限、分類できないもの約24%)が落ちている。3つで全てを分けたように読める。同じ事実を使う ch2-s6 は「分類できないもの約24%」「下限であることを帯に書く」と書いている
      - 箇所: ch4-s3
        理由: 条件5の指摘と同じ。show が「過去の誤検知を理由に」を落としている
      - 箇所: ch3-s11
        引用: 'show「1件のアラートの時間の線: 0分 調べ始める → 30分 …」、見出し「このSOCでは、配属から3か月の新人の持ち時間は…」'
        理由: show に「このSOCの運用」「配属から3か月」がない。時間の線だけを見ると、一般の手順に見える
      - 箇所: ch2-s2
        引用: '見出し「最も一般的にはルールで」、F101 qualifiers「ルール以外の相関もある」、show「サーバの中で記録値(時刻、IPアドレス、種別)を照らすルール」'
        理由: show はルールだけを描き、「最も一般的には」(ほかの相関もある)を図の上に残す書き方がない
    補足: 見出しと出典の行を合わせて判定する(D006)ため、出典の行が限定を持つ枚は、図の上で限定を書かなくても読み手に届く見込みはある。ここでは、図そのものが限定と違う読み方をさせるもの(書式、製品の分類、3つだけの区分、運用と案の混在)を挙げた
  - 項目: 7. 演習(ch5)の show が、答えを問題の表示から導ける見込みがある
    判定: 不合格
    指摘:
      - 箇所: ch5-s1、ch5-s3、ch5-s5、ch5-s7
        引用:
          - '4枚とも show「演習Nの架空のアラートの表示(検知のルール、端末、時刻、宛先などの項目)」、focus「判断に使う項目(端末、時刻、一覧との一致など)」で同じ文'
          - 'ch5-s2 見出し「端末と時刻が一覧と合うため…」、ch5-s6 見出し「侵害に至らなかった攻撃の試みで…」(ch5-s5「防がれた記録があるアラート」)、ch5-s8 見出し「…30分の中で誤検知と根拠をもって言えなければ…」(ch5-s7「重要でない業務用のPCで、一覧にない見慣れないプロセス」)'
        理由: 答えが拠る情報が、表示の項目に入る見込みがない。演習1と4はリーダーの一覧(F002)そのものが要るが、show は一覧を見せない。演習3は防がれた記録(通信の結果)が要るが、項目にない。演習4は資産の重要度とプロセスの情報が要るが、項目にない。演習2は管理ツールの定期の通信であることを示す情報が要る。4枚の show と focus が同じ文で、演習ごとの判断の材料を決めていない
        直し方の案: 演習ごとに、表示する項目と、添える資料(一覧、資産の重要度の表など)を show に書く
      - 箇所: ch5-s2、ch5-s4、ch5-s6、ch5-s8
        引用:
          - 'show「第1章の流れ図(閉じる・調べる・上げる)の上で、演習Nがたどる道を強調する」'
          - 'ch1-s2 show「「根拠をもって誤検知か想定内と言えるか」で分かれ、言えれば記録して閉じる、言えず迷えば上げる流れ」'
        理由: 第1章の流れ図(ch1-s2)には「調べる」と30分の分かれ目がなく、演習4の答え(閉じずに調べ、30分の中で…)の道を描けない。演習3の答えの理由(配属から3か月の新人は攻撃の試みを全て上げる、F003)も分かれ目として図にない。ch1-s2 の「言えず迷えば上げる」の道を強調すると、演習3は「迷ったから上げた」と読める。また「第1章の流れ図(閉じる・調べる・上げる)」がどの図か(ch1-s1 の2段か ch1-s2 の分岐か)が決まっていない
        直し方の案: 答えの図を、30分の分かれ目(ch3-s13)と3か月の規則(ch3-s14)を含む流れ図にするか、第1章の流れ図にそれらを足す
主な指摘:
  - 'real true の3枚(ch2-s1、ch2-s2、ch2-s3)とも、show が仕組みの定義にないつながりを描く。ch2-s3 は定義が「途切れとして示す」とした箇所そのもの'
  - 'real を申告していない実在の写し: ch3-s11(このSOCの運用の時間の線)、ch3-s5(製品の閉じるときの分類)、ch4-s1(Target と FireEye の事案。false と明記)。解釈の余地があるため、2回目の検査と合わせて判断する'
  - '演習の問題の show が4枚とも同じ文で、答えに要る一覧、防がれた記録、資産の重要度を表示に含めない。答えの図(第1章の流れ図)に30分と3か月の規則の分かれ目がない'
  - '案の見出しの6枚で、show に案の印がない(ch3-s3、s4 にはある)'
