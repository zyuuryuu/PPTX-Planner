target: trial/deck/01-sources.yaml の request が R2、R4、R5 の事実(F200〜F218、F400〜F414、F500〜F510、45件)
judge: claude-opus-5-5(検査セッション)
date: '2026-11-23'
method: 各出典をこのセッションで取得し(PDF は pdftotext、HTML はタグを除去)、quote を空白と引用符を正規化して全文検索し、前後の文を読んで判定した。CISA の PDF は直接の取得が 403 だったため、WebFetch が保存した同じ URL の PDF から抽出した。記憶による判定はしていない。
criteria:
  1_quote_exists: quote が出典に実在する
  2_cut: 切り取りが前後の条件、範囲、主体を落としていない
  3_statement: statement が quote と合う(言い過ぎ、quote にない内容の追加がない)
  4_qualifiers: qualifiers が quote の限定を漏れなく挙げ、value と unit が quote と一致する
  5_as_of(参考): as_of と撤回・旧版の扱い
