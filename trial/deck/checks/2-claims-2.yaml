# 検査: 主張の骨子の重大な検査(工程2、2回目)
検査: 2-claims(重大な検査。限定の残存、answer と主張より強くないか、unresolved への依存)
回: 2
対象: trial/deck/02-claims.yaml(answer、summary、C1〜C4、objections)。判定に使った版は f549255b08531620631482739967980076f867dd
判定者: claude-sonnet-5-5(セッションの設定上のモデル識別子)
読んだもの: 02-claims.yaml、02-answers.yaml、01-sources.yaml(stance は読まない。F番号の statement、qualifiers、quote と origin のみ)、terms.yaml、decisions.md、docs/stages/02-claims.md。仮説、journal、他の checks は読んでいない
件数: {合格: 1, 不合格: 2, 判定できない: 0}
条件:
  - 条件: 1. 各主張と objections の response が、根拠の事実の限定と問いごとの答えの限定を落としていない。事実にない内容を足していない。数値が事実の値と一致する
    判定: 不合格
    数値: 一致している(0.01%、27%以上、49%以上、2020年12月〜2022年7月、179人、56%。F207、F506 と照合)。数値の誤りはない
    指摘:
      - 箇所: C1 statement
        引用: 誤検知のよくある原因には、緩く書かれたシグネチャや、学習期間に観測されなかった保守作業がある
        根拠: >
          F214「Some analysts reported that signatures are “loosely written”」(qualifiers: インタビュー参加者の一部の認識(定性))。
          F210 の qualifiers「異常検知型の検知方式について」。
        理由: 「一部の解析者の述べたこと」を「よくある原因」にし、学習期間の保守作業が異常検知型 IDPS に限った話であることを落としている。Q1.1.4 の答えは「実務者の一部は」「異常検知型では」と限定を残しているのに、主張で消えた
      - 箇所: C1 statement(F207 の割合の使い方)
        引用: アラートは、SIEMやEDRが検知の条件に合うイベントを見つけて出す知らせであり、…1つの実在のSOCの実測(2020年12月〜2022年7月)では…0.01%…27%以上…49%以上
        根拠: F207 の origin「同SOCのZeekアラートログ(著者らが実測)」、論文題名「Network Alerts in a Security Operations Center」
        理由: 測った対象はネットワークの Zeek アラートである。主張はアラートをSIEMやEDRが出す知らせと定義した直後に、この割合を「アラート」の割合として置いており、測定対象の限定(Zeek のネットワークアラート)が主張にない。重みは小さい
      - 箇所: C1 objections の response
        引用: 8割に近い値はベンダーの調査の83%だけで、誤検知と想定内の検知を分けずに数えている
        根拠: F204 qualifiers「「誤検知」の定義は示されていない」「解析者の自己申告(測定値ではない)」「ベンダーの調査。宣伝目的を含む」
        理由: 出典が定義を示していないことを、「分けずに数えている」という断定に変えている(Q1.1.3 の答えにも同じ括弧がある)。F204 は「含めうる」とするだけである。また自己申告であることと、ベンダーの調査であることの限定が、response では「ベンダーの調査の83%」の語以外に残っていない(自己申告が落ちている)
      - 箇所: C2 statement 末尾
        引用: 複数のアラートの間は、届いた順ではなく、影響の大きさなどの要因で優先順位を付ける
        根拠: >
          「届いた順ではなく」を支えるのは F300 だけ(F321 の statement に到着順の記述はない)。F300 qualifiers「出典の NIST SP 800-61 Rev. 2 は 2025-04-03 に撤回され…置き換えられた」「対象は「インシデント」の対応であり、アラートの個別の選別に限った記述ではない」。F321 は「資産の重要度、攻撃の段階、脅威インテリジェンスとの一致、異常スコア、業務上の文脈」で、「影響の大きさ」とは別の語
        理由: 撤回済みの Rev.2 だけが支える内容なのに、撤回済みであることと、インシデントについての記述であることが、主張の本文に出ていない(assumes が インシデント→アラートの当てはめだけを述べる)。答えの文書の冒頭の決まり「撤回済みの Rev.2 だけが支える内容は明示する」にも合わない。さらに「影響の大きさ」は F321 の要因の言い換えとして広い
      - 箇所: C3 statement
        引用: 重要な資産や横展開の疑いがあるとき
        根拠: F406 quote「Any confirmed or likely TP on a Tier 1 asset」/「Evidence of lateral movement (multiple hosts involved)」。Q3.3.1 の答え「複数のホストにまたがる横展開の証拠」
        理由: 出典の条件は、重要資産では「疑い」でよいが、横展開では「証拠(複数ホストにまたがる)」である。主張は横展開を「疑い」にしており、上げる条件を出典より広げている。案として組み立てた旨はあるが、F406 を根拠に挙げた文で値が違う
      - 箇所: C3 statement 冒頭
        引用: 閉じる、調査を続ける、上げるの具体的な線は、調べた公的な文書に書かれておらず、組織が決める
        根拠: Q3 の unresolved「「NIST は組織の方針で定める」の根拠は撤回済みの Rev.2(F409)だけで、その明示がなく…」。F409 qualifiers「撤回済みの版」。C3 の evidence に F409 はない。F610 は「要因の組み合わせは組織の必要と成熟度による」まで
        理由: 「組織が決める」は、撤回済みの Rev.2 の記述(上げる条件)を、閉じる条件にも広げて(Q3.1 の assumes、D001)言った内容である。この広げた前提は C3 の assumes に載っていない。F610 が支えるのは要因の組み合わせが組織による点までで、「線は組織が決める」ではない
      - 箇所: C3 objections の response
        引用: 新人の SOC で使えるかは、SOC のリーダーが決める(D001)
        根拠: D001「依頼者の SOC の基準として使えるかは、依頼者が出来上がったものを見て決める」
        理由: D001 は決める人を依頼者としている。「SOC のリーダー」は事実にも記録にもない人物の指定で、足された内容である
      - 箇所: C4 statement
        引用: 2013年のTargetの侵害では、検知製品の緊急のアラートに対応がなく、米上院の報告は、頻繁に鳴るアラートを誤検知とみなした可能性があると推定している
        根拠: F500 qualifiers「Bloomberg Businessweekの報道を引用した記述」「報告自身は新たな技術的事実を示していない公開情報ベースのスタッフ報告」。F501 / F506 の statement は「誤検知」を出典の語として扱う(Q4.1 の答え「(出典の言い方)」)
        理由: 緊急のアラートに対応がなかったことが、報道を引いた上院報告の記述であるという限定が落ち、確定した事実の書き方になっている。「誤検知」は語彙表では想定内の検知を含めない語だが、出典の false positive は定義が違いうるのに、「出典の言い方」の限定が主張にない(C4 の Imperva の文も同じ)。括弧書きで「無視したアラートが本物だったかは示されていない」を残した点は適切
    合格の部分: C2 の NIST と民間の解説の順序の食い違いの記述(F303 の対象はインシデント報告、F312 の段階の順は見出しによる)、C3 の持ち時間と記録の記述、C4 の Imperva の数値と限定
  - 条件: 2. summary が、answer と主張より強いこと、広いことを述べていない。主張の限定を落としていない。数値が一致する
    判定: 合格
    理由: summary に数値はなく、一致の対象がない。C1〜C4 にない主張を足していない。「案」「侵害に至らなかった試みを含む」「持ち時間の中で」は C2、C3 と同じ強さで残っている。C3 の「迷うとき」「調査を続ける」を落としているのは狭める側で、強めてはいない
    付記:
      - 条件1の C3 の指摘(横展開の「疑い」)が直ると、summary の「重要な資産と横展開の疑いがあるもの」も同じ直しが要る。現状は C3 と同じ強さなので不合格にしないが、直すときは一緒に直すこと
      - 「重要な資産と横展開の疑い」の「と」は、C3 の「や」と違い、両方が要る意味にも読める
  - 条件: 3. 問いごとの答えの unresolved の部分に頼っていない
    判定: 不合格
    指摘:
      - 箇所: C3 statement 冒頭の「組織が決める」
        引用: 閉じる、調査を続ける、上げるの具体的な線は、調べた公的な文書に書かれておらず、組織が決める
        根拠: Q3 の unresolved「「NIST は組織の方針で定める」の根拠は撤回済みの Rev.2(F409)だけで、…主張に使うときはこの部分に頼らない」。Q3.1 の unresolved(「閉じるときに分類を付けるものがある」)は C3 が使っていないので、こちらは頼っていない
        理由: Q3 の答えの括弧「上げる判断について、NIST は組織の方針で定めるとする」と、C3 の「組織が決める」は同じ内容で、unresolved の部分に頼っている。Rev.3 の F610 などで独立に支えられる範囲(要因の組み合わせは組織による)を超えている
    頼っていない箇所: Q1.2 の unresolved(認証サーバのログ)は、どの主張にも使われていない。Q3.1 の unresolved も使われていない
重大な指摘の要約:
  - C1 と objection: 「よくある原因」(F214 は一部の解析者、F210 は異常検知型に限る)、「分けずに数えている」(F204 は定義を示していない)
  - C2: 「届いた順ではなく」を支えるのは撤回済みの Rev.2(インシデント)だけで、本文に出ていない
  - C3: 横展開が「証拠」から「疑い」になっている。「組織が決める」が unresolved の部分に頼る。「SOC のリーダー」は足された人物
  - C4: 上院報告が報道を引いたものという限定、出典の「誤検知」の語の限定が落ちている
直し方の提案(成果物は変えていない):
  - 「よくある」を「一部の実務者が述べた」にし、保守作業は「異常検知型の IDPS では」と限る
  - 「分けずに数えている」を「定義は示されていない」にする
  - C2 末尾は「撤回済みの NIST SP 800-61 Rev.2 はインシデントについて届いた順にしないとし、民間の解説はアラートの要因を挙げる」の形にするか、案として自分の順を採ると書く
  - C3 は「横展開の証拠」にする。「組織が決める」は、案として示す理由の側(D001)に置くか、Rev.3 が支える範囲(要因の組み合わせが組織による)に狭める。「SOC のリーダー」は「依頼者」にする
  - C4 は「上院の報告が報道を引いて述べるところでは」を足し、「誤検知」に「(出典の言い方)」を付ける
