out_of_scope_observation: >
  指摘ではない(F303 の qualifiers のこの項目は直されておらず、前回の検査で問われていないため、判定に数えない)。
  F303 の qualifiers「優先度の区分は High(推奨の度合い)」について、SP 800-61r3 は Priority を
  "Each row’s relative priority within the context of incident response"(High: "Functions as a core incident response activity for most organizations")
  と定義しており、R1 の推奨の度合いではなく、CSF の要素(RS.MA-02)の行の優先度である。設計セッションが使う前に確かめるとよい。
