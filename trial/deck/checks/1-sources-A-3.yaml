disputes:
  - id: F303
    判定: 収集セッションが正しい。A-2 の c1 の不合格は誤り
    引用:
      - "出典(SP 800-61r3 Table 3、RS.MA-02 の行。-layout で文字に起こしたもの): RS.MA-02 | Incident reports are triaged and validated | High | R1: Perform a preliminary review of a new incident report to verify that a cybersecurity incident has occurred, then estimate the severity of the incident and the level of urgency needed to respond to it."
    理由: >
      "validated" は CSF の要素の説明の列("Incident reports are triaged and validated")にあり、R1 の本文は
      "Perform a preliminary review of a new incident report ..." で、"new" と "incident" の間に語はない。
      PDF の全文で "validated" は3か所だけ(1464行 "identified, validated, and"、2549行の上の要素説明、2745行 "estimated and validated")で、
      R1 の中にはない。台帳の quote は R1 と一致する。台帳の qualifiers の「R1 の本文に "validated" の語はない」も正しい。
  - id: F115, F119
    判定: 収集セッションが正しい。'Last updated April 2024' は頁の本文の更新日ではない
    引用:
      - "出典(https://attack.mitre.org/resources/ の HTML): <a href=\"/docs/attack_roadmap_2024_april.pdf\"> … MITRE ATT&CK Roadmap … </a> <div class=\"text-label-small\">Last updated April 2024</div>"
      - "同: <a href=\"/docs/attack_matrix_poster_2024_april.pdf\"> … MITRE ATT&CK Matrix Poster … </a> <div class=\"text-label-small\">Last updated April 2024</div>"
    理由: >
      頁にある 'Last updated' は2つだけで、どちらも資料(Roadmap と Matrix Poster の PDF)へのボタンの直下に付いた小さなラベルである。
      リンク先のファイル名も 2024_april である。頁の本文(What is ATT&CK?、How can I use ATT&CK?)に更新日の表示はない
      (日付らしい表示は、ほかに著作権表示 "2015 - 2026" と参考文献の年だけ)。
      したがって A-1 の c5 の指摘(頁の更新日は April 2024)は誤りで、台帳の as_of「2026-11-23取得(ATT&CK v20.1)。ページに本文の更新日の表示なし」が正しい。
      v20.1 は /resources/versions/ の "ATT&CK v20.1 October 13, 2026 - current" で確かめた。

