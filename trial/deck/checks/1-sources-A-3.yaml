method: >
  出典を全て取得し直して照合した。NIST SP 800-92 / 800-94 / 800-61r2 / 800-61r3 と MITRE ATT&CK Design and Philosophy の PDF は
  nvlpubs.nist.gov と attack.mitre.org から curl で取得し、pdftotext で文字に起こした。attack.mitre.org の /、/resources/、
  /resources/faq/、/resources/versions/ と CyberDefenders の記事は HTML を取得した。CISA の PDF は curl では 403 だったため、
  WebFetch で同じ URL から取得した PDF(44頁、Publication: November 2021、2024-08-23 作成)を pdftotext で文字に起こした。
  csrc.nist.gov の SP 800-92 と SP 800-94 のページも取得した。
  quote は、空白、改行、引用符、ダッシュ、行末のハイフン分割、表の区切り記号(| と ;)を正規化して機械で照合し、
  照合できなかった4件(F100、F101、F109、F305)は原文を目で読んで、脚注番号(37、6)、脚注の挿入、改ページで割れているだけと確かめた。
  そのうえで、前回の指摘の箇所と、直した箇所の前後の文脈を読んだ。
  前回の版(コミット 7c2bad2 と 1314416 の直前)と今回の版を項目ごとに比べ、変わった項目だけを新しい問題の対象にした。
  01-hypotheses.yaml、01-sources.yaml、journal.md、ほかの checks/ は読んでいない。成果物は変えていない。
