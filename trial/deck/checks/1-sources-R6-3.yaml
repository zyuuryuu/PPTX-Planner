    解消: 解消
    根拠: "statement は「エスカレーションは一般に…」「エレベーションは通常…」となり、qualifiers に「generally」「usually」付きで確定した定義ではないことが入った。「宣言済みのインシデント(アラートの段階ではない)」は「進行中のインシデント(ongoing incidents)」に直り、quote の 'all ongoing incidents' と合う。表の列の連結も qualifiers にある。quote は p.28 の RS.MA-04 に実在"
    新しい問題: "あり(軽微)。statement の「エレベーションは通常より上位の管理者を対応に関与させることを示す」は、「通常より上位」と読むと「通常よりも上のレベルの管理者」の意味になり、原文の usually(副詞。通常は)と higher level of management(上位の管理者)の関係とずれうる。直すなら「エレベーションは通常、上位の管理者を…」"
