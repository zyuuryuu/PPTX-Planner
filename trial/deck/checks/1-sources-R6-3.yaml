  - id: F607
    前回の指摘: "(a)種別の選択(with a type of threat/activity)が statement と qualifiers にない (b)Informational の「通常は無視してよいが、実際の攻撃者の同様の活動では検知を期待する」が落ちている"
    解消: "(a)は解消 (b)は未解消"
    根拠: "(a) statement に「脅威の種別を付ける」「活動の種別を付ける」が入り、qualifiers に「with a type of threat」「with a type of activity」「the options in this category」が入った。追加した用途(セキュリティテスト、レッドチーム、信頼するアプリや利用者の想定内の異常な振る舞い)は原文と合う。(b) 'You generally want to ignore these alerts but expect them for similar activities in the future where the activities are triggered by actual attackers or malware.' に当たる記述は、statement にも qualifiers にもない。quote には残っている"
    新しい問題: なし
    判定: "合格(前回も、(b)は軽微として不合格にしていない。(b)を直すなら qualifiers に「通常は無視してよいが、実際の攻撃者や悪意のあるソフトによる同様の活動では検知を期待するアラート」を足す)"
