  - "F607(未解消・軽微): 種別の選択(with a type of …)は直った。もう1つの指摘、Informational, expected activity が「通常は無視してよいが、実際の攻撃者や悪意のあるソフトによる同様の活動では検知を期待する」という但し書きを持つ点は、statement にも qualifiers にもまだない"
  - "F618、F619(参考): qualifiers の「適用範囲は Plans 1 and 2」は、ページの Applies to のうち Defender for Endpoint の部分だけで、同じ行にある Microsoft Defender XDR を書いていない。誤りではない"
