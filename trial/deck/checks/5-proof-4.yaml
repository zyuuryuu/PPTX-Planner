machine_check: tools/check.py --stage 5 を対象のコミットで実行し、不合格なし(F002、F003、F005 の再使用の警告のみ)。以下は機械では見られない判定。
summary:
  pass: 2
  fail: 3
  cannot_judge: 0
  main_findings:
    - 【重大】確かめる順(一覧→誤検知→重大度→攻撃の試み→それ以外)と「上のどれにも当たらない」は F002、F003、F005 にない。重なる条件(一覧にあり重大度が高いなど)の行き先を、証言にない順序で決めている。D009 自身が確かめていないと書いている。
    - '【重大】案の部分(「誤検知と根拠をもって言える」、30分の後の分かれ方)が basis: operation のつながりの condition に入っている。案であることは note にしかない。場面の note「線は依頼者が決めた」は D009 と合わない。'
    - 【重大】ch3-s17 の見出し、source、show のどれも「配属から3か月」を落としている(F003、F005 の限定。ch3-s11、s14 の見出しにはある)。
    - ch3-s17 は誤検知の判定と攻撃の試みの判定を「調べる」の前に置き、30分を「残り」だけに当てている。ch3-s5、s11、s13(閉じる根拠は30分の調べで得る)と食い違う。一覧にあって重大度が高いアラートを閉じる道ができ、ch3-s16 と食い違う。
    - ap-s2 と holds、relation は合格。

checks:
  # ===== 条件1【重大】仕組みの定義に足したものが証言の範囲内か =====
  - id: 1
    condition: 【重大】仕組みの定義に足した要素とつながりの条件が、依頼者の証言(F002、F003、F005)の範囲を超えていない。証言にない線、条件、順序を足していない。案(D001、D008)の部分を運用として書いていない。
    verdict: 不合格
    findings:
      - point: 確かめる順と「上のどれにも当たらない」が証言にない
        quote:
          - '01-model.yaml R-op-other: condition: 上のどれにも当たらない / note: このSOCの運用。依頼者が挙げた順に確かめる / evidence: [F005]'
          - '01-model.yaml S-newbie-ops note: 依頼者が工程5で挙げた順(一覧/誤検知→閉じる、重大度が高い→すぐ上げる、攻撃の試み→上げる、それ以外→30分調べる)。依頼者の運用で、線は依頼者が決めた'
          - 'F005 statement: 配属から最初の3か月の新人は、1件のアラートを30分まで調べ、過ぎたらそこまでに見たことを付けて上げる。重大度が高いものは30分を待たずにすぐ上げる'
          - 'D009: 確かめる順は依頼者が挙げた順とし、たとえば一覧にあるが重大度が高いアラートの扱いは、依頼者に確かめていない'
        reason: >
          F002、F003、F005 は、それぞれ閉じてよいもの、上げるもの、持ち時間を述べるだけで、どれを先に確かめるかも、
          「どれにも当たらないものだけを調べる」とも述べていない。F005 の30分は「1件のアラート」すべてに掛かる書き方で、
          「残り」に限っていない。R-op-other の evidence は F005 だが、F005 から「上のどれにも当たらない」は出ない。
          順序の根拠とされる「依頼者が挙げた順」は、出典(01-sources.yaml)に証言として登録されていない。
          条件が重なる場合(一覧にあり重大度が高い、など)に行き先を決めているのはこの順序で、証言にない順序を足している。
          また「線は依頼者が決めた」は、D009 の「依頼者の運用なので線を引いてよく」(許可)と「依頼者に確かめていない」と合わない。
      - point: '案の部分を basis: operation のつながりとして登録している'
        quote:
          - '01-model.yaml R-op-fp: basis: operation / condition: 誤検知と根拠をもって言える / note: このSOCの運用。誤検知と言える基準は案(D001、ch3-s5)'
          - '01-model.yaml R-op-inv-close: basis: operation / condition: 30分の中で閉じる根拠が得られた / note: …根拠が得られたら閉じる分かれ方は案(D008)'
          - '01-model.yaml R-op-inv-esc: basis: operation / condition: 30分たっても閉じる根拠がない / note: …根拠がなければ上げる分かれ方は案(D008)'
          - '01-model.yaml 冒頭: operation(依頼者のSOCの運用。依頼者の証言 F002〜F005。…)'
          - 'F002 statement: 新人が自分で閉じてよいのは、誤検知と、…想定内の活動…に当てはまるものだけである'
          - 'D008: 案として「30分調べても閉じる根拠がなく迷うなら、閉じずに上げる」(ch3-s13)とする … 決めた人: 設計セッション'
        reason: >
          F002 は「誤検知」と言うだけで、「根拠をもって言える」は案(D001、D002、ch3-s5)の基準である。
          F005 は「過ぎたら上げる」と言うだけで、「閉じる根拠がない」ときに上げる、「根拠が得られた」ら閉じる、という分かれ方は
          設計セッションが決めた D008 の案である。これら3本は basis が operation(冒頭の定義では「依頼者の証言」)で、
          condition の欄に案の文言がそのまま入っている。案であることは自由記述の note にしかなく、basis で区別できない。
          条件の「案(D001、D008)の部分を運用として書いていない」を満たさない。
      - point: A-close の名前に案の文言が入っている(軽微)
        quote:
          - '01-model.yaml A-close: name: 閉じる(記録して終える) / evidence: [F002]'
        reason: F002 は閉じてよい範囲を述べるだけで、「記録して」は D002 の案の文言である。
    ok:
      - R-op-list(F002)、R-op-severe(F005、30分を待たずにすぐ上げる)、R-op-attempt(F003、配属から3か月)の条件は、それぞれの証言の範囲内。
      - 要素 E-newbie(配属から3か月の新人)、D-op-alert、A-investigate(30分まで)、A-escalate は証言の範囲内。
    suggestion: >
      順序は依頼者に確かめて証言として登録するか、確かめるまでは図に順序(と「上のどれにも当たらない」)を持たせない。
      案の部分は basis を分ける(例: 案のつながりを別の basis にする)か、少なくとも案のつながりと運用のつながりを分けて登録する。

  # ===== 条件2【重大】見出し、source、show が証言と案の限定を落としていない =====
  - id: 2
    condition: '【重大】ch3-s17 の見出しと source、show が、証言と案の限定を落としていない(配属から3か月の新人、30分、案の部分の印)。real: true の view と show が合う。'
    verdict: 不合格
    findings:
      - point: 「配属から3か月」が見出し、source、show のどれにもない
        quote:
          - '04-storyline.yaml ch3-s17 headline: このSOCの新人は、一覧か誤検知なら閉じ、重大度が高いか攻撃の試みなら上げ、残りは30分調べる'
          - '04-storyline.yaml ch3-s17 source: このSOCの運用。「誤検知と言える」の基準と、30分で根拠がなければ上げる分かれ方は案'
          - '05-proof.yaml ch3-s17 show: このSOCの運用の流れ図: 新人に届いたアラートから、…'
          - 'F003 qualifiers: 配属から最初の3か月 / F005 qualifiers: 配属から最初の3か月'
          - '04-storyline.yaml ch3-s11 headline: このSOCでは、配属から3か月の新人の持ち時間は1件30分で、…'
          - '04-storyline.yaml ch3-s14 headline: このSOCでは、配属から3か月の新人は攻撃の試みも全て上げ、…'
        reason: >
          攻撃の試みを全て上げること(F003)と30分(F005)は、配属から最初の3か月に限った運用である。
          見出しは「このSOCの新人は」と言い切り、限定がない。source と show にもない。
          view の要素 E-newbie の名前には「配属から3か月の新人」があるが、show は E-newbie を図のどこに置くかを書いておらず、
          聞き手に見える文言で限定が出る保証がない。同じ運用を述べる ch3-s11、s14 の見出しには限定がある。
      - point: 見出しの「誤検知なら閉じ」に案の印がない(source と show にはある)
        quote:
          - '04-storyline.yaml ch3-s17 headline: …一覧か誤検知なら閉じ、…'
          - '04-storyline.yaml ch3-s5 headline: 案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる'
        reason: >
          source と show は「誤検知と言える基準」を案としている。見出しは「誤検知なら」とだけ言い、案の基準(根拠をもって言える)も
          案の印も落としている。F002 の文言(誤検知)の範囲には収まるので単独では重大でないが、show の「誤検知と根拠をもって言える→閉じる」と
          見出しの言い方がずれる。
      - point: view の E-newbie が show に対応しない(軽微)
        quote:
          - '05-proof.yaml ch3-s17 view.elements: E-newbie, D-op-alert, A-close, A-investigate, A-escalate'
          - '01-model.yaml: E-newbie を from または to に持つつながりがない'
        reason: >
          show の流れは D-op-alert、A-close、A-investigate、A-escalate と場面の7本のつながりで全て表せ、ここは合う。
          E-newbie はどのつながりにも出ず、show も図の中の位置を書いていないため、view にあるのに図に出る形が決まらない。
          「配属から3か月の新人」をこの要素で示すつもりなら、show にその置き方を書く必要がある。
      - point: 「30分まで」が「30分調べる」になっている(軽微)
        quote:
          - 'headline: 残りは30分調べる'
          - 'F005 statement: 1件のアラートを30分まで調べ'
        reason: F005 は上限(まで)であり、30分調べ続けるとは言っていない。A-investigate の名前は「調べる(30分まで)」で正しい。
    ok:
      - 30分は見出しと show にある。
      - 案の部分(誤検知と言える基準、30分の後の分かれ方)は source と show に印がある。
      - show の分かれ方(一覧→閉じる、誤検知→閉じる、重大度が高い→すぐ上げる、攻撃の試み→上げる、どれでもない→調べる→閉じる/見たことを付けて上げる)は、S-newbie-ops の7本のつながりと一致する。
    suggestion: 見出しを「このSOCでは、配属から3か月の新人は、…」とし、案の部分に「案として」を付けるか、案の部分を見出しから外す。

  # ===== 条件3 ほかの運用と案のスライドと矛盾しない =====
  - id: 3
    condition: ch3-s17 の流れが、ほかの運用と案のスライド(ch3-s5、s6、s11、s13、s14、s16)と矛盾しない。
    verdict: 不合格
    findings:
      - point: 一覧にあり重大度が高いアラートが閉じる道に入り、ch3-s16 と食い違う
        quote:
          - '04-storyline.yaml ch3-s16 headline: このSOCでは、重大度が高いアラートは30分を待たずにすぐ上げる'
          - '01-model.yaml R-op-other note: 依頼者が挙げた順に確かめる(一覧→誤検知→重大度→攻撃の試み→それ以外)'
          - '05-proof.yaml ch3-s17 focus: どのアラートも、この流れのどれか1つの道を通ること'
        reason: >
          一覧にある、と重大度が高い、は重なりうる。挙げた順に確かめると、一覧にあって重大度が高いアラートは閉じる道に入る。
          ch3-s16 は重大度が高いアラートに例外を置いていない。順序を持たないと読むなら、重なるアラートが2つの道に入り、
          focus の「どれか1つの道」が成り立たない。どちらに読んでも、ch3-s16 か focus と食い違う(D009 は確かめていないと記録している)。
      - point: 誤検知の判定を調べる前に置き、ch3-s5、s11、s13 と食い違う
        quote:
          - '01-model.yaml R-op-fp: from: D-op-alert / to: A-close / condition: 誤検知と根拠をもって言える'
          - '01-model.yaml R-op-other: from: D-op-alert / to: A-investigate / condition: 上のどれにも当たらない'
          - '05-proof.yaml ch3-s13 show: 30分の時点(このSOCの運用)で「閉じる根拠があるか」で分かれる流れ。…ある→記録して閉じる、なく迷う→閉じずに上げる'
          - '04-storyline.yaml ch3-s11 headline: このSOCでは、配属から3か月の新人の持ち時間は1件30分で、過ぎたら見たことを付けて上げる'
          - 'D008: 演習4の答えは「30分の中で誤検知と根拠をもって言えなければ上げる」とする'
        reason: >
          ch3-s5 の案は「検知の条件かデータの誤りで出たと根拠をもって言える」ことを求め、ch3-s13 と D008 は、その根拠を30分の調べの中で得るとしている。
          ch3-s11 の持ち時間は1件ごと(全てのアラート)に掛かる。ch3-s17 は、誤検知と言えるかを「調べる」の前の分かれ道に置き、
          30分を「上のどれにも当たらない」残りだけに当てている。このため、調べずに誤検知として閉じる道と、調べてから閉じる道(R-op-inv-close)の2つがあり、
          どちらで閉じるのかが決まらない。攻撃の試み(ch3-s14)の判定も調べる前に置かれ、調べている途中で攻撃の試みと分かった場合の道がない(30分まで続けることになる)。
    ok:
      - 一覧にある活動だけを想定内として閉じる(ch3-s6)、攻撃の試みは全て上げる(ch3-s14)、30分を過ぎたら見たことを付けて上げる(ch3-s11)、根拠がなければ閉じずに上げる(ch3-s13)の、個々の行き先は合う。
    suggestion: >
      分かれ方の先頭を「重大度が高い→すぐ上げる」にするか、重なる場合の扱いを依頼者に確かめる。
      誤検知、想定内、攻撃の試みの判定は「調べる(30分まで)」の中に置き、30分の時点の分かれ方(ch3-s13)につなぐ形にすると、ch3-s5、s11、s13 と合う。

  # ===== 条件4 ap-s2 =====
  - id: 4
    condition: ap-s2 の見出しが、F508、F509、F510 の限定を落とさず、2つの主張をつないでいない。
    verdict: 合格
    quote:
      - '04-storyline.yaml ap-s2 headline: 上げるのが遅れる誤りも、上げすぎる誤りも、割合を測った公開の調査は見つからなかった'
      - '04-storyline.yaml ap-s2 source: Kerstenら(2025年)、Moosmannら(2026年)、Alahmadiら(USENIX Security 2022)。近い調査はあるが、どれも誤りの割合は測っていない'
      - 'F508 qualifiers: 上げるのが遅れる誤りを直接測った結果ではない / F509 qualifiers: 実際のエスカレーション遅れの測定ではない / F510 qualifiers: 上げ過ぎの割合は未測定'
    reason: >
      見出しは「見つからなかった」と述べるだけで、F508、F509、F510 の内容を言い換えて主張していないため、限定を落としていない。
      F509 の33%は自己申告の行動の割合で、誤りの割合ではないため、見出しと食い違わない。
      2つの誤りは「も、も」で並べただけで、因果や両立しないといった関係を述べておらず、2つの主張をつないでいない。
    notes:
      - 旧 ap-s2 の「直接測った」は「割合を測った」に変わった。遅れの誤りは割合以外(時間など)でも測れるため、「割合」は遅れについてはやや狭い言い方だが、言い過ぎではない(主張が弱くなる向き)。
      - 'appendix_of は ch3-s11 だけになり、旧 ap-s3 の appendix_of: ch3-s14(上げすぎる誤り)の結び付きがなくなった。条件4の範囲外だが、本編から付録を引く箇所で確かめるとよい。'

  # ===== 条件5 holds と relation =====
  - id: 5
    condition: holds と relation が正しい(docs/visual-grammar.md の問い)。
    verdict: 合格
    quote:
      - '05-proof.yaml ch3-s17: relation: branching-flow / holds: [ordered, connected]'
      - '05-proof.yaml ap-s2: relation: statement / relation_reason: 「見つからなかった」ことを述べるスライドで、比べる対象も順序もない / holds: []'
    reason: >
      ch3-s17: 条件で行き先が分かれる流れで、branching-flow が合う。ordered の問い「項目を入れ替えると、意味が変わるか」は、
      アラート→調べる→閉じる/上げる の順を入れ替えると意味が変わるため、はい。connected は、全ての線に route(条件付きの行き先)という関係の種類を言えるため、成り立つ。
      partition は申告されておらず、条件が重なりうる(条件3)ため、申告しないのは正しい(ただし focus の「どれか1つの道」との関係は条件3を参照)。
      ap-s2: 主張は「見つからなかった」の1文で、statement と空の holds は合う。
    notes:
      - ap-s2 の show は3件の調査と「それぞれが測ったもの」を並べる。同じ観点(何を測ったか、誤りの割合を測ったか)で並ぶので、見せ方によっては comparable が生じる。表にする場合は relation を見直す。
