調査依頼の文面(requests/R6.md、重大な検査ではない):
  判定: 合格
  理由: '3つの問いは「何とされているか」「何を記録し、何を根拠にアラートを出すか」と開いた聞き方で、仮説や結論を含まない。見つからない場合と見解が割れる場合の返し方も指示している'
  注記: 'Q3.1.1「アラートを誤検知として閉じてよい条件」は、閉じる理由を「誤検知」の一つに寄せた言い方で、Benign Positive や Informational, expected activity のような「正確だが想定内」の閉じ方を拾い漏らす聞き方になりうる。今回の回答(F605、F607、F609)はこれも拾っているため、実害は出ていない'

主な指摘:
  - 'F604: statement が原文の "ideally" と "sometimes" を落とし、「判断の問題であり」と言い切っている(不合格)'
  - 'F611: statement が原文の "generally" と "usually" を落とし、確定した定義のように書いている(不合格)'
  - 'F620: locator のページは 1800-24C の p.180(p.179 ではない)'
  - 'F615: quote の "rulesbased" は原文の "rules-based" と綴りが違う'
  - 'F618、F619: as_of(ms.date 2025-03-26)とページ表示の最終更新日(2026-06-02)が違う。どちらを使うかの決まりがない'
  - '収集セッションが付けた区切り(" — ")や箇条の連結を qualifiers に書いた事実と、書いていない事実がある(F600、F611、F613、F616)'
