検査の名前: 答えるべき問い(再検査)
回: 2
対象:
  成果物: trial/deck/00-brief.md の「答えるべき問い」
  基準: docs/stages/00-brief.md の「合格条件」(答えるべき問いの3条件)
  コミット: 6cf3d79
判定者: claude-opus-5-5
読んだもの:
  - trial/deck/00-brief.md
  - docs/stages/00-brief.md の「合格条件」
対象の文言: >-
  新人がアラートを受けてから「誤検知として閉じる/調査を続ける/上に上げる」を決めるまでに、
  何をどの順で確かめ、何を基準に決めればよいか

条件:
  - 条件: 問いが1つである。
    判定: 合格
    引用: 「何をどの順で確かめ、何を基準に決めればよいか」
    理由: >-
      言い足した「何を基準に決めればよいか」は、前半と同じ主語(新人)と同じ到達点
      (3つのうちどれかを「決める」)を持ち、1つの判断の手順の中の要素になっている。
      基準は、確かめた結果に当てはめて使うものなので、前半の「確かめる」ことと切り離して
      単独では答えられない。逆に前半だけでは「決める」まで届かない。2つの独立した問いに
      割れてはおらず、「確かめて、基準に当てて、決める」という1つの手順を問う形になっている。
    補足: >-
      文の上では「確かめ」と「決め」の2つの述語が並ぶため、後の工程で答えが
      「確認の順序」の章と「判断基準」の章に分かれて互いを参照しない構成になると、
      実質的に2つの問いとして扱われる恐れがある。問いの文言の不合格ではなく、
      後の工程で、各確認段階ごとに基準を対にして答える構成を保てば足りる(提案)。

  - 条件: 答えの形が決まっている(はいかいいえ、どれを選ぶか、どれだけか、どうやるか、のいずれか)。
    判定: 合格
    答えの形: どうやるか
    引用: 「何をどの順で確かめ、何を基準に決めればよいか」
    理由: >-
      答えは、確認する項目とその順序、および各段階で3つの扱いのどれに倒すかの基準からなる
      判断の手順であり、「どうやるか」の形に定まる。「何を」は手順の中身(確認項目・基準)を
      問う従属的な語で、答えの形を「どれを選ぶか」などに変えるものではない。

  - 条件: 答えが、ブリーフの「目的」に書いた行動につながる。
    判定: 合格
    引用:
      目的: 「届いたアラートを見て、誤検知として閉じる、調査を続ける、上に上げる、のいずれかを1人で決められるようにする。」
      問い: 「「誤検知として閉じる/調査を続ける/上に上げる」を決めるまでに、何をどの順で確かめ、何を基準に決めればよいか」
    理由: >-
      問いの到達点が、目的の行動(3つのいずれかを決める)と同じ3択で一致している。
      確認の順序に加えて決める基準を答えるため、他者に判断を仰がずに決められる
      (「1人で」)ことにつながる。

前回の指摘:
  - 指摘: >-
      目的は"1人で決められる"まで求める。答えが確認の順序だけで、各段階でどれに倒すかの
      基準を含まないと届かない。
    判定: 解消した
    引用: 「何を基準に決めればよいか」
    理由: >-
      問いが、確認の順序に加えて、決める基準を答えに含むことを求める文言になった。
      直したことで問いが2つに割れていないかは、上の「問いが1つである」で確かめ、割れていないと判定した。

集計:
  不合格: 0
  判定できない: 0
