# 検査の結果(工程2 主張の骨子、1回目)
check: "主張の骨子の検査(重大な検査: 主張と要約の文が根拠の事実の限定を落としていない、を含む)"
target: trial/deck/02-claims.yaml(answer、summary、C1〜C4、objections)
version: f549255b08531620631482739967980076f867dd
inspector: 検査セッション(1回目。モデル名は依頼元へのメッセージで伝える)
read:
  - trial/deck/02-claims.yaml
  - trial/deck/02-answers.yaml
  - trial/deck/01-plan.yaml
  - trial/deck/01-sources.yaml(stance は読んでいない)
  - trial/deck/terms.yaml
  - trial/deck/decisions.md
  - trial/deck/00-brief.md
  - docs/stages/02-claims.md(合格条件)
  - docs/checks.md(意味の検査、重大な検査)
not_read: [01-hypotheses.yaml, journal.md, checks/]
summary:
  pass: 4
  fail: 3
  undeterminable: 0

results:
  - condition: 1
    name: 【重大】主張と summary が、事実の限定と問いごとの答えの限定を落としていない。数値が一致する。summary が answer と主張より強い、広いことを述べていない
    verdict: 不合格
    findings:
      - id: 1-a
        where: C1.statement
        quote: 1つの実在のSOCの実測(2020年12月〜2022年7月)では、侵害に至った攻撃に関連するアラートは0.01%で、侵害に至らなかった攻撃の試みが27%以上、想定内の検知が49%以上を占めた
        source_quote:
          F207.qualifiers: 分類不能(Unknown)が23.72%残る
          Q1.1.3.answer: 想定内の検知が49%以上、分類できないものが残りを占めた
        reason: 分類不能が約24%残るという限定が落ちている。この限定がないと、残りの約24%が誤検知だと読める。C1 の後の文が誤検知の原因を続けて述べるため、その読みを誘う
      - id: 1-b
        where: C1.statement
        quote: 誤検知のよくある原因には、緩く書かれたシグネチャや、学習期間に観測されなかった保守作業がある
        source_quote:
          F214.qualifiers: インタビュー参加者の一部(『Some analysts』)の認識(定性)
          F210.qualifiers: 異常検知型の検知方式について
          Q1.1.4.answer: NISTの文書は、誤検知(出典の false positive。想定内の検知を含みうる)の原因として…異常検知型では学習期間に観測されなかった保守作業などの良性の活動を挙げる。実務者の一部は、緩く書かれたシグネチャが多くの誤検知を出すと述べた
        reason: 「実務者の一部の認識」「異常検知型の場合」「出典の false positive は想定内の検知を含みうる」の3つの限定が落ち、「よくある原因」と一般化している
      - id: 1-c
        where: C1.objections[0].response
        quote: 8割に近い値はベンダーの調査の83%だけで、誤検知と想定内の検知を分けずに数えている
        source_quote:
          F204.qualifiers: 解析者の自己申告(測定値ではない)
          Q1.1.3.answer: 解析者がアラートの83%を「誤検知で時間をかける価値がない」と答えた
        reason: 83%は解析者の自己申告であり、数えた値ではない。「数えている」は測定値と読める。あわせて、素材台帳には依頼者の実感の80%(F001、testimony)があるため、「だけ」は「公開資料のうち」の範囲を示さないと事実と合わない(軽微)
      - id: 1-d
        where: C2.statement
        quote: NIST SP 800-61 Rev.3 は起きたかの確認を深刻度の見積もりより前に、民間の解説は優先順位付けを真偽の判定より前に置く
        source_quote:
          F303.qualifiers: 対象は「インシデント報告」
          Q2.answer: NISTはインシデントが起きたかの確認を深刻度の見積もりより前に置き
        reason: NIST の順序がインシデント報告についてのものだという限定が落ちている。対象の違う2つ(インシデント報告とアラート)を同じ水準で比べているように読める
      - id: 1-e
        where: C2.statement
        quote: 複数のアラートの間は、届いた順ではなく、影響の大きさなどの要因で優先順位を付ける
        source_quote:
          F300.qualifiers: 対象は「インシデント」の対応であり、アラートの個別の選別に限った記述ではない / 出典の NIST SP 800-61 Rev. 2 は 2025-04-03 に撤回され
          Q2.answer: (NISTはインシデントについて、民間の解説はアラートについて述べる)
          02-answers.yaml の冒頭: '撤回済みの NIST SP 800-61 Rev.2 だけが支える内容は「撤回済みの Rev.2」と明示する'
        reason: 「届いた順ではなく」を支えるのは F300(撤回済みの Rev.2、インシデントについて)だけで、F321 はこれを述べていない。主張は出典も対象の限定もない一般の規則として書かれ、「とされる」も「案」もない。assumes に前提があっても、文面からは読めない
      - id: 1-f
        where: C4.statement
        quote: 米上院の報告は、頻繁に鳴るアラートを誤検知とみなした可能性があると推定している
        source_quote:
          F501.quote: It is possible that Target staff could have viewed this alert as a false positive if the system was frequently alarming.
          Q4.1.answer: アラートが頻繁に鳴る状況なら誤検知(出典の言い方)とみなした可能性があると推定している
        reason: 出典の「もし頻繁に鳴っていたなら」という条件が落ち、アラートが頻繁に鳴っていたことを前提にした文になっている。頻繁に鳴っていたことは出典で確かめられていない
      - id: 1-g
        where: C4.statement
        quote: 2013年のTargetの侵害では、検知製品の緊急のアラートに対応がなく、米上院の報告は
        source_quote:
          F500.qualifiers: Bloomberg Businessweekの報道を引用した記述 / 報告自身は新たな技術的事実を示していない公開情報ベースのスタッフ報告
          Q4.1.answer: 米上院の報告が報道を引いて述べ
        reason: 「対応がなかった」は報道を引いた記述だという限定が落ち、確かめられた事実として書かれている
      - id: 1-h
        where: summary
        quote: 持ち時間の中で決められないものや重要な資産と横展開の疑いがあるものを上げる
        source_quote:
          C3.statement: 持ち時間の中で決められないとき、重要な資産や横展開の疑いがあるとき、迷うときは、経過と証拠を添えて上げる
        reason: C3 の「や」(どちらか)が summary で「と」になり、「重要な資産で、かつ横展開の疑いがあるもの」とも読める。その読みでは上げる範囲が C3 より狭く、主張と違うことを述べる。読み方によるため、「や」にそろえることを勧める
    passed_parts:
      - 数値(0.01%、27%以上、49%以上、2020年12月〜2022年7月、83%、179人、56%、2013年)は、事実の値と一致する
      - C1 の「1つの実在のSOC」「以上」、C4 の「ベンダーの」「答えた」「無視したアラートが本物だったかは示されていない」は保たれている
      - C3 は Q3.1.1、Q3.3.1 の限定(公的な文書に線がない)と、実務者向けの資料という出所を保っている
      - summary は「公開資料から組み立てた案の手順」と述べ、answer と主張より強いことは述べていない(1-h を除く)
    notes:
      - C3 と summary の「横展開の疑い」は、F406 の「Evidence of lateral movement」(証拠)より緩い。案としての設計の選択であれば不合格としないが、出典の材料から変えた点であることを設計の側で把握しておくとよい
      - C2 は、Q2 の答えにある「撤回済みの版は、順序は常に守るものではないとしていた」を落としている。C2 は Rev.2 を述べていないため不合格としない

  - condition: 2
    name: answer と各主張が、否定の検査と具体性の検査を通る
    verdict: 合格
    detail:
      answer: 否定(新人が1人で決められない)は主張として成り立つ。主語(新人)、述語(決められる)、対象(3つの区分、3つの判断)を含む
      C1: 否定(アラートは常に本物の攻撃である、など)が成り立つ。数値と条件を含む
      C2: 否定(順序は出典で食い違わない、など)が成り立つ。対象と条件を含む
      C3: 否定(具体的な線は公的な文書に書かれている)が成り立つ。条件を含む
      C4: 否定(誤検知に慣れても見過ごすことはない)が成り立つ。事案と数値を含む

  - condition: 3
    name: 主張の分け方が、分類の軸の検査を通る
    verdict: 合格
    detail: 軸は「研修で習得する項目の種類」と一言で言える。4項目(前提となる知識、手順、判断の基準、誤りやすい点)は問いの木の根の直下(Q1〜Q4)に対応し、同じ水準である。グループの数は軸(研修資料の分解)から決まる
    notes:
      - C2 の「複数のアラートの間の優先順位の要因」は、判断の基準とも読める。ただし Q3 の軸は「3つの判断」で、優先順位はそこに入らないため、2つのグループに入るとまでは言えない

  - condition: 4
    name: disputed の問い(Q1.1.3)と、限界として残った問い(Q3.1.1、Q3.3.1)に関わる主張が、そのことを述べている
    verdict: 不合格
    findings:
      - id: 4-a
        where: C1.statement
        quote: 1つの実在のSOCの実測(2020年12月〜2022年7月)では、侵害に至った攻撃に関連するアラートは0.01%で…
        source_quote:
          01-plan.yaml Q1.1.3: 'result: disputed'
          Q1.1.3.answer: 誤検知の割合は、出典の定義と数え方で大きく割れている
        reason: C1 は Q1.1.3 の事実(F207)を使うが、本文は1つのSOCの実測だけを述べ、見解が割れていることを述べていない。割れていることは objections の response にだけある(「誤検知の割合は出典の定義と数え方で大きく割れ」)。objections は工程3で付録に回りうるため、本文に1句加えることを勧める
    passed_parts:
      - C3 は「閉じる、調査を続ける、上げるの具体的な線は、調べた公的な文書に書かれておらず、組織が決める」と、Q3.1.1、Q3.3.1 の限界を述べている

  - condition: 5
    name: 公開資料にない基準を組み立てた部分を「案」と明示している(D001)
    verdict: 合格
    detail: C2 の確かめる順序(「この資料は案として」)、C3 の閉じる・上げる基準(「公開資料の材料から組み立てた案として」)、summary(「公開資料から組み立てた案の手順」)が案と明示している
    notes:
      - answer は「受講後にできること」の形で、手順が公開の標準だとは述べていないため不合格としない。ただし「影響の大きさで優先度を付けたうえで」は C2 では案である。答えのスライドで案と分かるかは工程3以降で確かめるとよい
      - C2 の最後の文(複数のアラートの間の優先順位)は、案ではなく出典の内容として書かれている。その限定の問題は 1-e に記した

  - condition: 6
    name: 語彙表の語(誤検知、想定内の検知、アラート、インシデントなど)の使い方が定義に合う
    verdict: 不合格
    findings:
      - id: 6-a
        where: C1.statement
        quote: 誤検知のよくある原因には、…学習期間に観測されなかった保守作業がある
        source_quote:
          terms.yaml T-false-positive: 検知の条件そのものが誤っていて、無害な活動に反応したアラート
          terms.yaml T-expected-detection: 検知の条件どおりに正しく反応したが、業務上は問題のない活動によるアラート
          F210.quote: Anomaly-based IDPS products often produce many false positives because of benign activity that deviates significantly from profiles
          Q1.1.4.answer: 誤検知(出典の false positive。想定内の検知を含みうる)
        reason: 月1回の保守作業はプロファイルから外れたという条件どおりの反応で、業務上は正当な活動である。語彙表の定義では想定内の検知に当たりうる。出典の false positive をそのまま「誤検知」と書き、問いごとの答えにあった注記を落としている
      - id: 6-b
        where: C4.statement
        quote: 頻繁に鳴るアラートを誤検知とみなした可能性 / 56%が過去の誤検知を理由にアラートを無視したことがある
        source_quote:
          Q4.1.answer: 誤検知(出典の言い方)とみなした可能性 / 過去の誤検知(出典の言い方)を理由に
          terms.yaml T-false-positive.note: 想定内の検知を含めない
        reason: 出典の false positive は想定内の検知を含みうる。問いごとの答えは「出典の言い方」と断っていたが、C4 はこれを落とし、語彙表の定義の誤検知として述べている
    passed_parts:
      - アラート(C1 の「検知の条件に合うイベントを見つけて出す知らせであり、本物の攻撃とは限らない」)は定義に合う
      - 想定内の検知(C1 の49%以上。F207 の benign trigger の定義は「正しく一致したが業務上の説明がある」)は定義に合う
      - インシデントは、製品の呼び名としては使われていない。C2 の assumes の「インシデント」は NIST の意味で、語彙表の定義と矛盾しない

  - condition: 7
    name: 問いごとの答えの unresolved の部分に頼っていない
    verdict: 合格
    detail:
      Q1.2: 認証サーバのログの項目に頼る主張はない
      Q3.1: 「閉じるときに分類を付ける」に頼る主張はない。C3 は記録して閉じることを F318 で述べている
      Q3: C3 の「組織が決める」は NIST に帰していない。D001 で資料の前提として決めた内容であり、「NIST は組織の方針で定める」には頼っていない
