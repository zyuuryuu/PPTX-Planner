- 前回の2点(pie-chart の円の下端の欠け、tree の案の枠の最後の行と下端の重なり)は、どちらも解消した。

主な指摘:
- 'architecture-diagram: 「持つ」は入れ子に直ったが、記録の一覧をアラートの真下(22px)に移したため、記録とアラートがつながるように読める(経路は出典にない)'
- 'er-diagram: 矢印の向き(分析ルール → 集めたデータ)が前回と同じで、データが渡る向きに読める。下向きに替えただけで偽の含意は残る。1列の並びの強い読みは解消'
