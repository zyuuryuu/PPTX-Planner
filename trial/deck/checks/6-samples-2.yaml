  理由: 前回の指摘(出典の行の括弧が表と重なる)は解消した。出典の行は文献の特定(著者、会議、年)だけで、表の列と重ならない。
- 見本: pie-chart(ch2-s6)
  条件: 消しても情報が失われない要素がない
  判定: 不合格
  引用: >-
    出典の行: 「…アラート約1,443万件を著者らが分類。27%と49%は下限。分類できないものが約24%残る」 /
    画像の凡例: 「攻撃の試み 27%以上」「想定内の検知 49%以上」「分類できないもの 約24%」 /
    見出し: 「攻撃の試みは27%以上、想定内は49%以上」
  理由: >-
    前回の指摘(凡例の下の注記が出典の行と同じ)は、注記が消えて解消した。ところが出典の行に足された「27%と49%は下限。分類できないものが約24%残る」が新しい重複になった。
    「下限」は凡例と見出しの「以上」と同じ情報、「約24%」は凡例の「分類できないもの 約24%」と同じで、消しても情報が失われない。
    出典の行は文献の特定(Yangら、USENIX Security 2024)と分類の対象(1つのSOCのネットワークの検知、期間、約1,443万件)で足りる。
    (出典の行は 04-storyline.yaml の source から来ており、前回の対象コミットにはこの2文はなかった。)
  直し方の案: 出典の行の最後の2文を削る。下限であることを円の上にも示したい場合は、凡例の「以上」を残し、出典の行には書かない。
