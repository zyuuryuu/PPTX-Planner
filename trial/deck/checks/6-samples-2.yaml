# ---------- 資料に共通の規則(style.yaml common) ----------
- 条件: 文字の大きさの下限(font_min)
  判定: 不合格
  対象: er-diagram(1か所)
  引用: >-
    前回: 「er-diagram: …図の下の1行『1つのSOCの…0.01%(10枚目で詳しく)』22px は本文なら 24px 未満」 /
    samples.py: e += text(0, 310, '1つのSOCのネットワークの検知の実測では、侵害に至った攻撃に関連するアラートは 0.01%', FIG, …)(FIG=22) /
    er-diagram.yaml: text: 1つのSOCのネットワークの検知の実測では、侵害に至った攻撃に関連するアラートは {F207} / style.yaml common.font_min: body: 18pt(=24px)
  理由: >-
    図の中の文字(矢印のラベル、ひし形、箱、「ので」)は 22px 以上に直り、注記(「案の基準」など)は 19px で下限 18.7px を満たす。出典の行も 22px(下限 21.3px)。これらの前回の指摘は解消した。
    残るのは、図の下の1行だけで、仕様に text として持つ説明の文であり、本文の下限 24px に対して 22px のままである。
  参考(判定に含めない): >-
    architecture-diagram「プロセス、接続、ファイルなどの端末の記録を集める」と cause-chain「架空の例: …」も 22px の説明の文で、本文か図の説明かを style.yaml が分けていない。
    本文なら 24px 未満になるため、分け方を style.yaml に書くことを勧める。
  直し方の案: 24px に上げる。または、図の中の注記として扱う文であるなら、その分類を style.yaml に決める。
