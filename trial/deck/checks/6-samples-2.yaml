    赤い札は枠の真下にあり、同じ点を指す。「閉じるのは…ときだけ」は青い札が右に離れて置かれ、形だけでは弱く、結論の帯の文で伝わる。これは前回と同じで、不合格にしない。
- 見本: step-flow(ch1-s1)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: 分けてから決める、という2段の順 / highlight: 2段をつなぐ矢印(順) / 画像: 2つの枠の間の太い黒の矢印と太字の「それから」'
  理由: 前回の指摘(彩色の6つの帯に目が行く)は解消した。色の塗りがなくなり、最初に目が行くのは2つの枠をつなぐ太い矢印で、focus と highlight に合う。
- 見本: architecture-diagram、er-diagram、pie-chart、plain-list、statement、table、tree
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  理由: >-
