# ---------- 最初に目が行く場所と focus ----------
- 見本: cause-chain(ch2-s8)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: 原因が検知の条件の側にあること / 画像: 左端の「検知のルールが緩く書かれている」が太枠・太字、右端の「誤検知」は白地に灰色の枠と灰色の文字(太字でない)'
  理由: 前回の指摘(右端の塗りが太枠に勝つ)は解消した。目が行くのは左端の原因の箱で、focus に合う。
- 見本: flowchart(ch3-s17)
  条件: 最初に目が行く場所が focus と合う
  判定: 合格
  引用: 'focus: 上げる条件を先に確かめ、閉じるのは一覧にあるか、調べて誤検知と言えたときだけであること / 画像: 太い黒枠「先に確かめる」が2つのひし形(重大度が High 以上?、攻撃の試み?)を囲み、その下に赤い札「すぐ上げる」「上げる」'
