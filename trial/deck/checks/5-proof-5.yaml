# 検査: 工程5 立証の設計(第3章 ch3-s17 と、その元の運用の部分)
name: 工程5 運用の流れ図(ch3-s17)の証言との照合(重大の2条件)
target:
  commit: 62bfacd9706e607ab263f8a7ef1bc7b1f381384f
  files:
    - trial/deck/01-model.yaml (basis: operation の要素・つながり・場面 S-newbie-ops、冒頭コメント)
    - trial/deck/04-storyline.yaml (ch3-s17)
    - trial/deck/05-proof.yaml (ch3-s17)
  reference: trial/deck/01-sources.yaml の F002、F003、F005(いずれも依頼者の証言。decisions.md の D001、D008、D009 も参照)
inspector: Claude Sonnet 5.5
summary:
  pass: 1
  fail: 10
  cannot_judge: 1
  main_findings:
    - 判定の順(一覧→誤検知→重大度→攻撃の試み→それ以外)と「上のどれにも当たらない」は、F002/F003/F005 のどこにもない。D009 自身が「一覧にあるが重大度が高い場合は確かめていない」と書いている。
    - 「誤検知と根拠をもって言える」「30分の中で閉じる根拠が得られたら閉じる」は案(D001/D002/D008)なのに、basis: operation として登録され、場面の note は「線は依頼者が決めた」と書く。
    - ch3-s17 の見出しは、案の限定と「最初の3か月」を落として言い切っている。focus「どのアラートも1つの道を通る」は、証言にない順序で重なりを消した上での主張。

checks:
  # ===== 検査1: 仕組みの定義に足したものが証言の範囲内か =====
  - id: 1-1
    condition: 足した要素(E-newbie、D-op-alert、A-close、A-investigate、A-escalate)に、証言にない内容がない
    verdict: 不合格
    quote:
      - 'A-close name: 閉じる(記録して終える)  evidence: [F002]'
      - 'F002 statement: 新人が自分で閉じてよいのは、誤検知と、…一覧にした想定内の活動…に当てはまるものだけである'
    reason: >
      F002 は「閉じてよい」(許可)であり、「記録して終える」とは書かれていない。「記録して閉じる」は
      D002 の案の文言である。ほかの要素(配属から3か月の新人、調べる(30分まで)=F005、上げる=F003/F005)は証言の範囲内。
      なお F002 の quote は「おすすめのが近い。それでいい。」で、内容は設計セッションが示した案への同意として statement に書かれている。
      quote 単独では内容を確かめられないが、statement と qualifiers に「設計セッションが示した案に依頼者が同意したもの」とあるため、statement を証言として扱った。

  - id: 1-2
    condition: R-op-list、R-op-severe、R-op-attempt の条件が証言の範囲内
    verdict: 合格
    quote:
      - 'R-op-list condition: リーダーの一覧にある活動に当てはまる (F002)'
      - 'R-op-severe condition: 重大度が高い / label: 30分を待たずにすぐ上げる (F005)'
      - 'R-op-attempt condition: 侵害に至らなかった攻撃の試み(配属から3か月) (F003)'
    reason: >
      それぞれ F002「リーダーが事前に一覧にした想定内の活動」、F005「重大度が高いものは30分を待たずにすぐ上げる」、
      F003「最初の3か月の新人には、侵害に至らなかった攻撃の試みを全て上げさせる」と、個別には一致する。
      この3本が互いにどう優先されるかは 1-4 で別に判定する。

  - id: 1-3
    condition: R-op-fp(誤検知→閉じる)の条件が証言の範囲内で、案を運用として書いていない
    verdict: 不合格
    quote:
      - 'R-op-fp condition: 誤検知と根拠をもって言える / note: このSOCの運用。誤検知と言える基準は案(D001、ch3-s5)'
      - 'F002: 誤検知と、…一覧にした想定内の活動…に当てはまるものだけ'
      - 'D002: 根拠をもって誤検知か想定内の検知と言えれば記録して閉じ'
    reason: >
      F002 が言うのは「誤検知なら閉じてよい」まで。「根拠をもって言える」という条件は D002 の案で、証言にない。
      note 自体が「基準は案」と認めているのに basis: operation、evidence は F002 のままで、案の部分が運用として登録されている。
      案と運用を分ける形(別の basis、または condition から案の語を除き案を別に持つ)になっていない。

  - id: 1-4
    condition: 証言にない順序・条件(つながりの優先、「それ以外」)を足していない
    verdict: 不合格
    quote:
      - 'R-op-other condition: 上のどれにも当たらない / note: 依頼者が挙げた順に確かめる (F005)'
      - 'S-newbie-ops note: 依頼者が工程5で挙げた順(一覧/誤検知→閉じる、重大度が高い→すぐ上げる、攻撃の試み→上げる、それ以外→30分調べる)'
      - 'D009: 確かめる順は依頼者が挙げた順とし、たとえば一覧にあるが重大度が高いアラートの扱いは、依頼者に確かめていない'
      - 'F005: 1件のアラートを30分まで調べ、…重大度が高いものは30分を待たずにすぐ上げる'
    reason: >
      F002/F003/F005 は、閉じる条件、上げる条件、30分の持ち時間を別々に述べるだけで、判定の順序も「どれにも当たらないものを調べる」という
      残余の扱いも述べていない。「依頼者が挙げた順」は sources に記録がなく(F002〜F005 に順の記述なし)、確かめられない。
      その順に依存して、一覧にある重大なアラートが閉じるへ、攻撃の試みで一覧にあるものが閉じるへ進むかなど、重なりの扱いが定まる。
      D009 は重なりの扱いを依頼者に確かめていないと認めている。確かめていない順序と残余を、basis: operation のつながりの condition として足している。
      「依頼者が挙げた順」が実際に聞き取りであったかは、記録が渡されていないため判定できないが、いずれにせよ証言として sources に残っていない順序を運用と書いているため不合格とした。
    suggestion: 順序は設計の案として別に示すか、依頼者に重なりの扱いを確かめて証言(新しい F)に加える。

  - id: 1-5
    condition: R-op-inv-close(調べる→閉じる)が証言の範囲内
    verdict: 不合格
    quote:
      - 'R-op-inv-close condition: 30分の中で閉じる根拠が得られた / evidence: [F005] / note: …根拠が得られたら閉じる分かれ方は案(D008)'
      - 'F005: 1件のアラートを30分まで調べ、過ぎたらそこまでに見たことを付けて上げる'
    reason: >
      F005 は「30分を過ぎたら上げる」だけで、30分の中で閉じる根拠が得られたら閉じることは述べていない。
      D008 の案(「30分調べても閉じる根拠がなく迷うなら上げる」の裏返し)で、note も案と認める。案を basis: operation、evidence: F005 で登録している。

  - id: 1-6
    condition: R-op-inv-esc(調べる→上げる)の条件が証言の範囲内
    verdict: 不合格
    quote:
      - 'R-op-inv-esc condition: 30分たっても閉じる根拠がない / note: …根拠がなければ上げる分かれ方は案(D008)'
      - 'F005: 過ぎたら、そこまでに見たことを付けて上げる'
    reason: >
      「30分過ぎたら見たことを付けて上げる」は F005 の範囲内。しかし条件に足した「閉じる根拠がない」は証言になく、note も案と述べる。
      F005 の言い方(過ぎたら上げる)と condition(根拠がなければ上げる)は同じ意味ではない(根拠が得られた場合の扱いが別にある)。
      証言の部分(30分で上げる、見たことを付ける)と案の部分(根拠で分ける)が1本のつながりに混ざっている。軽微。

  - id: 1-7
    condition: 場面 S-newbie-ops が、証言の範囲を超えて「依頼者の運用」と述べていない
    verdict: 不合格
    quote:
      - 'S-newbie-ops basis: operation / note: …依頼者の運用で、線は依頼者が決めた'
      - 'steps: [R-op-list, R-op-fp, R-op-severe, R-op-attempt, R-op-other, R-op-inv-close, R-op-inv-esc]'
    reason: >
      steps に 1-3、1-4、1-5、1-6 で不合格としたつながり(R-op-fp、R-op-other、R-op-inv-close、R-op-inv-esc)を含む。
      この場面全体を「依頼者の運用で、線は依頼者が決めた」と書くのは、案(D001、D008)と確かめていない順序(D009)を含む範囲を超えた言い方。
      場面の内訳に、証言で裏付けられるつながりと案のつながりの区別がない。

  - id: 1-8
    condition: 冒頭コメントが、運用の部分の範囲(証言と案)を正しく述べている
    verdict: 不合格
    quote:
      - '#   basis: … / operation(依頼者のSOCの運用。依頼者の証言 F002〜F005。工程5で設計セッションが足した)'
    reason: >
      operation を「依頼者の証言」と定義しているが、実際には案(誤検知の基準、30分の中で閉じる分かれ方)と順序が入っている(1-3〜1-7)。
      また F004(新人が閉じたものを後で見直す)は運用の要素・つながりのどれにも使われておらず、「F002〜F005」の範囲と合わない(軽微)。
      コメントは、案が混ざること、または案を別に扱う方法を述べていない。

  # ===== 検査2: ch3-s17 が証言と案の限定を落としていないか =====
  - id: 2-1
    condition: ch3-s17 の見出しが、証言と案の限定を落としていない
    verdict: 不合格
    quote:
      - 'headline: このSOCの新人は、一覧か誤検知なら閉じ、重大度が高いか攻撃の試みなら上げ、残りは30分調べる'
      - 'F003/F005 qualifiers: 配属から最初の3か月'
      - 'source: …「誤検知と言える」の基準と、30分で根拠がなければ上げる分かれ方は案'
    reason: >
      見出しは(a)「配属から最初の3か月」を落とし、「このSOCの新人」全般に言い切っている(F003/F005 の限定)。
      (b)「誤検知なら閉じ」は、F002 が述べる範囲の誤検知であり、その基準が案であることを見出しの文面は示さない(source にだけある)。
      (c)「重大度が高いか攻撃の試みなら上げ、残りは」と並べ、重なる場合の扱い(1-4)を述べないまま、全アラートが分かれると読める。
      見出しだけ読む聴衆に、案の部分が運用として届く。

  - id: 2-2
    condition: ch3-s17 の source が、証言と案の限定を落としていない
    verdict: 不合格
    quote:
      - 'source: このSOCの運用。「誤検知と言える」の基準と、30分で根拠がなければ上げる分かれ方は案'
    reason: >
      案の2点(誤検知の基準、30分後の分かれ方)は書かれ、これは評価できる。ただし(a)30分で「閉じる」へ進む分かれ方(R-op-inv-close)は案だが、
      「上げる分かれ方」とだけ書かれ、閉じる側の案が明示されていない。(b)判定の順と重なりの扱いは依頼者に確かめていない(D009)のに、
      source に書かれていない。(c)「最初の3か月」の限定がない。(d)証言の出所(依頼者の運用。F002 は設計の案への同意)を落とし、F002 の「閉じてよい」を「閉じる」と読ませる余地がある。

  - id: 2-3
    condition: ch3-s17 の show が、証言と案の限定を落としていない
    verdict: 不合格
    quote:
      - "show: …一覧にある→閉じる、誤検知と根拠をもって言える→閉じる、重大度が高い→すぐ上げる、攻撃の試み→上げる、どれでもない→調べる(30分)…案の部分(誤検知と言える基準、30分の後の分かれ方)に「案」の印を付ける"
      - 'focus: どのアラートも、この流れのどれか1つの道を通ること'
    reason: >
      (a)focus の「どのアラートも1つの道を通る」は、順序(確かめていない)を前提にして初めて成り立つ。一覧にあり、かつ重大度が高い、または攻撃の試みの
      アラートは、証言だけでは道が決まらない(D009)。証言にない主張を、このスライドの要点に置いている。
      (b)「最初の3か月」の限定が show にない。(c)「案」の印は誤検知の基準と30分後の分かれ方に付くとあるが、判定の順(1-4)には付かない。
      (d)「30分の後の分かれ方」に印を付けると、F005 に根拠がある「30分を過ぎたら見たことを付けて上げる」まで案に見える(1-6)。印を付ける範囲が証言と一致していない。

  - id: 2-4
    condition: real: true の view(場面 S-newbie-ops、要素5つ)と show が合う
    verdict: 判定できない
    quote:
      - 'view: scenario: S-newbie-ops / elements: E-newbie, D-op-alert, A-close, A-investigate, A-escalate'
      - 'show: …新人に届いたアラートから、…閉じる…上げる…調べる(30分)…'
    reason: >
      show に出る語(アラート、閉じる、調べる、上げる)は、view の要素と、場面のつながり7本のラベルと条件に対応する(合う)。
      しかし show は「案」の印を付けると述べるのに対し、モデル側の7本はすべて basis: operation で、案かどうかを描画側が読み取れる項目がない。
      印を show の指示だけで付けるのか、モデルから導くのかが渡されておらず、描画の結果(プレビュー)は検査の対象に含まれていないため、
      view と show が実際に合うかは確かめられない。
    suggestion: 案のつながりを区別する項目(basis の追加など)をモデルに持たせると、view と show の対応が確かめられる。
