# 検査: 反論の検査(docs/stages/02-claims.md の合格条件)
name: 反論の検査
target: trial/deck/02-claims.yaml(コミット f549255b08531620631482739967980076f867dd)の answer と objections
inspector: claude-sonnet-5-5
inputs: [trial/deck/00-brief.md, trial/deck/02-claims.yaml, trial/deck/01-sources.yaml(stance は読まない)]
verdict: 不合格
summary: 組み立てた反論3件のうち、objections に同じ趣旨のものがあるのは0件。objections は C1(8割誤検知)と C3(公的基準がない)の2件のみ。

objections_built:
  - id: O1
    objection: 「根拠をもって想定内の検知と言えれば閉じる」と言うが、想定内かどうかは組織の環境で決まる。環境を知らない新人は、何を見て根拠があると言えるのか。同じ振る舞いは攻撃者も出す。閉じて後で本物と分かるのが最も怖い、という新人の懸念に答えていない
    reader_view: 新人(最も重い懸念「間違って閉じるのが怖い」)
    facts: [F213, F220, F215, F216, F607, F504, F505]
    fact_basis: >
      想定内の検知は『組織の環境における業務上正当な挙動で説明される』もの(F220)で、組織が無視するもの(F213)。
      定期スキャンは悪性スキャンと似た振る舞いをする(F215)。共同研究のサイトが内部ホスト侵害の検知ルールに該当した例(F216)。
      実務者12人の調査で、判断の正答は83%でも説明が実際の根本原因を反映していたのは39%(F504)、情報が足りないと述べる事例がある(F505)。
  - id: O2
    objection: answer は「1人で決められる」とするが、台帳では、インシデントかどうかの判定は他の担当者との協力が要ることがあり、実務者でも判断が難しい事例では情報が足りないと感じる。新人が1人で閉じる・上げるを決めるのは現実的でないのではないか。さらに、不確かなときに上げると答えた分析者は33%にとどまる
    reader_view: SOCのリーダー(資料の使い手)と新人(上に上げる線が分からない)
    facts: [F401, F604, F505, F509, F504, F403, F406]
    fact_basis: >
      NISTは、判定が判断の問題になり、他の技術者や担当者との協力が要る場合があるとする(F401, F604)。
      不確かなときにチケットを作って引き継ぐと答えたのは33%で、同僚に相談92%、自分で調べる71%より少ない(F509)。
  - id: O3
    objection: 攻撃の試み(侵害に至らなかったもの)が27%以上ある。answer は試みを「攻撃の疑い」に含める。上げる条件(F406)に当てはめると、試みの大半が上に上がり、上位が埋まる。閉じてよい試みと上げる試みの線は、資料のどこにもない
    reader_view: SOCのリーダー(資料を使う立場。運用が回るか)
    facts: [F207, F201, F203, F406, F405, F510, F315]
    fact_basis: >
      試みは27%、良性トリガー49%、真の攻撃0.01%(F207)。人手が処理するアラートは自動遮断後も1日約13,764件(F201)。
      Tier 1が処理するのは偽陽性と無害な真陽性で、それ以外は全て上げる(F406)。迷うときは上げすぎる側に倒す(F405)。
      上げる圧力が過剰な報告を生む例(F510)。真偽判定の表は、偽陽性・無害な真陽性・判定不能の3つを扱い、「実在するが侵害に至らない試み」の行がない(F315)。

judgments:
  - objection: O1
    in_objections: false
    judgment: 不合格
    reason: >
      objections の2件は、C1「8割は誤検知」と C3「公的な基準がないのに教えてよいのか」。O1(新人が環境を知らないときに、何を根拠に想定内と言えるか)と同じ趣旨のものはない。
      C3 の答えは「案として示す。使えるかは SOC のリーダーが決める」で、閉じる根拠の中身には触れない。
    quote_objection: "C3: 公的な基準がないのに、基準を教えてよいのか"
    quote_claim: "C3: 根拠をもって誤検知か想定内の検知と言えれば調べたことと判断を記録して閉じ"
  - objection: O2
    in_objections: false
    judgment: 不合格
    reason: >
      answer の「1人で決められる」に対する反論は、C1〜C3 のどの objections にもない。C3 は「持ち時間の中で決められないものは上げる」とするが、新人が1人で決めることそのものへの反論ではない。
    quote_answer: "answer: ...閉じる、調査を続ける、上げるを根拠とともに1人で決められる"
  - objection: O3
    in_objections: false
    judgment: 不合格
    reason: >
      試みの扱い(閉じるか上げるか)と、上げる量の運用上の限界に関する objections はない。C1 は試みの割合を述べるのみで、試みをどう扱うかは書いていない。
    quote_claim: "C1: 侵害に至らなかった攻撃の試みが27%以上、想定内の検知が49%以上を占めた"

unanswered_by_objections:
  - objection: O1
    answerable_from_sources: 一部答えられる
    can_answer: >
      想定内かどうかは組織の環境で決まる(F220, F213)こと、定期スキャンのように攻撃と似た振る舞いが想定内になりうること(F215)、閉じるときに調べたことと判断を記録すること(F318)、
      閉じたデータでルールを調整し、誤検知率とエスカレーションの正確さを週次で見直すこと(F324, F325)は、台帳の事実で言える。
    cannot_answer: >
      環境を知らない新人が、何を見て・誰に何を確かめれば「想定内」と言えるのか(許可リストや資産台帳の確認、先輩への相談を閉じる前の手順にするか)を述べる事実は台帳にない。
      閉じた後に本物と分かったときの扱いも、台帳にない。F509 は、相談する人が92%いることを示すだけで、相談を手順にする根拠にはならない。
  - objection: O2
    answerable_from_sources: 一部答えられる
    can_answer: >
      「決められない場合に上げる」も1人の判断に含めれば、answer と整合する。持ち時間内に判定できないものは、記録の要約を付けて上げる(F403, F406, F413)。権限や守備範囲を超えたら上げる(F407)。
    cannot_answer: >
      新人が1人で決めてよい範囲と、先輩の確認を要する範囲の線は台帳にない。F509(引き継ぎ33%)は、上げることをためらう実態を示すが、その対策を述べる事実はない。
      「1人で」の語が F401(協力が要る場合がある)と食い違うことは、台帳の事実では解けない。answer の語を直す判断になる。
  - objection: O3
    answerable_from_sources: 答えられない
    can_answer: 上げる量が上位の処理能力を超えうることを示す数値の材料(F207, F201, F403)と、上げすぎる側に倒す規則(F405)は台帳にある。
    cannot_answer: >
      閉じてよい試みと上げる試みの線、試みの割合を前提にした上げる件数の見積もりは、台帳にない。F406 は「それ以外は全て上げる」とするので、そのまま使うと試みも上がる。
      資料の基準案(C3)がどう扱うかを決めるには、設計側の判断か追加の調査が要る。

notes:
  - 成果物は変えていない。直し方の提案: O1〜O3 を C3(または新しい主張)の objections に加え、答えられない部分は「案」と明示するか、調査を依頼する。
  - 台帳 F001(依頼者の実感8割)は C1 の objection に使われているが、O1〜O3 には使っていない。
