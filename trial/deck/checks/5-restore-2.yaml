検査の名前: 見出しの復元
工程: 5 立証設計(docs/stages/05-proof.md の合格条件)
回: 2
対象:
  成果物: trial/deck/05-proof.yaml の show、focus、facts、view、real
  上流: trial/deck/04-storyline.yaml の headline(判定の後にだけ読んだ)
  コミット: 38ba555e9f3f08932aa46445e0dae624f1f86cf7
  スライド数: 20
判定者: 検査セッション(モデルの識別子は記載しない)
条件: 見出しを隠し、show、focus、facts、view だけから1文(50字以内)で見出しを書き、元の見出しと意味が一致するかを判定する
注記: 手順どおり、見出しを書いてから 04-storyline.yaml を開いた。facts(01-sources.yaml)は引いていない。facts に依る点は『判定できない』ではなく、注記に残した。
判定:
- スライド: ch2-s7
  復元した見出し: 「8割に近い値は自己申告で、誤検知の定義もない」
  元の見出し: 「8割が誤検知」に近い値は、調べた範囲ではベンダーの調査の自己申告(83%)だけだった
  判定: 不合格
  引用: 'show: 「83%」の値と、その条件の注記: ベンダーの調査、解析者の自己申告、「誤検知」の定義が示されていない。別の出典では誤検知と想定内の検知を分けて定義していることを1行で添える / focus: 8割に近い値が自己申告で、誤検知の定義がないこと'
  理由: 見出しは「調べた範囲では自己申告だけ」という出典の数を述べ、「誤検知の定義がない」という focus の点を述べていない。見出しの主張は、スライドが示す「数値の条件が定義されていない」とは別のものである。
- スライド: ch2-s9
  復元した見出し: 「想定内の検知を起こすのは、業務上正当な活動である」
  元の見出し: 想定内の検知を起こすのは、業務上正当な活動である
  判定: 合格
  引用: 'show: 1つのSOCで想定内の検知を起こした業務上正当な活動の2例 / focus: どちらも業務上正当な活動で、ルールは正しく反応していること'
  理由: 見出しの「1つのSOCの実測」は show の文に出てこない。出典は facts(F215、F221)で確かめる必要があり、本検査では確かめていない。見出しの主張は show、focus と一致する。
- スライド: ch3-s1
  復元した見出し: 「NISTは確認を最初に、民間の解説は優先付けを判定より前に置く」
  元の見出し: NISTは確認を最初に、民間の解説は優先付けを判定より先に置く
  判定: 合格
  引用: 'show: NIST SP 800-61 Rev.3(インシデントの報告): 起きたかの確認→深刻度の見積もり。民間の解説(アラート): …優先付け→調べる→本物か誤検知かの判定 / focus: NISTは確認が最初で、民間の解説は判定より前に優先付けを置くこと'
  理由: show と focus の対比と一致する。
- スライド: ch3-s4
  復元した見出し: 「根拠は、ルールの条件を元のログと照らして確かめる」
  元の見出し: 根拠は、ルールの条件と利用者・端末を元のログと照らして確かめる
  判定: 合格
  引用: 'show: 根拠の確かめ方の2段(案) / focus: 元のログと照らすところ'
  理由: focus の「元のログと照らす」が見出しに入っている。
- スライド: ch3-s5
  復元した見出し: 「誤検知として閉じてよいのは、根拠を言える2つの理由だけ」
  元の見出し: 誤検知として閉じてよいのは、根拠を言える2つの理由だけ
  判定: 合格
  引用: 'show: 誤検知として閉じてよい理由の2つ(案): 検知の条件の誤り、データの誤り / focus: 根拠をもって言える2つの理由だけが、誤検知として閉じる理由であること'
  理由: 2つの理由と、根拠を言えることの条件が一致する。
- スライド: ch3-s7
  復元した見出し: 「優先度はSIEMの深刻度だけでなく、要因の1つとして決める」
  元の見出し: 優先度はSIEMの深刻度だけでなく、要因の1つとして決める
  判定: 合格
  引用: 'show: 優先度の要因の例(案): 資産の重要度、機能とデータへの影響、活動の段階、SIEMの深刻度(材料の1つ) / focus: SIEMの深刻度は要因の1つの材料にすぎないこと'
  理由: focus の「材料の1つ」を、見出しの「要因の1つ」と「だけでなく」が表している。見出しは SIEM の深刻度を要因の一つとして挙げていない点で、show より弱いが、意味は一致する。
- スライド: ch3-s9
  復元した見出し: 「閉じるときは、4項目をそろえて記録する」
  元の見出し: 閉じるときは、4項目をそろえて記録する
  判定: 合格
  引用: 'show: 閉じるときに記録する4項目(案) / focus: 4項目そろえて残すこと'
  理由: 4項目をそろえて残すという主張が一致する。
- スライド: ch3-s11
  復元した見出し: 「新人は1件30分まで調べ、過ぎたら見たことを付けて上げる」
  元の見出し: 新人は1件30分まで調べ、過ぎたら見たことを付けて上げる
  判定: 合格
  引用: 'show: 配属から3か月の新人、1件30分、過ぎたら見たことを付けて上げる / focus: 30分という区切り'
  理由: 30分の区切りと、過ぎたときの扱いが一致する。
- スライド: ch3-s12
  復元した見出し: 「重要資産の疑いなど3条件のどれか1つで上げる」
  元の見出し: 重要な資産の疑いなど3条件のどれか1つで上げる
  判定: 合格
  引用: 'show: 上げる条件の3つ(案) / focus: どれか1つで上げる'
  理由: 3条件のどれか1つで上げる、という主張が一致する。
- スライド: ch3-s13
  復元した見出し: 「30分で閉じる根拠がなければ、閉じずに上げる」
  元の見出し: 30分で閉じる根拠がなければ、閉じずに上げる
  判定: 合格
  引用: 'show: 30分の時点で「閉じる根拠があるか」で分かれる流れ(案) / focus: 根拠がなければ閉じない側に倒すこと'
  理由: 根拠がなければ閉じずに上げる、という focus と一致する。
- スライド: ch3-s15
  復元した見出し: 「上げるときは、5項目をそろえて引き継ぐ」
  元の見出し: 上げるときは、5項目をそろえて引き継ぐ
  判定: 合格
  引用: 'show: 上げるときに添える5項目(案) / focus: 5項目そろえて渡すこと'
  理由: 5項目をそろえて渡す、という主張が一致する。
- スライド: ch4-s3
  復元した見出し: 「IT専門職の56%が、誤検知を理由にアラートを無視したと自己申告」
  元の見出し: IT専門職の56%が、誤検知を理由にアラートを無視したと自己申告
  判定: 合格
  引用: 'show: IT専門職179人のうち…56%を1本の帯で示す(自己申告) / focus: 56%'
  理由: 数値、対象、自己申告の区別が一致する。見出しの「ベンダーの調査では」という出典名は show に出てこない。出典名の照合は facts(F506)で確かめる必要があり、本検査では確かめていない。
- スライド: ap-s1
  復元した見出し: 「1日のアラート量は、出典と調べ方で値が大きく違う」
  元の見出し: 扱う量は出典で大きく違い、1つのSOCの実測は1日約13,764件、自己申告は1日平均4,484件
  判定: 合格
  引用: 'show: 1日に扱うアラートの量を出典ごとに並べた表 / focus: 調べ方と値が出典ごとに違うこと'
  理由: 出典ごとに値が違うという主旨は一致する。見出しには調べ方(列に入れる内容)の違いが出ていないが、focus の「調べ方」は、実測と自己申告の区別で一部表れている。
- スライド: ch5-s1
  復元した見出し: 「演習1のアラートは、端末と時刻が一覧と合っている」
  元の見出し: 一覧に載ったスキャン用の端末から、一覧の時刻に、多数の宛先への接続のアラートが届いた
  判定: 合格
  引用: 'show: 端末(一覧に載ったスキャン用の端末)、時刻(一覧のスキャンの時間帯の中) / focus: 端末と時刻が一覧と合うこと'
  理由: 端末と時刻が一覧に合うという focus が、見出しの「一覧に載った」「一覧の時刻」で表れている。
- スライド: ch5-s2
  復元した見出し: 「端末と時刻が一覧と合うので、想定内として記録して閉じる」
  元の見出し: 端末と時刻が一覧と合うので、想定内として記録して閉じる
  判定: 合格
  引用: 'show: 端末と時刻が一覧と合うため、想定内の検知として記録して閉じる(ch3-s6) / focus: 当てはめた規則'
  理由: show の答えと一致する。
- スライド: ch5-s3
  復元した見出し: 「演習2のルールは条件が緩く、無害な通信に合っている」
  元の見出し: 演習2のルールは条件が緩く、無害な通信に合っている
  判定: 合格
  引用: 'show: 検知のルールの条件(緩く書かれた条件) / focus: ルールの条件が緩く、無害な通信に合っていること'
  理由: focus と一致する。
- スライド: ch5-s4
  復元した見出し: 「条件の誤りと根拠があるので、誤検知として閉じる」
  元の見出し: 条件の誤りと根拠があるので、誤検知として閉じる
  判定: 合格
  引用: 'show: 検知の条件の誤りと根拠をもって言えるため、誤検知として記録して閉じる(ch3-s5) / focus: 当てはめた規則'
  理由: show の答えと一致する。
- スライド: ch5-s5
  復元した見出し: 「演習3は、攻撃の試みが防がれた記録がある」
  元の見出し: 演習3は、攻撃の試みが防がれた記録がある
  判定: 合格
  引用: 'show: 防がれた記録 / focus: 攻撃の試みが防がれた記録があること'
  理由: focus と一致する。
- スライド: ch5-s6
  復元した見出し: 「防がれた攻撃の試みは、新人なら全て上げる」
  元の見出し: 防がれた攻撃の試みは、新人なら全て上げる
  判定: 合格
  引用: 'show: 侵害に至らなかった攻撃の試みで、配属から3か月の新人は全て上げる(ch3-s14) / focus: 当てはめた規則'
  理由: show の答えと一致する。見出しの「防がれた」は、侵害に至らなかったことを言い換えたもので、意味は一致する。
- スライド: ch5-s7
  復元した見出し: 「演習4は、一覧にない活動で、資産が重要でない」
  元の見出し: 演習4は、一覧にない活動で、資産が重要でない
  判定: 合格
  引用: 'show: 端末(重要でない業務用のPC)、一覧に当てはまらないこと / focus: 一覧にない活動で、資産が重要でないこと'
  理由: focus と一致する。
- スライド: ch5-s8
  復元した見出し: 「根拠がつかめなければ、30分の中で見たことを付けて上げる」
  元の見出し: 根拠がつかめなければ、30分の中で見たことを付けて上げる
  判定: 合格
  引用: 'show: 閉じずに調べ、30分の中で誤検知と根拠をもって言えなければ、見たことを付けて上げる / focus: 当てはめた規則'
  理由: show の答えと一致する。見出しは「閉じずに調べ」を省いているが、主張は一致する。
