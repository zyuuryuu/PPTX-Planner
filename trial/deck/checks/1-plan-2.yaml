# ------------------------------------------------------------
# 1. 前回の指摘が解消したか
# ------------------------------------------------------------
previous_failures:
  - 指摘: Q0 基準を一言で言えるか(研修資料の分解と、解析を行う状況の2つの基準)
    判定: 解消
    引用: "axis: 研修資料の分解(前提となる知識、手順、判断の基準、誤りやすい点)"
    理由: 「解析を行う状況」が軸から外れ、Q5 も Q0 の子から外れた。基準は「研修資料の分解」の1つになった。
  - 指摘: Q0 重なりがないか(Q2.2とQ3.1、Q5.3とQ4.1)
    判定: 解消
    引用:
      - "Q2.2 1件のアラートについて、何をどの順で確かめるとされているか"
      - "Q3.1.1 アラートを誤検知として閉じてよい条件は、何とされているか"
      - "Q4.1 実際の攻撃を誤検知として閉じてしまう誤りは、どんな状況や要因で起きるとされているか"
    理由: >
      Q2.2 は誤検知の判定の段階を問うのをやめ、1件の確認の順序を問う形になった。閉じる条件は Q3.1.1 だけが問う。
      Q5.3 は削除され、誤検知の多さが判断に与える影響は Q4.1 の「要因」で扱える形になった。
  - 指摘: Q1 重なりがないか(Q1.2 EDRの記録とQ1.4 ログの種類)
    判定: 解消
    引用:
      - "Q1.1.1 SIEMとEDRは、それぞれ何を根拠にアラートを生成するか"
      - "Q1.2 一次解析で確かめる記録には、どんな種類があり、それぞれから何が分かるか(端末の記録、通信の記録、認証の記録など)"
    理由: 記録の種類は Q1.2 だけが問い、Q1.1.1 はアラートを生成する根拠(検知の仕組み)を問う。問う対象が分かれた。
  - 指摘: Q2 基準を一言で言えるか
    判定: 解消
    引用: "axis: 確かめる単位(複数のアラートの間、1件のアラートの中)"
    理由: 「確かめる単位」という1つの物差しで分けている。
  - 指摘: Q2 子は同じ水準か(全体の手順と、その1段階が兄弟)
    判定: 解消
    引用: "Q2.1 複数のアラートが届いたとき、どれから調べるか / Q2.2 1件のアラートについて、何をどの順で確かめるか"
    理由: 全体と部分の関係がなくなり、2つの単位が並ぶ。
  - 指摘: Q2 重なりがないか
    判定: 解消
    引用: 同上
    理由: 複数のアラートの間の優先順位と、1件の中の確認の順序で、答えが重ならない。
  - 指摘: Q2 子の数が軸から決まっているか
    判定: 解消
    引用: "複数のアラートの間、1件のアラートの中 → 子2つ"
    理由: 単位が2つで、子が2つ。
  - 指摘: Q5 子は同じ水準か / 重なりがないか / 子の数が軸から決まっているか(3件)
    判定: 解消(3件とも)
    引用: "Q1.1.2 SOCの解析者が受けるアラートの量 / Q1.1.3 誤検知はどの程度の割合を占めるか"
    理由: >
      Q5 の枝はなくなった。Q5.1、Q5.2 は Q1.1 の下に移り、Q5.3 は削除された。前回の3件の指摘の対象は存在しない。
      ただし、移した先の Q1.1 に新しい問題が生じた(下の Q1.1 の欄)。

previous_sufficiency_notes:
  - 補足1(上げるときに渡すもの): 解消。"Q3.3.3 上に上げるときに、何を添えて渡すとされているか"
  - 補足2(閉じた判断の記録と見直し): 解消。"Q3.1.2 誤検知として閉じた判断は、どう記録され、後からどう見直されるとされているか"
  - 補足3(上げ遅れ): 解消。"Q4.2 調査を続けたまま上に上げるのが遅れる誤りは、どんな状況や要因で起きるとされているか"
  - 補足4(複数のアラートの優先順位): 解消。"Q2.1 複数のアラートが届いたとき、どれから調べるかは、何で決めるとされているか"

# ------------------------------------------------------------
# 2. 直した計画の枝分かれ(axis を持つ全ての問い)の分類の軸の検査
# ------------------------------------------------------------
axis_check:
  Q0:
    axis: 研修資料の分解(前提となる知識、手順、判断の基準、誤りやすい点)
    children: [Q1, Q2, Q3, Q4]
    基準を一言で言えるか:
      判定: 合格
      引用: "研修資料の分解"
      理由: >
        「研修資料に載せる内容の種類」と一言で言える。型の decomposition の「何ができるようになるか」は
        Q0 そのものが担い、「判断の基準」を加えている。ブリーフの目的(3つの判断を1人で決める)に合わせた変更で、
        docs/stages/01-exploration.md の「問いに合わなければ変えてよい」の範囲と読める。
    子は同じ水準か:
      判定: 合格
      引用: "Q1 知る必要があること / Q2 何をどの順で確かめるか / Q3 判断の基準 / Q4 どこで誤りやすいか"
      理由: どれも「研修資料に載せる内容の1種類」で、水準がそろう。
    重なりがないか:
      判定: 合格
      引用:
        - "Q2.2 1件のアラートについて、何をどの順で確かめるとされているか"
        - "Q3.1.1 アラートを誤検知として閉じてよい条件は、何とされているか"
      理由: >
        手順(順序)と基準(条件)は問う内容が分かれている。公開された手順の文書は、順序の最後に判断の条件を
        併記することがあるが、問いの文面の上では範囲が切り分けられている。前回の重なり(Q2.2とQ3.1、Q5.3とQ4.1)はない。
    子の数が軸から決まっているか:
      判定: 合格
      引用: "前提となる知識、手順、判断の基準、誤りやすい点 → 子4つ"
      理由: 軸の4項目と子が1対1に対応する。

  Q1:
    axis: 一次解析で扱う情報の種類(アラート、確かめる記録、攻撃の手口の分類)
    children: [Q1.1, Q1.2, Q1.3]
    基準を一言で言えるか:
      判定: 合格
      引用: "一次解析で扱う情報の種類"
      理由: 1つの物差しで分けている。
    子は同じ水準か:
      判定: 合格
      引用: "Q1.1 アラート / Q1.2 確かめる記録 / Q1.3 攻撃の手口の分類"
      理由: どれも「新人が扱う情報の1種類」で、水準がそろう。Q1.1 だけが枝で他は末端だが、木の深さの違いで、分類の水準の違いではない。
    重なりがないか:
      判定: 合格
      引用:
        - "Q1.1.1 SIEMとEDRは、それぞれ何を根拠にアラートを生成するか"
        - "Q1.2 一次解析で確かめる記録には、どんな種類があり ... (端末の記録 ...)"
      理由: アラートを生成する根拠(検知の仕組み)と、解析者が確かめる記録の種類で、問う対象が分かれる。
    子の数が軸から決まっているか:
      判定: 合格
      引用: "アラート、確かめる記録、攻撃の手口の分類 → 子3つ"
      理由: 軸の3項目と子が対応する。ブリーフが「資料で説明する」とした項目(ログの見方、ATT&CK、SIEMの相関、EDRの記録)は全てこの3つに収まり、「解析の進め方」は Q2 が担う。

  Q1.1:   # 新しい枝(前回の Q1.1 と Q5.1、Q5.2 をまとめた)
    axis: アラートの出どころと、届くアラートの実態
    children: [Q1.1.1, Q1.1.2, Q1.1.3]
    基準を一言で言えるか:
      判定: 不合格
      引用:
        - "axis: アラートの出どころと、届くアラートの実態"
        - "question: SOCに届くアラートは、どのように生成され、どんな中身か"
      理由: >
        「出どころ(生成の仕組み)」と「届いた実態(量、割合の統計)」の2つの基準が「と」でつながれている。
        問いの文面も「どのように生成され」と「どんな中身か」の2つの問いを1文にしている。
        前回 Q0 で不合格とした形(基準を「と」でつなぐ)と同じである。
    子は同じ水準か:
      判定: 合格
      引用: "Q1.1.1 何を根拠に生成するか / Q1.1.2 量はどの程度か / Q1.1.3 誤検知の割合はどの程度か"
      理由: >
        どれも「アラートの1つの側面」を問うとは言える。ただし、Q1.1.1 は仕組みの知識、Q1.1.2 と Q1.1.3 は
        統計で、性質が違う。基準が2つあることの帰結で、上の条件で不合格にしたため、ここは合格とする。
    重なりがないか:
      判定: 合格
      引用: "Q1.1.2 量 / Q1.1.3 誤検知の割合"
      理由: 3つの子の答えは重ならない。
    子の数が軸から決まっているか:
      判定: 不合格
      引用: "アラートの出どころと、届くアラートの実態 → 子3つ"
      理由: >
        軸から決まるのは「出どころ」と「実態」の2つ。「実態」が「量」と「誤検知の割合」の2つに分かれることは
        軸に書かれていない。「実態」に、誤検知以外の中身(重大度や種類の分布など)を含めない理由も軸から言えない。
    直し方の提案: >
      Q1.1 を「アラートはどう生成されるか」(Q1.1.1)と「届くアラートの実態はどうか」(Q1.1.2、Q1.1.3 を子に持つ。
      軸は「実態の指標(量、誤検知の割合)」)に分けるか、Q1 の軸を「アラートの仕組み、アラートの実態、記録、攻撃の手口の分類」の4つにする。

  Q2:
    axis: 確かめる単位(複数のアラートの間、1件のアラートの中)
    children: [Q2.1, Q2.2]
    基準を一言で言えるか: {判定: 合格, 引用: "確かめる単位", 理由: 1つの物差しで分けている。}
    子は同じ水準か: {判定: 合格, 引用: "Q2.1 どれから調べるか / Q2.2 1件について何をどの順で確かめるか", 理由: 単位ごとの手順で、水準がそろう。}
    重なりがないか:
      判定: 合格
      引用:
        - "Q2.2 1件のアラートについて、何をどの順で確かめるとされているか"
        - "Q3.3.2 上に上げる前に、1件のアラートをどこまで調べるとされているか(調べる範囲や時間の目安)"
      理由: >
        Q2 の子の間に重なりはない。枝の外では、Q2.2(順序)と Q3.3.2(範囲、時間)は隣り合うが、
        順序と深さで問う内容が分かれており、重なりとまでは言えない。
    子の数が軸から決まっているか: {判定: 合格, 引用: "複数のアラートの間、1件のアラートの中 → 2", 理由: 単位2つと子2つが対応する。}

  Q3:
    axis: 3つの判断
    children: [Q3.1, Q3.2, Q3.3]
    基準を一言で言えるか: {判定: 合格, 引用: "3つの判断", 理由: ブリーフが定める判断の選択肢(閉じる/調査を続ける/上に上げる)。前回と同じ。}
    子は同じ水準か: {判定: 合格, 引用: "Q3.1 閉じる判断 / Q3.2 調査を続ける場合 / Q3.3 上げる判断", 理由: どれも1つの判断を問う。}
    重なりがないか:
      判定: 不合格
      引用:
        - "Q3.2 判断を保留して調査を続ける場合、何を追加で確かめるとされているか(Q3 の下)"
        - "Q3.3.2 上に上げる前に、1件のアラートをどこまで調べるとされているか(調べる範囲や時間の目安)(Q3.3 の下)"
      理由: >
        「上げる前にどこまで調べるか」は、「調査を続ける」と「上げる」の境目を問うもので、Q3.2(調査を続けて
        何を確かめるか)の枝にも、Q3.3(上げる判断)の枝にも入る。答え(例: 何を確かめても判断できなければ上げる、
        何分を目安に上げる)は、Q3.2 の答えの「どこまで確かめるか」と同じ記述になる。
        前回 Q2.3 を Q3.3 の下に移したことで生じた、新しい重なりである。
    子の数が軸から決まっているか: {判定: 合格, 引用: "閉じる/調査を続ける/上に上げる → 3", 理由: 前回と同じ。}

  Q3.1:   # 新しい枝
    axis: 判断の前と後(閉じてよい条件、閉じた判断の記録と見直し)
    children: [Q3.1.1, Q3.1.2]
    基準を一言で言えるか: {判定: 合格, 引用: "判断の前と後", 理由: 判断の時点で分けている。}
    子は同じ水準か: {判定: 合格, 引用: "Q3.1.1 閉じてよい条件 / Q3.1.2 閉じた判断の記録と見直し", 理由: 前と後に1つずつで、水準がそろう。}
    重なりがないか: {判定: 合格, 引用: 同上, 理由: 判断の前の条件と、後の記録、見直しで、答えが重ならない。}
    子の数が軸から決まっているか: {判定: 合格, 引用: "前と後 → 2", 理由: 2つの時点と子2つが対応する。}

  Q3.3:   # 新しい枝
    axis: 判断の前と後(上げる条件と調べる深さ、上げるときに渡すもの)
    children: [Q3.3.1, Q3.3.2, Q3.3.3]
    基準を一言で言えるか:
      判定: 合格
      引用: "判断の前と後"
      理由: Q3.1 と同じ基準(判断の時点)。「上げるときに渡すもの」は厳密には「後」より「その時点」だが、判断を下した後の行為と読める。
    子は同じ水準か:
      判定: 不合格
      引用:
        - "上げる条件と調べる深さ(前)"
        - "上げるときに渡すもの(後)"
        - "Q3.3.1 上げる条件 / Q3.3.2 どこまで調べるか / Q3.3.3 何を添えて渡すか"
      理由: >
        Q3.3.3 は「後」の全体に当たる。Q3.3.1 と Q3.3.2 は「前」を2つに分けた部分である。
        軸の項目(前、後)と、その下位の項目(条件、深さ)が兄弟として並んでいる。
    重なりがないか:
      判定: 不合格
      引用:
        - "Q3.3.1 アラートを上に上げる条件は、何とされているか"
        - "Q3.3.2 上に上げる前に、1件のアラートをどこまで調べるとされているか(調べる範囲や時間の目安)"
      理由: >
        「どこまで調べたら上げるか」(調べる範囲や時間の目安)は、上げる条件の1つ(例: 一定の確認で判断できなければ上げる)
        として答えられる。Q3.3.2 の答えは Q3.3.1 の答えに含まれ得る。ブリーフの懸念「どこまで調べたら上に上げていいのか
        分からない」自体が、上げる条件を問うている。枝の外の Q3.2 との重なりは、Q3 の欄に挙げた。
    子の数が軸から決まっているか:
      判定: 不合格
      引用: "判断の前と後 → 子3つ"
      理由: 軸から決まるのは「前」と「後」の2つ。「前」を「条件」と「深さ」の2つに分ける基準は軸に書かれていない。
    直し方の提案: >
      Q3.3.2 を Q3.3 から外し、「調査を続けるか上げるかの境目」として Q3.2 に寄せる(Q3.2 を「調査を続ける場合に、
      何をどこまで確かめるか」とする)か、Q3.3.1 に統合する。前者なら Q3.3 は前と後の2つになり、Q3.1 と形がそろう。
      前者を選ぶ場合、Q3.2 が懸念3に直接答える問いになるため、重要度の付け方を見直す余地がある(前回の参考の指摘)。

  Q4:   # 軸が変わった(2向き → 3つの判断のそれぞれ)
    axis: 3つの判断のそれぞれでの誤り(閉じるべきでないものを閉じる、調査を続けて上げるのが遅れる、上げなくてよいものを上げる)
    children: [Q4.1, Q4.2, Q4.3]
    基準を一言で言えるか: {判定: 合格, 引用: "3つの判断のそれぞれでの誤り", 理由: 「誤って選んだ判断」で分けている。}
    子は同じ水準か: {判定: 合格, 引用: "Q4.1 / Q4.2 / Q4.3 ... どんな状況や要因で起きるとされているか", 理由: どれも1つの誤り方が起きる状況と要因を問う。}
    重なりがないか: {判定: 合格, 引用: "Q4.1 閉じる / Q4.2 上げ遅れ / Q4.3 上げすぎ", 理由: 誤って選んだ判断が互いに違い、重ならない。前回の Q5.3 との重なりは、Q5.3 の削除で解消した。}
    子の数が軸から決まっているか: {判定: 合格, 引用: "3つの判断 → 子3つ", 理由: Q3 の3つの判断と1対1に対応する。}

# ------------------------------------------------------------
# 3. 十分性と観点
# ------------------------------------------------------------
sufficiency:
  判定: 合格
  引用: "Q0 新人がアラートを受けてから「誤検知として閉じる/調査を続ける/上に上げる」を決めるまでに、何をどの順で確かめ、何を基準に決めればよいか"
  理由: >
    「何をどの順で確かめ」は Q2.1、Q2.2、「何を基準に決めるか」は Q3 の末端(Q3.1.1、Q3.2、Q3.3.1、Q3.3.2)が答える。
    前提の知識はブリーフが未習とした項目を Q1 が全て覆う。懸念は、「誤検知ばかりで何を見ればいいか」が Q1.1.3、Q2.1、Q2.2、
    「間違って閉じるのが怖い」が Q3.1.1、Q3.1.2、Q4.1、「どこまで調べたら上げてよいか」が Q3.3.2、Q3.2、Q4.2 で覆われる。
    前回の補足4件も全て末端になった。末端が全て答えられれば、ブリーフの問いに答えられる。
    分類の軸の不合格(Q1.1、Q3、Q3.3)は問いの置き場所と重なりの問題で、問いの欠落ではない。

