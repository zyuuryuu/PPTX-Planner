    判定: 合格
    理由: abstract に実在(par.nsf.gov PDF)。『115 million alerts』を『約1.16億件』と書くのは本文の 115,617,526 件と合う。
  - 条件: 切り取りが条件・範囲・主体を落としていない
    判定: 不合格
    理由: 出典§6.1は、24,000件/日(第2期)と134,000件/日(第1期)を「daily alerts」の総数として示し、第2期には自動遮断(BHR)で処理された44.9%を含む。引用 'during the first period (April 2018 to August 2020), the average number of daily alerts is 134,000,
      which is 5-6 times higher than the 24,000 alerts per day in the second period'。同じ§6.1に 'after BHR filtering, there are still ... (about 13,764 alerts per day)'。statementと qualifiers は「解析者が直面する」(abstractの語)のまま、2.4万に自動遮断分が含まれることを落としており、F201(1.3764万)と並べると食い違って見える。qualifiersに『自動遮断(BHR)で処理された分を含む総数』を足すこと。
