検査の名前: 素材台帳の重大な検査(引用の実在と切り取り、statement と qualifiers の一致)
対象: trial/deck/01-sources.yaml のうち request が R2/R4/R5 の事実 45件(F200〜F218、F400〜F414、F500〜F510)
判定者: Claude Sonnet 5.5(claude-sonnet-5-5)
回: B-2(別セッションの検査とは独立)
件数:
  合格: 22
  不合格: 21
  判定できない: 2
方法: 出典を取得して全文を文字列照合し(表記は正規化)、前後の本文を読んで条件2〜4を判断した。cisa.gov はこの環境から403で開けず、代替の取得経路は試していない。全引用のうち、機械の照合で一致しなかったもの(F208、F400、F409、F412、F500、F501)は、ページ跨ぎ、ハイフネーション、脚注番号、『pre-defined』の綴りの違いが原因で、本文を目視して実在を確認した。
注意: locator の節番号(§2.2、§4.3.3.2、付録 0.A.3 など)は一部しか確かめていない。F509 の『付録 0.A.3』は本文中に該当する見出しを見つけられなかった(quoteは付録の『Dealing with uncertainties』に実在)。
