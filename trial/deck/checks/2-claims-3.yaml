    判定: 不合格
    分けて書かれている箇所:
      - C3 statement は、案を「公開資料の材料から組み立てた案として」と示し、運用を「あわせて、依頼者のSOCの運用(…)を、公開資料とは分けて示す」と別の文で示している
      - C1 objections[1]、C3 objections[2]、C3 objections[3] の証言の部分は、いずれも「依頼者のSOCの運用では」で始まる
      - C3 objections[1] の資料の扱いは「この資料では」で、撤回済みの NIST の記述と分けている
    指摘:
      - id: 7-a
        箇所: C1 objections[1] response と C3 statement
        引用:
          - C1 objections[1]「依頼者のSOCの運用では、新人が想定内の検知として閉じてよいのは、リーダーが事前に一覧にした想定内の活動に当てはまるものだけである」
          - C3 statement「依頼者のSOCの運用(新人が閉じてよいのは誤検知と一覧にある想定内の活動だけ、…)」
        根拠: F002 の quote「おすすめのが近い。それでいい。」、qualifiers「設計セッションが示した案に依頼者が同意したもの」
        理由: F002 は、依頼者が運用を自分の言葉で述べたものではなく、設計の側が示した案に、依頼者が「近い」として同意したものである。claims ではこの限定が落ち、依頼者のSOCに既にある運用として書かれている。F003、F004 は依頼者自身の言葉が quote にあり、この問題はない。案と証言を分けるという点で、F002 の部分は案の性質を持つことが文面から読めない
        直し方の提案: 「依頼者のSOCの運用に近いとして依頼者が同意した形では」のように限定を残すか、依頼者に運用そのものを確かめて F002 の quote と qualifiers を直す(後者は上流の素材台帳の直しになる)

