事実:
  - id: F700
    判定: 合格
    理由: "3.1 p.3-1 に quote が実在(第1層、第2層の連続した記述)。statement の「通常3層」「リアルタイムかほぼリアルタイム、または定期的な一括」「ログサーバ自身か別のデータベースサーバ」は quote に合う。第3層を含めないことと、ログ管理基盤一般であることを qualifiers に書いている。"
  - id: F701
    判定: 不合格
    引用: "statement: 「多くのSIEM製品は、ログ生成元からログを集める2つの方法(エージェントなし、エージェント型)に対応する」 / quote の末尾: \"Most SIEM products support two ways of collecting logs from log generators:\""
    理由: "quote はコロンで終わり、2つの方法の名前(Agentless、Agent-Based)を含まない。statement の括弧内の「エージェントなし、エージェント型」は quote にない。原文の直後に Agentless. と Agent-Based. が実在するので内容は誤りでないが、台帳の条件(statement が quote と合う)を満たさない。ログサーバとデータベースサーバの記述と、qualifiers の 'Most SIEM products' は quote に合う。"
    直し方の案: "statement から括弧内を除く、または quote を Agentless. と Agent-Based. の見出しまで伸ばす。"
  - id: F702
    判定: 合格
    理由: "3.4 p.3-9 に quote が実在。pull と push、'usually'、どちらでも絞り込み・集約・正規化・分析を行うこと、全て statement と qualifiers に合う。"
  - id: F703
    判定: 合格
    理由: "3.4 p.3-9 に quote が実在。'usually' を qualifiers に書き、複数のエージェントの記述も含む。"
  - id: F704
    判定: 合格
    理由: "3.4 p.3-9 に quote が実在。'several dozen' を「数十種類」、'such as' を例示として qualifiers に書いている。"
  - id: F705
    判定: 合格
    理由: "3.2 Functions の Event correlation に quote が実在(2文は連続)。主体が 'the infrastructure'(ログ管理基盤)であること、'generally'、'might' を qualifiers に書いている。ただし、この事実を SIEM の記述として使うことの可否は、つながりの検査(R-siem-alert)で別に判定した。"
  - id: F706
    判定: 合格
    理由: "NCA PDF の 1-2 と 2-3 に実在([...] による省略は、間に別の項が入る)。要件(must)であること、ひな形であることを qualifiers に書いている。"
  - id: F707
