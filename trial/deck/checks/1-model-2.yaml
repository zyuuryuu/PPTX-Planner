判断を求められた3点:
  - 点: "R-siem-alert、R-siem-correlated-entry(ログ管理基盤一般の記述を SIEM に当てはめてよいか)"
    答え: "不合格。主体が 'the infrastructure' の記述で、SIEM の記述にはない。当てはめるには、SIEM がその基盤の機能を持つと書いた出典か、ユーザーの証言が要る。"
  - 点: "R-server-db(保存先の記述からつながりを作ってよいか)"
    答え: "合格(認める)。SIEM の記述(F701)に保存先が書かれ、向きは F700 から読める。mode と condition は unknown のまま。kind を「保存先」に近いものにすることは勧める。"
  - 点: "R-edr-siem(NCA の要件を仕組みのつながりとしてよいか)"
    答え: "不合格。要件の文が向きと内容を書いていない。ほかの NCA 要件のつながりは認めるが、要件に基づくことを機械で区別できる印を勧める。"

