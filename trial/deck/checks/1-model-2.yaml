    理由: "Threat detection in Microsoft Sentinel の冒頭に quote が実在(HTML ではリンク部分の空白だけが差)。Applies to と、冒頭の custom detections の注記も実在し、qualifiers に書いている。as_of 2026-05-14 は Last updated と一致。"
  - id: F710
    判定: 合格
    理由: "Scheduled rules の節に実在。statement は quote に合う。"
  - id: F711
    判定: 合格
    理由: "Microsoft security rules の節に実在。続きの 'Microsoft security rules are not available if you have enabled Microsoft Defender XDR incident integration, or onboarded Microsoft Sentinel to the Defender portal' の注記も実在し、qualifiers に書いている。つながりの条件に落ちている点は R-sentinel-external-incident の備考に書いた。"
  - id: F712
    判定: 合格
