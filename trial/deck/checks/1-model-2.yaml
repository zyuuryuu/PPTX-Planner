# 3. つながり(向きと条件。出典にないつながりが足されていないか。unknown の扱い)
# ============================================================
つながり:
  合格: "R-os-source、R-secsw-source、R-app-source、R-physical-source、R-siem-server、R-siem-db、R-source-agent、R-agent-server、R-source-server-push、R-server-source-pull、R-server-db、R-server-significant、R-sentinel-rule-contain、R-sentinel-source-data、R-sentinel-rule-data、R-sentinel-rule-alert、R-sentinel-alert-incident、R-sentinel-external-incident、R-endpoint-agent、R-agent-central-db、R-edr-detection、R-edr-notify、R-mde-sensor、R-mde-alert、R-mde-alert-incident、R-analyst-alert、R-mde-portal、R-sep-symedr、R-symedr-malicious(29件)"
  不合格:
    - id: R-siem-alert
      引用: "from: E-siem / label: さらに調査が必要であることを示すアラートを生成する / evidence: [F705] / note: 「出典はログ管理基盤一般の記述で、作る主体は『基盤』。SIEM の記述ではない」。出典(3.2): \"the infrastructure might also generate an alert to indicate that the identified event needs further investigation.\""
      理由: "出典の主体は 'the infrastructure'(ログ管理基盤)で、アラートを生成するのは基盤である。SIEM の記述(3.4 とその脚注、F100、F101)には、アラートの生成も、相関の結果として新しいログ項目を作ることも書かれていない(3.4 のアラートに近い記述は、ログ監視職員を助ける機能の一覧(GUI、知識ベース、インシデントの追跡、資産情報)だけで、アラートの生成は含まれない)。3.4 は SIEM を 'a relatively new type of centralized logging software' と呼び、log servers と database servers の語を 3.1 と共有するが、3.2 の機能を SIEM の機能と書いているわけではない。収集セッションが note に書いた通り、主体を E-siem に置き換えたのは、SIEM がログ管理基盤の一種だという一般化に基づく補完で、docs/model.md の「出典に書かれていないことは unknown」に当たる。"
      収集セッションの質問への答え: "ログ管理基盤一般の記述を SIEM に当てはめることは、現状の根拠では認められない。"
      直し方の案: "(a) 主体を、出典の語のままの要素「ログ管理基盤(log management infrastructure)」に置き、SIEM とは別に登録する。SIEM との関係は、ユーザーに聞いて証言として登録するか、unknown のまま図に未確定と示す。(b) SIEM の出典を探して、SIEM がアラートを生成すると書いた記述を足す(Microsoft Sentinel の側には、分析ルールがアラートを生成する記述がある)。"
    - id: R-siem-correlated-entry
      引用: "from: E-siem / label: 相関の結果として新しいログ項目を作る / evidence: [F705] / note: 「作る主体は『基盤』。SIEM の記述ではない」。出典: \"generally the result of successful correlation is a new log entry\""
      理由: "R-siem-alert と同じ。主体が 'the result of successful correlation'(結果)で、作る主体の記述は 'the infrastructure' の側にしかない。SIEM の記述にはない。"
      直し方の案: "R-siem-alert と同じ。"
    - id: R-edr-siem
      引用: "from: E-edr, to: E-siem, kind: send / label: セキュリティの知見を統合し共有する / evidence: [F708]。出典(4-2): \"EDR solution must accelerate response time by integrating and sharing security insights with Network Detection and Response (NDR), Security Information and Event Management (SIEM) and Security Orchestration, Automation and Response (SOAR) tools.\""
      理由: "(1) 向きが出典にない。'integrating and sharing ... with' は双方向でも一方向でもありえ、EDR から SIEM へ送るとは書かれていない。kind: send は「データが from から to へ渡る」と定義しているので、向きを主張している。(2) 渡す内容(security insights)が書かれていない。(3) to の E-siem は NIST SP 800-92(2006年)の SIEM の要素で、NCA の 'SIEM tools' と同じものか、出典からは言えない(出典の系統をまたぐ)。(4) 4-2 は要件(must)で、製品の動作の記述ではない。"
      収集セッションの質問への答え: "NCA の要件を、向きのあるつながり(send)として登録することは認めない。要件の文は、向きを書いていない以上、unknown の向きでしか登録できない。"
      直し方の案: "削除して図では途切れとして示す。または、向きを持たない種類(例: link)と、basis: requirement のような印を新しく定め、to は NCA の文の 'SIEM tools' を指す別の要素にする。"
    - id: R-endpoint-mde
      引用: "from: E-endpoint, to: E-mde, kind: send / label: 振る舞いのテレメトリ(D-mde-telemetry)を継続的に集める / note: 「出典は『Defender for Endpoint が集める』と書き、どこからどこへ送るかは書いていない」。出典(F618): \"Defender for Endpoint continuously collects behavioral cyber telemetry.\""
      理由: "収集セッション自身が note で、出典は集める元も送る向きも書いていないと認めているのに、kind: send で「端末から Defender for Endpoint へ渡る」向きを登録している。F618 は集める主体(Defender for Endpoint)と集めるものだけを書く。端末が元だと読むのは自然だが、それは出典にない補完で、send は端末が送る側だと主張する。モデルの冒頭のコメントは、同じ理由(センサーの置き場所、テレメトリの経路)でほかの経路を登録していない。それと基準が合わない。"
      直し方の案: "削除する。テレメトリが Defender for Endpoint のものであることは、要素 D-mde-telemetry の evidence(F618)で足りる。または、from を E-mde にした「集める」関係に変え、集める元は unknown とする。"
  合格のうち備考:
    - id: R-server-db
      備考: "収集セッションの質問への答え: 認める。F701(SIEM)は、データベースサーバがログを保存すると書く。F700 は、第2層のサーバが受け取ったログデータが、サーバ自身か別のデータベースサーバに保存されると書き、向き(サーバからデータベースサーバ)は読み取れる。向きは F700(ログ管理基盤一般)に頼るが、SIEM の側にも保存先の記述があり、R-siem-alert のように SIEM の側に記述がないものとは違う。mode と condition は unknown で正しい(F700 は、別のデータベースサーバがない構成もありうると書く)。ただし、判断が分かれうる点で、kind が send(データが渡る)であることと、label が「保存する」であることが少しずれる。「保存先」を示す種類にすると、出典に近い。"
    - id: R-sentinel-source-data
      備考: "to が D-sentinel-data(データの要素)で、send の宛先が部品でない。出典は、集めたデータの行き先の部品(ワークスペースなど)を書いていないので、このままで出典に反しない。データソースが送るのか Sentinel が取りに行くのかも出典にないが、kind: send は向き(データがソースからデータへ)だけを示し、mode に push と pull を決めていないので許容。"
    - id: R-sentinel-external-incident
      備考: "kind: produce の from が D-ms-external-alert(データ)で、出典は Microsoft security rules(ルール)がインシデントを作ると書く。向きと条件は出典に合うので合格。ただし、F711 の続きの注記(Defender の XDR インシデント連携を有効にした場合、または Sentinel を Defender のポータルに onboard した場合は、Microsoft security rules が使えない)が condition に入っていない。condition が「Microsoft セキュリティのルールを使う場合」だけだと、広く読まれる。condition に足すことを勧める。"
    - id: R-endpoint-agent
      備考: "出典(F616)は、エージェントが端末のデータを監視して集めると書く。端末からエージェントへデータが渡る向きは合うが、取りに行く側はエージェントなので、kind は retrieve(from がエージェント、to が端末)のほうが出典に近い。mode の「リアルタイムで継続的」は F615(OMB、EDR 全体の記述)に由来し、同じ系統の EDR 一般の記述なので許容。エージェントが端末の上で動くかは書かれていないので、unknown にしてある点は正しい。"
    - id: NCA の要件に基づくつながり全般(R-endpoint-agent、R-agent-central-db、R-edr-detection、R-edr-notify)
      備考: "収集セッションの質問(NCA の要件を仕組みのつながりとしてよいか)への答えの続き: R-edr-siem は向きが出典にないので不合格にしたが、上の4件は、要件の文が主体、相手、向き、条件を書いているので、つながりとして認める。ただし、要件(must)であって製品の実際の動作の記述ではないことが、note(自由記述)にしかない。図で動作として読まれないよう、要件に基づくことを機械で区別できる印(例: basis: requirement)を足すことを勧める。"
    - id: R-edr-detection
      備考: "要件(3-3、3-5、3-7)に合う。分析の入力が中央のデータベースかは書かれていないとして、つながりを足していない点は正しい。"
    - id: R-mde-alert
      備考: "出典は 'alerts are created in the system' と、作る主体を 'the system' と書く。ページは Defender for Endpoint の EDR の記述なので、from を E-mde とすることを許容。"

