  - id: R-server-db
    result: 不合格
    quote_in_source:
      - "F701: SIEM products have one or more log servers that perform log analysis, and one or more database servers that store the logs."
      - "F700: Log data may be stored on the log servers themselves or on separate database servers."
      - "F703(参考): transmit the normalized log data to an SIEM server, usually on a real-time or near-real-time basis for analysis and storage."
    quote_in_target: "kind: send / from: E-siem-server / to: E-siem-db / label: ログを保存する"
    reason: >-
      出典は、SIEM がログサーバとデータベースサーバを持ち、前者が分析し後者が保存する、と役割を書くだけで、
      ログサーバからデータベースサーバへログが渡ることを書いていない。エージェントの送り先も「SIEM server」とだけあり、
      データベースサーバへの経路(誰が書き込むか)は出典にない。F700 は一般の基盤について「ログサーバ自身に保存することもある」と書き、
      この経路が必ずあることの根拠にならない。役割から経路を補ったつながりで、「よくある構成」による補完にあたる。
    suggestion: このつながりを除き、冒頭の「つながりを登録しなかった箇所」に、SIEM の中でログがデータベースサーバに届く経路を加える。包含(R-siem-db)は残してよい。

  - {id: R-server-significant, result: 合格, reason: "F100 'Regardless of how it receives log data ... an SIEM server analyzes ... correlates ... identifies and prioritizes significant events'。条件も合う"}

  - id: R-siem-correlated-entry
    result: 不合格
    quote_in_source:
      - "F705: If correlation is performed through automated methods, generally the result of successful correlation is a new log entry ... the infrastructure might also generate an alert"
      - "SP 800-92 3 冒頭(台帳にない): It then describes the basic functions performed within a log management infrastructure. Next, it examines the two major categories of log management software: syslog-based centralized logging software and security information and event management software."
      - "SP 800-92 3.6(台帳にない): Log management infrastructures, which are typically based on either syslog-based centralized logging software or security information and event management software, usually use a three-tiered design."
    quote_in_target: "from: E-siem / note: 出典はログ管理基盤一般の記述で、作る主体は「基盤」。SIEM の記述ではない"
    reason: >-
      F705 の主体はログ管理基盤(the infrastructure)で、SIEM 製品ではない。evidence の F705 だけでは、E-siem(SIEM 製品。F701、F100 で定義)を from にできない。
      出典の第3章の冒頭と 3.6 には、ログ管理基盤は通常 syslog 型か SIEM のどちらかを基にすること、3.2 の機能は基盤の中で行われる基本の機能であることが書かれており、
      「SIEM を基にした基盤」に当てはめる道はある。しかしその記述は台帳になく、当てはめても主体は「SIEM を基にした基盤」で、条件 typically(通常)が付く。
      note で「SIEM の記述ではない」と認めながら from を E-siem にしており、向きの起点が出典と合わない。
    suggestion: >-
      (a) 第3章の冒頭か 3.6 の文を事実として台帳に足し、主体を「SIEM を基にしたログ管理基盤」とする要素を別に置いて from にする。
      条件に「基盤が SIEM を基にする場合(typically)」を足す。または (b) このつながりを SIEM の範囲から外し、ログ管理基盤一般の記述として別に置く。

  - id: R-siem-alert
    result: 不合格
    quote_in_source:
      - "F705: Depending on the nature of that information, the infrastructure might also generate an alert to indicate that the identified event needs further investigation."
      - "F100: ... an SIEM server analyzes ... and initiates responses to events if desired."
    quote_in_target: "from: E-siem / to: D-siem-alert / note: 出典はログ管理基盤一般の記述で、作る主体は「基盤」。SIEM の記述ではない"
    reason: >-
      R-siem-correlated-entry と同じ理由。SP 800-92 の SIEM の節(3.4)と 3.6 の SIEM の記述には、SIEM がアラートを生成するとは書かれていない
      (書かれているのは 'initiates responses to events if desired')。アラートを生成する主体は F705 の「基盤」だけである。
      SIEM の範囲の図でこのつながりを SIEM から出すと、出典にない主体の置き換えになる。
    suggestion: R-siem-correlated-entry と同じ。F100 の 'initiates responses to events if desired' は応答であってアラートではないため、代わりの根拠にもならない。

