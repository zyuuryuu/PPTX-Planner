questions:
  - item: R-siem-alert と R-siem-correlated-entry(ログ管理基盤一般の記述を SIEM に当てはめてよいか)
    answer: >-
      今の登録のままでは不可(不合格)。SP 800-92 には、ログ管理基盤は通常 syslog 型か SIEM のどちらかを基にする(3.6)、
      3.2 の機能は基盤の中で行われる基本の機能である(第3章の冒頭)、という橋渡しの記述がある。これを事実として台帳に足せば、
      「SIEM を基にしたログ管理基盤」を主体として、typically、generally、might の限定を付けて登録できる。主体を SIEM 製品(E-siem)にすることはできない。
  - item: R-server-db(保存先の記述からつながりを作ってよいか)
    answer: 不可(不合格)。役割の記述(誰が分析し、誰が保存するか)から、データの経路は導けない。経路は出典にない箇所として示す。
  - item: R-edr-siem(NCA の要件を仕組みのつながりとしてよいか)
    answer: >-
      不可(不合格)。要件は仕組みの記述ではなく、かつ NIST の系統の E-siem に結んでいる。残すなら、要件であることを区別できる kind にし、
      連携先を別の要素とし、向きを unknown とする。

