      他の NCA のつながりも要件だが、それらは EDR の内部の段であり、別の系統の要素に結ぶものではない。
      依頼の判断事項への答え: NCA の要件は、仕組みのつながりとしては登録できない。登録するなら、要件であることを kind か属性で区別し、向きと mode は unknown とすべきである。
