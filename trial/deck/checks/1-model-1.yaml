  - id: R-edr-siem
    result: 不合格
    quote_in_source: "F708: 4-2 EDR solution must accelerate response time by integrating and sharing security insights with Network Detection and Response (NDR), Security Information and Event Management (SIEM) and Security Orchestration, Automation and Response (SOAR) tools."
    quote_in_target: "kind: send / from: E-edr / to: E-siem / label: セキュリティの知見を統合し共有する"
    reason: >-
      (1) to の E-siem は NIST SP 800-92 から定義した要素(F701、F100)で、F708 の 'SIEM tools' は組織が持つ任意の SIEM を指す。
      NCA の要件を NIST の系統の要素に結んでおり、冒頭の「出典の系統ごとに分けて登録した」と合わない。図では NIST の SIEM の仕組みに EDR から線が入って見える。
