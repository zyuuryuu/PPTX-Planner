    quote_in_target: "qualifiers: 同じ節の続きに、Microsoft セキュリティのルールが使えない条件の注記がある"
    reason: >-
      quote の直後に、Microsoft セキュリティのルールが使えない条件(Defender XDR のインシデントの統合を有効にした場合、Sentinel を Defender のポータルに載せた場合)と、
