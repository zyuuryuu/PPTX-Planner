      (参考: NCA のひな形の 1-1 には 'real-time continuous security monitoring and collection of endpoint data' があるが、台帳にない。)
    suggestion: mode を unknown にする。または NCA 1-1 を事実として足し、その事実を根拠にする。

  - {id: R-agent-central-db, result: 合格, reason: "F616 'collect endpoint data ... into a central database'"}
  - {id: R-edr-detection, result: 合格, reason: "F617 3-3〜3-7、F706 2-3。要件であることは note にある"}
