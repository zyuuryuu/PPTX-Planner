# 検査: 素材台帳の重大な検査(引用の実在、切り取り、記述と限定の一致)
name: 素材台帳の重大な検査 A(2回目)
target: trial/deck/01-sources.yaml のうち request が R1 または R3 の事実 40件(F100〜F120、F300〜F318)
inspector: Claude Sonnet 5.5
date: 2026-11-23
method: >
  出典を取得して全文を照合した(NIST SP 800-92 / 800-94 / 800-61r2 / 800-61r3 と MITRE ATT&CK Design and Philosophy の PDF を
  テキスト化、MITRE ATT&CK の3ページと CyberDefenders のページを HTML 取得)。quote は空白・引用符・改行の違いを除いて機械照合し、
  不一致と、statement が quote の外にある内容を述べている箇所は出典の前後を読んで確かめた。
  cisa.gov は取得時に 403 を返した。ユーザーエージェントの偽装などで回避せず、判定できないとした。
conditions:
  c1: quote が出典に実在する
  c2: quote の切り取りが、前後の条件・範囲・主体を落としていない
  c3: statement が quote の述べていることと合う(言い過ぎ、quote にない内容がない)
  c4: qualifiers が quote の条件・範囲・幅・不確かさを漏れなく挙げ、value/unit が合う
  c5: as_of と、撤回・旧版の扱い(参考)
summary:
  total: 40
  pass: 17      # F101 F104 F105 F106 F108 F110 F111 F113 F114 F115 F120 F304 F305 F307 F313 F314 F317
  fail: 21      # F100 F102 F103 F107 F109 F112 F116 F117 F118 F119 F300 F301 F302 F303 F306 F308 F309 F312 F315 F316 F318
  undetermined: 2   # F310 F311(出典を開けない)
  main_pattern: >
    不合格の多くは c3。statement は出典の内容としては正しいが、quote が1文だけで、statement が述べる後続の文や別の文
    (要因の一覧、定義の後半、用途の2つ目など)が quote に入っていない。出典に実在する内容なので、quote を広げれば直せるものが大半。
    重大な検査の条件は「statement が quote に合う」ため、通さない。
  other: >
    F100 は脚注37が「優先順位付けは一部の製品」と限定している。F303 は quote が原文の validated を落としている。
    F302 と F301 は原文の程度(smooth、such as)を statement が強めている。
    F114 と F119 の qualifiers は、原文の引用の中のカンマで YAML の項目が分割されている(書式の不備)。
    R3 の依頼で使う NIST SP 800-61r2 の事実(F300 F301 F302 F307 F308 F309 F314 F316)は、出典が 2025-04-03 に撤回されているのに、
    qualifiers に撤回の記載がない(F400 と F401 にはある)。

