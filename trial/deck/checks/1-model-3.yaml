# ============================================================
# 5. basis
# ============================================================
basis:
  判定: 合格
  確かめたこと: >-
    NIST SP 800-92 に基づく項目(F701、F715 を根拠にするもの、E-siem-infra、D-infra-alert、E-siem-server、R-infra-*、R-server-db、SIEM の3場面)は description、
