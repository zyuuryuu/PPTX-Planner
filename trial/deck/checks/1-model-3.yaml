# ============================================================
# 6. 収集セッションが判断を求めた点
# ============================================================
判断を求められた点:
  点: "R-infra-*: SP 800-92 第3章の冒頭(基盤の基本の機能)と 3.6(基盤は通常 SIEM を基にする)をつないで、「SIEM を基にしたログ管理基盤」に当てはめてよいか"
  答え: 出典の記述の範囲に収まる。補完にはあたらない
  理由: >-
    (1) F705 の主体は 'the infrastructure'(ログ管理基盤一般)で、その記述を、基盤の一部である「SIEM を基にした基盤」に当てはめるのは、一般の記述を部分に適用したもので、
    新しい主体やつながりを足していない。(2) SIEM を基にした基盤が存在すること(typically)と、3.2 の機能が基盤の中で行われる基本の機能であることは、F715 で台帳にある。
    (3) 主体を基盤のままにし、SIEM 製品(E-siem)や SIEM サーバ(E-siem-server)に置き換えていない。前回の両検査が補完とした点(主体の置き換え)は、ここで解消している。
    (4) generally、might、自動の相関の場合という限定が condition に残っている。
    補足(原文の確認で見つけたこと): 3.2 の末尾(p.3-5)に、さらに直接の橋渡しがある。
    "A log management infrastructure usually encompasses most or all of the functions described in this section. ... The placement of some of the log functions among
    the three tiers of the log management infrastructure depends primarily on the type of log management software used. Log management infrastructures are typically
    based on one of the two major categories of log management software"。
    ここから2つの限界が読める。(a) 基盤は 3.2 の機能の「大半か全て」を「通常」持つのであって、全ての基盤が相関を行うとは限らない。R-infra-* の condition
    「相関を自動の方法で行う場合」がこの限定を含むので、不合格にはしない。(b) 機能を3層のどこに置くかは、使うソフトウェアの種類による。よって、相関やアラートの生成を
    SIEM の特定の部品(SIEM サーバなど)に置くことは、出典の範囲を超える(補完になる)。今の定義は主体を基盤のままにしており、この線を越えていない。
    図でも、R-infra-* を SIEM サーバから出るように描かないことを勧める。
  勧め: "3.2 末尾の上の文を F715 に足すか、R-infra-* の note に書くと、当てはめの根拠と限界がはっきりする(判定には影響しない)。"
