          - 02-answers の answer「閉じる、調査を続ける、上げるを根拠とともに1人で決められる」(攻撃の疑い全てを上げるとは述べていない)
        理由: summary は「攻撃の疑い」の全てを上げるとしている。主張は、上げる条件を、持ち時間内に決められない、重要な資産での疑い、横展開の証拠、迷うときの4つとし、侵害に至らなかった試みを閉じるか上げるかの線は公開資料になかったとしている。「攻撃の疑い」は、侵害に至らなかった試みを含む区分(summary 自身の括弧)なので、その全てを上げるとするのは、主張より広い。全ての試みを上げるのは、F003(依頼者のSOCの最初の3か月の運用。証言)の内容であり、summary が述べる「公開資料の材料から組み立てた案」には入っていない。証言の内容が案に混ざった読みにもなる。C3 が落とした限定(上げる条件の4つ)を、summary が「攻撃の疑い」の1語に置き換えたことで、広くなっている
        直し方の提案: 上げる条件を C3 の4つ(または summary に収まる範囲でそのうちの一部)のとおりに書くか、「攻撃の疑いのうち上げる条件に当たるもの」のように限る
      - id: 3-b
        箇所: summary
        引用: 「決めきれないものは持ち時間の中で調査を続け」
        突き合わせ: C3 statement は「閉じる」と「上げる」の条件を示すだけで、調査を続ける条件(決めきれないものを持ち時間の中で調べ続ける)を主張として述べていない。F403 は持ち時間内に判定できなければ上げるとし、調査を続けるとは書いていない。02-answers の Q3.2 も、調査を続けるときの確かめる内容と持ち時間は標準になく、実務者向けの解説1件が12〜20分とするだけ
        理由: 3つの判断のうち「調査を続ける」の条件が、主張で裏付けられていない。C3 の「持ち時間の中で決められないとき…上げる」の裏返しとして導いた設計側の推論であり、summary の「案」の一部としては述べうるが、主張に書かれていない部分を summary が先に述べている。ただし 3-a に比べて重みは小さい
        直し方の提案: C3 に調査を続ける条件(持ち時間の中は調べ続ける)を案として書き足すか、summary から外す(その場合 answer の3つの判断との関係は設計の側で決める)
    合格の部分:
