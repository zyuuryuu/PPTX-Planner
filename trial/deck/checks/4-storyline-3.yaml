検査の名前: 工程4 ストーリーラインの検査セッションの条件(限定の検査を除く全て、1回)
対象: trial/deck/04-storyline.yaml、04-chapter-states.yaml、04-scenarios.yaml(コミット 49a88e24)
判定者: Claude Opus 5.5(検査セッション)
上流: 00-brief.md、02-claims.yaml、03-chapters.yaml、terms.yaml、style.yaml、decisions.md(D001〜D006)。01-sources.yaml は、見出しの evidence にある事実の statement と qualifiers だけを開いた。基準は docs/stages/04-storyline.md の合格条件、docs/checks.md の否定・具体性・除去・分類の軸の検査
範囲の外: 見出しが根拠の事実の限定を落としていないか(重大な検査。別のセッションが行う)。機械の検査の項目(字数以外)
件数: {合格: 2, 不合格: 11, 判定できない: 0}
備考: 条件9の一部(発表の通しの時間)は見出しの一覧から判定できない。条件の判定は不合格としたうえで、その部分を判定できないとして記した
項目:
  - 項目: 1. 見出しが2つの主張をつないでいない
    判定: 不合格
    指摘:
      - 引用: 'ch3-s1「何から確かめるかは出典で食い違う。NISTはインシデントの確認を深刻度の見積もりより前に置く」'
        理由: 2文で、「出典で食い違う」と「NISTは〜を前に置く」の2つの主張がある。しかも食い違いの片方(民間の解説は優先順位付けを先に置く。C2、F312)が見出しになく、見出しだけでは「食い違う」が成り立たない
        直し方の案: 「何から確かめるかは出典で食い違い、NISTは確認を先、民間の解説は優先順位付けを先に置く」のように1つの主張(食い違いの中身)にする。または「何から確かめるかは出典で食い違う」だけにし、両側は中身に置く
      - 引用: 'ch3-s11「調べた公的な文書に持ち時間の目安はない。実務者の解説の1件は12〜20分を目安とする」'
        理由: 2文で、「公的な目安がない」と「1件の解説が12〜20分とする」の2つの主張がある(条件3の指摘も参照)
      - 引用: 'ch3-s13「迷ったときは上げる。有志の手順書も、判断に迷うときは上げる側に倒すとする」'
        理由: 2文で、規則(迷ったら上げる)と、その裏付け(有志の手順書もそう言う)の2つの主張がある。裏付けは出典の行(source)と中身に置ける
    合格とした境界の例:
      - 'ch2-s1「…知らせで、本物の攻撃とは限らない」、ch2-s5「…知識ベースで、検知の分析を作る助けになりうる」、ch3-s2「…公的な文書になく、この講義の基準は案である」: 前半が後半の前提(定義、理由)になっており、1つの主張とみなした'
      - 'ch2-s3「EDRは端末の振る舞いの記録を継続して集め、製品の例では脅威を検知するとアラートを作る」: 前半(一般の説明、OMB)と後半(製品の例)で範囲が違うが、問い「何を根拠にアラートを出すのか」への1つの答えとみなした'
  - 項目: 2. 見出しどうしが矛盾していない
    判定: 不合格
    挙げた組: 'ch1-s2/ch2-s6(F207)、ch2-s7/ap-s1(Vectra の調査)、ch2-s1/ch2-s2/ch3-s4(アラートを出す仕組み、F709)、ch2-s8/ch2-s9/ch3-s5/ch3-s6/ch5-s4(誤検知と想定内の検知の区分)、ch3-s2/ch3-s7(公的な文書と線、F610)、ch3-s3/ch3-s7/ch3-s8(優先度)、ch3-s11/ch3-s12/ch3-s13/ch5-s8(上げる条件)、ch3-s14/ch5-s6/ap-s3(攻撃の試み)、ch3-s10/ch3-s9(閉じた後)、ch4-s2/ch4-s3(誤検知に慣れる)'
    指摘:
      - 引用: 'ch3-s12「案として、重要な資産での疑い、横展開の証拠、時間切れ、守備範囲の超過のどれかなら上げる」'
        対比: 'ch5-s7「重要なサーバで、一覧にない見慣れないプロセスが動いたアラートが届いた」、ch5-s8「閉じずに調べ、正当と確かめられなければ、経過と証拠を添えて上げる」'
        理由: ch3-s12 では「重要な資産での疑い」は、それだけで上げる条件である。演習4は重要なサーバでの疑いだが、答えは「調べ、正当と確かめられなければ上げる」で、調べ終えるまで上げない。D002 の「重大度が高いものは調べ終える前に上げる」とも合わない。新人は、重要な資産の疑いで先に上げるのか、調べてから上げるのかを、見出しからは決められない
        直し方の案: 演習4の答えを「重要な資産での疑いなので、調べ終えるのを待たずに経過を添えて上げる」とするか、ch3-s12 の条件の書き方を変える(どちらに揃えるかは設計の判断)
      - 引用: 'ch2-s8「出典の言う誤検知の原因には、緩いシグネチャや、学習期間に見なかった保守作業がある」'
        対比: 'ch2-s9「…社内の脆弱性スキャンや外部の診断が想定内の検知を起こしていた」、ch3-s5「案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる」、ch3-s6「このSOCでは、想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけである」'
        理由: 月1回の保守作業(F210)は業務上正当な活動で、語彙表の定義では想定内の検知(条件どおりに反応したが業務上は問題のない活動)に当たりうる。ch2-s8 は「出典の言う」と断っているが、ch2 の中で ch2-s8 は誤検知の原因、ch2-s9 は想定内の検知の原因として並ぶため、同じ種類の対象(業務上正当な活動)が2つの区分に分かれて読める。閉じ方は区分で違い(ch3-s5 は根拠があれば閉じる、ch3-s6 は一覧にあるものだけ)、保守作業のアラートを一覧によらず誤検知として閉じてよいと読める。過去の指摘の場面「誤検知と想定内の検知を混同していない」にも関わる
        直し方の案: ch2-s8 から保守作業を外して検知の条件の誤り(緩いシグネチャ)に絞るか、保守作業はこの講義の区分では想定内の検知に当たると見出しで示す
    備考:
      - 'ch3-s1 の「NISTはインシデントの確認を…前に置く」を「1件のアラートは何から確かめるのか」の答えとして置くと、語彙表 T-incident の「新人は自分でインシデントと決めず」と食い違って読まれうる。NIST の対象はインシデントの報告である(F303)。矛盾とまでは判定しないが、中身でアラートとの違いを示す必要がある'
      - 'ch3-s2(線は公的な文書にない)と ch3-s7(NISTは優先度を資産の重要度などで付けるよう推奨する)は、F610 が上げる判断もリスク評価の要因に基づかせるとすることから、要因の例示はあるが線はない、として両立する。矛盾なし'
  - 項目: 3. 見出しが、そのスライドの question に答えている
    判定: 不合格
    指摘:
      - 引用: 'ch2-s4 question「アラートを確かめるには、どのログを見ればよいのか」、headline「ログの種類ごとに分かることが違い、認証のログからは接続元、利用者、成否、日時が分かる」'
        理由: 「どのログを見るか」に答えていない。種類で違うことと、認証のログの1例だけで、アラートに応じてどのログを見るかがない。evidence の F110(OSの監査記録)、F111(OSログは不審な活動の調査に最も役立ち、検知の後に参照される)、F107 は見出しに反映されていない
        直し方の案: 「アラートの後は、ホストのOSのログで詳細を、認証のログで接続元や成否を確かめる」のように、見る先を答える
      - 引用: 'ch3-s4 question「アラートの根拠は、どう確かめるのか」、headline「製品の例では、アラートは分析ルールがデータに問い合わせて出し、関わる利用者や端末を含む」'
        理由: アラートが出る仕組みの説明で、根拠の確かめ方(何を見て、何と照らすか)を述べていない
        直し方の案: 「アラートを出したルールの条件と、アラートに含まれる利用者や端末を見て、元のデータと照らす」のように、確かめ方を答える
      - 引用: 'ch3-s11 question「どこまで調べたら上げてよいのか」、headline「調べた公的な文書に持ち時間の目安はない。実務者の解説の1件は12〜20分を目安とする」'
        理由: 外の資料の状況を述べるだけで、この講義(またはこのSOC)では、どこまで調べたら上げるのかに答えていない。12〜20分を採るのかも分からない。ch3 の到達点の語「持ち時間」の値が、どの見出しにもない
        直し方の案: 「案として、持ち時間(例は1件20分)の中で決められなければ上げる。公的な目安はない」のように、採る線を答える。値はこのSOCの運用として依頼者に確かめる必要がありうる
      - 引用: 'ch5-s1、ch5-s3、ch5-s5、ch5-s7(例: question「演習1: このアラートを、閉じる・調べる・上げるのどれにするか」、headline「演習1: 承認済みの脆弱性スキャンの時刻に、社内の1台から多数の宛先への接続のアラートが届いた」)'
        理由: question は受講者への出題で、headline はアラートの描写であり、question に答えていない(答えは次のスライド)。演習の問題のスライドに、工程4の「1つの問いに1枚のスライドで答える」の形が合っていない。docs と style.yaml に、この形の例外の定めはない
        直し方の案: question を読み手の問い(例:「演習1では、どんなアラートが届いたのか」)に書き換えるか、演習の問題のスライドを例外として style.yaml の exceptions と設計の判断の記録に残す
    備考: 'ch3-s1 は、問い「何から確かめるのか」に「出典で食い違う」と答えており、この講義の順は ch3-s3 が答える。答えにはなっているとして、この条件では不合格にしていない(条件1の指摘はある)'
  - 項目: 4. 章内の見出しを順に読むと、章の message が導ける
    判定: 不合格
    指摘:
      - 章: ch1
        引用: 'message「アラートは、誤検知、想定内の検知、攻撃の疑いの3つに分ける。根拠をもって誤検知か想定内と言えるものだけを記録して閉じ、迷ったら上げる」'
        対比: 'ch1-s1「届いたアラートを、閉じる・調べる・上げるのどれにするか、根拠とともに1人で決められる」、ch1-s2「1つのSOCの実測では、誤検知でも想定内の検知でもない攻撃の試みが27%以上あった」'
        理由: ch1 の見出しからは、3つに分けること(3つ目の名前「攻撃の疑い」もない)、根拠のあるものだけを記録して閉じること、迷ったら上げることのいずれも導けない。ch1-s1 は講義の目標、ch1-s2 は3つ目の区分がある理由の材料である。章のまとめ(半導出)に message は載るが、条件は見出しから導けることである
        直し方の案: ch1-s1 か ch1-s2 の後に、結論そのもの(3つに分け、根拠のあるものだけを閉じ、迷ったら上げる)を述べる見出しを置く。ch1 の配分は4枚で、本編は2枚のため、枠の確認が要る
    合格とした章:
      - 'ch2: ch2-s1(本物の攻撃とは限らない)と ch2-s6(試み27%以上、想定内49%以上。合わせて76%以上で「多くを占めた」と合う)から導ける'
      - 'ch3: ch3-s2(線は公的な文書にない、案である)、ch3-s3/s5/s6(3つに分け、根拠のあるものだけ閉じる)、ch3-s13(迷ったら上げる)、ch3-s6/s10/s14(このSOCの運用)から導ける'
      - 'ch4: ch4-s1〜s3 から「誤検知に慣れると見過ごしうる」は導ける。2文目の「根拠をもって言えるものだけを閉じる理由として示す」への橋渡し(慣れで閉じた・無視したから見過ごした)は ch4-s2 から推論できる程度で、見出しには明示されていない。合格としたが、章のまとめで明示が要る'
      - 'ch5: 演習4件が誤検知(演習2)、想定内(演習1)、攻撃の試み(演習3)、不明な疑い(演習4)と、閉じる・調べる・上げるを全て含み、message の演習の部分は導ける。「配属から3か月で1人で決められるようにする」は目標で、見出しから導くものではないとした'
  - 項目: 5. 同じ主張を述べる見出しが複数ない
    判定: 不合格
    指摘:
      - 引用: 'ch1-s2「1つのSOCの実測では、誤検知でも想定内の検知でもない攻撃の試みが27%以上あった」'
        対比: 'ch2-s6「1つのSOCの実測では、侵害に至った攻撃は0.01%、攻撃の試みは27%以上、想定内は49%以上」'
        理由: 同じ事実(F207)の同じ値(攻撃の試み27%以上)を、ch1-s2 は ch2-s6 の一部として述べている
        直し方の案: ch1-s2 を数値のない理由(「誤検知でも想定内でもない、攻撃の試みが少なくない」など)にして、数値は ch2-s6 に任せる。または予告として重ねることを設計の判断に残す
      - 引用: 'ch3-s4「製品の例では、アラートは分析ルールがデータに問い合わせて出し、関わる利用者や端末を含む」'
        対比: 'ch2-s1「アラートは、検知の仕組みが探すものを見つけたときの知らせで…」(F709)、ch2-s2「SIEMは、最も一般的にはルールで複数のログの記録値を照合し、重要なイベントを特定する」'
        理由: ch3-s4 の前半(ルールがデータに問い合わせてアラートを出す)は、ch2-s1 と ch2-s2 が既に述べたアラートの出る仕組みと同じ主張である。新しいのは「関わる利用者や端末を含む」だけ
    備考: 'ch3-s5/ch5-s4、ch3-s6/ch5-s2、ch3-s14/ch5-s6 は、規則と、その演習への当てはめで、同じ主張の重複とはみなさなかった'
  - 項目: 6. 全ての見出しが、否定の検査と具体性の検査を通る
    判定: 不合格
    指摘:
      - 引用: 'ch5-s1「演習1: 承認済みの脆弱性スキャンの時刻に、社内の1台から多数の宛先への接続のアラートが届いた」、ch5-s3、ch5-s5、ch5-s7(同じ形)'
        理由: 演習の問題の描写で、否定(「届かなかった」)が主張として成り立たない。主張ではない。条件3の指摘と同じ根で、例外として扱うかの判断が要る
      - 引用: 'ch2-s4「ログの種類ごとに分かることが違い、…」'
        理由: 前半「ログの種類ごとに分かることが違う」は、否定(「どのログでも分かることは同じ」)が主張として成り立たず、何も述べていない。後半(認証のログから接続元、利用者、成否、日時が分かる)は否定の検査を通る
        直し方の案: 前半を外し、見る先を答える文にする(条件3の案)
    合格の判断:
      - '残る35件は否定の検査を通る。例: ch2-s1 の否定「アラートは必ず本物の攻撃である」、ch3-s8 の否定「SIEMの深刻度で判断してよい」、ch3-s13 の否定「迷っても上げずに調べ続ける」、ap-s2 の否定「直接測った調査がある」は、いずれも主張として成り立つ'
      - '具体性: 全ての見出しに対象(アラート、SIEM、ログ、閉じる条件など)、数値、条件のいずれかがある。主語を省いた指示の文(ch1-s1、ch3-s3、ch3-s5、ch3-s8、ch3-s9、ch3-s12、ch3-s13、ch3-s15、ch5 の答え)は、主語が受講者(新人)であると文脈で一意に決まるとして、主語ありとみなした'
  - 項目: 7. 本編の全てのスライドが除去の検査を通る
    判定: 不合格
    上位の主張とした基準: 'ch1 は message、ch2 は C1 と ch2 の message、ch3 は C2・C3 と ch3 の message、ch4 は C4、ch5 は ch5 の message。章をまたいで後の見出しが前提にするもの(例: ch3-s3 の「ログ」)は、後の見出しも上位とした'
    指摘:
      - 引用: 'ch2-s5「ATT&CKは攻撃者の目的と方法の知識ベースで、検知の分析を作る助けになりうる」'
        理由: C1 の statement と evidence に ATT&CK はなく(F114〜F125 を含まない)、ch2 の message にもない。後の章の見出しも ATT&CK を使わない。見出しが言う用途は検知の分析を作ること(検知を作る側の仕事)で、新人の一次解析の判断を支えない。抜いても、上位の主張は成り立つ。ブリーフは ATT&CK を「知らないため資料で説明する」に挙げるが、それは見出しを残す理由で、除去の検査の答えではない
        直し方の案: 付録に回すか、一次解析での使い道(アラートが攻撃のどの段階かを知る、など。出典の裏付けが要る)を答える見出しにして、ch3 の優先度(活動の段階、F610)とつなぐ
      - 引用: 'ch3-s4「製品の例では、アラートは分析ルールがデータに問い合わせて出し、関わる利用者や端末を含む」'
        理由: 今の見出しは ch2-s1、ch2-s2 と重なる仕組みの説明で、C2・C3 のどの部分も支えない。抜いても ch3 の主張は成り立つ。条件3の案のように確かめ方を答える見出しにすれば、C2 の「根拠とログで3つに分ける」を支えうる
      - 引用: 'ch3-s8「案として、SIEMが付けた深刻度は判断の材料にとどめ、判断の代わりにしない」'
        理由: C2、C3 の statement と evidence に F306 はなく、抜いても C2(順序と優先度の要因)、C3(閉じる・上げるの線)は成り立つ。読み手が抱きうる問いではあるが、上位の主張は依存していない
        直し方の案: ch3-s7 に合わせる(優先度は SIEM の深刻度でなく、資産の重要度などで付ける)か、付録に回す
    合格とした例: 'ch2-s4(ログ)は ch3-s3「根拠とログで3つに分け」と主張の骨子の answer が前提にするため残る。ch2-s8、ch2-s9 は C1 の原因の部分と ch3-s5、ch3-s6、演習1・2を支える。ch1-s2 は ch1 の「3つに分ける」の理由として残る(重複は条件5)。演習4件はそれぞれ別の区分と行き先を担い、どれを抜いても ch5 の message の「3つに分け」を確かめられなくなる'
  - 項目: 8. 章の前提と到達点が、見出しの中身と合っている
    判定: 不合格
    指摘:
      - 引用: '04-chapter-states.yaml ch2 exit concerns_answered「誤検知ばかりで、何を見ればいいか分からない」'
        対比: 'ch2-s7「「8割が誤検知」に近い値は、調べた範囲ではベンダーの調査の自己申告(83%)だけだった」、ch2-s4「ログの種類ごとに分かることが違い、認証のログからは…が分かる」'
        理由: ch2 の見出しは懸念の前半(誤検知ばかり)には答えるが、後半(何を見ればいいか)には答えていない。ch2-s4 は見る先を答えていない(条件3)。何を見るかに答えるのは ch3-s3(根拠とログで3つに分ける)と ch3-s4 だが、ch3-s4 も確かめ方を述べていない(条件3)。今の見出しでは、この懸念はどの章でも答えきれていない
        直し方の案: ch2-s4 と ch3-s4 を条件3の案のように直し、concerns_answered を ch3 にも置くか ch3 に移す
      - 引用: '04-chapter-states.yaml ch2 exit terms「侵害に至らなかった攻撃の試み」'
        対比: 'ch2-s6「侵害に至った攻撃は0.01%、攻撃の試みは27%以上」'
        理由: ch2 の見出しにこの語はなく、「攻撃の試み」だけである。語として初めて出るのは ch3-s14。ch2-s6 で「侵害に至った攻撃」と「攻撃の試み」が並ぶので意味は読み取れるが、到達点の語と見出しの語が一致しない。軽微
      - 引用: '04-chapter-states.yaml ch3 exit terms「持ち時間」'
        対比: 'ch3-s11「調べた公的な文書に持ち時間の目安はない。実務者の解説の1件は12〜20分を目安とする」、ch3-s12「…時間切れ…なら上げる」'
        理由: 語は出るが、この講義で持ち時間がいくつか(または誰が決めるか)が見出しにない。T-investigate の定義(持ち時間の中で確かめ続ける)と ch3-s12 の「時間切れ」は値を前提にしており、読み手は語を得ても使えない
    合格とした項目:
      - 'ch1 exit terms(アラート、誤検知、想定内の検知、閉じる、調べる、上げる)は ch1-s1、ch1-s2 に出る。ch2 exit の イベント、ログ、SIEM、EDR、ATT&CK は ch2-s2〜s5 に出る'
      - 'ch2 accepted C1、ch3 accepted C2・C3、ch4 accepted C4 は、それぞれの章の見出しで得られる(C2 の「届いた順ではなく要因で扱う」は ch3-s7 が要因の部分だけを述べる)'
      - 'ch3 concerns_answered「間違って閉じるのが怖い」は ch3-s5、s6、s9、s10 で答えがある。「どこまで調べたら上に上げていいのか分からない」は ch3-s12(条件)と ch3-s13(迷ったら上げる)で答えがあるとした(持ち時間の値の欠けは上の指摘)'
      - 'ch4 answered「なぜ根拠のあるものだけを閉じるのか」は、条件4の ch4 の備考の通り、推論でつながるとした'
      - 'ch5 answered「自分で決められるか」は演習4件で得られる'
  - 項目: 9. 場面の期待する結果が、見出しの一覧で満たせる見込みがある
    判定: 不合格
    指摘:
      - 場面: 反対の立場の通読
        引用: '「攻撃の試みを全て上げると溢れる」'
        対比: 'ch3-s14「このSOCでは、配属から最初の3か月は、侵害に至らなかった攻撃の試みも全て上げる」(objection C3 index 2)。ap-s3「上げすぎる誤りの割合を測った調査は見つからなかった」(付録)'
        理由: ch3-s14 は規則を述べるだけで、溢れるという反論への答え(C3 の response「上が溢れるかはリーダーの側で対処する」、F003)がどの見出しにもない。question も「攻撃の試みは、閉じてよいのか」で、溢れる懸念を問いにしていない。本編の見出しの一覧から、この反論に答えが得られる見込みが確かめられない
        直し方の案: ch3-s14 を「…全て上げる。溢れるかはリーダーの側で対処する」の趣旨にする(条件1に触れない1文で)か、溢れる懸念を問いにしたスライドを置く
      - 場面: 発表の通し
        判定: 判定できない
        理由: 90分2回に収まるか、ノートが話としてつながるかは、見出しの一覧からは判定できない(ノートと発表の時間の見積もりがない)
    合格とした部分:
      - '反対の立場の通読の残り5件: 「8割は誤検知」は ch2-s7・ch2-s6、「環境を知らずに想定内と言えるのか」は ch3-s6、「公的な基準がないのに教えてよいのか」は ch3-s2(線はなく、案と明示)、「1人で決められるのか」は ch3-s13(迷ったら上げることまでを1人の判断にする、のつながりは見出しに明示されていないが、中身で示せる見込みがある)、「間違って閉じたら取り返しがつかない」は ch3-s10'
      - '主な読み手の通読: 3つに分ける(ch3-s3。区分の名前「攻撃の疑い」は見出しになく、章扉・章のまとめの message に頼る)、根拠のあるものだけ記録して閉じる(ch3-s5、s6、s9)、迷ったら上げる(ch3-s13)、このSOCの運用(ch3-s6、s10、s14)、演習(ch5)。ch1 の見出しの欠け(条件4)と、演習1・4の答えの導出(条件13)は、この場面の「根拠を答えられる」に影響する'
      - '要約だけ: 要約の文は章扉・まとめから載る。見出しと食い違わない'
      - '過去の指摘: 3つの行き先は全ての見出しで「閉じる・調べる・上げる」。依頼者、同意などの語はない。誤検知と想定内の検知の混同のおそれは条件2の ch2-s8 の指摘'
  - 項目: 10. 用語が terms.yaml と揃っている。banned の語を使っていない。3つの行き先が「閉じる・調べる・上げる」
    判定: 合格
    理由: 'banned の「良性のトリガー」「調査を続ける」「上に上げる」「エスカレーション」は、見出しと question のどこにもない(全40件を検索)。3つの行き先は ch1-s1、ch3-s2、ch5 の question で「閉じる・調べる・上げる」と揃い、動詞としての使い方(閉じる、調べ、上げる)も T-close、T-investigate、T-escalate の定義と合う。ch5-s2「想定内の検知として記録して閉じる」、ch5-s4「誤検知として、根拠を記録して閉じる」は T-close の定義(記録して終える)と合う'
    備考:
      - 'ch2-s8 の「緩いシグネチャ」と ch5-s3 の「緩く書かれたルール」は、同じ対象(F214)を違う語で呼んでいる。演習2の答えは ch2-s8 を当てはめるものなので、語を揃えたほうがよい。どちらも語彙表にない'
      - '「持ち時間」(ch3 の到達点の語)、「侵害に至らなかった攻撃の試み」「攻撃の疑い」「SIEM」「EDR」「ATT&CK」「優先度」「深刻度」は語彙表に登録がない。terms.yaml の冒頭は、対象を指す語の登録を工程6で行うとし、工程4の合格条件は新しい語の登録を機械の検査とする。どちらを優先するかは、この検査の範囲の外として判定していない'
      - 'ch2-s8 の誤検知の扱いは条件2の指摘を参照'
  - 項目: 11. style.yaml の個人の表現規約(P001〜P008)に反する見出しがない
    判定: 不合格
    指摘:
      - 規約: P004 資料自身の狙いや構成を語る文を書かない
        引用: 'ch1-s1 question「この講義で何ができるようになるのか」、headline「届いたアラートを、閉じる・調べる・上げるのどれにするか、根拠とともに1人で決められる」'
        理由: 講義の狙い(目標)をそのまま述べる文である。研修資料の章の順(目標、全体像…)と、この規約がぶつかっているが、style.yaml の exceptions に例外の定めはない
        直し方の案: 研修資料の目標のスライドを P004 の例外として style.yaml の exceptions に残すか、見出しを結論(3つに分け、根拠のあるものだけを閉じ、迷ったら上げる)に替えて目標は章扉に置く(条件4の ch1 の指摘とあわせて直せる)
    合格の判断と備考:
      - 'P001(飾り)、P002(既知の説明)、P003(前置き)、P007(記号)、P008 に反する見出しはない。「閉じる・調べる・上げる」の中黒は依頼者が決めた表記で、記号の代用ではない'
      - 'P004: ch3-s2「この講義の基準は案である」は資料の狙いや構成ではなく、基準の位置づけ(D001 が求める「案」の明示)を述べるとして、反しないとした'
      - 'P005: 「調べた範囲では」(ch2-s7)、「調べた公的な文書に」(ch3-s2、s11)、「見つからなかった」(ap-s2、ap-s3)は主張の範囲を示す限定で、検討の経緯を写した文ではないとした'
      - 'P006(専門用語に補足): ch2-s8 の「シグネチャ」「学習期間」(異常検知型の学習)、ch3-s12 の「横展開」は、セキュリティ製品の経験のない読み手に補足が要る。見出しに補足がなくても中身で補えるため、見出しの不合格とはしないが、工程7で確かめる必要がある'
  - 項目: 12. 見出しが50字以内である(D006)
    判定: 合格
    理由: 'headline の文字数を全40件数えた(Python の len で、空白と記号を含む)。最長は ch2-s6 の48字、次いで ch5-s1・ch5-s2 の47字。50字を超えるものはない'
  - 項目: 13. 演習(ch5)の4件の答えが、ch3 の案とこのSOCの運用から導ける
    判定: 不合格
    指摘:
      - 演習: 演習1
        引用: 'ch5-s1「承認済みの脆弱性スキャンの時刻に、社内の1台から多数の宛先への接続のアラートが届いた」、ch5-s2「一覧にある承認済みのスキャンに当てはまるため、想定内の検知として記録して閉じる」'
        対比: 'ch3-s6「想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけである」、ch3-s5「…根拠をもって言えるときだけ…閉じる」'
        理由: 問題が示すのは「スキャンの時刻に」という時刻の一致だけで、接続元の1台が一覧にあるスキャンの端末かは示されていない。時刻が重なっただけでは「一覧にある活動に当てはまる」と根拠をもって言えず、同じ時刻の別の端末からの不審な走査も閉じてしまう。答えは問題の情報から導けない
        直し方の案: 問題に「一覧に載ったスキャン用の端末から」などを足し、答えに当てはめの根拠(端末と時刻の両方が一覧と合う)を書く
      - 演習: 演習4
        引用: 'ch5-s7「重要なサーバで、一覧にない見慣れないプロセスが動いたアラートが届いた」、ch5-s8「閉じずに調べ、正当と確かめられなければ、経過と証拠を添えて上げる」'
        対比: 'ch3-s12「案として、重要な資産での疑い、横展開の証拠、時間切れ、守備範囲の超過のどれかなら上げる」'
        理由: ch3 の案では、重要な資産での疑いはそれだけで上げる条件で、演習4の答え(調べてから、確かめられなければ上げる)は ch3-s12 から導けない(条件2の指摘と同じ)。また「正当と確かめられなければ」の確かめる期限(持ち時間)も ch3 の見出しにない
    合格とした演習:
      - '演習2: 緩く書かれたルールが管理ツールの定期の通信に反応した、は T-false-positive(緩すぎるルール)と ch3-s5(検知の条件の誤りと根拠をもって言える)から「誤検知として記録して閉じる」が導ける。F002 は新人が誤検知を閉じてよいとする。ただし、管理ツールの定期の通信は業務上正当な活動でもあり、条件2の ch2-s8 の指摘(誤検知と想定内の境)が直らないと、受講者が想定内の検知(一覧が要る)と答える余地がある'
      - '演習3: 防がれた記録のある既知の攻撃の通信は、ch3-s14(最初の3か月は攻撃の試みを全て上げる)から「上げる」が導ける。「侵害に至らなかった」は、防がれた記録1つからは言い切れないが、侵害の有無によらず上げるので、答えは変わらない'
