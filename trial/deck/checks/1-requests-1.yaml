分類の軸の検査:
  対象: 01-plan.yaml の Q1.1(子: Q1.1.1〜Q1.1.4)
  軸: "アラートの性質(生成の根拠、届く件数、誤検知の割合、誤検知の典型)"
  条件:
    - 条件: 何の基準で分けたかを一言で言えるか
      判定: 合格
      引用:
        - "axis: アラートの性質(生成の根拠、届く件数、誤検知の割合、誤検知の典型)"
      理由: >
        基準は「アラートの性質」の一語で言える。括弧内の4つは、その性質の側面として並ぶ。
    - 条件: 項目は同じ水準か
      判定: 合格
      引用:
        - "Q1.1.1 SIEMとEDRは、それぞれ何を根拠にアラートを生成するか"
        - "Q1.1.2 SOCの解析者が受けるアラートの量は、どの程度か"
        - "Q1.1.3 SOCに届くアラートのうち、誤検知はどの程度の割合を占めるか"
        - "Q1.1.4 よくある誤検知には、どんなパターンがあり、それぞれ何が原因で起きるか"
      理由: >
        4つとも、アラートの性質の1側面を問う。ただし、誤検知の割合(Q1.1.3)と誤検知の典型(Q1.1.4)は、
        どちらも「誤検知」を対象にする。典型は割合の内訳になりうる。同じ水準とは言えるが、
        近い位置にあるので、設計の側で確かめてよい。
    - 条件: 1つの項目が2つのグループに入らないか
      判定: 合格
      引用:
        - "Q1.1.1 何を根拠にアラートを生成するか"
        - "Q1.1.4 それぞれ何が原因で起きるか"
      理由: >
        各子の問いは1つのグループにだけ入る。問いの文面は重ならない。注記として、
        誤検知の原因(Q1.1.4)の答えが、生成の根拠(Q1.1.1)の答えと同じ事実になりうる
        (例: 検知の条件が正規の運用に一致する)。問いの段階では合格とするが、工程2の主張の分け方で
        この重なりを見る余地がある。
    - 条件: グループの数は軸から決まっているか
      判定: 合格
      引用:
        - "軸の項目: 生成の根拠、届く件数、誤検知の割合、誤検知の典型(4つ)"
        - "子: Q1.1.1、Q1.1.2、Q1.1.3、Q1.1.4(4つ)"
      理由: 軸の4項目と子の4つが1対1に対応する。
  件数: {合格: 4, 不合格: 0, 判定できない: 0}

依頼の文面の検査:
  判定の基準: 結論や仮説を含む聞き方、特定の答えを前提にした聞き方がないか
  R1:
    判定: 合格
    引用: "Q1.1.1 SIEMとEDRは、それぞれ何を根拠にアラートを生成するか / Q1.2 一次解析で確かめる記録には、どんな種類があり… / Q1.3 攻撃の手口の分類(MITRE ATT&CKなど)は何を分類しており…"
    理由: 3つとも「何か」「どんな種類」を尋ねる形で、答えを前提にしない。共通の条件も、見解が割れている場合は両方返すとしている。
  R2:
    判定: 合格
    引用: "Q1.1.2 SOCの解析者が受けるアラートの量は、どの程度か / Q1.1.3 …誤検知はどの程度の割合を占めるか / Q1.1.4 よくある誤検知には、どんなパターンがあり…"
    理由: 「どの程度」「どんなパターン」を尋ねており、特定の数値や結論を前提にしない。Q1.1.3 の「占めるか」は割合の存在を前提にするが、結論ではなく問いの対象を示す。
  R3:
    判定: 合格
    引用: "Q2.1 …何で決めるとされているか / Q2.2 …何をどの順で確かめるとされているか / Q3.1.1 …閉じてよい条件は、何とされているか / Q3.1.2 …どう記録され、後からどう見直されるとされているか"
    理由: 「とされているか」で出典の述べる内容を尋ねる形になっており、答えを前提にしない。
  R4:
    判定: 合格
    引用: "Q3.2 判断を保留して調査を続ける場合、何をどこまで確かめるとされているか(調べる範囲や時間の目安を含む) / Q3.3.1 …上に上げる条件は、何とされているか / Q3.3.3 …何を添えて渡すとされているか"
    理由: 3つとも出典の述べる内容を尋ねる。範囲や時間の目安は問いの対象として挙げられているだけで、答えを前提にしない。
  R5:
    判定: 合格
    引用: "Q4.1 実際の攻撃を誤検知として閉じてしまう誤りは、どんな状況や要因で起きるとされているか / Q4.2 …遅れる誤りは、どんな状況や要因で起きるとされているか / Q4.3 上に上げなくてよいアラートまで上げてしまう誤りは…"
    理由: 「とされているか」で、誤りの状況や要因を出典から尋ねる。誤りの存在は計画の問いの前提だが、どんな要因かは答えを決めていない。
  共通の条件(R1〜R5):
    判定: 合格
    引用: "見つからなかった問いは、見つからないと返す。見解が割れている場合は、割れている両方の事実を返す。"
    理由: 結論を選ばせる指示がない。「stance は書かない」とあり、立場の判断は依頼に含まれない。

末端の網羅:
  対象: 01-plan.yaml の、result を持つ問い(16件)
  判定: 合格
  件数:
    末端の問い: 16
    依頼に1回含まれる: 16
    2回以上: 0
    含まれない: 0
    依頼にあるが末端でない: 0
  対応:
    R1: [Q1.1.1, Q1.2, Q1.3]
    R2: [Q1.1.2, Q1.1.3, Q1.1.4]
    R3: [Q2.1, Q2.2, Q3.1.1, Q3.1.2]
    R4: [Q3.2, Q3.3.1, Q3.3.3]
    R5: [Q4.1, Q4.2, Q4.3]
  理由: >
    末端の16件が、依頼に1回ずつ含まれる。依頼の問いの文面は、計画の文面と一致する。
    Q0、Q1、Q2、Q3、Q3.1、Q3.3、Q4 は、子を持つ枝で、result を持たないため対象外。
    Q3.3.2 は欠番で、末端にも依頼にもない(前回の検査の参考と同じ)。
