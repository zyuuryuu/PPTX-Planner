# 検査の結果(工程7、ch4、1回目)
check: 工程7の重大な検査(裏付けのない文、限定の残存)
definition:
- docs/writing.md「検査」の節「検査セッションが判断するもの」の「裏付けのない文」「限定の残存」
- docs/checks.md「重大な検査」の工程7の2行(スライドの文に、裏付けのない文がない / スライドの文が、事実の限定を落としていない)
target:
  file: trial/deck/07-slides/ch4.yaml
  commit: e35873c
  slides: [ch4-s1, ch4-s3]   # ch4-s2 は承認済みの型の見本のため対象外
  upstream: trial/deck/work/ch4.md(F500、F506、ストーリーラインの source、立証の設計)
inspector: claude-opus-5-5
assumptions:
- '{F506} は台帳の value と unit で「56%」に置き換わるものとして読んだ。'
- ストーリーラインの source は見出しの下に描かれるため、そこにある限定は残っているとみなした(依頼の指示、作業票の D006 の説明)。見出しも画面に出るため、限定が見出しにある場合も残っているとみなした。
- 限定の残存は、スライドの単位で、事実の qualifiers が全て画面かノートに残るかを見る。文ごとの判定は、その文が限定を外して主張を事実より強く、広くしていないかを見る。
- 出典の原文は開いていない(照合は依頼されていない)。事実の quote と qualifiers を正とした。

summary:
  fail: 1
  undeterminable: 1
  pass: 40   # 文ごとの2条件の判定(20文×2)と、スライドごとの限定の判定(2件)を合わせた42件のうち

slides:
- id: ch4-s1
