    unsupported: 合格
    qualifiers: 合格
    remark: F506 の quote と metric に本物かどうかの記述はなく、章の主張 C4 も「無視したアラートが本物だったかは示されていない」とする。出典の全文は開いていない。
  - field: notes
    text: また、回答者の言う誤検知は原文の false positive で、この講義の誤検知の定義と同じとは限らない。
    unsupported: 合格
    qualifiers: 合格
    remark: quote の false-positive と、語彙の T 誤検知の定義(検知の条件そのものが誤っていて、無害な活動に反応したアラート。想定内の検知を含めない)による。
  - field: notes
    text: 前のスライドまでの事案と合わせ、誤検知に慣れると、本物の攻撃のアラートを見過ごしうる。
    unsupported: 合格
    qualifiers: 合格
    remark: >-
      F500(本物の攻撃のアラートに対応がなかった)、F501(頻繁な警報なら誤検知とみなした可能性。推定)、F506(過去の誤検知を理由に無視。本物かは不明)を合わせた、可能性の主張。
      どの事実も単独では「慣れ」から「本物の見過ごし」への因果を確かめていないため、「うる」を外すと不合格になる。章の主張 C4 と同じ文。
  - field: notes
    text: だから、閉じてよいのは根拠をもって誤検知か想定内の検知と言えるものだけになる。
    unsupported: 判定できない
    qualifiers: 合格
    quote_slide: だから、閉じてよいのは根拠をもって誤検知か想定内の検知と言えるものだけになる。
    reason: >-
      事実の主張ではなく、講義の決まり(何を閉じてよいか)を前の文から導く規範の文である。
      このスライドが使う事実 F506 は、この決まりを裏付けない(無視が起きうることは示すが、閉じる範囲をどう限るかは示さない)。
      作業票の章の message は、これを「根拠をもって言えるものだけを閉じる理由として示す」としており、章の設計としては予定された文である。
      一方、前の章の見出しでは、閉じる線は「案として」(ch3-s5)と「このSOCでは」(ch3-s6)と区別されており、この文は「だから〜になる」と事実からの帰結として言い切っている。
      規範の文が「裏付けのない文」の検査の対象か、対象なら何を裏付けとするか(章の主張か、ch3 の案と運用か)が検査の定義にないため、判定できない。
    suggestion: 事実からの帰結でなく講義の決まりであることが分かる言い方にする(例「この講義が、閉じてよいものを、根拠をもって誤検知か想定内の検知と言えるものに限るのは、このためである」)。対象かどうかは設計セッションが決める。
