    unsupported: 合格
    qualifiers: 合格
  - field: notes
    text: 強調したいのは、半数を超える回答者がそう答えた点である。
    unsupported: 合格
    qualifiers: 合格
  - field: notes
    text: ただし、調査はベンダーが自社の製品の宣伝を含めて公表したもので、回答者はSOCの解析者に限らず、回答は自己申告である。
    unsupported: 合格
    qualifiers: 合格
  - field: notes
