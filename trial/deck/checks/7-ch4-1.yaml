    - qualifier: 調査会社がセキュリティ製品のベンダーであり、製品の宣伝を含む資料(一次情報として扱わない)
      where: 見出し「ベンダーの調査」、body.caveat「ベンダー(Imperva)の調査で、製品の宣伝を含む」、notes の3文目
    - qualifier: RSA Conference 2018で、IT専門職179人を対象に実施。SOC分析者に限らない
      where: 出典の行「2018年、RSA Conference の参加者のIT専門職179人」、body.caveat「回答者はSOCの解析者に限らず」
    - qualifier: 誤検知は出典の言い方(立証の設計の show)
      where: 出典の行「原文の false positive」、notes の5文目
  sentences:
  - field: takeaway
    text: 過去の誤検知の経験が、次のアラートを無視する理由になりうる
    unsupported: 合格
    qualifiers: 合格
    remark: F506 の quote(ignored an alert based on past false-positive experiences、tempting to disregard future alerts)の範囲。「なりうる」に留めている。
  - field: body.text
    text: 回答者の{F506}(描画では「回答者の56%」)
    unsupported: 合格
    qualifiers: 合格
  - field: body.caveat
    text: ベンダー(Imperva)の調査で、製品の宣伝を含む。
    unsupported: 合格
    qualifiers: 合格
    remark: 限定は「製品の宣伝を含む資料」で、宣伝を含むのは公表した資料。この文は「調査が宣伝を含む」とも読める。限定より強くはならないため合格とするが、notes の3文目(宣伝を含めて公表したもの)の言い方のほうが限定に近い。
  - field: body.caveat
    text: 回答者はSOCの解析者に限らず、回答は自己申告
    unsupported: 合格
    qualifiers: 合格
  - field: notes
