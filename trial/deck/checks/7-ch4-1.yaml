  qualifiers_coverage:   # スライド単位の限定の残存
    verdict: 合格
    items:
    - qualifier: Bloomberg Businessweekの報道を引用した記述
      where: 出典の行「報道(Bloomberg Businessweek)を引いた記述」、notes の1文目
    - qualifier: 報告自身は新たな技術的事実を示していない公開情報ベースのスタッフ報告
      where: body.caveat「報告は公開情報にもとづき、新たな技術的事実は示していない」
    - qualifier: 2013年の1事案
      where: 見出し「2013年のTargetの侵害では」
  sentences:
  - field: takeaway
    text: 検知の仕組みが攻撃を捉えていても、アラートを扱う人の側で見過ごしは起こりうる
    unsupported: 合格
    qualifiers: 合格
    remark: 1事案からの一般化だが「起こりうる」(可能性)に留めており、1件の発生で裏付けられる範囲にある。
  - field: body.text
    text: 侵入を検知する製品は、データを持ち出すためのマルウェアが導入されるたびに緊急のアラートを出したが、Targetのセキュリティチームは対応しなかった
    unsupported: 合格
    qualifiers: 合格
    remark: F500 の quote(triggered urgent alerts with each installation of the data exfiltration malware ... neither reacted to the alarms)と合う。報道を引いた記述であることは出典の行にある。
  - field: body.caveat
    text: 報告は公開情報にもとづき、新たな技術的事実は示していない
    unsupported: 合格
    qualifiers: 合格
  - field: notes
    text: 報告は報道(Bloomberg Businessweek)を引いてこの経過を述べている。
    unsupported: 合格
    qualifiers: 合格
  - field: notes
    text: 強調したいのは、検知の製品はアラートを出していた、という点である。
    unsupported: 合格
    qualifiers: 合格
  - field: notes
    text: 見落としたのは検知の仕組みではなく、アラートを受けた側だった。
    unsupported: 不合格
    qualifiers: 合格
    quote_slide: 見落としたのは検知の仕組みではなく、アラートを受けた側だった。
    quote_fact: 'F500 quote: "However, Target’s security team neither reacted to the alarms nor allowed the FireEye software to automatically delete the malware in question."'
    reason: >-
      F500 が述べるのは、チームがアラートに「反応しなかった」(neither reacted)ことで、アラートに気づかなかった(見落とした)ことではない。
      気づいたうえで対応しなかった可能性は事実の範囲で否定されず、次のスライドの F501 はむしろ「誤検知とみなした可能性」(気づいたうえでの判断)を推定している。
      「見落とした」は事実より強い(または別の)主張である。また、この文は「報告によれば」を付けた5文目と並ぶため、話し手自身の断定として聞こえる。
    suggestion: 「見落とした」を、事実の語に合わせて「対応しなかったのは、検知の仕組みではなく、アラートを受けた側だった」とする。
  - field: notes
    text: 報告によれば、チームはマルウェアを自動で削除する機能も許可していなかった。
