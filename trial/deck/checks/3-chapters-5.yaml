検査の名前: 章の message が主張より強い・広いことを述べていない(重大な検査。D005 で短くした ch2 と ch3 の確認、1回)
対象: trial/deck/03-chapters.yaml(コミット 26ab9449)の ch2 message と ch3 message
判定者: Claude Sonnet 5.5(検査セッション)
上流: 02-claims.yaml(C1、C2、C3)、terms.yaml、decisions.md(D005)、docs/checks.md の否定の検査と具体性の検査。01-sources.yaml は F002、F003、F004、F207 の statement、source、qualifiers だけを開いた(stance は読んでいない)
件数: {合格: 3, 不合格: 2, 判定できない: 0}
項目:
  - 項目: 1. ch2 message が C1 より強い・広いことを述べていない
    判定: 不合格
    引用: 「アラートは本物の攻撃とは限らない。1つのSOCの実測では、侵害に至らなかった攻撃の試みと想定内の検知が多くを占めた」
    対比: C1「1つの実在のSOCのネットワークの検知(Zeek)のアラートの実測(2020年12月〜2022年7月)では、…侵害に至らなかった攻撃の試みが27%以上、想定内の検知が49%以上」
    理由: 数値を「多くを占めた」にしたこと自体は D005 で認めた範囲で、合わせて76%以上なので「多く」は C1 の数値と合う。1文目も C1 の冒頭と同じ。しかし、測定の対象(ネットワークの検知のアラート)まで外した結果、「アラート」一般について、そのSOCでは多くが攻撃の試みと想定内の検知だった、と読める。C1 の実測が言うのはネットワークの検知(Zeek)のアラートだけで、EDRなど他の検知は含まない。1つのSOCであることは残ったが、対象の広さは主張より広がった。D005 の例(「1つのSOC」は残す)は限定の1つを残したにすぎず、対象を外す許可は、外した結果の広さの検査を免れない
    直し方の案: 「1つのSOCのネットワーク検知の実測では、…」のように、対象を2〜4字で残す。章扉の1〜2行には収まる
  - 項目: 1. ch3 message が C2、C3 より強い・広いことを述べていない
    判定: 不合格
    引用: 「閉じる・調べる・上げるの線は公的な文書にない」
    対比: C3「閉じる、調査を続ける、上げるの具体的な線は、調べた公的な文書に書かれていなかった」
    理由: C3 は「調べた」文書に書かれていなかったと述べる。message は「調べた」を落とし、公的な文書一般にない、と言い切っている。調べていない公的な文書にあるかもしれないので、調べた範囲の話が全体の話に広がった。数値や条件を外すことは D005 で認めたが、これは条件ではなく、主張の根拠の範囲(調べた範囲)を外したもので、主張にない断定になっている
    直し方の案: 「調べた公的な文書に、閉じる・調べる・上げるの線はない」のように、「調べた」を残す
    備考: 「根拠があるものだけを閉じ」の「だけ」は、C3 の公開資料からの案(根拠をもって言えれば閉じ、迷うときは上げる)では「言えれば」だが、迷うときは上げるので、根拠がなければ閉じないと同じ内容になる。また「だけ」は依頼者が同意した運用(F002)と summary にもある。広がっていないと判断し、不合格にはしていない
  - 項目: 2. ch3 の「このSOCの運用」が、証言(1つのSOCの運用)であることと食い違わない
    判定: 合格
    引用: 「この講義は、…案と、このSOCの運用を示す」
    対比: F002、F003、F004 はいずれも kind が testimony で、source は依頼者(SOCのリーダー)が「自分のSOCの運用として」述べたもの。C3「依頼者のSOCの運用」
    理由: 「運用」は1つのSOCのものと分かる語で、案(公開資料の材料からの組み立て)とも分けて書かれている。「このSOC」は ch2 の「1つのSOC」(論文の実在のSOC)とは別で、講義を行うSOCを指す。D005 の説明と合う。F002 は設計セッションの案に依頼者が同意したもので、既存の運用ではない点は message から見えないが、D005 が受け入れた影響で、新人から見れば講義を行うSOCの運用であり、他のSOCに広げる書き方ではない
    備考: 同意した運用と、既に行われている運用の区別は、F002 の qualifiers と C3 に残り、message にはない。中のスライドで必要
  - 項目: 3. 否定の検査(ch2、ch3)
    判定: 合格
    理由: ch2 は「アラートは本物の攻撃である」「想定内の検知と攻撃の試みは少数だった」、ch3 は「線は公的な文書にある」「根拠があっても閉じず、迷っても上げない」が、いずれも主張として成り立ち、中身を述べている。ただし、否定の検査に通ることと、項目1の広さの問題は別である
  - 項目: 3. 具体性の検査(ch2、ch3)
    判定: 合格
    理由: どちらも主語と述語があり、対象(攻撃の試み、想定内の検知、公的な文書、3つの分け方)と条件(根拠があるもの、迷ったら)を含む。「多くを占めた」は数値ではないが、対象と条件があるので通る
