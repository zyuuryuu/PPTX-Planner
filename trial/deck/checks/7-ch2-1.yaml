- スライド: ch2-s7
  sources: [F204, F220]
  出典の行: Vectra AI の調査(2023年、解析者2,000人の回答)。「誤検知」の定義は示されていない
  事実ごとの限定:
    F204: >-
      「ベンダーの調査。宣伝目的を含むため一次情報として扱わない」は notes[3]、「解析者の自己申告(測定値ではない)」は body.attribution、
      「誤検知の定義は示されていない」は body.caveat と出典の行、「(この語に正当な検知を含めうる)」は takeaway と notes[6] に残る。
      「Sapio Research(Vectra委託)の2023年3〜4月の調査。対象は従業員1,000人超の組織の IT security analysts 2,000人(米英仏独伊など)」のうち、
      2023年と2,000人は出典の行に残るが、「従業員1,000人超の組織」(母集団の限定)と「Sapio Research への委託」はスライドのどこにも残っていない。
    F220: 「論文中の用語の定義」は text(分けて定義している)と notes[5] に残る。
  文:
  - 箇所: takeaway
    引用: 83%の「誤検知」には、想定内の検知が含まれている可能性がある
    裏付け: 合格
    限定: 不合格
    理由: >-
      裏付け: F204 の qualifiers「誤検知の定義は示されていない(F205・F207 は、この語に正当な検知を含めうることを示す)」。「可能性がある」と弱めている。
      限定: 83% の母集団「従業員1,000人超の組織の解析者」がスライドに残っていない(上の F204 の欄)。大きな組織の解析者に限った回答であることが落ち、
      新人が自分のSOCの値として受け取りうる。
    直し方の案: 出典の行を「Vectra AI の調査(2023年、Sapio Research に委託。従業員1,000人超の組織の解析者2,000人の回答)」とする。
  - 箇所: body.text(quote_of F204)
    引用: 受けるアラートの{F204}は、誤検知で、時間をかける価値がない
    裏付け: 合格
    限定: 不合格
    理由: >-
      裏付け: F204 の quote「they say 83% of these alerts are false positives and not worth their time」の訳。
      限定: takeaway と同じ。母集団(従業員1,000人超の組織)が残っていない。この値を示す文の中心はこの引用である。
  - 箇所: body.attribution
    引用: 解析者の回答。原文(英語)の日本語訳。測った値ではなく、自己申告である
    裏付け: 合格
    限定: 合格
    理由: F204 の qualifiers「解析者の自己申告(測定値ではない)」。
  - 箇所: body.caveat
    引用: 「誤検知」の定義は示されていない
    裏付け: 合格
    限定: 合格
    理由: F204 の qualifiers。
  - 箇所: text
    引用: 別の論文は、誤検知と、正しく反応した想定内の検知を、分けて定義している
    裏付け: 合格
    限定: 合格
    理由: >-
      F220。補足(判定は変えない): 論文が定義したのは benign trigger で、誤検知は「一般的な用法(usually refer to)」として示し、それと異なると述べている。
      「分けて定義している」は大筋で合うが、notes[5] と同じ傾き(論文が誤検知も定義したように読める)がある。
  - 箇所: notes[1]
    引用: 「アラートの8割は誤検知」という話を聞いたことがあるかもしれない
    裏付け: 合格
    限定: 対象外
    理由: 聞き手への問いかけで、事実の主張を含まない(「かもしれない」)。
  - 箇所: notes[2]
    引用: 調べた範囲で8割に近い値は、このベンダーの調査で解析者が答えた{F204}だけだった
    裏付け: 判定できない
    限定: 不合格
    理由: >-
      裏付け: 「調べた範囲で…だけだった」は、素材台帳と探索の全体についての主張で、作業票の事実だけでは確かめられない(依頼により素材台帳は読んでいない)。
      作業票の中にも、確かめを要する材料がある: F214 の出典の題は「99% False Positives: A Qualitative Study of SOC Analysts' Perspectives on Security Alarms」で、
      誤検知の割合を述べる値(99%)が素材の中にある。99% を「8割に近い値」に入れないのか、題の値は値として扱わないのかを、素材台帳の全体で確かめる必要がある。
      限定: 値 {F204} を述べる文で、母集団(従業員1,000人超の組織)が残っていない(takeaway と同じ指摘)。
  - 箇所: notes[3]
    引用: ベンダーの調査で、宣伝の目的を含むため、一次情報としては扱わない
    裏付け: 合格
    限定: 合格
    理由: F204 の qualifiers。
  - 箇所: notes[4]
    引用: 強調したのは、この調査が「誤検知」の定義を示していない点
    裏付け: 合格
    限定: 合格
    理由: F204 の qualifiers。
  - 箇所: notes[5]
    引用: Yangらの論文は、誤検知を、悪いルール、エラー、誤った設定などで、無害な挙動に誤って反応したアラートとし、想定内の検知を、組織の環境で業務上正当で許容される挙動によって説明される、正しく反応したアラートとして、両者を分ける
    裏付け: 不合格
    限定: 合格
    理由: >-
      F220 の quote は「This definition is different from the generic "false positives" which usually refer to alerts that are incorrectly fired on benign behaviors」で、
      誤検知の説明は、論文が一般に使われる意味(generic、usually refer to)として紹介したもので、論文自身の定義ではない(F220 の statement も「一般的な『誤検知』」)。
      この文は「Yangらの論文は、誤検知を…とし」と、論文が誤検知を定義したように述べ、「一般的な」「通常は」を落としている。
      想定内の検知(benign trigger)の部分は F220 の定義と合う。
    直し方の案: 「Yangらの論文は、想定内の検知を、…正しく反応したアラートと定義し、一般に言う誤検知(悪いルール、エラー、誤った設定などで、無害な挙動に誤って反応したアラート)とは違うと述べる」。
  - 箇所: notes[6]
    引用: 調査の回答者の言う「誤検知」に想定内の検知が入っていても、区別できない
    裏付け: 合格
    限定: 合格
    理由: F204 の qualifiers(定義が示されていない。この語に正当な検知を含めうる)。
  - 箇所: notes[7]
    引用: 実測の内訳は ch2-s6 で示した
    裏付け: 合格
    限定: 対象外
    理由: 参照の文。
  - 箇所: notes[8]
    引用: 次の ch2-s8 では、誤検知がなぜ起きるのかを見る
    裏付け: 合格
    限定: 対象外
    理由: 遷移の文。

# ======================================================================
- スライド: ch2-s9
  sources: [F215, F221]
  出典の行: Yangら(USENIX Security 2024)。1つのSOCのネットワークの検知(Zeek)の2020年12月〜2022年7月のアラート約1,443万件を著者らが分類
  事実ごとの限定:
    F215: 「1つのSOC」は出典の行と notes[1]、「最初の一般的な原因」は notes[3] に残る。
    F221: >-
      「1つのSOC」は出典の行と notes[1]、「既知のベンダーIPで識別」は items[1].sub[0] と notes[4] に残る。
      「92%はLog4j関連(2022年前半)」は、スライドのどこにも残っていない。
  文:
  - 箇所: takeaway
    引用: 攻撃と似た振る舞いでも、業務で説明できれば想定内の検知になる
    裏付け: 合格
    限定: 合格
    理由: >-
      F215(悪性のスキャンと似た振る舞いをするが、無視してよい良性のトリガー)と、語彙表 T-expected-detection の definition。
      補足(判定は変えない): 定義の条件は「検知の条件どおりに正しく反応した」と「業務上は問題のない活動」の2つで、この文は前者を書いていない。
      ルールが誤って無害な業務の活動に反応した場合は誤検知(T-false-positive)で、「業務で説明できれば」だけでは両者が分かれない。同じスライドの題と text が前者を補っている。
  - 箇所: body.title
    引用: どちらも業務上正当な活動で、ルールは正しく反応した
    裏付け: 合格
    限定: 合格
    理由: >-
      F215(良性のトリガーの原因)、F221(metric が「外部ペンテストに起因する良性のトリガーの件数」、locator が §6.4 Understanding Benign Triggers)と、
      良性のトリガーの定義(語彙表 T-expected-detection: 正しく反応した)。
  - 箇所: body.items[0].text
    引用: 定期的な社内のスキャン(脆弱性と設定の不備の確認)
    裏付け: 合格
    限定: 合格
    理由: F215「scheduled internal scanning to proactively check for vulnerabilities and misconfigurations」。
  - 箇所: body.items[0].sub[0]
    引用: 悪意のあるスキャンと似た振る舞いをするが、アラートは無視してよかった
    裏付け: 合格
    限定: 合格
    理由: F215「similar behavior patterns as malicious scans, but the alerts can be safely ignored」。
  - 箇所: body.items[0].sub[1]
    引用: このSOCで、想定内の検知の共通の原因の1つ
    裏付け: 合格
    限定: 合格
    理由: F215。「1つのSOC」を「このSOC」で残している。
  - 箇所: body.items[1].text
    引用: 外部のセキュリティベンダーによる診断(ペネトレーションテストと年次の監査)
    裏付け: 合格
    限定: 合格
    理由: F221「third-party (external) security vendors to perform penetration tests and the annual compliance auditing」。
  - 箇所: body.items[1].sub[0]
    引用: 既知のベンダーのIPアドレスで、対応するアラートを見分けた
    裏付け: 合格
    限定: 合格
    理由: F221「identified based on known vendor IPs」。
  - 箇所: text
    引用: 想定内の検知は、ルールどおりに正しく反応したが、業務上は問題のない活動によるアラートである
    裏付け: 合格
    限定: 対象外
    理由: 語の定義の文。語彙表 T-expected-detection の definition と一致する。
  - 箇所: notes[1]
    引用: 2つとも1つのSOCの実測の例
    裏付け: 合格
    限定: 合格
    理由: F215、F221 の qualifiers「1つのSOC」。
  - 箇所: notes[2]
    引用: どちらもルールは正しく反応しており、ルールの誤りによる誤検知とは違う
    裏付け: 合格
    限定: 合格
    理由: body.title と同じ根拠と、語彙表 T-false-positive、T-expected-detection の not。
  - 箇所: notes[3]
    引用: 社内のスキャンは、論文が想定内の検知の最初の共通の原因として挙げたもの
    裏付け: 合格
    限定: 合格
    理由: F215「The first common cause of benign triggers」。
  - 箇所: notes[4]
    引用: 外部の診断に対応するアラートは、既知のベンダーのIPアドレスで見分けて約{F221}あった
    裏付け: 合格
    限定: 不合格
    理由: >-
      裏付け: F221「The corresponding alerts are identified based on known vendor IPs (2.7 million alerts)」。
      限定: F221 の qualifiers「92%はLog4j関連(2022年前半)」が、この文にもスライドのほかの箇所にも出典の行にも残っていない。
      件数の大半が2022年前半の1つの出来事(Log4j)に関わるもので、「外部の診断がふだんから約270万件のアラートを起こす」と受け取られうる。
    直し方の案: 「…約{F221}あった。うち92%は2022年前半のLog4jに関わるものだった」を足す。
  - 箇所: notes[5]
    引用: 論文の語は benign trigger
    裏付け: 合格
    限定: 対象外
    理由: F215 の quote「benign triggers」。
  - 箇所: notes[6]
    引用: このSOCで新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけで、ch3-s6 で扱う
    裏付け: 不合格
    限定: 対象外
    理由: >-
      同じスライドで「このSOC」は Yang らが実測した1つのSOCを指している(body.items[0].sub[1]「このSOCで、想定内の検知の共通の原因の1つ」、notes[1] の「1つのSOC」)。
      この文の「このSOC」も同じSOCと読め、その読みでは「論文のSOCで、新人はリーダーの一覧にある活動だけを閉じてよい」となり、F215、F221 に裏付けがない。
      講義を行うSOC(書き手のSOC)を指すのであれば、語彙表 T-list の definition(新人が想定内の検知として閉じてよいのは、これに当てはまるものだけ)が裏付けになる。
      指す先が文から決まらないため、不合格とした。
    直し方の案: 「私たちのSOCでは、新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけで、ch3-s6 で扱う」のように、論文のSOCと書き分ける。
