工程: 7 スライドの中身(docs/writing.md「検査」の「裏付けのない文」「限定の残存」、docs/checks.md「重大な検査」の工程7の2行)
回: 1
対象:
  成果物: trial/deck/07-slides/ch2.yaml の ch2-s2、ch2-s4、ch2-s7、ch2-s9(ほかの5枚は型の見本で対象外)
  コミット: 50471d5(検査時のブランチの先頭は 4e2085a。対象の4枚は 50471d5 から変わっていない)
  上流: trial/deck/work/ch2.md(ストーリーラインと立証の設計、使う事実の全文、仕組みの定義の該当部分、語彙)
判定者: 検査セッション(モデルの識別子は記載しない。依頼元への連絡に記す)
手順の記録: >-
  作業票だけを読み、ほかの成果物(素材台帳の全体、ストーリーラインの全体、出典)は読んでいない。
  headline を除く takeaway、body の文(題、項目、ラベル、注記、引用、帰属、caveat)、text、notes の文を1つずつ、
  (1) 裏付け: そのスライドの sources の事実(作業票の statement、quote、qualifiers)、語の定義の文は作業票の語彙表の definition と model_labels、図のラベルは作業票の仕組みの定義、で裏付けられるか、
  (2) 限定: その文が使う事実の qualifiers が、文、同じスライドのほかの文、またはストーリーラインの source(出典の行)に残っているか、
  を判定した。{F…} は台帳の値に置き換わるものとして読んだ(値の照合はしていない)。
  「2006年版」「確認日」「撤回の表示なし」など出典の版と検証の記録である qualifiers は、出典の行に版の年があれば残っているとみなした。
  事実を使わない文(遷移の文、スライドの見どころを示すだけの文)は、裏付けは「事実の主張を含まない」で合格、限定は対象外とした。

