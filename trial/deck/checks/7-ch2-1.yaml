- スライド: ch2-s4
  sources: [F111, F108, F110, F107]
  出典の行: NIST SP 800-92(2006年)。「しばしば」「通常は」の記述
  事実ごとの限定:
    F111: 「2006年版」は出典の行。「しばしば(often)」は body の sub「参照されることが多い」と notes[2]「よく参照される」に残る。
    F108: >-
      「2006年版」は出典の行。「通常は(typically)」は sub と出典の行。「ディレクトリサーバとシングルサインオンサーバを含む」は items[1].text に残る。
    F110: 「such as(例示)」「管理者が指定できる(OSによる)」は notes[3]、notes[4] に残る。「2006年版」は出典の行。
    F107: >-
      「記録する主体はウイルス対策ソフト」「通常は」は notes[6] に残る。「2006年版」は出典の行。
      ただし notes[6] は、ウイルス対策ソフトが何の最も一般的な形かを落としている(裏付けの不合格として下に記す)。
  文:
  - 箇所: takeaway
    引用: アラートを確かめる材料は、アラートの外のログにある
    裏付け: 合格
    限定: 合格
    理由: >-
      F111「After suspicious activity is identified by security software, OS logs are often consulted to get more information」。
      「often」は文に無いが、出典の行「しばしば」に残る(依頼の取り決めにより残っているとみなす)。
  - 箇所: body.title
    引用: アラートを確かめるときに見る2つのログ
    裏付け: 不合格
    限定: 合格
    理由: >-
      OSのログについては F111 が裏付ける。認証のログについては、F108 は「認証サーバのログは、試行ごとに接続元、ユーザー名、成否、日時を記録する」と
      記録の内容だけを述べ、アラートを確かめるときに見る、とは述べていない。sources のほかの事実(F110、F107)にもない。
      立証の設計の show(2つのログと、そこから分かること)も、確かめるときに見る先とまでは書いていない。
    直し方の案: 「アラートの詳細を確かめる先のOSのログと、認証のログ」のように認証のログを「確かめるときに見る」から外す。または、認証のログを確かめに使うことを述べた事実を足す。
  - 箇所: body.items[0].text
    引用: OSのログ
    裏付け: 合格
    限定: 合格
    理由: 項目の名前。F111。
  - 箇所: body.items[0].sub[0]
    引用: 特定のホストの不審な活動の特定と調査に最も役立つ
    裏付け: 合格
    限定: 合格
    理由: F111「most beneficial for identifying or investigating suspicious activity involving a particular host」。
  - 箇所: body.items[0].sub[1]
    引用: セキュリティソフトが不審な活動を見つけた後に、詳細を得るために参照されることが多い
    裏付け: 合格
    限定: 合格
    理由: F111。「often」を「多い」で残している。
  - 箇所: body.items[1].text
    引用: 認証のログ(ディレクトリサーバとシングルサインオンサーバを含む)
    裏付け: 合格
    限定: 合格
    理由: >-
      F108 の限定を括弧で残している。
      補足(判定は変えない): F108 の主体は「認証サーバ(authentication servers)のログ」で、「認証のログ」はOSの監査記録の認証(F110)も含むように読める。
      括弧が「サーバ」を示すため合格としたが、「認証サーバのログ」と書くと主体の幅が出典と合う。
  - 箇所: body.items[1].sub[0]
    引用: 認証の試行ごとに、接続元、ユーザー名、成否、日時を通常は記録する
    裏付け: 合格
    限定: 合格
    理由: F108。「typically」を「通常は」で残している。
  - 箇所: text
    引用: ログは、イベントを書き残したものである
    裏付け: 合格
    限定: 対象外
    理由: 語の定義の文。語彙表 T-log の definition と一致する。
  - 箇所: notes[1]
    引用: 強調したのはOSのログ
    裏付け: 合格
    限定: 対象外
    理由: 事実の主張を含まない。
  - 箇所: notes[2]
    引用: セキュリティソフトが不審な活動を見つけた後に、詳細を得るためによく参照される
    裏付け: 合格
    限定: 合格
    理由: F111。「often」を「よく」で残している。
  - 箇所: notes[3]
    引用: OSの監査記録には、認証の成功と失敗、ファイルへのアクセス、セキュリティポリシーの変更、アカウントの変更、権限の使用などが含まれる
    裏付け: 合格
    限定: 合格
    理由: F110。「such as」を「など」で残している。
  - 箇所: notes[4]
    引用: これは例示で、記録する事象の種類は、OSによっては管理者が指定できる
    裏付け: 合格
    限定: 合格
    理由: F110 の qualifiers。
  - 箇所: notes[5]
    引用: 認証のログからは、だれが、どこから、いつ認証を試み、成功したかが分かる
    裏付け: 合格
    限定: 合格
    理由: >-
      F108(username、origin、date and time、success or failure)。
      この文は「通常は」を落として「分かる」と言い切るが、同じスライドの sub と出典の行に「通常は」が残るため合格とした。
      口頭で読むときに限定が落ちやすい文である(ノートは読み上げの台本)。
  - 箇所: notes[6]
    引用: セキュリティソフトの側にもログがあり、最も一般的な形のウイルス対策ソフトは、通常、検出したマルウェア、駆除の試み、隔離を記録する
    裏付け: 不合格
    限定: 合格
    理由: >-
      F107 は「The most common form of antimalware software is antivirus software」で、ウイルス対策ソフトは「マルウェア対策ソフトの」最も一般的な形である。
      この文は直前に「セキュリティソフト」を置き、何の最も一般的な形かを書かないため、「セキュリティソフトの最も一般的な形がウイルス対策ソフト」と読める。
      その主張は事実にない(F107 の qualifiers も「マルウェア対策ソフト全般ではなく、その最も一般的な形」と比べる対象をマルウェア対策ソフトに限っている)。
    直し方の案: 「マルウェア対策ソフトの最も一般的な形であるウイルス対策ソフトは、通常、…を記録する」。
  - 箇所: notes[7]
    引用: 出典の文書は、どちらも「しばしば」「通常は」と書いている
    裏付け: 不合格
    限定: 合格
    理由: >-
      使う事実は全て同じ1つの文書(NIST SP 800-92)で、「どちら」に当たる2つの文書はない。
      また、OSのログの記述(F111)は「often」だけ、認証サーバの記述(F108)は「typically」だけで、どちらの記述も両方の語を使ってはいない。
      「2つの記述がそれぞれ限定の語を持つ」という趣旨は事実と合うが、文のとおりの主張は裏付けられない。
    直し方の案: 「出典の文書は、OSのログについて「しばしば」、認証サーバのログについて「通常は」と書いている」。
  - 箇所: notes[8]
    引用: 次の ch2-s5 では、アラートの活動を攻撃の手口の分類に当てはめる
    裏付け: 合格
    限定: 対象外
    理由: 遷移の文。

