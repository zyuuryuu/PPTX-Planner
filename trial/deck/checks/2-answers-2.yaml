  3: "親と根の答えが、子の答えと assumes から導け、子にない内容を足さず、子の限定を落とさない"
  4: "語彙表の区別(誤検知=検知の条件の誤り、想定内の検知=条件どおりだが業務上問題のない活動)に沿う"
集計:
  末端(16件): "全条件合格 5(Q1.1.3、Q2.1、Q3.1.2、Q4.2、Q4.3)、不合格 11"
  不合格の末端: [Q1.1.1, Q1.1.2, Q1.1.4, Q1.2, Q1.3, Q2.2, Q3.1.1, Q3.2, Q3.3.1, Q3.3.3, Q4.1]
  親と根(8件): "合格 3(Q1、Q1.1、Q3.3)、不合格 5"
  不合格の親と根: [Q2, Q3.1, Q3, Q4, Q0]
  数値: "全ての数値(13,764、4,484、45%、83%、0.01%、27%、49%、56%、39%、33%、12〜20分)が事実の値と一致した"
  判定できない: 0
