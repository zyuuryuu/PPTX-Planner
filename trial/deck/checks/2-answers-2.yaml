  # ===== 親と根 =====
  - question: Q1.1
    判定: 合格
    条件3: 合格
    条件4: 合格
    備考:
      - "『実際の攻撃に関連するのはごく一部』は1つのSOCの実測(0.01%)による。この範囲は assumes に書かれている"
      - "『多くは誤検知か想定内の検知』は、子の答えでは想定内の検知49%以上(下限)と、ベンダーの83%(定義なし)による。誤検知の割合は子の答えにない。『割合は出典の定義で大きく割れる』の限定が付いているので合格とした"
      - "『1日数千件以上』は、子の答えの『45%が1日5,000件未満』と合わせて読むと、やや強い言い方"

  - question: Q1
    判定: 合格
    条件3: 合格
    条件4: 合格
    備考: "『新人は...知る必要がある』は、問いの形が要求するものであり、子の答えにない判断を足している。assumes は空。不合格にはしないが、問いの木の問いに答える形として許容した"

  - question: Q2
    判定: 不合格
    条件3: 不合格
