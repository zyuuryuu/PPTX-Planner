        理由: "『組織が決める』は子の答えにない。標準が『定めていない』ことと、組織に委ねていることは別である。Q3.1 に assumes がなく、D001 の記述(Q0 の assumes にだけある)で補っている"
      - 箇所: "閉じるときは、誤検知(検知の条件の誤り)か想定内の検知(業務上正当な活動)かを根拠とともに区別し"
        根拠: "子 Q3.1.1(上記の指摘:製品によって分類が違う)"
        理由: "子の答えを、一般の手順のように書いている。子の答え自体の限定の落ち(Q3.1.1)を引き継ぐ"

