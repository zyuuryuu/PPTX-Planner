    指摘:
      - 箇所: "1件の中では、まず兆候が正当か(誤検知や想定内の検知でないか)を確かめ、相関する情報を探し、その後に影響と緊急度を見積もる。ただし、この順序は常に守るものではない"
        根拠: "子 Q2.2『民間のSOC向けの解説は、優先順位付けを真偽の判定より前の段階に置く』"
        理由: "子の答えには、NISTの順序(正当性の確認が先)と、民間の解説の順序(優先順位付けが先)の食い違いがある。親は NIST の順序だけを採り、食い違いを書いていない。この選択を導く前提が assumes にもない(assumes は NIST がアラートの一次解析にも当てはまること)"
      - 箇所: "複数のアラートの間では、届いた順ではなく、影響の大きさと緊急度で調べる順を決める"
        根拠: "子 Q2.1『機能への影響、情報への影響、復旧のしやすさなどの要因』『資産の重要度や攻撃の段階など』"
        理由: "子の答えの要因は、影響のほかに資産の重要度、攻撃の段階、復旧のしやすさなど。『影響の大きさと緊急度』に絞っており、子の答えより狭い。『緊急度』は Q2.1 にない(Q2.2 で見積もるもの)。『決める』と言い切っており、『とされる』の出典の性格(NIST、民間の解説)も落ちている"

