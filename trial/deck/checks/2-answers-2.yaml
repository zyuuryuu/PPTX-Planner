答え:
  # ===== 末端 =====
  - question: Q1.1.1
    判定: 不合格
    条件1: 不合格
    条件2: 不合格
    条件4: 合格
    指摘:
      - 箇所: "EDRは、...既知のパターンとの一致や、全端末の過去のデータと比べた違いを根拠に悪意のある活動を識別する"
        根拠: "F617 の qualifiers『要件(must)であり製品の実際の動作の記述ではない』『組織が自組織に合わせて直して使う例示のひな形』。F617 の quote は 'EDR solution must compare new dataset patterns to the previous ones, in order to identify previously unknown or known malicious activities'。答えは、要件を満たすべきEDRの動作として言い切っている"
        理由: "標準のひな形の要件を、EDRの実際の動作として書いている。また『既知のパターンとの一致』は F617 にない(F617 は、新旧のデータを比べて未知と既知の悪意のある活動を識別する、と求める)。『全端末の過去のデータと比べた違い』は、F617 の 3-3(全端末のデータの集約からパターンを識別)と 3-4(新しいデータを過去のものと比べる)を混ぜている"
      - 箇所: "SIEMは、...記録値を照合するルールで相関させ"
        根拠: "F101 quote 'The most common form of event correlation is rule-based correlation'。F101 qualifiers『同じ節に Event correlation can also be performed in other ways, such as using statistical methods or visualization tools. とあり、ルール以外の相関もある』『2006年版』"
        理由: "『最も一般的な形』を、唯一の方法のように書いている。2006年版であることも落ちている"
    直し方の提案: "SIEMは『最も一般的な形はルールによる照合』と書く。EDRは、出典を MDE の公式文書(F618、振る舞いのテレメトリの継続収集)に絞るか、F617 を『標準のひな形が求める機能』と明記する。『既知のパターンとの一致』は F617 の語に合わせる"

  - question: Q1.1.2
    判定: 不合格(軽微)
    条件1: 不合格
    条件2: 合格
    条件4: 合格
    指摘:
      - 箇所: "ベンダーの業界調査では1日平均4,484件"
        根拠: "F203 qualifiers『対象は従業員1,000人超の組織のIT security analysts 2,000人』『自己申告の平均』"
        理由: "対象(従業員1,000人超の組織)が落ちている。自己申告であることも『平均』のみで、答えからは読み取れない。数値4,484は一致している"
    備考: "F201(第2期、自動遮断後)、F202(n=20、自己申告)の限定は答えに残っている"

  - question: Q1.1.3
    判定: 合格
    条件1: 合格
    条件2: 合格
    条件4: 合格
    備考:
      - "F204 の『誤検知の定義は示されていない』は、冒頭の『出典の定義と数え方で大きく割れている』で足りるとみた。ただし、ベンダーの83%に想定内の検知が含まれうることは答えに書かれていない"
      - "『学術の調査は、誤検知と想定内の検知を分けて定義している』は F220(Yangらの論文内の定義)1件に基づく。複数の調査のように読める"
      - "F207 の『分類不能が23.72%残る』は書かれていない(27%と49%が『以上』と書かれているため、限定は残っている)"
      - "evidence の F219、F001 は答えの中で使われていない(F001 の8割は答えにない)。誤りではないが、evidence と答えが対応していない"

  - question: Q1.1.4
    判定: 不合格
    条件1: 不合格
    条件2: 合格
    条件4: 不合格
    指摘:
      - 箇所: "誤検知のよくある原因は、弱いシグネチャや緩く書かれたルール、正当なネットワーク管理ツールの通信、学習期間に観測されなかった保守作業などによる平常からの逸脱である"
        根拠: "F208 qualifiers『NIDS(ネットワーク型IDS)について』『2003年の文書』。F210 qualifiers『異常検知型の検知方式について』。F214 qualifiers『インタビュー参加者の一部(Some analysts)の認識(定性)』。F208 quote 'They can also be caused by normal network monitoring and maintenance traffic'"
        理由: "適用範囲(NIDS、異常検知型)、年代、『一部の分析者の認識』が落ちている。『よくある』は出典にない(F208 は 'can also be caused')。さらに、シグネチャが緩いことは『平常からの逸脱』ではないのに、全てを『平常からの逸脱』でまとめている"
      - 箇所: "誤検知のよくある原因は、...正当なネットワーク管理ツールの通信、学習期間に観測されなかった保守作業"
        根拠: "terms.yaml T-false-positive『検知の条件そのものが誤っていて、無害な活動に反応したアラート』、note『想定内の検知を含めない』。F208 の誤検知の定義は 'an alert caused by normal non-malicious background traffic'(NISTの定義は語彙表より広い)"
        理由: "管理ツールの通信や保守作業による警告は、検知の条件どおりに反応した無害な活動とも読める。語彙表では想定内の検知に近い。NISTの広い定義の例を、語彙表の『誤検知』の原因として並べており、区別に沿っていない"
    直し方の提案: "NIST の例は『NISTの定義する誤検知(通常の無害な通信による警告)の原因』と範囲を示し、語彙表の誤検知(条件の誤り)と想定内の検知(管理ツールや保守作業)に振り分け直す。『よくある』は出典の語に合わせて落とす"

  - question: Q1.2
    判定: 不合格
    条件1: 不合格
    条件2: 合格
    条件4: 合格
    指摘:
      - 箇所: "OSの監査記録からは認証の成否、ファイルアクセス、ポリシーとアカウントの変更、権限の使用が...分かる"
        根拠: "F110 qualifiers『原文は such as(例示であり、全てではない)』『記録する事象の種類は管理者が指定できる』"
        理由: "例示を全体のように書いている"
      - 箇所: "認証サーバのログからは接続元、ユーザー名、成否、日時が...ウイルス対策ソフトのログからは検出、駆除、隔離が分かる"
        根拠: "F108 qualifiers『通常は(typically)の記述』。F107 qualifiers『通常は(typically)』『駆除の試み(disinfection attempts)』。F107 quote 'file and system disinfection attempts'"
        理由: "『通常は』が落ちている。『駆除』は『駆除の試み』である。ログの記録は設定によって変わるという限定も落ちている"
      - 箇所: "複数のログ源の時刻は、そろえる必要があることが多い"
        根拠: "F113 qualifiers『複数の時間帯にシステムを持つ組織の場合』『時計のずれの補正には might be necessary』『脚注の記述』"
        理由: "『複数の時間帯にシステムを持つ組織』という条件が落ち、全ての組織について『多い』と読める。時計のずれは『必要になりうる』にとどまる"
      - 箇所: "答え全体"
        根拠: "F106〜F113 の as_of は全て 2006-09(F113 の脚注の記述)"
        理由: "2006年版の記述であることが、答えのどこにもない"

  - question: Q1.3
    判定: 不合格
    条件1: 不合格
    条件2: 合格
    条件4: 合格
    指摘:
      - 箇所: "各技術には、その使用を見つけるためのデータや検知の方針の項目がある"
        根拠: "F120 qualifiers『2020年3月改訂版の文書の記述。現行版の技術ページの構成は未確認』『Detection may not always be possible for a given (sub-)technique and should be documented as such』(技術によっては検知が可能とは限らない)"
        理由: "2020年版の記述を、現行(ATT&CK v20.1。F114 の取得時点)の事実のように書いている。『技術によっては検知が可能とは限らない』も落ちている"
    備考: "F119『ATT&CK can help』と F124『共通言語を与える』は、答えの『作るときや』『共通の言葉として使われる』と合う"

  - question: Q2.1
    判定: 合格
    条件1: 合格
    条件2: 合格
    条件4: 合格
    備考:
      - "F300、F301、F319、F320 は SP 800-61 Rev.2(2025-04-03 撤回)だが、F305(Rev.3)が同じ趣旨(到着順にしない、機能への影響、データへの影響、回復可能性を要因の例に挙げる)を支える。そのため合格とした"
      - "民間の解説(F321、F306)は『民間のSOC向けの解説』と書かれ、出典の性格が残っている"

  - question: Q2.2
    判定: 不合格(軽微)
    条件1: 不合格
    条件2: 合格
    条件4: 合格
    指摘:
      - 箇所: "手順書では兆候の分析と相関情報の探索を優先順位付けより前に置く。ただしNIST自身、この順序は常に守るものではなく、種類によって変わるとする"
        根拠: "F307 qualifiers『出典の NIST SP 800-61 Rev. 2 は 2025-04-03 に撤回され、SP 800-61r3 に全面的に置き換えられた』『対象はアラート1件ではなく「インシデントが起きたか」の判定』"
        理由: "この部分を支えるのは F307 だけで、撤回された版であることが落ちている。『NISTの手順書』と書いて、現行の文書のように読める"
    備考: "F303(Rev.3)の部分、F312(民間の解説が優先順位付けを真偽の判定より前に置く)の部分は合格"

  - question: Q3.1.1
    判定: 不合格
    条件1: 不合格
    条件2: 合格
    条件4: 合格
    指摘:
      - 箇所: "製品の公式の文書と民間のSOC向けの解説は、閉じるときに、検知の条件が誤っていた場合(誤検知)と、活動は実在するが承認済みか想定内の場合(想定内の検知)を分けて分類する"
        根拠: "F609 qualifiers『正確だが無害なアラートの分類が F607 の Informational, expected activity と一致しない(同じ会社の製品の文書の間で扱いが異なる)』。F609 quote 'The alert is accurate, but benign (unimportant) — Classify the alert as a true positive, and then suppress'。decisions.md D001『製品の公式文書は、閉じるときの分類を定めるが、製品ごとに定義が違う』"
        理由: "F609 は、正確だが無害なアラートを True positive に分類する。想定内の検知を分ける製品(F605、F607)だけを一般化し、製品ごとに分類が違うという限定が落ちている。F609 は『閉じる』のではなく『分類や抑制の前』の判断でもある"
      - 箇所: "NISTは、...兆候が正当かを評価するよう述べる"
        根拠: "F308 qualifiers『ideally(理想的には)という限定付き』『Rev. 2 は撤回』"
        理由: "『理想的には』が落ちている。Rev.2 の撤回も落ちている(Rev.3 の F600 は『既知の誤検知を考慮する』の部分だけを支える)"

  - question: Q3.1.2
    判定: 合格
    条件1: 合格
    条件2: 合格
    条件4: 合格
    備考:
      - "F324 の原文は『調整に使える(can be used)』。答えの『使い』は少し強い。『民間の解説は...とする』と出典の性格が付いているため、限定の欠落とはしなかった"
      - "F317 の『監視技術の調整であり、閉じた個々の判断の見直しではない』は、答えの文脈(NISTは監視の技術を調整するとする)に沿っている"

  - question: Q3.2
    判定: 不合格
    条件1: 不合格
    条件2: 不合格
    条件4: 合格
    指摘:
      - 箇所: "調査を続けるときは、影響を受けるシステム、発生源、手口を確かめるとされる(NISTとCISAの、インシデントと判断した後の初動の記述)"
        根拠: "F400 qualifiers『撤回済みの版』。F402 quote 'identify the type of access, the extent to which assets have been affected, the level of privilege attained by the adversary, and the operational or informational impact'"
        理由: "発生源と手口は F400(NIST Rev.2、撤回済み)にあり、CISA(F402)の項目は、アクセスの種類、資産の範囲、権限の水準、影響であって、同じではない。『NISTとCISAの記述』として1つの項目にまとめており、裏付けが合わない。撤回の事実も落ちている。『インシデントと判断した後』の限定は残っている"
      - 箇所: "実務者向けの解説では一次解析の担当で12〜20分が一般的とし"
        根拠: "F403 qualifiers『根拠となる調査や数値の出典は記事中で確認できていない』『出版社は広告やスポンサー募集を掲載している』"
        理由: "1つの記事の主張であり根拠が示されていない点が落ちている。『実務者向けの解説』と書かれているため軽微"

  - question: Q3.3.1
    判定: 不合格(軽微)
    条件1: 不合格
    条件2: 合格
    条件4: 合格
    指摘:
      - 箇所: "インシデントかの判断が難しい場合は他の担当者と協力して決めるとする"
        根拠: "F401 quote 'It may be necessary to collaborate with other technical and information security personnel'。F401 qualifiers『撤回済みの版』"
        理由: "『必要が生じうる(may be necessary)』が『決める』になっている。撤回済みの版であることも落ちている。また、F401 は『インシデントかの判定』の話で、上げる判断ではない(答えの文脈では分けて書かれているので、これは指摘に含めない)"
    備考: "F403、F405、F406、F407 の限定は、『実務者向けの資料』という性格と、迷うときの規則に残っている"

  - question: Q3.3.3
    判定: 不合格(軽微)
