      - 箇所: "NISTは、対応の記録に、状況、関連する兆候、各担当者の対応、影響の評価、集めた証拠、次の手順を含めるとする"
        根拠: "F412 qualifiers『撤回済みの版』。F412 statement は『などを含めるべき』"
        理由: "撤回済みの版であることと、一覧が一部である(『など』)ことが落ちている"

