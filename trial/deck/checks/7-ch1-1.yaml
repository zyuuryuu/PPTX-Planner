検査の名前: 裏付けのない文、限定の残存(重大な検査)
工程: 7 スライドの中身(docs/writing.md「検査」の「裏付けのない文」「限定の残存」、docs/checks.md「重大な検査」の工程7の2行)
回: 1
対象:
  成果物: trial/deck/07-slides/ch1.yaml の ch1-s2(ch1-s1 は型の見本で対象外)
  コミット: c298a5a(検査時のブランチの先頭は 530ef04。ch1-s2 は c298a5a から変わっていない)
  上流: >-
    trial/deck/work/ch1.md(ストーリーラインと立証の設計、語彙、前後の章の見出し、ch3-s17 の見出し)、
    trial/deck/decisions.md の D015、trial/deck/04-storyline.yaml の ch3 の見出し、trial/deck/terms.yaml の語の定義(作業票の語彙表で読んだ)
判定者: 検査セッション(モデルの識別子は記載しない。依頼元への連絡に記す)
手順の記録: >-
  ch1-s2 は立証の設計の facts が空で、使う事実がない。D015 に従い、講義の決まりを述べる文の裏付けは、
  その決まりを述べる第3章のスライドの見出し(案か、このSOCの運用かは見出しの印「案として」「このSOCでは」による)と、語の定義とした。
  headline を除く takeaway、body.text、body.caveat、notes の文を1つずつ、
  (1) 裏付け: 文の言う決まりが、ch3 の見出しか語の定義で裏付けられるか、
  (2) 限定: 事実の qualifiers は対象がないため、依頼に従い、裏付けとする ch3 の見出しが持つ限定
  (「案として」「このSOCでは」の印、条件、対象)が、文、同じスライドのほかの文、または出典の行に残っているか、
  を判定した。ch1-s2 には出典の行がない(sources が空、ストーリーラインに source がない)ため、印はスライドの文に残るかだけで判定した。
  決まりを含まない文(読み上げの指示、参照先の案内、次の章への遷移)は、参照先の見出しと食い違わないかを裏付けとして判定し、限定は対象外(合格に数える)とした。
  headline、章の message、資料の summary は検査の対象外とした(上流で固定)。

件数:
  不合格: 2
  判定できない: 0
  合格: 16      # 9文 × 2条件 = 18 から不合格を除いたもの(限定の「対象外」を合格に含む)
  指摘の一覧(重い順):
  - body.text 2文目「誤検知は、根拠をもって誤検知と言えるものだけを閉じる」が、裏付けの ch3-s5 の「案として」を落とし、
    このSOCの運用である1文目(ch3-s6)と並べて同じ形で言い切っている。出典の行もないため、スライドのどこにも案の印がなく、
    案がこのSOCの運用(または決まった基準)として読める(限定)
  - body.caveat「迷ったら上げる」が、裏付けの ch3-s13 の条件「30分調べても閉じる根拠がなく」を落としている。
    調べずにすぐ上げると読め、ch3-s17「残りは調べる」とも食い違って見える(限定)
  判定できない: []

# notes の文の番号は、notes を句点「。」で区切った順(1から)。
判定:
- スライド: ch1-s2
  sources: []
  出典の行: なし
  裏付けに使った見出しと定義:
    ch3-s5: 案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる
    ch3-s6: このSOCでは、新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけ
    ch3-s13: このSOCでは、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる
    ch3-s14: このSOCでは、配属から3か月の新人は攻撃の試みも全て上げ、溢れたらリーダーが対処する
    ch3-s17: 配属から3か月の新人は、重大度 High 以上か攻撃の試みなら上げ、一覧なら閉じ、残りは調べる(出典の行「このSOCの運用…調べる中で誤検知と言える基準は案」)
    T-close: アラートを、誤検知か想定内の検知と判断して、調べたことと判断を記録し、対応を終える
    T-attack-suspect: 誤検知とも想定内の検知とも根拠をもって言えないアラート。攻撃の試みと、侵害の疑いを含む
    T-list: リーダーが事前に作った、想定内の活動の一覧。新人が想定内の検知として閉じてよいのは、これに当てはまるものだけ
    T-proposal: 公開資料の材料から、この講義が組み立てた基準。公的な基準でも、このSOCの運用でもない
  文:
  - 箇所: takeaway
    引用: 閉じてよいのは誤検知と想定内の検知だけで、攻撃の疑いは閉じない
    裏付け: 合格
    限定: 合格
    理由: >-
      前半は語の定義 T-close(閉じるのは誤検知か想定内の検知と判断したもの)で、後半は T-attack-suspect(どちらとも根拠をもって言えないもの)と
      ch3-s13(閉じずに上げる)、ch3-s14(攻撃の試みも全て上げる)、ch3-s17(攻撃の試みなら上げ)で裏付けられる。
      区分の範囲を述べるだけで、ch3 の見出しより広い言い切りはない。区分の範囲は語の定義(この講義の語)によるため、案か運用かの印は要らないと判断した。
      補足(判定は変えない): 「閉じてよいのは…だけ」は必要条件だが、単独では「誤検知と想定内の検知は閉じてよい」(十分条件)とも読める。
      根拠と一覧の条件は、同じスライドの headline と body.text にある。
  - 箇所: body.text(1文目)
    引用: 想定内の検知は、リーダーが作った一覧に当てはまるものだけを閉じる
    裏付け: 合格
    限定: 合格
    理由: >-
      ch3-s6 と T-list で裏付けられる。ch3-s6 の「このSOCでは」は文に書かれていないが、「リーダーが作った一覧」がこのSOCの運用であることを示しており、
      公的な基準や案としては読めないと判断した。ch3-s6 の対象「新人が」も文にないが、講義の受講者が新人であり、ch1-s2 のどの文も受講者の扱いを述べるため、範囲は広がっていないと判断した。
  - 箇所: body.text(2文目)
    引用: 誤検知は、根拠をもって誤検知と言えるものだけを閉じる
    裏付け: 合格
    限定: 不合格
    理由: >-
      内容は ch3-s5「案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる」と、T-false-positive の定義で裏付けられる。
      しかし ch3-s5 の「案として」が落ちている。この文は、このSOCの運用である1文目(ch3-s6)と同じ「…だけを閉じる」の形で並べられ、
      ch1-s2 には出典の行もなく、ノートも案であることに触れないため、スライドのどこにも案の印が残っていない。
      講師がこのSOCのリーダーであるため、受講者は2文とも「このSOCの決まり」と受け取る。T-proposal は案を「このSOCの運用でもない」と定義しており、
      案と運用の区別を崩している。ch3-s17 の出典の行も「調べる中で誤検知と言える基準は案」と書き分けている。
    直し方の提案: >-
      body.text の2文目に「案として」を付ける(例:「誤検知は、案として、根拠をもって誤検知と言えるものだけを閉じる」)か、
      ノートに「誤検知の基準は、公開資料から組み立てた案で、第3章(ch3-s5)で扱う」と書く。前者のほうが映した画面で区別が残る。
  - 箇所: body.caveat
    引用: どちらとも言えないものは閉じず、迷ったら上げる
    裏付け: 合格
    限定: 不合格
    理由: >-
      「どちらとも言えないものは閉じず」は T-close、T-attack-suspect、ch3-s13 で裏付けられる。「迷ったら上げる」は ch3-s13 の内容である。
      しかし ch3-s13「このSOCでは、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる」の条件「30分調べても」が落ちている。
      caveat の文は、迷った時点で調べずに上げると読め、ch3-s17「…一覧なら閉じ、残りは調べる」(どちらとも言えないものはまず調べる)とも食い違って見える。
      ch3 の見出しより強い言い切りである。notes[3] は詳しい流れを ch3-s17 に送るが、調べてから上げることは述べていない。
      なお headline と章の message にも「迷ったら上げる」があるが、上流で固定されており検査の対象外である。caveat は headline の言い切りを補える箇所である。
    直し方の提案: >-
      caveat を「どちらとも言えないものは閉じずに調べ、30分調べても迷うなら上げる」などとする。
      「30分」は ch3-s11、ch3-s13 の運用の値で、ch1 の立証の設計の facts にはないため、数値を出さず「決めた時間調べても迷うなら上げる」とする書き方もある。
  - 箇所: notes[1]
    引用: 閉じてよい2つの条件を順に読み上げ、どちらも「だけ」が付くことを強調する。
    裏付け: 合格
    限定: 合格(対象外)
    理由: 読み上げの指示で、決まりを述べない。body.text の2文はどちらも「だけ」を含み、指示と合う。
  - 箇所: notes[2]
    引用: 一覧は第3章(ch3-s6)、誤検知の根拠は第2章(ch2-s8)で扱う。
    裏付け: 合格
    限定: 合格(対象外)
    理由: >-
      一覧は ch3-s6 の見出しと合う。ch2-s8「誤検知の原因には、弱いルールや緩く書かれたルールなど、検知の条件の誤りがある」は、
      誤検知と言う根拠の中身(検知の条件の誤り)を扱っており、食い違わない。
      補足(判定は変えない): 「根拠をもって言えるものだけ閉じる」という決まりそのものは ch3-s5(案)が述べる。body.text 2文目の指摘を直す場合、ここに ch3-s5 を足すと案の印をノートにも残せる。
  - 箇所: notes[3]
    引用: どのアラートを調べ、どれを上げるかの詳しい流れは第3章の最後(ch3-s17)で示す。
    裏付け: 合格
    限定: 合格(対象外)
    理由: ch3-s17 の見出し(上げる・閉じる・調べるの振り分け)と、ストーリーラインの順(ch3 の最後)と合う。
  - 箇所: notes[4]
    引用: 「間違って閉じるのが怖い」という不安には、根拠が言えなければ閉じない、という線で答える。
    裏付け: 合格
    限定: 合格
    理由: >-
      不安はブリーフの「読み手の立場と懸念」にある。「根拠が言えなければ閉じない」は ch3-s5、ch3-s6、ch3-s13 と T-close で裏付けられ、
      閉じない方向の言い切りのため、ch3 の見出しより広くも強くもない。答え方の指示で、案か運用かを区別する決まりの文ではないと判断した。
  - 箇所: notes[5]
    引用: 次の章では、アラートとは何かから始める。
    裏付け: 合格
    限定: 合格(対象外)
    理由: 作業票の ch2-s1 の見出しと、ch1 の到達点の open_questions「アラートとは何か」と合う。遷移の文。
