検査の名前: 章の message が主張より強い・広いことを述べていない(重大な検査。再検査、1回)
対象: trial/deck/03-chapters.yaml(コミット eaf36ae5)の ch2 message と slides_reason、ch3 message、ch4 message と slides_reason、ch5 slides、C3 の反論 index 1 の置き場
判定者: Claude Sonnet 5.5(検査セッション)
上流: 02-claims.yaml、terms.yaml、decisions.md、docs/stages/03-chapters.md(01-sources は stance を読んでいない)
件数: {合格: 5, 不合格: 2, 判定できない: 0}
項目:
  - 項目: ch2 message(前回の指摘「測定対象と期間の限定の脱落」)
    判定: 合格
    理由: 「1つの実在のSOCのネットワークの検知(Zeek)のアラートの実測(2020年12月〜2022年7月)では、…27%以上、…49%以上」は C1 の限定と一致し、「以上」も残っている。「定義と数え方で割れ」は C1「出典の定義と数え方で大きく割れている」から「出典の」が落ちたが、割合が割れるという内容は同じで、広がっていない。前回の指摘は解消した
  - 項目: ch2 slides_reason
    判定: 合格
    備考: 「Q1.2」「Q1.3」が Q1 の子であることは、探索の計画を読んでいないので確かめていない。Q1.1.2 が omitted にあることとは矛盾しない
  - 項目: ch3 message(依頼者の運用と案の分離、限定の保持)
    判定: 不合格
    引用: 「あわせてリーダーの運用として、新人が閉じてよいのは誤検知とリーダーが一覧にした想定内の活動だけで、攻撃の試みは最初の3か月は全て上げ、閉じたものは後で見直されることを示す」
    対比: C3「依頼者が同意した運用(新人が閉じてよいのは誤検知と一覧にある想定内の活動だけ)と、依頼者のSOCの運用(攻撃の試みは最初の3か月は全て上げる、閉じたものは後で見直される)を、公開資料とは分けて示す」。C1 の反論の response「設計セッションが示した案に、自分のSOCの運用に近いとして同意したもの」
    理由: 案の部分と運用の部分は「あわせて」で分かれた。しかし運用の出どころが「依頼者」でなく「リーダー」になり、1つの SOC の運用(証言)であることが message から消えた。「リーダーの運用」は、どの組織でも通じる一般のリーダーの運用にも読める。また C3 は、前半(閉じてよいのは…だけ)を「依頼者が同意した運用」、後半を「依頼者のSOCの運用」と2つに分けているが、message は1つの「リーダーの運用」にまとめ、前半が設計側の案に同意したものである点も落ちた。公開資料からの案と、1つの SOC の運用が分けて書かれているとは言えず、主張より広い
    直し方の案: 「あわせて依頼者のSOCの運用として、…」と出どころを書く(前半が同意した運用であることは、スライドで示すか、「同意した運用と」と添える)
    前回の指摘の解消: 運用を加えた点は解消した。限定(出どころ)の脱落という新しい問題が生じた
  - 項目: ch3 message のうち、案の部分(「調べた公的な文書になく」「案として」、優先度、閉じる条件、上げる4条件)
    判定: 合格
    理由: C2、C3 の案の記述と合う。「時間内」は「持ち時間の中で」の略、「横展開」は「複数のホストにまたがる」の略で、広がっていない(前回と同じ)
  - 項目: ch4 message の1文目と2文目(重大な検査 3 の確認)
    判定: 合格
    理由: 1文目は C4 の冒頭の文と同じ。「解析者は」を足したが、C4 の「誤検知に慣れると」の主語を補っただけである。2文目は主張の内容(事実)ではなく、この講義が慣れの危険をどの結論の理由として使うかの、資料の構成の説明で、「示す」と書き、出典が言ったこととしてはいない。案の部分(根拠をもって言えるものだけを閉じる)は summary と C3 に既にある。前回の指摘(具体性と除去)は、主語と資料内の役割が書かれて解消した。ch3 の message には慣れの危険がないので、除去すると欠ける
    備考: 2文目は、慣れの危険から「根拠をもって言えるものだけを閉じる」が導かれると読めるが、C4 の出典はそこまで言っていない。スライドで、これは講義の設計であり出典の結論ではないと分かるようにする必要がある。C4 の限定(Target は上院報告の推定、Imperva は自己申告)も message になく、スライドで示す必要がある(前回と同じ)
  - 項目: ch4 slides_reason
    判定: 合格
    理由: 配分の理由が、新人の懸念との関係と、ch3 との役割分担で書かれ、前回の指摘(除去・具体性)に答えている
  - 項目: ch5 slides と slides_reason
    判定: 不合格
    引用: 「slides: 10」「架空のアラート1件につき問題と解説の2枚を、4件分充てる」
    理由: 理由の計算は 2枚×4件=8枚で、slides の10と合わない。残り2枚の用途が書かれていない。枚数を11から10に直したが、理由との食い違いは残っている
    直し方の案: 理由に残り2枚の内容を書くか、枚数を理由に合わせる
  - 項目: C3 の反論 index 1(「1人で決められるとするが、判定には他の担当者との協力が要る」)の置き場
    判定: 合格
    理由: to は body に直った。その答え(持ち時間の中で決められないときや迷うときに上げることまでを1人の判断に含める)は、ch3 message の上げる条件にあり、本論の ch3 で答えられる
