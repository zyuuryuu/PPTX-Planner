検査の名前: 工程4 ストーリーラインの検査セッションの条件(再検査。前回の不合格の条件 1〜9、11、13 と、書き換えた見出しの条件12)
対象: trial/deck/04-storyline.yaml、04-chapter-states.yaml、04-scenarios.yaml(コミット ce66f9af。前回の対象は 49a88e24)
判定者: Claude Opus 5.5(検査セッション)
前回の指摘: trial/deck/checks/4-storyline-3.yaml
上流: 00-brief.md、02-claims.yaml、03-chapters.yaml、terms.yaml、style.yaml、decisions.md(D001〜D007)。01-sources.yaml は、書き換えた見出しの evidence にある事実(F005 を含む)の statement と qualifiers だけを開いた。基準は docs/stages/04-storyline.md の合格条件
範囲: 前回の指摘が解消したかと、直した箇所(49a88e24 と ce66f9af の差分で変わった見出し、question、章の状態)に新しい問題が生じていないか。直していない箇所には新しい指摘を出していない。依頼で挙げられていない差分(ch3-s2、ch3-s6、ch4-s2、ap-s1 の見出し)も、変わった箇所として見た
範囲の外: 見出しが根拠の事実の限定を落としていないか(重大な検査。別のセッションが行う)。機械の検査の項目(字数以外)。条件10(前回合格、今回の確かめる対象に含まれない)
件数: {合格: 7, 不合格: 4, 判定できない: 1}
項目:
  - 項目: 1. 見出しが2つの主張をつないでいない
    判定: 不合格
    前回の指摘:
      - 'ch3-s1: 解消。「何から確かめるかは出典で食い違い、NISTは報告の確認を、民間の解説は優先付けを先に置く」は1文で、食い違いの中身(両側)を述べる1つの主張になった'
      - 'ch3-s11: 解消。「このSOCでは、最初の3か月は1件30分まで調べ、過ぎたら見たことを付けて上げる」は1つの規則'
      - 'ch3-s13: 解消。「案として、迷ったときは、決められないことを理由に上げてよい」は1つの主張'
    新しい指摘:
      - 引用: 'ap-s1「扱う量は出典で大きく違い、1つのSOCの実測では、自動遮断の後も1日約13,764件残った」'
        理由: 「出典で大きく違う」と「1つのSOCの実測では1日約13,764件残った」の2つの主張がある。違いのもう片方(自己申告の平均4,484件、F203。SOC実務者20人の回答、F202)は出典の行にしかなく、見出しだけでは「大きく違う」が成り立たない。前回の ch3-s1 の指摘と同じ形である。書き換える前の ap-s1「…1日約13,764件の実測と、1日平均4,484件の自己申告がある」は、違いの中身を述べる1つの主張だった
        直し方の案: 違いの中身を見出しに戻す(例「扱う量は出典で大きく違い、1つのSOCの実測は1日約13,764件、自己申告の平均は4,484件」)か、「扱う量は出典で大きく違う」だけにして値は中身と出典の行に置く
    合格とした境界の例:
      - 'ch1-s2「根拠をもって誤検知か想定内と言えるものだけを記録して閉じ、迷ったら上げる」: 閉じる側の条件と、その外のものの扱いが対になって1つの判断の規則を成すとみなした(要約の文の2文目と同じ。D004)'
      - 'ch2-s4「アラートの詳細はOSのログで確かめることが多く、認証のログは通常、接続元と成否を残す」: 問い「どのログを見ればよいのか」への答えとして、見る先の2つを並べた1つの答えとみなした'
      - 'ch3-s14「…攻撃の試みも全て上げ、溢れたらリーダーの側で対処する」: 規則と、その規則への反論(溢れる)の扱いを1文にしたもので、前回の直し方の案のとおり。1つの運用の記述とみなした'
  - 項目: 2. 見出しどうしが矛盾していない
    判定: 不合格
    前回の指摘:
      - 'ch3-s12 と演習4(ch5-s7、s8): 解消。演習4が「重要でない業務用のPC」になり、ch3-s12 の上げる条件(重要な資産での疑い)に当たらない。答えは ch3-s11(30分)と合う'
      - 'ch2-s8 と ch2-s9(誤検知と想定内の検知の区分): 解消。ch2-s8 が「弱いルールや緩く書かれたルールなど、検知の条件の誤り」に絞られ、保守作業(F210)が外れた。T-false-positive の定義と合い、演習2(緩く書かれたルール)とも語が揃った'
    新しい指摘:
      - 引用: 'ch1-s2「…迷ったら上げる」、ch3-s13「案として、迷ったときは、決められないことを理由に上げてよい」'
        対比: 'ch3-s11「このSOCでは、最初の3か月は1件30分まで調べ、過ぎたら見たことを付けて上げる」、ch5-s8「演習4の答え: 閉じずに調べ、30分の中で正当と確かめられなければ、見たことを付けて上げる」'
        理由: 3点が食い違って読める。(1) ch1-s2 は「迷ったら上げる」(するべきこと)、ch3-s13 は「上げてよい」(してもよいこと)で、強さが違う。(2) 迷った時点で上げるのか、30分まで調べてから上げるのかが、見出しから決まらない。演習4は、プロセスが正当か分からない(迷う)状態から始まるが、答えは30分調べるであり、ch1-s2 をそのまま当てはめた「すぐ上げる」と食い違う。ch3-s13 の「上げてよい」に従えば、すぐ上げることも正しくなり、演習4の答えが1つに決まらない。(3) ch3-s11 は全てのアラートを30分まで調べると読めるが、ch3-s12 は重要な資産での疑いなどを上げる条件とし、その場合に30分を待つのかが見出しにない。F005 は「重大度が高いものは30分を待たずにすぐ上げる」とし、D002 も「重大度が高いものは調べ終える前に上げる」とするが、どの見出しにもない。いずれも、ch1-s2、ch3-s11、ch3-s13、ch5-s8 の書き換えで生じた
        直し方の案: '「迷う」と30分の関係を見出しで決める。例: ch3-s13 を「案として、30分の途中でも、決められないと分かったら待たずに上げる」とするか、ch3-s11 を「…30分まで調べ、決められなければ上げる」として「迷う」を30分で決められないことと定める。あわせて、重要な資産での疑いなど ch3-s12 の条件は30分を待たない(F005)ことを、ch3-s11 か ch3-s12 で示す。どちらに揃えるかは設計の判断で、要約の文(D004)の「迷ったら上げる」との関係も決める必要がある'
    合格とした組:
      - 'ch2-s5/ch3-s7: ATT&CK の戦術で表す段階を優先度の材料にする(ch2-s5)と、優先度を活動の段階などで付ける(ch3-s7)は揃う'
      - 'ch3-s3/ch3-s7: ch3-s3「影響の大きさで優先度を付ける」と ch3-s7「SIEMの深刻度だけでなく、資産の重要度、影響、活動の段階で付ける」は、ch3-s7 が要因を詳しくしたものとして両立する'
      - 'ch3-s7(深刻度だけでなく)と F306(深刻度は判断の材料で代わりではない): 消えた ch3-s8 の主張は ch3-s7 に含まれ、食い違わない'
      - 'ch1-s2/ch3-s6: 根拠をもって想定内と言える(ch1-s2)の根拠が、このSOCでは一覧である(ch3-s6)として両立する'
      - 'ch3-s2「この講義の線は案とこのSOCの運用である」と ch3 の message、ch3-s11、ch3-s14: 揃う'
  - 項目: 3. 見出しが、そのスライドの question に答えている
    判定: 合格
    前回の指摘:
      - 'ch2-s4: 解消。見る先(OSのログで詳細、認証のログで接続元と成否)を答えている'
      - 'ch3-s4: 解消。確かめ方(ルールの条件と、含まれる利用者や端末を、元のログと照らす)を答えている'
      - 'ch3-s11: 解消。「1件30分まで調べ、過ぎたら上げる」と、採る線を答えている'
      - '演習の問題(ch5-s1、s3、s5、s7): 解消。question が「演習Nでは、どんなアラートが届いたのか」になり、見出しのアラートの描写が答えになった(D007)'
    書き換えた見出しの確認: 'ch1-s1、ch1-s2、ch2-s5、ch2-s8、ch3-s1、ch3-s2、ch3-s6、ch3-s7、ch3-s13、ch3-s14、ch4-s2、ch5-s2、ch5-s8、ap-s1 は、それぞれの question に答えている'
    備考:
      - 'ch3-s14 の question「攻撃の試みは閉じてよいのか。全て上げたら溢れないか」と ch1-s2 の question「何を閉じ、何を上げるのか」は、2つの問いを1つにしている。「1スライドに問いと見出しが1つずつある」は機械の検査の項目で範囲の外のため判定しないが、機械の検査が問いの数を数える場合は挙がりうる'
  - 項目: 4. 章内の見出しを順に読むと、章の message が導ける
    判定: 合格
    前回の指摘:
      - 'ch1: 解消。ch1-s1(3つに分け、閉じる・調べる・上げるを決める)と ch1-s2(根拠のあるものだけを記録して閉じ、迷ったら上げる)を順に読むと、message そのものになる'
    新しい問題の確認:
      - 'ch2: ch2-s8 の書き換え後も、ch2-s1 と ch2-s6 から message が導ける'
      - 'ch3: ch3-s2(公的な文書になく、案とこのSOCの運用)、ch3-s3/s5/s6(3つに分け、根拠のあるものだけ閉じる)、ch3-s13(迷ったら上げてよい)、ch3-s6/s10/s11/s14(このSOCの運用)から導ける。ch3-s13 の「上げてよい」と message の「迷ったら上げる」の強さの違いは条件2の指摘'
  - 項目: 5. 同じ主張を述べる見出しが複数ない
    判定: 合格
    前回の指摘:
      - 'ch1-s2/ch2-s6: 解消。ch1-s2 から実測の数値(F207)が外れた'
      - 'ch3-s4/ch2-s1・ch2-s2: 解消。ch3-s4 は確かめ方を述べ、アラートの出る仕組みの説明と重ならない'
    新しい問題の確認:
      - 'ch1-s1・ch1-s2 と ch3-s3・s5・s6・s13: ch1 は結論を先に示す章(order: conclusion first)で、ch1 の2枚は結論の全体を、ch3 の見出しはその部分を条件(案として、このSOCでは)とともに述べる。同じ主張の重複とはみなさなかった。前回、ch1 に結論そのものを置くよう求めたこととも合う'
      - 'ch2-s5/ch3-s7: どちらも活動の段階に触れるが、ch2-s5 は ATT&CK の使い道、ch3-s7 は優先度の要因で、主張が違う'
      - 'ch3-s7 は消えた ch3-s8 の主張を含み、ほかに同じ主張の見出しはない'
  - 項目: 6. 全ての見出しが、否定の検査と具体性の検査を通る
    判定: 合格
    前回の指摘:
      - '演習の問題(ch5-s1、s3、s5、s7): 解消。D007 と style.yaml の exceptions で否定の検査の対象外とされた。具体性の検査は当てはめ、4件とも対象(スキャン用の端末、管理ツールの通信、既知の攻撃の通信、業務用のPCのプロセス)と状況がある'
      - 'ch2-s4: 解消。否定「アラートの詳細をOSのログで確かめることは少なく、認証のログは接続元と成否を残さない」は主張として成り立つ'
    書き換えた見出しの確認: 'ch1-s1、ch1-s2、ch2-s5、ch2-s8、ch3-s1、ch3-s4、ch3-s7、ch3-s11、ch3-s13、ch3-s14、ch5-s2、ch5-s8、ap-s1 の否定は、いずれも主張として成り立つ(例: ch3-s13 の否定「迷っても、決められないことを理由に上げてはならない」、ch2-s5 の否定「ATT&CK は優先度の材料にしない」)。いずれも対象と条件がある'
  - 項目: 7. 本編の全てのスライドが除去の検査を通る
    判定: 合格
    前回の指摘:
      - 'ch2-s5: 解消。ATT&CK の戦術でアラートの活動の段階を表し、優先度の材料にする、とした。ch3-s7 の要因「活動の段階」を新人が判断する手段になり、抜くと ch3-s7 の段階の部分を新人が当てはめられない。C2 の「要因で扱う」を支える'
      - 'ch3-s4: 解消。確かめ方を述べ、C2 と ch3-s3 の「根拠とログで3つに分ける」を支える'
      - 'ch3-s8: 解消。ch3-s7 にまとめて消えた'
    備考:
      - 'ch2-s5 の「戦術で…攻撃のどの段階かを表す」は、F116(戦術は技術の「なぜ」を表す)と F610(活動の段階)をつないだ案で、「案として」と示されている。ATT&CK の戦術は順に進む段階として定義されたものではないため、中身で「段階の目安」であることを示すとよい。限定の検査の範囲に当たるため判定はしない'
  - 項目: 8. 章の前提と到達点が、見出しの中身と合っている
    判定: 不合格
    前回の指摘:
      - 'ch2 の懸念「誤検知ばかりで、何を見ればいいか分からない」: 解消。ch3 に移り、前半は ch2-s6・s7、後半は ch2-s4(見る先)と ch3-s3・s4(確かめ方)で、ch3 の出口までに答えがある'
      - 'ch2 exit terms「侵害に至らなかった攻撃の試み」: 解消。「攻撃の試み」になり、ch2-s6 の語と一致する'
      - 'ch3 exit terms「持ち時間」の値: 解消。ch3-s11 に1件30分がある'
    新しい指摘:
      - 引用: '04-chapter-states.yaml ch3 exit terms「持ち時間」'
        対比: 'ch3-s11「このSOCでは、最初の3か月は1件30分まで調べ、過ぎたら見たことを付けて上げる」、ch3-s12「…時間切れ…なら上げる」'
        理由: ch3-s11 の書き換えで、語「持ち時間」がどの見出しと question にもなくなった(全39件を検索)。値は得られるが、到達点の語と見出しの語が一致しない。T-investigate の定義(持ち時間の中で確かめ続ける)は語を使っている。軽微
        直し方の案: ch3-s11 に語を入れる(例「このSOCでは、最初の3か月の持ち時間は1件30分で、過ぎたら見たことを付けて上げる」、43字)か、ch3 の到達点の語を見出しの言い方に合わせる
    新しい問題の確認: 'ch1 exit terms に足した「攻撃の疑い」は ch1-s1 に出る。ch1 exit の他の語(アラート、誤検知、想定内の検知、閉じる、調べる、上げる)も ch1-s1・s2 に出る'
  - 項目: 9. 場面の期待する結果が、見出しの一覧で満たせる見込みがある
    判定: 判定できない
    理由: 前回の不合格の指摘(反対の立場の通読「攻撃の試みを全て上げると溢れる」)は解消した。ch3-s14 の question が溢れる懸念を問い、見出しが「溢れたらリーダーの側で対処する」と答える(F003、C3 の response と合う)。残る「発表の通し」(90分2回に収まるか、ノートが話としてつながるか)は、前回と同じく、見出しの一覧からは判定できない(ノートと時間の見積もりがない)
    備考:
      - '主な読み手の通読: ch1 の見出しで結論が述べられるようになった。演習で根拠を答えられるかは、条件2(迷ったときと30分の関係)と条件13(演習4)の指摘に影響される'
      - '過去の指摘「誤検知と想定内の検知を混同していない」: ch2-s8 の書き換えで、前回の懸念は解消した'
      - '過去の指摘「新人に見せない言葉」: 書き換えた見出しと出典の行に「依頼者」「同意」はない。ch3-s11 の出典の行は「このSOCの運用」で、F005 の qualifiers(依頼者の指定)と合う'
  - 項目: 11. style.yaml の個人の表現規約(P001〜P008)に反する見出しがない
    判定: 合格
    前回の指摘:
      - 'P004(ch1-s1 が講義の目標を述べる): 解消。ch1-s1 は結論(3つに分け、閉じる・調べる・上げるを決める)になった'
    新しい問題の確認:
      - '書き換えた見出しに、P001〜P005、P007、P008 に反するものはない。ch3-s2「この講義の線は案とこのSOCの運用である」は、前回の「この講義の基準は案である」と同じく基準の位置づけの明示とした'
      - 'P006: ch2-s5 の「戦術」(ATT&CK の用語)、ch2-s8 の「弱いルール」は、読み手に補足が要る。前回の「シグネチャ」「学習期間」と同じく、中身で補えるため見出しの不合格とはせず、工程7で確かめる'
  - 項目: 12. 見出しが50字以内である(D006)
    判定: 合格
    理由: '全39件の headline を Python の len で数えた(空白と記号を含む)。書き換えた見出しでは ch5-s1 の47字が最長で、ch2-s5・ch5-s8・ap-s1 が45字、ch3-s2 が46字。全体の最長は ch2-s6 の48字(書き換えていない)。50字を超えるものはない'
  - 項目: 13. 演習(ch5)の4件の答えが、ch3 の案とこのSOCの運用から導ける
    判定: 不合格
    前回の指摘:
      - '演習1: 解消。問題が「一覧に載ったスキャン用の端末から、一覧の時刻に」となり、答えが「端末と時刻が一覧と合うため」と当てはめの根拠を述べる。ch3-s6 から導ける'
      - '演習4(ch3-s12 との食い違い): 解消。重要でないPCになり、ch3-s12 に当たらない'
    新しい指摘:
      - 演習: 演習4
        引用: 'ch5-s7「演習4: 重要でない業務用のPCで、一覧にない見慣れないプロセスが動いたアラートが届いた」、ch5-s8「演習4の答え: 閉じずに調べ、30分の中で正当と確かめられなければ、見たことを付けて上げる」'
        対比: 'ch3-s6「このSOCでは、新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけ」、ch3-s5「…検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる」'
        理由: (1) 答えは「正当と確かめられれば上げない(閉じる)」を含意するが、プロセスは一覧にないため、30分の中で正当と確かめられても、ch3-s6 により新人は想定内の検知として閉じられない。正当な活動にルールが条件どおり反応したものは、語彙表では誤検知ではなく想定内の検知であり、ch3-s5 でも閉じられない。ch3 の案と運用からは、正当と確かめられても上げることになり、答えの条件「正当と確かめられなければ」が導けない。(2) 条件2の指摘のとおり、ch1-s2・ch3-s13 からは「迷ったのですぐ上げる」も導け、答えが1つに決まらない。(1) は書き換える前の演習4にもあった問題で、前回見落とした。演習4は今回書き換えた箇所のため挙げる
        直し方の案: 答えを、ch3-s6 に合う分かれ方にする(例「閉じずに調べ、30分の中で誤検知と根拠をもって言えなければ、見たことを付けて上げる」。一覧にない正当な活動は、新人は閉じずに上げる)。または、一覧にない活動を正当と確かめたときの扱い(リーダーに確かめる、など)をこのSOCの運用として依頼者に確かめ、ch3 の見出しに置く
    合格とした演習:
      - '演習2: 変わっていない。ch2-s8 の書き換えで語(緩く書かれたルール)が揃い、前回の備考の懸念(想定内と答える余地)は小さくなった'
      - '演習3: 変わっていない。ch3-s14 から「上げる」が導ける'

