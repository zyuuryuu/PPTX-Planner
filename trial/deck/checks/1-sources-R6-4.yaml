# 検査: 素材台帳の出典照合(重大な検査の再検査)
検査の名前: "1-sources-R6-4"
対象: "trial/deck/incoming/R6.yaml(コミット e9cc546 で直した F600、F604、F607、F609、F611、F613、F615、F616、F618、F619、F620)"
前回の指摘: "trial/deck/checks/1-sources-R6-1.yaml、trial/deck/checks/1-sources-R6-2.yaml"
判定者: "claude-opus-5-5(検査セッション)"
日付: 2026-11-23
基準: "docs/stages/01-exploration.md「素材台帳」と合格条件。docs/checks.md「重大な検査」"
条件: "c1=quote が出典に実在する / c2=切り取りが前後の条件・範囲・主体を落としていない / c3=statement が quote と合う / c4=qualifiers と value・unit が quote と漏れなく合う / c5=as_of と旧版の扱い(参考)"
方法: |
  出典8件を 2026-11-23 に取得して開いた(全て HTTP 200)。
    NIST SP 800-61r3 PDF、NIST SP 800-61r2 PDF、OMB M-22-01 PDF、NCA EDR Standard Template PDF、
    NIST SP 1800-24 PDF(386ページの合本)、Microsoft Learn 3ページ(investigate-alerts、
    defender-endpoint-false-positives-negatives、overview-endpoint-detection-response)
  PDF は pdftotext(通常、-layout、-raw、-bbox-layout)で抽出し、表の行の区切りは NCA の PDF の
  8ページ目を画像にして目で確かめた。HTML はタグを除いた本文と、表示の "Last updated on" とメタデータ ms.date を見た。
  直されていない事実(F601〜F603、F605、F606、F608、F610、F612、F614、F617)は判定していない。

集計:
  対象: 11件
  前回の指摘が解消: "11件中10件が解消。F607 は一部が未解消(軽微な指摘のため、判定は合格)"
  不合格: "1件(F616 の c1。直したことで明らかになった問題)"
  判定できない: 0件
  要修正(軽微、不合格にしない): "2件(F607 の qualifiers の YAML の分割、F618・F619 の Applies to の書き漏れ)"

主な指摘:
  - "F616(不合格): quote の項番「2-7」の位置が原文と違う。原文の表では \"Relevant data for EDR solution must include ... Users.\" は 2-7 の行にあるが、quote では 2-6 の後に続き、「2-7」は \"Additional data sources ...\" の前に置かれている。今回足した qualifiers「項番(2-6、2-7)は表の列の見出しと番号で、収集セッションが本文と連結した」は、この誤った対応をそのまま説明している"
  - "F607(要修正): qualifiers の項目 True positive は「with a type of threat」、Informational, expected activity は… が引用符なしの YAML の流れ形式に書かれ、\"Informational, expected activity\" のコンマで2項目に分かれて読み込まれる"
  - "F618、F619(要修正): ページの Applies to は \"Microsoft Defender for Endpoint Plans 1 and 2\" と \"Microsoft Defender XDR\" の2つ。qualifiers は前者だけを書いている"
  - "F604、F611、F615、F620、F600、F609、F613、F618/F619 の as_of: 前回の指摘は解消した"

判定:
  - id: F604
    前回の指摘: "statement が \"ideally\" と \"sometimes\" を落とし、qualifiers にもない(R6-1、R6-2 とも不合格)"
    解消: 解消
    c1: 合格
    c1_note: "800-61r2 の 3.2.4(p.28)で quote の全文を確かめた。「[...]」は \"Making matters worse, the total number of indicators may be thousands or millions a day. Finding the real security incidents that occurred out of all the indicators can be a daunting task.\" の2文の省略"
    c2: 合格
    c3: 合格
    c3_note: "statement は「理想的には個々に正当かを評価すべき」「判断の問題である場合があり」と、ideally と sometimes を保っている。新たに足した「侵入検知システムが誤検知を出すことがあり」は quote の \"Intrusion detection systems may produce false positives\" と合う"
    c4: 合格
    c4_note: "qualifiers に ideally、sometimes、may be necessary が加わった。参考: quote の \"may produce false positives\" の may は qualifiers にないが、statement が「ことがあり」で保っているため不合格にしない。揃えるなら qualifiers に足す"
    c5: "合格(PDF 冒頭の撤回の通知と qualifiers の「旧版」が合う)"
  - id: F611
    前回の指摘: "statement が \"generally\" と \"usually\" を落とした(R6-1 不合格)。qualifiers の「宣言済みのインシデント」が quote を越える(R6-2 軽微)"
    解消: 解消
    c1: "合格(800-61r3 の PDF 36ページ目、ページ下端の番号 28。RS.MA-04 の N1 と R1)"
    c2: 合格
    c3: 合格
    c3_note: "statement は「一般に」「通常」を保っている"
    c4: 合格
    c4_note: "qualifiers に「generally」「usually」と「進行中のインシデント(ongoing incidents)」があり、quote の語と合う。表の列の連結も書かれた"
    c5: 合格
  - id: F615
    前回の指摘: "quote の \"rulesbased\" が原文の \"rules-based\" と違う(R6-1、R6-2)"
    解消: 解消
