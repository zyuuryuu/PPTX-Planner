    c1_note: "M-22-01 の p.1。PDF の語の座標(pdftotext -bbox-layout)では、行末の語は \"rules-\"、次の行の先頭は \"based\"。quote は \"rules-based\" に直された。参考: pdftotext の通常の抽出はハイフンを消して \"rulesbased\" を出すため、前回の誤りはこれによると考えられる(推測)"
    c2: 合格
    c3: 合格
