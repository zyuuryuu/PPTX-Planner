  - id: F607
    前回の指摘: "True positive と Informational の種別の選択が statement と qualifiers にない。Informational の「通常は無視するが、実際の攻撃者による同様の活動では検知を期待する」という含みが落ちている(R6-2 軽微)"
    解消: "一部が解消。種別の選択は statement と qualifiers に入った。Informational の含みは statement にまだない"
    c1: 合格
    c1_note: "節 \"Manage alert status and classification\" で quote の全文を確かめた。「[...]」は True positive の \"Specifying this threat type alerts your security team see threat patterns and act to defend your organization from them.\" の省略"
    c2: 合格
    c3: 合格
    c3_note: "statement に足した Informational の用途(セキュリティテスト、レッドチームの活動、信頼するアプリや利用者の想定内の異常な振る舞い)は quote の \"Use the options in this category to classify alerts for security tests, red team activity, and expected unusual behavior from trusted apps and users\" と合う。statement の「解決するときの」を削ったのも、quote の節が解決に限らない分類を述べているため合う。未解消の点: \"You generally want to ignore these alerts but expect them for similar activities in the future where the activities are triggered by actual attackers or malware\" と、False positive の \"you generally don't want to see these alerts again\" が statement にない。言い過ぎではないため不合格にしない"
    c4: 合格
    c4_note: "要修正(直したことで生じた): 108行目の qualifiers は引用符なしの流れ形式で、項目 True positive は「with a type of threat」、Informational, expected activity は「with a type of activity」を選ぶ が、\"Informational,\" の後のコンマで「True positive は「with a type of threat」、Informational」と「expected activity は「with a type of activity」を選ぶ」の2項目に分かれて読み込まれる(PyYAML で確かめた)。文字は失われていないが、台帳を機械で読むと意味が崩れる。この項目を引用符で囲む。参考: F609 の qualifiers(132行目)の Informational, expected activity も同じ形で分かれるが、今回の修正で変えた箇所ではないため指摘にしない"
    c5: "合格(ページの Last updated on 2026-11-09、ms.date も 2026-11-09)"
