  - id: F616
    前回の指摘: "2-7 の箇条の連結が qualifiers にない(R6-1 の注記)"
    解消: "解消(qualifiers に箇条の連結が加わった)。ただし直したことで、次の問題が明らかになった"
    c1: 不合格
    c1_quote: '"... 2-6 EDR solution must collect and monitor relevant data to build a complete picture of endpoint activity. Relevant data for EDR solution must include information covering the following areas: Processes, Connections, Files, Drivers, Autorun, System, Machine, Users. 2-7 Additional data sources may be used, including but not limited to: ..."'
    c1_source: "PDF の8ページ目(下端の番号 7)の表。行 2-6 は \"EDR solution must collect and monitor relevant data to build a complete picture of endpoint activity.\" だけ。行 2-7 は \"Relevant data for EDR solution must include information covering the following areas: Processes, Connections, Files, Drivers, Autorun, System, Machine, Users.\" から始まり、\"Additional data sources may be used, including but not limited to:\" と5つの箇条が続く(ページを画像にして表の罫線で確かめた。pdftotext の抽出では「2-7」が箇条の横に出るため、行の区切りを取り違えやすい)"
    c1_reason: "quote は「2-7」を \"Additional data sources\" の前に置き、\"Relevant data ... Users.\" を 2-6 の続きとしている。原文の項番と本文の対応と違う。今回足した qualifiers「「Objective:」と項番(2-6、2-7)は表の列の見出しと番号で、収集セッションが本文と連結した」は、この誤った対応を正しいものとして説明している"
    c2: 合格
    c2_note: "項番の位置の違いは、要求の主体(EDR solution)と強さ(must)を変えない"
    c3: 合格
    c3_note: "statement は項番に触れておらず、述べている内容は原文と合う"
    c4: 合格
    c5: 合格
    直し方の案: "quote を「... 2-6 EDR solution must collect and monitor relevant data to build a complete picture of endpoint activity. 2-7 Relevant data for EDR solution must include information covering the following areas: Processes, Connections, Files, Drivers, Autorun, System, Machine, Users. Additional data sources may be used, ...」とし、locator の項番を合わせる"
    参考: "locator の「p.6-7」は下端のページ番号(Objective は下端 6、2-6 と 2-7 は下端 7)。PDF のページ目では 7〜8"

