  previous: 不合格(裏付けのない文)。「公的な順序は1つに決まっていない」が、公的な文書1つと民間の解説1つという表の内容と合わない
  now: 'アラートについての公的な順序は見当たらず、出典の順も食い違うため、案として順を決める'
  verdict: 解消(合格)
