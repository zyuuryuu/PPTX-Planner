    表の NIST の行は対象を「インシデントの報告」とし(F303)、アラートの行は民間の解説(F312、公的機関・標準ではない)である。
    「アラートについての公的な順序は見当たらず」はこのスライドの範囲と合い、「出典の順も食い違う」は表の2行の順の違いと合う。
    「案として順を決める」は決まりの内容を事実から導くのではなく、案を作る理由を述べる文で、D015 に反しない。

