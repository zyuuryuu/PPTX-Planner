out_of_scope_observations:   # 判定の件数に含めない
- >-
  ch3-s13 の見出し(上流のストーリーラインの文)は「このSOCでは、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる」で、「迷う」を運用の側に置く。
  ノートは「この講義では、迷っている状態を、閉じる根拠がない状態として扱う」と講義の読み方にした。見出しの「迷うなら」を「閉じる根拠がない」の言い換えと読めば食い違わないが、
  見出しだけを読むと、迷うときの扱いが依頼者の規則と読める。見出しは執筆の対象外のため、上流で直すかを PM と設計が決める。
