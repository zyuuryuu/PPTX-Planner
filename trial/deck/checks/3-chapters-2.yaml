# 検査: 章構成の重大な検査(工程3、2回目)
検査: 3-chapters(重大な検査。章の message が割り当てた主張より強い・広い内容を述べていないか、限定の残存、数値の一致、語彙表の語の使い方)
回: 2
対象: trial/deck/03-chapters.yaml の各章の message(ch1〜ch5)。判定に使った版は 365dc5ecc8eac52d6336552f4eed1785d3042f65
判定者: claude-sonnet-5-5(セッションの設定上のモデル識別子)
読んだもの: 03-chapters.yaml、02-claims.yaml、01-sources.yaml(stance は読まない。statement、qualifiers、value のみ)、terms.yaml、decisions.md、00-brief.md(ch5 の比較のため)、docs/stages/03-chapters.md、docs/checks.md。仮説、journal、他の checks は読んでいない
件数: {合格: 4, 不合格: 1, 判定できない: 0}
章ごと:
  - 章: ch1(導入。summary と比べる)
    判定: 合格
    理由: message は summary と同じ2文(区切りの句点が読点に変わっただけ)で、summary より強い・広い内容はない。「迷ったら上げる」の根拠が標準ではない手順書と案であることが文にないのは、D004 で依頼者が受け入れた扱いで、summary と同じである
    備考: 「想定内」は語彙表の「想定内の検知」の略記で、語彙表に略記の登録はない(使い方は定義に合う)。summary 自体の重大な検査は D004 により行われていない
  - 章: ch2(C1)
    判定: 不合格
    数値: 一致している(27%以上、49%以上。C1、F207 の value と qualifiers「下限」と一致。「以上」も残っている)
    指摘:
      - 箇所: ch2 message
        引用: アラートは、SIEMやEDRが検知の条件に合うイベントを見つけて出す知らせで、本物の攻撃とは限らない。誤検知の割合は数え方で割れ、1つの実在のSOCの実測では、侵害に至らなかった攻撃の試みが27%以上、想定内の検知が49%以上あった
        対比: C1「1つの実在のSOCのネットワークの検知(Zeek)のアラートの実測(2020年12月〜2022年7月)では、…」
        根拠: F207 の qualifiers「割合は表4の期間(2020-12〜2022-07、14,429,534件)のもの」。C1 の本文が測定対象を「ネットワークの検知(Zeek)のアラート」と限っている
        理由: message はアラートを SIEM や EDR が出す知らせと定義した直後に、27%と49%を置いている。測ったのは1つの SOC のネットワーク検知(Zeek)のアラートだけだが、message は「1つの実在のSOC」としか限定せず、測定対象の限定(ネットワーク検知のアラート)と期間を落としている。読み手には、SIEM や EDR のアラート一般の実測に見える。主張より広い
        直し方の案: 「1つの実在のSOCのネットワーク検知(Zeek)のアラートの実測では」とする
  - 章: ch3(C2、C3)
    判定: 合格
    理由: 「調べた公的な文書になく」「案として」は C3 と合う。「まず根拠とログで3つに分けて影響で優先度を付け」は C2 の案の順序と合う。上げる条件の4つ(時間内に決められない、重要な資産での疑い、横展開の証拠、迷うとき)は C3 の4つと合う。「横展開の証拠」は「複数のホストにまたがる」を略しているが、横展開の語の意味に含まれ、広がってはいない。「根拠をもって誤検知か想定内と言えれば記録して閉じ」は C3 と合う
    備考: C2 の前提(インシデントについての NIST の考え方をアラートに当てはめる)は message に出ないが、message は C2 の NIST の記述を主張していないため、強さには影響しない
  - 章: ch4(C4)
    判定: 合格
    理由: message は C4 の冒頭の文と同一で、それより強くない。「見過ごしうる」は可能性の述べ方になっている
    備考: C4 の限定(Target は上院報告の推定、Imperva は自己申告で無視したアラートが本物かは不明、いずれも出典の言う誤検知)は message になく、スライドで示す必要がある。message の「誤検知」は語彙表の定義(検知の条件が誤っていて無害な活動に反応したもの)の意味で使われており、根拠の「誤検知(出典の言い方)」の範囲と同じとは限らない。C4 の冒頭の文と同じなので不合格にはしない
  - 章: ch5(結び。ブリーフの目的と比べる)
    判定: 合格
    理由: ブリーフの目的「配属から3か月で、…誤検知として閉じる、調査を続ける、上に上げる、のいずれかを1人で決められるようにする」と、型ごとの追加の項目「演習。架空のアラートの例を数件見せ、…どれかと、その根拠を答えさせる」に合う。「配属後の実務での確認は資料とは別に行う」とあり、message は演習が習得を確かめるとは言っておらず、広がっていない。「3つに分け」は C3 の区分に合う
    備考: 「閉じる」はブリーフでは「誤検知として閉じる」で、C3 の運用では誤検知と一覧にある想定内の活動だけである。message の「閉じる」にその限定はないが、ブリーフの目的の言い方と同じである
