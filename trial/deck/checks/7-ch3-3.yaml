# 検査の結果(工程7、ch3、3回目。D018 による見出しの変更を受けた ch3-s13 の再検査)
check: 工程7の重大な検査(裏付けのない文、限定の残存)の再検査
definition:
- docs/writing.md「検査」の節の「裏付けのない文」「限定の残存」
- 依頼の追加の定め(1回目、2回目と同じ): 案や講義の読み方と、このSOCの運用の区別が文で崩れていれば、裏付けのない文として扱う
- trial/deck/decisions.md の D015(講義の決まりを述べる文の裏付けは、その決まりを述べるスライドのID)、D016(事実の本文にある数値は、同じ文に事実の参照を置けば直接書いてよい)
- 前提: D018(見出しから「迷う」を外す。「迷ったら上げる」との関係はノートの講義の読み方で示す)
scope: >-
  ch3-s13 だけ。見出しが「このSOCでは、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる」から
  「このSOCでは、30分調べても閉じる根拠がなければ、閉じずに上げる」に変わったことで、takeaway、body の文(図のラベル)、notes が
  新しい見出しと食い違わないか、運用と講義の読み方の区別が崩れていないかだけを確かめた。見出しの変更と関係しない箇所は判定し直していない。
target:
  file: trial/deck/07-slides/ch3.yaml
  slide: ch3-s13
  commit: 10ec175   # headline の1行だけを変えた(git show 10ec175 で確認)
  previous: trial/deck/checks/7-ch3-2.yaml
  upstream:
  - trial/deck/work/ch3.md の ch3-s13 の節(ストーリーライン、立証の設計)
  - 同じ作業票の F005、F006、F405 の全文
inspector: claude-opus-5-5
assumptions:
- 文の裏付けは、このスライドの立証の設計の facts(F005、F006、F405)と、D015 によるスライドID だけとした。出典の原文は開いていない(照合は依頼されていない)。
- 1回目(7-ch3-1)で takeaway を合格とした理由は「見出しが『30分調べても…迷うなら』と条件を持つため」だった。この理由が見出しの変更で失われたため、takeaway は見出しの変更と関係する箇所として判定し直した。

summary:
  fail: 1
  undeterminable: 0
  pass: 9
  main_findings:
  - takeaway「迷うなら、上げすぎる側に倒す」が、運用の印のスライドの結論1行に、講義の読み方と有志の手順書(F405)の言い方を、限定なしで置いている。見出しから「迷う」が外れたため、結論1行だけが「迷う」をこのSOCの運用の側に置く形になった。D018 が見出しで避けたことが、takeaway に残っている。また、「迷うなら」が30分の条件を持たなくなり、迷った時点ですぐ上げると読め、見出しの「30分調べても」と食い違う。
  - body の図のラベルと notes は、新しい見出しと食い違わない。notes の「この講義では、迷っている状態を、閉じる根拠がない状態として扱う」は講義の読み方として明示され、見出し(運用)との区別は文で保たれている。

items:
- no: 1
  field: takeaway
  text: '迷うなら、上げすぎる側に倒す'
  check: 裏付けのない文(運用と講義の読み方の区別)
  verdict: 不合格
  quote_slide:
  - 'headline: このSOCでは、30分調べても閉じる根拠がなければ、閉じずに上げる'
  - 'takeaway: 迷うなら、上げすぎる側に倒す'
  - 'body.mark: 運用'
  - 'notes: この講義では、迷っている状態を、閉じる根拠がない状態として扱う。'
  quote_fact:
  - 'F006 quote: それ以外→30分調べて、根拠がなければ上げる。'
  - 'F405 quote: Over-escalate if unsure — it''s better to escalate and be wrong than to miss a real incident(qualifiers: 有志のSOP集で標準や公的文書ではない)'
  - '立証の設計 focus: 根拠がなければ閉じない側に倒すこと'
  - 'D018 状況: 依頼者の証言(F005、F006)は「30分調べて、根拠がなければ上げる」で、「迷う」の扱いはない。却下した案: 見出しを変えない(依頼者の規則に「迷う」の扱いがあると読める)'
  reason: >-
    (1) 運用と講義の読み方の区別: このスライドは運用の印を持ち、見出しは「このSOCでは」と運用を述べる。依頼者の証言(F005、F006)に「迷う」の扱いはなく、
    「迷う」を根拠がない状態とつなぐのは notes が「この講義では」と書く講義の読み方であり、「上げすぎる側に倒す」は有志の手順書(F405)の言い方である。
    takeaway は主体も「この講義では」も持たずに「迷うなら、上げすぎる側に倒す」と言い切るため、運用の印の結論1行として、このSOCの規則と読める。
    D018 は、依頼者の規則に「迷う」の扱いがあると読めることを理由に見出しから「迷う」を外したが、同じ読まれ方が takeaway に残った。
    (2) 見出しとの食い違い: 1回目はこの文を「見出しが『30分調べても…迷うなら』と条件を持つため」合格とした。新しい見出しには「迷う」がなく、
    takeaway の「迷うなら」は30分の条件と結びつかない。結論1行だけを読むと、迷った時点で30分を待たずに上げると読め、見出しの「30分調べても」と食い違う。
    (3) 立証の設計の focus は「根拠がなければ閉じない側に倒すこと」で、新しい見出しとは合うが、takeaway の「迷うなら」とは合わない。
  suggestion: >-
    focus と見出しに合わせて「根拠がなければ、閉じない側に倒す」のように、運用の言い方(根拠がなければ)にする。
    「迷う」を残すなら「この講義では、迷うなら上げる側に倒す」のように講義の読み方と分かる形にし、notes の読み方の文(ch3-s13)を裏付けとする(D015)。
    どちらにするかは、要約の文(D004「迷ったら上げる」)との関係を含めて、PM と設計が決める。

