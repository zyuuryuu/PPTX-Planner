    理由: '分類の2つはこの講義の案だが、「製品の閉じるときの分類」(Microsoft Sentinel の閉じるときの選択肢。F605)を図の中で例として出す。この分類の選択肢の画面を写すなら実在の画面にあたり real:true が要る。語として添えるだけなら不要。show の書き方だけでは、どちらか決められない。show で、製品の分類をどう載せるかを書く必要がある'
