検査の名前: real の申告の検査(図が実在のものを写しているのに false としていないか。real:true の view が show と一致するか)
対象: trial/deck/05-proof.yaml(コミット 9a72668e565cb61d3babe49b0a2a87d54584c378)の全40枚
判定者: Claude Sonnet 5.5
基準: docs/stages/05-proof.md の合格条件「real の申告が正しい」、docs/model.md、上流の 01-model.yaml、01-sources.yaml、terms.yaml(model_labels)、04-storyline.yaml
判定の基準の補足: 実在の仕組み、業務、組織、画面、事案を写すなら real:true が要る。real が書かれていないものは false とみなす。判定は枚数ごと。
集計:
  合格: 31
  不合格: 5
  判定できない: 4
主な指摘:
  - real:true の3枚(ch2-s1、ch2-s2、ch2-s3)は、全て view が show の図を支えない。show にあって view にないもの(ch2-s1 の3つの区分、ch2-s2 のルールと発生源のつながり、ch2-s3 の端末→センサー→記録→検知の鎖)、view の場面と食い違うもの(ch2-s2 は S-siem-agent を選んだが show は発生源→サーバを直接描く)、relation の端が elements にないもの(ch2-s1 の E-sentinel-source、ch2-s3 の E-mde)がある。
  - 実在の事案(Target)を写す ch4-s1 は real:false と明示、ch4-s2 は real なし。どちらも実在の事案を写す。
  - 判定できない4枚(ch2-s5、ch3-s5、ch3-s11、ch3-s16)は、基準に実在の分類体系やこの SOC の運用が含まれるかが定められていないため。基準側の決めが要る。
  - 範囲外の参考: brief の「扱わない範囲」は「製品名を出さず、SIEMやEDRに共通する説明にする」とするが、ch2-s1、ch2-s3 は製品名を使う。この検査の対象ではないため判定しない。
slides:
  - id: ch1-s1
    判定: 合格
    引用: '届いたアラートを「3つに分ける」→「閉じる・調べる・上げるを決める」の2段で示す'
    理由: '講義の書き手が整理した判断の枠組みで、実在の仕組み・組織・画面を写さない。real なし(false 相当)は正しい'
  - id: ch1-s2
    判定: 合格
    引用: '(この講義の案)'
    理由: '案と明記された流れ図。実在の業務を写さない'
  - id: ch2-s1
    判定: 不合格
    引用: 'show: 「アラートの先に、1つのSOCの実測の3つの区分(侵害に至った攻撃、攻撃の試み、想定内の検知)を小さく添える」/ view.elements: [D-sentinel-data, E-sentinel-rule, D-sentinel-alert]、relations に R-sentinel-source-data'
    理由: 'real:true は妥当(Sentinel の仕組みを写す)。ただし view が show と合わない。(1) show の「3つの区分」は view に要素もつながりもない。しかも出典 F207 は別の SOC の Zeek(ネットワーク検知)の分類で、Sentinel のアラートから先につながる事実は仕組みの定義にない。アラートの先に添えると、定義にないつながりを描くことになる。(2) R-sentinel-source-data の始点 E-sentinel-source が view.elements にない。つながりの端が図に出ない。(3) show は「集めたデータ→分析ルール」と述べるが、定義の R-sentinel-rule-data は rule→data の問い合わせ(query)。矢印の向きが逆になりうる。直し方: 3つの区分を別の要素(real:false の添え書き)として切り離すか削る。E-sentinel-source を加えるか、relation を外す。向きは定義に従う'
  - id: ch2-s2
    判定: 不合格
    引用: 'show: 「複数のログの発生源(OS、セキュリティソフト、アプリケーション)→SIEMのサーバ→重要なイベント。サーバの中で記録値(時刻、IPアドレス、種別)を照らすルールを示す」/ view.scenario: S-siem-agent'
    理由: 'real:true は妥当。ただし view が show と合わない。(1) S-siem-agent の steps は R-agent-server(エージェント→サーバ)と R-server-significant のみ。show の「発生源→SIEMのサーバ」に当たるつながりが場面にない(場面の note に「発生源からエージェントへの段は出典にない」)。発生源→サーバを直接描くなら S-siem-agentless-push(R-source-server-push)を選ぶ必要がある。選んだ場面では E-siem-agent が必要だが view.elements にない。(2) E-src-os、E-src-secsw、E-src-app の3つは、場面のどのつながりにも出ない(R-os-source などは E-log-source への example_of で、E-log-source も view にない)。(3) 「記録値を照らすルール」は、view にある要素にもつながりにもない。出典 F101 は「ログ管理ソフトウェア一般」の記述で SIEM の節(F100)の記述ではなく、定義の R-server-significant の label にも「ルール」はない。(4) terms.yaml の model_labels は D-significant-event を「重要と判断されたイベント(まだアラートではない)」とする。show は「重要なイベント」とだけ書き、アラートでないことの扱いがない。E-src-app の定義の名前は「アプリケーションサーバ」で、show の「アプリケーション」と食い違う。なお、アラートの生成まで描かず「重要なイベント」で終えている点は、出典の範囲に合っている'
  - id: ch2-s3
    判定: 不合格
    引用: 'show: 「端末→EDRのセンサー→振る舞いの記録(…)→検知→アラート(製品の例: Microsoft Defender for Endpoint)」/ view.relations: [R-mde-sensor, R-mde-alert]'
    理由: 'real:true は妥当。ただし view が show の連鎖を支えない。(1) 定義にあるのは R-mde-sensor(E-mde が sensor を持つ。contain)と R-mde-alert(E-mde がアラートを作る。produce)だけ。端末→センサー、センサー→記録、記録→検知、検知→アラートのつながりは定義にない。S-mde の note に「テレメトリの収集が検知の前に来ることは出典に書かれていない」とあり、D-mde-telemetry は attributes の storage_location が unknown。E-mde-sensor は location が unknown で、端末の上にあるかも分からない。(2) 「検知」の段に当たる要素が MDE にない(D-edr-detection は NCA の要件で、MDE の要素ではない)。(3) E-mde は relation の始点だが view.elements にない。(4) focus「端末の振る舞いを継続して集めた記録から、アラートが作られること」は、記録からアラートが作られる因果を述べるが、定義はそのつながりを持たない。「鎖」として描くと、出典にない順序を作る。直し方: 定義にあるつながりだけを描く(MDE が、センサーとアラートを持つ)。記録→アラートの鎖が要るなら、描かずに調査依頼を出す'
  - id: ch2-s4
    判定: 合格
    引用: 'ログの種類ごとに、そこから分かることを並べた表'
    理由: 'ログの種類を比べる表で、実在の仕組み・組織・画面を写す図ではない。ただし E-src-os などの要素が定義にあるため、仕組みの図に寄せて描くなら real の再判定が要る'
  - id: ch2-s5
    判定: 判定できない
    引用: 'ATT&CKの戦術(なぜ)と技術(どのように)の2層'
    理由: 'MITRE ATT&CK は実在の知識体系で、その2層の構造(F114、F116)を写す。ただし docs/model.md の対象は「仕組み、業務、組織、画面」で、実在の分類体系を含むかが定められていない。含むなら、定義に要素がなく、real:true と調査依頼が要る。含まないなら、現状の申告で合格。基準の側で決める必要がある'
