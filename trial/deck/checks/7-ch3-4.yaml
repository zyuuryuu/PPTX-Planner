  - 'F005 quote: 最初の3か月は1件30分。過ぎたら、そこまでに見たことを付けて上げる。'
  reason: >-
    7-ch3-3 の no.1 の理由3点を1つずつ確かめた。
    (1) 運用と講義の読み方の区別: 新しい文は「迷う」も「上げすぎる」も含まない。条件の「根拠がなければ」は依頼者の証言(F006「根拠がなければ上げる」)と見出しの言い方で、
    運用の印のスライドの結論1行として、このSOCの規則と読まれても依頼者の証言と合う。D018 が見出しで避けた「依頼者の規則に『迷う』の扱いがあると読める」形は、takeaway からもなくなった。
    (2) 見出しとの食い違い: 「閉じない側に倒す」は、閉じる判断についての文で、上げる時点(30分)については述べていない。
    F006 では、閉じてよいのは誤検知と言えるときだけで、根拠がない間は30分の前でも後でも閉じない。したがって、30分を書かなくても見出しの「30分調べても」と食い違わない。
    前回の「迷った時点で30分を待たずに上げると読める」問題は、文が「上げる」を述べなくなったため生じない。
    (3) 立証の設計の focus と合う(語順も同じで、「こと」を除いた形)。
    裏付け: この文は運用の決まりを述べる文で、裏付けはこのスライド(ch3-s13、印は運用)のID と、その facts の F006 とする(D015)。
  note: >-
    参考(指摘ではない): takeaway は見出しの「閉じずに上げる」のうち「閉じない」の側だけを述べる。図の強調(highlight: A-escalate)は「上げる」の側だが、
    「閉じない側に倒す」の結果が上げることであるのは見出しと図で読めるため、食い違いとはしなかった。

