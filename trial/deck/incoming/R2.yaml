- id: F208
  statement: NISTの文書は、誤検知を『通常の非悪性の背景トラフィックで起きたアラート』と定義し、ネットワークIDSでの原因に、弱いシグネチャ、正当な管理ツールのトラフィックを挙げる
  kind: fact
  source: NIST ITL Bulletin 'Testing Intrusion Detection Systems' (2003-07)
  locator: https://csrc.nist.gov/files/pubs/shared/itlb/itlbul2003-07.pdf p.1-2 (Probability of False Alarms。引用はp.1末尾からp.2先頭へ改ページをまたぐ)
  as_of: 2003-07
  superseded_by: null
  quote: A false positive or false alarm is an alert caused by normal non-malicious background traffic. Some causes for Network IDS (NIDS) include weak signatures that alert on all traffic to a high-numbered port used by a backdoor; search for the occurrence of a common word such as help in the first 100 bytes of SNMP or other TCP connections; or detection of common violations of the TCP protocol. They can also be caused by normal network monitoring and maintenance traffic generated by network management tools.
  qualifiers:
  - NIDS(ネットワーク型IDS)について
  - 2003年の文書
  - 誤検知率は環境ごとに異なり、標準的なネットワークはない
  origin: NIST ITL Bulletin (2003-07)
  answers:
  - Q1.1.4
  verified: false
- id: F209
  statement: 'NIST SP 800-94: 良性の活動を悪性と誤認すると誤検知になる。すべての誤検知をなくすことはできず、一方を減らすと他方が増える。チューニングで調整する'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §2.2 (Common Detection Methodologies の前の共通属性の節; 本文 'Another common attribute of IDPS technologies')
  as_of: 2007-02
  superseded_by: null
  quote: When an IDPS incorrectly identifies benign activity as being malicious, a false positive has occurred. When an IDPS fails to identify malicious activity, a false negative has occurred. It is not possible to eliminate all false positives and negatives; in most cases, reducing the occurrences of one increases the occurrences of the other.
  qualifiers:
  - IDPS全般
  - 2007年版(Rev.1は2007-02)
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
- id: F210
  statement: 'NIST SP 800-94: 異常検知型IDPSは、プロファイルから大きく外れる良性の活動(保守作業など)のために多くの誤検知を出す。環境が多様・動的なほど多い'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §2.3.2 Anomaly-Based Detection
  as_of: 2007-02
  superseded_by: null
  quote: Anomaly-based IDPS products often produce many false positives because of benign activity that deviates significantly from profiles, especially in more diverse or dynamic environments.
  qualifiers:
  - 異常検知型の検知方式について
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
- id: F211
  statement: 'NIST SP 800-94: ネットワーク型IDPSは、監視対象の環境に合わせた多大なチューニングが必要で、新規導入では調整が済むまで多数の誤検知が出る'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §4.3.3.2 Detection Accuracy
  as_of: 2007-02
  superseded_by: null
  quote: Another common problem with network-based IDPSs’ accuracy is that they typically require considerable tuning and customization to take into account the characteristics of the monitored environment.
  qualifiers:
  - ネットワーク型IDPSについて
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
- id: F212
  statement: 'NIST SP 800-94: NBA(ネットワーク挙動分析)型では、環境の良性の変化(新サービスの追加、サービスの移設)でも誤検知が起きる'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §6.2.3.2 Detection Accuracy (NBA)
  as_of: 2007-02
  superseded_by: null
  quote: False positives can also be caused by benign changes in the environment. For example, if a new service is added to a host and a few hosts start using it, an NBA sensor is likely to detect this as anomalous.
  qualifiers:
  - NBA型について
  - 同文書は、低優先度のため誤検知と呼べるかは議論の余地があるとも述べる
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
