  superseded_by: null
  quote: Through analysis, we observe that SOC analysts are facing excessive alerts (24K–134K per day), but only a small percentage of the alerts (0.01%) are associated with true attacks. While the majority of true attacks can be detected within the same day, the post-attack investigation takes much longer time (53 days on average). Furthermore, we observe a significant portion of the alerts are related to “attack attempts” (attacks that did not lead to true compromises, 27%), and “benign triggers” (correctly matched security events but had business-justified explanations, 49%).
  qualifiers:
  - 1つのSOC
  - 割合は表4の期間(2020-12〜2022-07、14,429,534件)のもの
  - 27%と49%は下限(論文は『at least』と述べる。良性のトリガーは明確な証拠があるものだけを数えた)
  - 分類不能(Unknown)が23.72%残る
  - 「攻撃の試み」は侵害に至らなかった攻撃、「良性のトリガー」は正しく一致したが業務上の説明があるセキュリティ事象と定義されている
  origin: 同SOCのZeekアラートログ(著者らが実測)
  answers:
  - Q1.1.3
  - Q1.1.4
  verified: false
- id: F208
  statement: NISTの文書は、誤検知を『通常の非悪性の背景トラフィックで起きたアラート』と定義し、ネットワークIDSでの原因に、弱いシグネチャ、正当なネットワーク管理ツールのトラフィックを挙げる。誤検知率はネットワーク環境ごとに異なることがある
  kind: fact
  source: NIST ITL Bulletin 'Testing Intrusion Detection Systems' (2003-07)
  locator: https://csrc.nist.gov/files/pubs/shared/itlb/itlbul2003-07.pdf p.1-2 (Probability of False Alarms。引用はp.1末尾からp.2先頭へ改ページをまたぐ)
  as_of: 2003-07
  superseded_by: null
  quote: A false positive or false alarm is an alert caused by normal non-malicious background traffic. Some causes for Network IDS (NIDS) include weak signatures that alert on all traffic to a high-numbered port used by a backdoor; search for the occurrence of a common word such as help in the first 100 bytes of SNMP or other TCP connections; or detection of common violations of the TCP protocol. They can also be caused by normal network monitoring and maintenance traffic generated by network management tools. It is difficult to measure false alarms because an IDS may have a different false positive rate in each network environment, and there is no such thing as a standard network.
  qualifiers:
  - NIDS(ネットワーク型IDS)について
  - 2003年の文書
  - 「標準的なネットワークはない」ため、誤検知の測定は難しいとされている
  origin: NIST ITL Bulletin (2003-07)
  answers:
  - Q1.1.4
  verified: false
- id: F209
  statement: 'NIST SP 800-94: 良性の活動を悪性と誤認すると誤検知になる。すべての誤検知をなくすことはできず、多くの場合、一方を減らすと他方が増える。多くの組織は偽陰性を減らす代わりに偽陽性が増える設定を選び、その分の分析資源が要る。設定を調整して検知精度を改善することをチューニングと呼ぶ'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §2.2 Key Functions of IDPS Technologies
  as_of: 2007-02
  superseded_by: null
  quote: When an IDPS incorrectly identifies benign activity as being malicious, a false positive has occurred. When an IDPS fails to identify malicious activity, a false negative has occurred. It is not possible to eliminate all false positives and negatives; in most cases, reducing the occurrences of one increases the occurrences of the other. Many organizations choose to decrease false negatives at the cost of increasing false positives, which means that more malicious events are detected but more analysis resources are needed to differentiate false positives from true malicious events. Altering the configuration of an IDPS to improve its detection accuracy is known as tuning.
  qualifiers:
  - IDPS全般
  - SP 800-94(2007年)
  - 原文は『in most cases』(例外がある)
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
- id: F210
  statement: 'NIST SP 800-94: 月1回だけの保守作業などは学習期間に観測されず、プロファイルからの大きな逸脱として警告を起こしうる。異常検知型IDPSは、プロファイルから大きく外れる良性の活動のために多くの誤検知を出し、環境が多様・動的なほど多い'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §2.3.2 Anomaly-Based Detection
  as_of: 2007-02
  superseded_by: null
  quote: Another problem with building profiles is that it can be very challenging in some cases to make them accurate, because computing activity can be so complex. For example, if a particular maintenance activity that performs large file transfers occurs only once a month, it might not be observed during the training period; when the maintenance occurs, it is likely to be considered a significant deviation from the profile and trigger an alert. Anomaly-based IDPS products often produce many false positives because of benign activity that deviates significantly from profiles, especially in more diverse or dynamic environments.
  qualifiers:
  - 異常検知型の検知方式について
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
- id: F211
  statement: 'NIST SP 800-94: ネットワーク型IDPSの精度に関する一般的な問題として、監視対象の環境の特性に合わせた多大なチューニングとカスタマイズが必要である'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §4.3.3.2 Detection Accuracy
  as_of: 2007-02
  superseded_by: null
  quote: Another common problem with network-based IDPSs’ accuracy is that they typically require considerable tuning and customization to take into account the characteristics of the monitored environment.
  qualifiers:
  - ネットワーク型IDPSについて
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
- id: F212
  statement: 'NIST SP 800-94: NBA型では、環境の良性の変化(新サービスの追加)でも異常として検知されうる。ただし通常は低優先度のアラートで、誤検知と呼べるかは議論の余地がある'
  kind: fact
  source: NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)
  locator: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf §6.2.3.2 Detection Accuracy (NBA)
  as_of: 2007-02
  superseded_by: null
  quote: False positives can also be caused by benign changes in the environment. For example, if a new service is added to a host and a few hosts start using it, an NBA sensor is likely to detect this as anomalous. However, typically this would be a low-priority alert, and not reported as an attack, so it is debatable whether this can truly be considered a false positive.
  qualifiers:
  - NBA(ネットワーク挙動分析)型について
  - 『誤検知と呼べるか議論の余地がある』と同文書が述べている
  origin: NIST SP 800-94
  answers:
  - Q1.1.4
  verified: false
