  statement: NIST SP 800-61r3 は、資源に限りがあるため、インシデントを到着順に扱わないとし、トリアージ・優先順位付け・エスカレーション・復旧開始の判断をリスク評価の要因の集合に基づけるとする。その集合は組織の必要と成熟度により単純なものから非常に複雑なものまである
