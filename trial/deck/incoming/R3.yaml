  statement: 民間の SOC 向け解説は、真偽の判定の結果を表で示す。良性の活動でアラートが発火した場合(False Positive)は閉じて所見を記録する。挙動が実在しても承認済みか想定内の場合(Benign True Positive)は閉じてルールの調整を検討する。結論に足る証拠がない場合(Unclear)は上位のアナリストにエスカレーションするか追加データを待つ
