- id: F307
  statement: NIST の手順書は、インシデントの取扱いの最初の段階を、兆候の分析、相関情報の探索、調査、文書化と証拠収集の順に並べ、その後に優先順位付けを置く。実際の手順はインシデントの種類で変わり、1.2 や 1.3 が不要な場合もあり、この順序を常に守るものではないとする
  kind: fact
  source: NIST SP 800-61 Rev. 2 Computer Security Incident Handling Guide
  locator: https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.5 Incident Handling Checklist, Table 3-5
  as_of: 2012-08
  quote: The checklist in Table 3-5 provides the major steps to be performed in the handling of an incident. Note that the actual steps performed may vary based on the type of incident and the nature of individual incidents. For example, if the handler knows exactly what has happened based on analysis of indicators (Step 1.1), there may be no need to perform Steps 1.2 or 1.3 to further research the activity. The checklist provides guidelines to handlers on the major steps that should be performed; it does not dictate the exact sequence of steps that should always be followed. Table 3-5. Incident Handling Checklist Action Completed Detection and Analysis 1. Determine whether an incident has occurred 1.1 Analyze the precursors and indicators 1.2 Look for correlating information 1.3 Perform research (e.g., search engines, knowledge base) 1.4 As soon as the handler believes an incident has occurred, begin documenting the investigation and gathering evidence 2. Prioritize handling the incident based on the relevant factors (functional impact, information impact, recoverability effort, etc.)
  qualifiers:
  - 対象はアラート1件ではなく「インシデントが起きたか」の判定
  - 1.4 は「ハンドラーがインシデントが起きたと考えたらすぐに」という条件付き
  - 表の箇条書きを連結して写した
  - 出典の NIST SP 800-61 Rev. 2 は 2025-04-03 に撤回され、SP 800-61r3 に全面的に置き換えられた(PDF 冒頭の Withdrawn Publication の表示による)
  origin: NIST SP 800-61r2
  answers:
  - Q2.2
  verified: false
- id: F308
  statement: NIST は、侵入検知システムが誤検知(誤った指標)を出すことがあり、指標のそれぞれが正当かを評価するのが理想だとし、指標が正確でもインシデントが起きたとは限らないと述べる
  kind: fact
  source: NIST SP 800-61 Rev. 2 Computer Security Incident Handling Guide
  locator: https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.2.4 Incident Analysis
  as_of: 2012-08
  quote: 'Intrusion detection systems may produce false positives—incorrect indicators. These examples demonstrate what makes incident detection and analysis so difficult: each indicator ideally should be evaluated to determine if it is legitimate. Making matters worse, the total number of indicators may be thousands or millions a day. Finding the real security incidents that occurred out of all the indicators can be a daunting task. Even if an indicator is accurate, it does not necessarily mean that an incident has occurred.'
  qualifiers:
  - '"ideally"(理想的には)という限定付き'
  - 指標が1日に数千から数百万件になりうるという前提の文脈
  - 出典の NIST SP 800-61 Rev. 2 は 2025-04-03 に撤回され、SP 800-61r3 に全面的に置き換えられた(PDF 冒頭の Withdrawn Publication の表示による)
  origin: NIST SP 800-61r2
  answers:
