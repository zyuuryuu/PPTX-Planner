  as_of: 2026-09-15
  quote: 'The factors that drive priority are well understood: Priority Factor | What to Assess ; Asset criticality | Is the affected system a domain controller, a financial database, or a developer laptop? ; Attack stage | Early-stage reconnaissance vs. active lateral movement vs. potential exfiltration demand very different urgency ; Threat intelligence match | Does the indicator match known adversary TTPs or active threat actor campaigns? ; Anomaly score | How far does this behavior deviate from the established baseline for this user or host? ; Business context | Is this alert firing during business hours, or at 3 AM on a Sunday?'
