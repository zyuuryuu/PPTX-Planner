  - Q3.1.1
  verified: false
- id: F309
  statement: NIST は、インシデントが起きたとチームが考えたときの初期分析で、影響範囲(影響を受けるネットワーク・システム・アプリケーション、発生源、発生の仕方)を確かめるとし、初期分析は後続の作業の優先順位付けに足る情報を与えるべきだとする
  kind: fact
  source: NIST SP 800-61 Rev. 2 Computer Security Incident Handling Guide
  locator: https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.2.4 Incident Analysis
  as_of: 2012-08
  quote: When the team believes that an incident has occurred, the team should rapidly perform an initial analysis to determine the incident’s scope, such as which networks, systems, or applications are affected; who or what originated the incident; and how the incident is occurring (e.g., what tools or attack methods are being used, what vulnerabilities are being exploited). The initial analysis should provide enough information for the team to prioritize subsequent activities, such as containment of the incident and deeper analysis of the effects of the incident.
  qualifiers:
  - 「インシデントが起きたとチームが考えたとき」の手順であり、誤検知の判定そのものではない
  - 出典の NIST SP 800-61 Rev. 2 は 2025-04-03 に撤回され、SP 800-61r3 に全面的に置き換えられた(PDF 冒頭の Withdrawn Publication の表示による)
  origin: NIST SP 800-61r2
  answers:
  - Q2.2
  verified: false
