  quote: '"You should trigger an escalation when you encounter an incident that exceeds your predefined technical scope" / "Escalate as soon as you hit the limit of your investigative authority."'
  qualifiers: [個人が運営する企業ブログで標準や公的文書ではない, 同ページは自社の書籍を宣伝している, 時間の目安は書かれていない, 2つの引用を「 / 」でつないで写している]
