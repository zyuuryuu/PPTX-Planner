- id: F409
  statement: "NISTは、分析と優先づけの後、誰に何をいつ報告するかを方針で定めるべきとし、通知先の例にCIO、情報セキュリティ責任者、組織内外の他のインシデント対応チームを挙げている"
  kind: fact
  source: "NIST SP 800-61 Rev.2 Computer Security Incident Handling Guide"
  locator: "https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.2.7 Incident Notification"
  as_of: "2012-08 (2025-04-03 に撤回)"
  quote: 'When an incident is analyzed and prioritized, the incident response team needs to notify the appropriate individuals so that all who need to be involved will play their roles. Incident response policies should include provisions concerning incident reporting—at a minimum, what must be reported to whom and at what times (e.g., initial notification, regular status updates). The exact reporting requirements vary among organizations, but parties that are typically notified include:'
  qualifiers: [撤回済みの版, 具体的な引き上げの閾値は書かれておらず、組織ごとの方針に委ねている, 通知先の一覧(CIO、Head of information security、Local information security officer、Other incident response teams within the organization、External incident response teams (if appropriate))は引用の直後の箇条書き]
  origin: "NIST SP 800-61 Rev.2"
  answers: [Q3.3.1]
  verified: true

- id: F410
  statement: "NISTは、インシデントの優先づけを、機能への影響、情報への影響、復旧の可能性などの要因に基づいて行うべきで、先着順にしないとしている"
  kind: fact
  source: "NIST SP 800-61 Rev.2 Computer Security Incident Handling Guide"
  locator: "https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.2.6 Incident Prioritization"
  as_of: "2012-08 (2025-04-03 に撤回)"
  quote: 'Prioritizing the handling of the incident is perhaps the most critical decision point in the incident handling process. Incidents should not be handled on a first-come, first-served basis as a result of resource limitations. Instead, handling should be prioritized based on the relevant factors, such as the following:'
  qualifiers: [撤回済みの版, 要因は引用の直後に Functional Impact, Information Impact, Recoverability の3つが続く, 引き上げの閾値そのものではない]
  origin: "NIST SP 800-61 Rev.2"
  answers: [Q3.3.1]
  verified: true

