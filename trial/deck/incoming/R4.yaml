- id: F405
  statement: "同じSOP集は、P1を「もっと調べる」ために遅らせず、先に上げて調査は並行して進めるとしている。判断に迷うときは、上げすぎる側に倒すとしている"
  kind: fact
  source: "SOC-SOP「Escalation Matrix」(IR-SOP-015)"
