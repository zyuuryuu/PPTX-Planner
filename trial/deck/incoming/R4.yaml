  statement: "インシデントかどうかの判定が判断の問題になることがあり、他の技術者や情報セキュリティの担当者と協力して決める必要が生じうる"
  kind: fact
  source: "NIST SP 800-61 Rev.2 Computer Security Incident Handling Guide"
  locator: "https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.2.4 Incident Analysis"
  as_of: "2012-08 (2025-04-03 に撤回)"
  quote: 'Determining whether a particular event is actually an incident is sometimes a matter of judgment. It may be necessary to collaborate with other technical and information security personnel to make a decision.'
  qualifiers: [撤回済みの版, 時間や範囲の数値は書かれていない]
  origin: "NIST SP 800-61 Rev.2"
  answers: [Q3.2, Q3.3.1]
  verified: false

- id: F402
