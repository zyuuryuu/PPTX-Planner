  qualifiers: [有志のオープンソースのSOP集で、標準や公的文書ではない, 運営する企業のロゴとリンクがある(製品販売の記述は見当たらない), 重大度の定義はこのSOP集の独自のもの, 2つのラベルを「 / 」でつないで写している]
