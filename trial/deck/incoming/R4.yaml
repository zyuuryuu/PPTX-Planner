# 調査依頼 R4 の結果。stance は書かない。
# verified: NIST・CISA は収集セッションが保存した PDF から抽出して照合した(true)。
# それ以外の Web 資料は、取得を担当した補助エージェントの報告に基づく。収集セッション自身は原文を未照合(false)。
# 開けなかった出典: MITRE「11 Strategies of a World-Class Cybersecurity Operations Center」(403)、Expel のアラートライフサイクルのページ(本文が取得できず)。
# SOC-SOP の Tier 1 Runbook は、要約を介した部分しか得られなかったため、事実として返さない。

- id: F400
  statement: "インシデント対応チームは、事象がインシデントだと判断したとき、初動の分析で、影響を受ける範囲(ネットワーク、システム、アプリケーション)、発生源、手口を速やかに判定する。この初動の分析は、後続の作業(封じ込め、より深い分析)の優先づけに足りる情報を出すものとされる"
  kind: fact
  source: "NIST SP 800-61 Rev.2 Computer Security Incident Handling Guide"
  locator: "https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.2.4 Incident Analysis"
  as_of: "2012-08 (2025-04-03 に撤回、後継は SP 800-61r3)"
  quote: 'The incident response team should work quickly to analyze and validate each incident, following a pre-defined process and documenting each step taken. When the team believes that an incident has occurred, the team should rapidly perform an initial analysis to determine the incident’s scope, such as which networks, systems, or applications are affected; who or what originated the incident; and how the incident is occurring (e.g., what tools or attack methods are being used, what vulnerabilities are being exploited). The initial analysis should provide enough information for the team to prioritize subsequent activities, such as containment of the incident and deeper analysis of the effects of the incident.'
  qualifiers: [インシデントが起きたとチームが判断した後の初動, 撤回済みの版, 時間の目安は書かれていない]
  origin: "NIST SP 800-61 Rev.2"
  answers: [Q3.2]
  verified: true

- id: F401
  statement: "インシデントかどうかの判定が判断の問題になることがあり、他の技術者や情報セキュリティの担当者と協力して決める必要が生じうる"
  kind: fact
  source: "NIST SP 800-61 Rev.2 Computer Security Incident Handling Guide"
  locator: "https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf 3.2.4 Incident Analysis"
  as_of: "2012-08 (2025-04-03 に撤回)"
  quote: 'Determining whether a particular event is actually an incident is sometimes a matter of judgment. It may be necessary to collaborate with other technical and information security personnel to make a decision.'
  qualifiers: [撤回済みの版, 時間や範囲の数値は書かれていない]
  origin: "NIST SP 800-61 Rev.2"
  answers: [Q3.2, Q3.3.1]
  verified: true

- id: F402
  statement: "CISAの連邦政府向けプレイブックは、調査範囲を、アクセスの種類、影響を受けた資産の範囲、攻撃者が得た権限の水準、業務や情報への影響で決めるとしている"
  kind: fact
  source: "CISA Federal Government Cybersecurity Incident and Vulnerability Response Playbooks (Incident Response Playbook)"
  locator: "https://www.cisa.gov/sites/default/files/2024-08/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf Detection & Analysis Activities, Determine Investigation Scope"
  as_of: "2024-08 (URL の日付。版の表記は未確認)"
  quote: 'Use available data to identify the type of access, the extent to which assets have been affected, the level of privilege attained by the adversary, and the operational or informational impact.'
  qualifiers: [対象は連邦文民行政機関(FCEB)の、重大インシデントが宣言された、または未だ合理的に除外されていない事案, 時間の目安は書かれていない]
  origin: "CISA Federal Government Cybersecurity Incident and Vulnerability Response Playbooks"
  answers: [Q3.2]
  verified: true

- id: F403
  statement: "アラート1件あたりのトリアージの持ち時間は、Tier 1では12〜20分が一般的とされる。その時間内に判定に達しなければ、記録した要約を付けてTier 2へ上げる"
  value: 12-20
  unit: 分
  kind: fact
  source: "Decryption Digest「SOC Analyst Alert Triage: A Field Guide to Working the Queue」(Eric Bang)"
  locator: "https://www.decryptiondigest.com/blog/soc-analyst-alert-triage-guide 節「The Alert Triage Mindset: Verdicts, Not Investigations」"
  as_of: "2026-05-14 公開、2026-07-02 更新"
  metric: "Tier 1のアラート1件あたりのトリアージ時間の目安"
  quote: 'Set a per-alert triage budget (12-20 minutes is typical for Tier 1). ... If you cannot reach a verdict within that window, escalate to Tier 2 with a documented summary'
  qualifiers: [Tier 1の場合, 実務者向けの解説記事で標準や公的文書ではない, 出版社は広告やスポンサー募集を掲載している, 「...」は原文の省略を示す, 根拠となる調査や数値の出典は記事中で確認できていない]
  origin: "Decryption Digest(独自の見解)"
  answers: [Q3.2, Q3.3.1]
  verified: false

