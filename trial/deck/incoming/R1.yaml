- id: F108
  statement: "認証サーバのログは、認証の試行ごとに、接続元、ユーザー名、成否、日時を記録する"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software(Authentication Servers)"
  as_of: "2006-09"
  quote: "Authentication servers, including directory servers and single sign-on servers, typically log each authentication attempt, including its origin, username, success or failure, and date and time."
  qualifiers: ["2006年版", "「通常は」(typically)の記述", "ディレクトリサーバとシングルサインオンサーバを含む", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
  verified: false
- id: F109
  statement: "ファイアウォールは、ルータと同様にポリシーに基づいて通信を許可または遮断するが、通信の検査にはるかに高度な方法を用いる。状態の追跡と内容の検査もできる。ルータよりも複雑なポリシーと詳細な活動ログを持つ傾向がある"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software(Firewalls)"
  as_of: "2006-09"
  quote: "Like routers, firewalls permit or block activity based on a policy; however, firewalls use much more sophisticated methods to examine network traffic. Firewalls can also track the state of network traffic and perform content inspection. Firewalls tend to have more complex policies and generate more detailed logs of activity than routers."
  qualifiers: ["原文は 'tend to'(傾向がある)", "2006年版", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
  verified: false
- id: F110
  statement: "OSの監査記録は、認証の成功と失敗、ファイルアクセス、セキュリティポリシーの変更、アカウントの変更、権限の使用などのセキュリティ事象の情報を含む"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.2 Operating Systems(Audit Records)"
  as_of: "2006-09"
  quote: "Audit records contain security event information such as successful and failed authentication attempts, file accesses, security policy changes, account changes (e.g., account creation and deletion, account privilege assignment), and use of privileges."
  qualifiers: ["原文は 'such as'(例示であり、全てではない)", "2006年版", "記録する事象の種類は管理者が指定できる(OSによる)", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
  verified: false
- id: F111
  statement: "OSログは、特定のホストに関する不審な活動の特定と調査に最も役立つ。セキュリティソフトが不審な活動を見つけた後に、詳細を得るために参照されることが多い"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.2 Operating Systems"
  as_of: "2006-09"
  quote: "OS logs are most beneficial for identifying or investigating suspicious activity involving a particular host. After suspicious activity is identified by security software, OS logs are often consulted to get more information on the activity."
  qualifiers: ["2006年版", "「しばしば」(often)の記述", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
  verified: false
- id: F112
  statement: "アプリケーションでしか記録できない情報が多く、そのためアプリケーションログは、アプリケーション関連のセキュリティインシデント、監査、遵守の取り組みに特に有用である。一方、アプリケーションログは独自形式であることが多く、内容が文脈に依存することが多いため、確認に多くの資源が要る"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.3 Applications"
  as_of: "2006-09"
  quote: "Much of this information, particularly for applications that are not used through unencrypted network communications, can only be logged by the applications, which makes application logs particularly valuable for application-related security incidents, auditing, and compliance efforts. However, these logs are often in proprietary formats that make them more difficult to use, and the data they contain is often highly context-dependent, necessitating more resources to review their contents."
  qualifiers: ["「アプリケーション側でしか記録できない」のは、特に暗号化されていないネットワーク通信を通じて使われないアプリケーションの情報(原文 'particularly for applications that are not used through unencrypted network communications')", "原文は 'often'(〜が多い)", "2006年版"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
  verified: false
- id: F113
  statement: "複数の時間帯にシステムを持つ組織は、記録された時刻を単一の時間帯に変換する必要があることが多い。システムの時計が互いにずれている場合は、ずれたログ源の記録時刻を加減する必要が生じうる"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 第3章 脚注24"
  as_of: "2006-09"
  quote: "Normalizing times is often particularly challenging. Organizations with systems in multiple time zones often need to convert all logged times to a single time zone. Also, systems’ clocks might not be in sync with each other, so it might be necessary to add or subtract times from the log entries recorded by out-of-sync sources."
  qualifiers: ["原文は、時間帯の変換には 'often need'(多い)、時計のずれの補正には 'might be necessary'(必要になりうる)", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)", "脚注の記述", "複数の時間帯にシステムを持つ組織の場合", "脚注は続けて、NTPなどの時刻同期技術を可能な限り使うべきとしている"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
  verified: false
