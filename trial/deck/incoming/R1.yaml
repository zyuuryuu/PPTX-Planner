# 調査依頼 R1 の結果(検査の指摘による修正済み。verified は全件 false)。stance は書かない。
- id: F100
  statement: "SIEMは、複数のログ源のデータを分析し、ログ項目間でイベントを相関させ、重要なイベントを特定して優先順位を付ける"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 3.4 Security Information and Event Management Software"
  as_of: "2006-09"
  quote: "Regardless of how it receives log data (through agents or an agentless method), an SIEM server analyzes the data from all the different log sources, correlates events among the log entries, identifies and prioritizes significant events, and initiates responses to events if desired."
  qualifiers: ["2006年版", "応答の開始は「必要な場合」", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)", "優先順位付けは一部のSIEM製品の機能。脚注37に 'Some SIEM products can prioritize events based on correlating events with other sources of information, such as the result of vulnerability scans.' とある"]
  origin: "NIST SP 800-92"
  answers: ["Q1.1.1"]
  verified: false
- id: F101
  statement: "ログのイベント相関で最も一般的なのは、タイムスタンプ、IPアドレス、イベント種別などの記録値に基づいて複数のログ項目を照合するルールベース相関である"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 3.2 Functions(Analysis)"
  as_of: "2006-09"
  quote: "Event correlation is finding relationships between two or more log entries. The most common form of event correlation is rule-based correlation, which matches multiple log entries from a single source or multiple sources based on logged values, such as timestamps, IP addresses, and event types."
  qualifiers: ["2006年版", "ログ管理ソフトウェア一般の機能として記述", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)", "同じ節に 'Event correlation can also be performed in other ways, such as using statistical methods or visualization tools.' とあり、ルール以外の相関もある"]
  origin: "NIST SP 800-92"
  answers: ["Q1.1.1"]
  verified: false
- id: F102
  statement: "シグネチャ検知は、既知の脅威に対応するパターン(シグネチャ)を観測イベントと比較して、潜在的なインシデントを見つける方式である"
  kind: "fact"
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 2.3.1 Signature-Based Detection"
  as_of: "2007-02"
  quote: "A signature is a pattern that corresponds to a known threat. Signature-based detection is the process of comparing signatures against observed events to identify possible incidents."
  qualifiers: ["2007年版", "IDPS(侵入検知防止システム)の検知方式として記述。EDRやSIEMそのものの定義ではない", "後続の文で「未知の脅威には largely ineffective」と述べる", "SP 800-94 は CSRC のページで Final(2007-02)。撤回の表示なし。2012年の改訂草案は最終版にならず廃止、NISTは新しい指針の開始を告知するとの注記あり(2022-07-15。確認日 2026-11-23)"]
  origin: "NIST SP 800-94"
  answers: ["Q1.1.1"]
  verified: false
- id: F121
  statement: "シグネチャ検知は、既知の脅威の検知には非常に有効だが、未知の脅威、回避手法で偽装された脅威、既知の脅威の多くの変種の検知にはほとんど効果がない"
  kind: "fact"
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 2.3.1 Signature-Based Detection"
  as_of: "2007-02"
  quote: "Signature-based detection is very effective at detecting known threats but largely ineffective at detecting previously unknown threats, threats disguised by the use of evasion techniques, and many variants of known threats."
  qualifiers: ["2007年版", "IDPS(侵入検知防止システム)の検知方式として記述。EDRやSIEMそのものの定義ではない", "後続の文で「未知の脅威には largely ineffective」と述べる", "SP 800-94 は CSRC のページで Final(2007-02)。撤回の表示なし。2012年の改訂草案は最終版にならず廃止、NISTは新しい指針の開始を告知するとの注記あり(2022-07-15。確認日 2026-11-23)"]
  origin: "NIST SP 800-94"
  answers: ["Q1.1.1"]
  verified: false
- id: F103
  statement: "振る舞い異常検知は、通常とみなす活動の定義(プロファイル)を観測イベントと比較し、大きな逸脱を見つける方式である"
  kind: "fact"
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 2.3.2 Anomaly-Based Detection"
  as_of: "2007-02"
  quote: "Anomaly-based detection is the process of comparing definitions of what activity is considered normal against observed events to identify significant deviations."
  qualifiers: ["IDPSの検知方式として記述。EDRやSIEMそのものの定義ではない", "SP 800-94 は CSRC のページで Final(2007-02)。撤回の表示なし。2012年の改訂草案は最終版にならず廃止、NISTは新しい指針の開始を告知するとの注記あり(2022-07-15。確認日 2026-11-23)"]
  origin: "NIST SP 800-94"
  answers: ["Q1.1.1"]
  verified: false
- id: F122
  statement: "振る舞い異常検知の主な利点は、未知の脅威の検知に非常に有効でありうることである"
  kind: "fact"
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 2.3.2 Anomaly-Based Detection"
  as_of: "2007-02"
  quote: "The major benefit of anomaly-based detection methods is that they can be very effective at detecting previously unknown threats."
  qualifiers: ["IDPSの検知方式として記述。EDRやSIEMそのものの定義ではない", "原文は 'can be very effective'(有効でありうる)", "SP 800-94 は CSRC のページで Final(2007-02)。撤回の表示なし。2012年の改訂草案は最終版にならず廃止、NISTは新しい指針の開始を告知するとの注記あり(2022-07-15。確認日 2026-11-23)"]
  origin: "NIST SP 800-94"
