- id: F104
  statement: "ホスト型IDPSは、単一ホストの特性とそのホスト内のイベントを不審な活動について監視する。監視しうる特性の例として、そのホスト宛のネットワーク通信、システムログ、実行中のプロセス、アプリケーション活動、ファイルへのアクセスと変更、システムとアプリケーションの設定変更が挙げられている"
  kind: "fact"
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 第2章 IDPS技術の種類(Host-Based)"
  as_of: "2007-02"
  quote: "Host-Based, which monitors the characteristics of a single host and the events occurring within that host for suspicious activity. Examples of the types of characteristics a host-based IDPS might monitor are network traffic (only for that host), system logs, running processes, application activity, file access and modification, and system and application configuration changes."
  qualifiers: ["原文は 'might monitor' と 'Examples'(監視しうるものの例であり、必ず監視するものではない)", "2007年版", "端末上で動くエージェント型の検知技術の記述。EDRという語は用いていない", "SP 800-94 は CSRC のページで Final(2007-02)。撤回の表示なし。2012年の改訂草案は最終版にならず廃止、NISTは新しい指針の開始を告知するとの注記あり(2022-07-15。確認日 2026-11-23)"]
  origin: "NIST SP 800-94"
  answers: ["Q1.1.1"]
  verified: false
- id: F105
  statement: "セキュリティソフトのログは、主にコンピュータのセキュリティに関する情報を含む。OSログとアプリケーションログは、セキュリティ関連のデータを含む様々な情報を通常含む"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1 The Basics of Computer Security Logs"
  as_of: "2006-09"
  quote: "Security software logs primarily contain computer security-related information. Section 2.1.1 describes them. Operating system logs (described in Section 2.1.2) and application logs (described in Section 2.1.3) typically contain a variety of information, including computer security-related data."
  qualifiers: ["2006年版", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)", "特に関心のあるログの種類として挙げた3つで、全てではない。同じ節の続きに、スイッチや無線アクセスポイントなどのネットワーク機器のログ、ネットワーク監視ソフトのログもセキュリティに関係しうるとある"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
  verified: false
- id: F106
  statement: "侵入検知・防止システムのログは、不審な挙動や検出した攻撃の詳細と、防止システムが実行した遮断の内容を記録する"
  kind: "fact"
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software"
  as_of: "2006-09"
  quote: "Intrusion detection and intrusion prevention systems record detailed information on suspicious behavior and detected attacks, as well as any actions intrusion prevention systems performed to stop malicious activity in progress."
  qualifiers: ["2006年版", "SP 800-92 は CSRC のページで Final(2006-09)。撤回の表示なし(確認日 2026-11-23)"]
  origin: "NIST SP 800-92"
  answers: ["Q1.2"]
