# 調査依頼 R1 の結果。stance は書かない。
# 結果: Q1.1.1 partial / Q1.2 answered / Q1.3 answered
# 注: NIST SP 800-92(2006)、SP 800-94(2007)は archived/withdrawn の旧版。as_of に発行日を記す。
- id: F100
  statement: "SIEMは、複数のログ源のデータを分析し、ログ項目間でイベントを相関させ、重要なイベントを特定して優先順位を付ける"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 3.4 Security Information and Event Management Software"
  as_of: "2006-09"
  quote: "Regardless of how it receives log data (through agents or an agentless method), an SIEM server analyzes the data from all the different log sources, correlates events among the log entries, identifies and prioritizes significant events, and initiates responses to events if desired."
  qualifiers: ["2006年版", "旧版(archived)の記述", "応答の開始は「必要な場合」"]
  origin: "NIST SP 800-92"
  answers: [Q1.1.1]
  verified: true
- id: F101
  statement: "ログのイベント相関で最も一般的なのは、タイムスタンプ、IPアドレス、イベント種別などの記録値に基づいて複数のログ項目を照合するルールベース相関である"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 3.2 Functions(Analysis)"
  as_of: "2006-09"
  quote: "Event correlation is finding relationships between two or more log entries. The most common form of event correlation is rule-based correlation, which matches multiple log entries from a single source or multiple sources based on logged values, such as timestamps, IP addresses, and event types."
  qualifiers: ["2006年版", "旧版(archived)の記述", "ログ管理ソフトウェア一般の機能として記述"]
  origin: "NIST SP 800-92"
  answers: [Q1.1.1]
  verified: true
- id: F102
  statement: "シグネチャ検知は、既知の脅威に対応するパターンを観測イベントと比較して潜在的なインシデントを見つける。既知の脅威には非常に有効だが、未知の脅威や回避された脅威には効果が乏しい"
  kind: fact
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 2.3.1 Signature-Based Detection"
  as_of: "2007-02"
  quote: "A signature is a pattern that corresponds to a known threat. Signature-based detection is the process of comparing signatures against observed events to identify possible incidents."
  qualifiers: ["2007年版", "旧版の記述", "IDPS(侵入検知防止システム)の検知方式として記述。EDRやSIEMそのものの定義ではない", "後続の文で「未知の脅威には largely ineffective」と述べる"]
  origin: "NIST SP 800-94"
  answers: [Q1.1.1]
  verified: true
- id: F103
  statement: "振る舞い異常検知は、通常とみなす活動の定義(プロファイル)を観測イベントと比較し、大きな逸脱を見つける。未知の脅威の検知に有効である"
  kind: fact
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 2.3.2 Anomaly-Based Detection"
  as_of: "2007-02"
  quote: "Anomaly-based detection is the process of comparing definitions of what activity is considered normal against observed events to identify significant deviations."
  qualifiers: ["2007年版", "旧版の記述", "IDPSの検知方式として記述。EDRやSIEMそのものの定義ではない"]
  origin: "NIST SP 800-94"
  answers: [Q1.1.1]
  verified: true
- id: F104
  statement: "ホスト型IDPSは、単一ホストの特性とそのホスト内のイベント(システムログ、実行中のプロセス、アプリケーション活動、ファイルの変更など)を監視する"
  kind: fact
  source: "NIST SP 800-94 Guide to Intrusion Detection and Prevention Systems (IDPS)"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf 第2章 IDPS技術の種類(Host-Based)"
  as_of: "2007-02"
  quote: "Host-Based, which monitors the characteristics of a single host and the events occurring within that host for suspicious activity. Examples of the types of characteristics a host-based IDPS might monitor are network traffic (only for that host), system logs, running processes, application activity, file access and modification, and system and application configuration changes."
  qualifiers: ["2007年版", "旧版の記述", "端末上で動くエージェント型の検知技術の記述。EDRという語は用いていない"]
  origin: "NIST SP 800-94"
  answers: [Q1.1.1]
  verified: true
- id: F105
  statement: "セキュリティソフトのログは、主にコンピュータのセキュリティに関する情報を含む。OSログとアプリケーションログは、セキュリティ関連のデータを含む様々な情報を通常含む"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1 The Basics of Computer Security Logs"
  as_of: "2006-09"
  quote: "Security software logs primarily contain computer security-related information. Section 2.1.1 describes them. Operating system logs (described in Section 2.1.2) and application logs (described in Section 2.1.3) typically contain a variety of information, including computer security-related data."
  qualifiers: ["2006年版", "旧版(archived)の記述", "ログを3分類(セキュリティソフト、OS、アプリケーション)する整理"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F106
  statement: "侵入検知・防止システムのログは、不審な挙動や検出した攻撃の詳細と、防止システムが実行した遮断の内容を記録する"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software"
  as_of: "2006-09"
  quote: "Intrusion detection and intrusion prevention systems record detailed information on suspicious behavior and detected attacks, as well as any actions intrusion prevention systems performed to stop malicious activity in progress."
  qualifiers: ["2006年版", "旧版(archived)の記述"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F107
  statement: "マルウェア対策ソフトのログは、検出したマルウェア、駆除の試み、隔離を記録する"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software(Antimalware Software)"
  as_of: "2006-09"
  quote: "The most common form of antimalware software is antivirus software, which typically records all instances of detected malware, file and system disinfection attempts, and file quarantines."
  qualifiers: ["2006年版", "旧版(archived)の記述", "「通常は」(typically)の記述"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F108
  statement: "認証サーバのログは、認証の試行ごとに、接続元、ユーザー名、成否、日時を記録する"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software(Authentication Servers)"
  as_of: "2006-09"
  quote: "Authentication servers, including directory servers and single sign-on servers, typically log each authentication attempt, including its origin, username, success or failure, and date and time."
  qualifiers: ["2006年版", "旧版(archived)の記述", "「通常は」(typically)の記述", "ディレクトリサーバとシングルサインオンサーバを含む"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F109
  statement: "ファイアウォールはポリシーに基づき通信を許可または遮断し、ルータよりも詳細なログを生成する"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.1 Security Software(Firewalls)"
  as_of: "2006-09"
  quote: "Firewalls can also track the state of network traffic and perform content inspection. Firewalls tend to have more complex policies and generate more detailed logs of activity than routers."
  qualifiers: ["2006年版", "旧版(archived)の記述", "ルータとの比較としての記述。ルータは遮断した通信の基本的な特性のみを記録するのが通常"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F110
  statement: "OSの監査記録は、認証の成功と失敗、ファイルアクセス、セキュリティポリシーの変更、アカウントの変更、権限の使用を記録する"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.2 Operating Systems(Audit Records)"
  as_of: "2006-09"
  quote: "Audit records contain security event information such as successful and failed authentication attempts, file accesses, security policy changes, account changes (e.g., account creation and deletion, account privilege assignment), and use of privileges."
  qualifiers: ["2006年版", "旧版(archived)の記述", "記録する事象の種類は管理者が指定できる(OSによる)"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F111
  statement: "OSログは、特定のホストに関する不審な活動の特定と調査に最も役立つ。セキュリティソフトが不審な活動を見つけた後に、詳細を得るために参照されることが多い"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.2 Operating Systems"
  as_of: "2006-09"
  quote: "OS logs are most beneficial for identifying or investigating suspicious activity involving a particular host. After suspicious activity is identified by security software, OS logs are often consulted to get more information on the activity."
  qualifiers: ["2006年版", "旧版(archived)の記述", "「しばしば」(often)の記述"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F112
  statement: "アプリケーションログは、クライアントの要求とサーバの応答、アカウント情報、利用状況などを記録し、アプリケーション関連のインシデントの調査に特に有用である。一方、独自形式が多く、内容が文脈に依存するため、確認に多くの資源が要る"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 2.1.3 Applications"
  as_of: "2006-09"
  quote: "However, these logs are often in proprietary formats that make them more difficult to use, and the data they contain is often highly context-dependent, necessitating more resources to review their contents."
  qualifiers: ["2006年版", "旧版(archived)の記述", "「しばしば」(often)の記述", "直前の文脈は、アプリケーション側でしか記録できない情報があることを述べている"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
- id: F113
  statement: "複数のログ源のログ時刻は、時間帯の違いや時計のずれのため、正規化が必要になることが多い"
  kind: fact
  source: "NIST SP 800-92 Guide to Computer Security Log Management"
  locator: "https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf 第3章 脚注24"
  as_of: "2006-09"
  quote: "Normalizing times is often particularly challenging. Organizations with systems in multiple time zones often need to convert all logged times to a single time zone. Also, systems’ clocks might not be in sync with each other, so it might be necessary to add or subtract times from the log entries recorded by out-of-sync sources."
  qualifiers: ["2006年版", "旧版(archived)の記述", "脚注の記述", "複数拠点・複数時間帯の組織の場合"]
  origin: "NIST SP 800-92"
  answers: [Q1.2]
  verified: true
