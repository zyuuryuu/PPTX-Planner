  as_of: "2020-03"
  quote: "Tactics represent the “why” of an ATT&CK technique or sub-technique. It is the adversary’s tactical objective: the reason for performing an action. Tactics serve as useful contextual categories for individual techniques and cover standard notations for things adversaries do during an operation, such as persist, discover information, move laterally, execute files, and exfiltrate data. Tactics are treated as “tags” within ATT&CK where a technique or sub-technique is associated or tagged with one or more tactic categories depending on the different results that can be achieved by using a technique."
  qualifiers: ["2020年3月改訂版の文書", "「1つ以上の戦術」(技術ごとに戦術は複数ありうる)", "戦術の例は such as による例示"]
  origin: "MITRE ATT&CK"
  answers: ["Q1.3"]
  verified: false
