</style></head><body><div class="top"><div class="h" data-role="headline">案として、優先度は製品の重大度だけでなく、資産の重要度、影響、活動の段階で付ける</div><div class="src" data-role="source">出典: NIST SP 800-61 Rev.3(2025年。インシデントのリスク評価の要因の例示)、CyberDefenders(SOC解析者の訓練事業者)の解説(2026年)。標準や公的文書ではない。2つから組み立てた案</div><div class="fig"><span class="tag" data-role="note" style="background:#7C3AED">案</span><span data-role="body" style="display:inline-block;border:5px solid #111827;padding:4px 14px;font-weight:bold;font-size:26px;vertical-align:middle">優先度の要因の例</span><ul data-role="body" style="margin-top:18px;list-style:none;font-size:28px;line-height:1.75;padding-left:24px"><li><span style="">・資産の重要度</span></li><li><span style="">・機能への影響、データへの影響</span></li><li><span style="">・活動の段階</span></li></ul></div><div class="after" data-role="body">民間の解説は、SIEMが付けた重大度は判断の材料であり、判断の代わりではないとする</div></div><div class="tk fit" data-role="takeaway" data-name="takeaway">重大度が同じアラートでも、要因が違えば優先度は変わりうる</div></body></html>
