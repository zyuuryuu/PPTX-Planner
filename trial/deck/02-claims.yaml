# 主張の骨子(工程2)。研修資料のため、answer は受講後にできること、主張は習得する項目(docs/deck-types.md)。
# 公開資料にない基準を組み立てた部分は「案」と明示する(D001)。用語は語彙表に従う。
answer: 新人が、届いたアラートを、根拠とログから誤検知、想定内の検知、攻撃の疑いの3つに分け、影響の大きさで優先度を付けたうえで、閉じる、調査を続ける、上げるを根拠とともに1人で決められる
summary: 新人は、アラートの根拠とログから誤検知、想定内の検知、攻撃の疑い(侵害に至らなかった試みを含む)の3つに分けて影響の大きさで優先度を付け、根拠をもって誤検知か想定内の検知と言えるものを記録して閉じ、持ち時間の中で決められないものや重要な資産と横展開の疑いがあるものを上げるという、公開資料から組み立てた案の手順を身につける
hypothesis: null
axis: 研修資料の分解(前提となる知識、手順、判断の基準、誤りやすい点)
claims:
  - id: C1
    statement: アラートは、SIEMやEDRが検知の条件に合うイベントを見つけて出す知らせであり、本物の攻撃とは限らない。1つの実在のSOCの実測(2020年12月〜2022年7月)では、侵害に至った攻撃に関連するアラートは0.01%で、侵害に至らなかった攻撃の試みが27%以上、想定内の検知が49%以上を占めた。誤検知のよくある原因には、緩く書かれたシグネチャや、学習期間に観測されなかった保守作業がある
    question: Q1
    evidence: [F100, F101, F619, F207, F208, F210, F214, F215, F216, F221]
    objections:
      - objection: 届くアラートの8割は誤検知なので、誤検知の見分け方を覚えれば足りるのではないか
        response: 誤検知の割合は出典の定義と数え方で大きく割れ、8割に近い値はベンダーの調査の83%だけで、誤検知と想定内の検知を分けずに数えている。1つの実在のSOCの実測では、侵害に至らなかった攻撃の試みが27%以上あり、これは誤検知でも想定内の検知でもない
        evidence: [F204, F207]
  - id: C2
    statement: 何から確かめるかの順序は出典で食い違う(NIST SP 800-61 Rev.3 は起きたかの確認を深刻度の見積もりより前に、民間の解説は優先順位付けを真偽の判定より前に置く)。この資料は案として、まずアラートの根拠とログで3つに分け、次に影響の大きさで優先度を付ける順を採る。複数のアラートの間は、届いた順ではなく、影響の大きさなどの要因で優先順位を付ける
    question: Q2
    evidence: [F303, F312, F300, F321]
    assumes: [インシデントについての NIST の優先順位の考え方は、アラートにも当てはまる]
  - id: C3
    statement: 閉じる、調査を続ける、上げるの具体的な線は、調べた公的な文書に書かれておらず、組織が決める。この資料は公開資料の材料から組み立てた案として、根拠をもって誤検知か想定内の検知と言えれば調べたことと判断を記録して閉じ、持ち時間の中で決められないとき、重要な資産や横展開の疑いがあるとき、迷うときは、経過と証拠を添えて上げる基準を示す
    question: Q3
    evidence: [F600, F610, F318, F406, F403, F405, F413]
    assumes: [標準ではない実務者向けの資料の条件を、新人の SOC の基準の案として使う]
    objections:
      - objection: 公的な基準がないのに、基準を教えてよいのか
        response: 公的な文書に線がないことを明示し、案として示す。新人の SOC で使えるかは、SOC のリーダーが決める(D001)
        evidence: [F610]
  - id: C4
    statement: 誤検知に慣れると、本物の攻撃のアラートを見過ごしうる。2013年のTargetの侵害では、検知製品の緊急のアラートに対応がなく、米上院の報告は、頻繁に鳴るアラートを誤検知とみなした可能性があると推定している。ベンダーのImpervaの調査では、IT担当者179人の56%が過去の誤検知を理由にアラートを無視したことがあると答えた(無視したアラートが本物だったかは示されていない)
    question: Q4
    evidence: [F500, F501, F506]
contradictions: []
