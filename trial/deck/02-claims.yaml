# 主張の骨子(工程2)。研修資料のため、answer は受講後にできること、主張は習得する項目(docs/deck-types.md)。
# summary は依頼者の指定で結論だけの短い文にした(D004)。上げる条件、優先度の付け方、案であることは中のスライドで示す。
# 公開資料にない基準を組み立てた部分は「案」と明示する(D001)。用語は語彙表に従う。出典の言う false positive が語彙表の「誤検知」と一致しない場合は「(出典の言い方)」と添える。
answer: 新人が、届いたアラートを、根拠とログから誤検知、想定内の検知、攻撃の疑いの3つに分け、影響の大きさで優先度を付けたうえで、閉じる、調べる、上げるを根拠とともに1人で決められる
summary: アラートは、誤検知、想定内の検知、攻撃の疑いの3つに分ける。根拠をもって誤検知か想定内と言えるものだけを記録して閉じ、迷ったら上げる。
hypothesis: null
axis: 研修資料の分解(前提となる知識、手順、判断の基準、誤りやすい点)
claims:
  - id: C1
    statement: アラートは、SIEMやEDRが検知の条件に合うイベントを見つけて出す知らせであり、本物の攻撃とは限らない。誤検知の割合は出典の定義と数え方で大きく割れている。1つの実在のSOCのネットワークの検知(Zeek)のアラートの実測(2020年12月〜2022年7月)では、侵害に至った攻撃に関連するアラートは0.01%で、侵害に至らなかった攻撃の試みが27%以上、想定内の検知が49%以上、分類できないものが約24%だった。誤検知(出典の言い方)の原因として、NISTはネットワーク型の検知の弱いシグネチャ(2003年の文書)や、異常検知型での学習期間に観測されなかった保守作業を挙げ、実務者の一部は緩く書かれたシグネチャを挙げる
    question: Q1
    evidence: [F100, F101, F619, F207, F208, F210, F214, F215, F216, F221]
    objections:
      - objection: 届くアラートの8割は誤検知なので、誤検知の見分け方を覚えれば足りるのではないか
        response: 公開資料のうち8割に近い値は、ベンダーの調査で解析者がアラートの83%を「誤検知で時間をかける価値がない」と答えた自己申告だけで、誤検知と想定内の検知を区別していない。1つの実在のSOCの実測では、侵害に至らなかった攻撃の試みが27%以上あり、これは誤検知でも想定内の検知でもない
        evidence: [F204, F207]
      - objection: 環境を知らない新人は、何を根拠に「想定内の検知」と言って閉じるのか
        response: 想定内の検知は、組織の環境で業務上正当と説明できるものであり、定期的な社内のスキャンのように攻撃と似た振る舞いをするものもある。依頼者は、新人が想定内の検知として閉じてよいのを、リーダーが事前に一覧にした想定内の活動に当てはまるものだけとする運用に同意した(設計セッションが示した案に、自分のSOCの運用に近いとして同意したもの)
        evidence: [F220, F215, F002]
  - id: C2
    statement: 何から確かめるかの順序は出典で食い違う。NIST SP 800-61 Rev.3 は、インシデントの報告について、起きたかの確認を深刻度の見積もりより前に置き、民間の解説は、アラートの優先順位付けを真偽の判定より前に置く。この資料は案として、まずアラートの根拠とログで3つに分け、次に影響の大きさで優先度を付ける順を採る。複数の案件の間は、届いた順ではなく、リスク評価の要因で扱うとNIST Rev.3はインシデントについて述べ、この資料はアラートにも当てはめる
    question: Q2
    evidence: [F303, F312, F305, F321]
    assumes: [インシデントについての NIST の優先順位の考え方は、アラートにも当てはまる]
  - id: C3
    statement: 閉じる、調べる、上げるの具体的な線は、調べた公的な文書に書かれていなかった。この資料は、線は組織が決めるものとして扱い(D001)、公開資料の材料から組み立てた案として、根拠をもって誤検知か想定内の検知と言えれば調べたことと判断を記録して閉じ、持ち時間の中で決められないとき、重要な資産での疑いがあるとき、複数のホストにまたがる横展開の証拠があるとき、迷うときは、経過と証拠を添えて上げる基準を示す。あわせて、依頼者が同意した運用(新人が閉じてよいのは誤検知と一覧にある想定内の活動だけ)と、依頼者のSOCの運用(攻撃の試みは最初の3か月は全て上げる、閉じたものは後で見直される)を、公開資料とは分けて示す
    question: Q3
    evidence: [F600, F610, F318, F406, F403, F405, F413, F002, F003, F004]
    assumes: [標準ではない実務者向けの資料の条件を、新人の SOC の基準の案として使う]
    objections:
      - objection: 公的な基準がないのに、基準を教えてよいのか
        response: 公的な文書に線がないことを明示し、案として示す。新人の SOC で使えるかは、依頼者が決める(D001)
        evidence: [F610]
      - objection: 「1人で決められる」とするが、判定には他の担当者との協力が要る場合がある
        response: 撤回済みの NIST SP 800-61 Rev.2 は、インシデントかの判定に協力が要る場合がありうるとしていた。この資料では、持ち時間の中で決められないときや迷うときに上げることまでを、新人が1人で行う判断に含める
        evidence: [F401, F403, F405]
      - objection: 侵害に至らなかった攻撃の試み(27%以上)を攻撃の疑いに含めると、上げる条件に当てはめて、その大半が上に上がる
        response: 調べた公開資料には、閉じてよい試みと上げる試みを分ける線がなかった。依頼者のSOCの運用では、配属から最初の3か月の新人には攻撃の試みを全て上げさせ、上が溢れるかはリーダーの側で対処する
        evidence: [F207, F003]
      - objection: 新人が間違って閉じてしまったら、取り返しがつかないのではないか
        response: 依頼者のSOCの運用では、新人が閉じたアラートは、後でリーダーかベテランが見直す。民間の解説は、閉じた全てのアラートに調べたことと判断を記録するとする(見直しの手順は書かれていない)。この資料は、その記録を見直しの材料として使う
        evidence: [F004, F318]
  - id: C4
    statement: 誤検知に慣れると、本物の攻撃のアラートを見過ごしうる。2013年のTargetの侵害では、検知製品が緊急のアラートを出したが対応がなかったと米上院の報告が報道を引いて述べ、システムが頻繁に警報を鳴らしていたのであれば職員が誤検知(出典の言い方)とみなした可能性があると推定している。ベンダーのImpervaの調査では、IT担当者179人の56%が過去の誤検知(出典の言い方)を理由にアラートを無視したことがあると答えた(無視したアラートが本物だったかは示されていない)
    question: Q4
    evidence: [F500, F501, F506]
contradictions: []
