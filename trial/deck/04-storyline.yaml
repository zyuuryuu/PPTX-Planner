  - Q1.1.1
  evidence:
  - F615
  - F618
  - F619
  source: 米国 OMB の覚書 M-22-01(2021年)、Microsoft Learn(Microsoft Defender for Endpoint の文書、2026年)
- id: ch2-s4
  chapter: ch2
  section: null
  question: アラートを確かめるには、どのログを見ればよいのか
  headline: ログの種類ごとに分かることが違い、認証のログからは接続元、利用者、成否、日時が分かる
  from:
  - Q1.2
  evidence:
  - F108
  - F110
  - F107
  - F111
  source: NIST SP 800-92(2006年)。「通常は記録する」の記述
- id: ch2-s5
  chapter: ch2
  section: null
  question: 攻撃の手口の分類(ATT&CK)は何に使うのか
  headline: ATT&CKは攻撃者の目的と方法の知識ベースで、検知の分析を作る助けになりうる
  from:
  - Q1.3
  evidence:
  - F114
  - F116
  - F125
  - F119
  source: MITRE ATT&CK 公式サイト(v20.1、2026年)
- id: ch2-s6
  chapter: ch2
  section: null
  question: 届くアラートのうち、本物の攻撃はどれだけあるのか
  headline: 1つのSOCの実測では、侵害に至った攻撃は0.01%、攻撃の試みは27%以上、想定内は49%以上
  from:
  - Q1.1.3
  evidence:
  - F207
  source: Yangら(USENIX Security 2024)。1つのSOCのネットワークの検知(Zeek)の2020年12月〜2022年7月のアラート約1,443万件を著者らが分類。27%と49%は下限。分類できないものが約24%残る
- id: ch2-s7
  chapter: ch2
  section: null
  question: 届くアラートの8割は誤検知ではないのか
  headline: 「8割が誤検知」に近い値は、調べた範囲ではベンダーの調査の自己申告(83%)だけだった
  from:
  - Q1.1.3
  evidence:
  - F204
  - F220
  objection:
    claim: C1
    index: 0
  source: Vectra AI の調査(2023年、解析者2,000人の回答)。「誤検知」の定義は示されていない
- id: ch2-s8
  chapter: ch2
  section: null
  question: 誤検知はなぜ起きるのか
  headline: 出典の言う誤検知の原因には、緩いシグネチャや、学習期間に見なかった保守作業がある
  from:
  - Q1.1.4
  evidence:
  - F208
  - F210
  - F214
  source: NIST の文書(2003年、SP 800-94 の2007年)、Alahmadiら(USENIX Security 2022、SOC解析者のインタビュー)。原文の false positive
- id: ch2-s9
  chapter: ch2
  section: null
  question: 想定内の検知はなぜ起きるのか
  headline: 1つのSOCの実測では、社内の脆弱性スキャンや外部の診断が想定内の検知を起こしていた
  from:
  - Q1.1.4
  evidence:
  - F215
  - F221
  - F216
  - F217
  source: Yangら(USENIX Security 2024)。1つのSOCのネットワークの検知(Zeek)の2020年12月〜2022年7月のアラート約1,443万件を著者らが分類
- id: ch3-s1
  chapter: ch3
  section: null
  question: 1件のアラートは何から確かめるのか
  headline: 何から確かめるかは出典で食い違う。NISTはインシデントの確認を深刻度の見積もりより前に置く
