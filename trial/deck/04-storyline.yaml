# スライド見出しの一覧(工程4)。章扉と章のまとめは書かない(章構成から決まる)。
# source は見出しのすぐ下に置く出典の行(D006。docs の書式にない項目で、設計セッションが足した)。
# 演習(ch5)のアラートは全て架空。
- id: ch1-s1
  chapter: ch1
  section: null
  question: この講義で何ができるようになるのか
  headline: 届いたアラートを、閉じる・調べる・上げるのどれにするか、根拠とともに1人で決められる
  from:
  - Q0
- id: ch1-s2
  chapter: ch1
  section: null
  question: なぜアラートを3つに分けるのか
  headline: 1つのSOCの実測では、誤検知でも想定内の検知でもない攻撃の試みが27%以上あった
  from:
  - Q1.1.3
  evidence:
  - F207
  source: Yangら(USENIX Security 2024)。1つのSOCのネットワークの検知(Zeek)の2020年12月〜2022年7月のアラート約1,443万件を著者らが分類。27%は下限
- id: ch2-s1
  chapter: ch2
  section: null
  question: アラートとは何か
  headline: アラートは、検知の仕組みが探すものを見つけたときの知らせで、本物の攻撃とは限らない
  from:
  - Q1.1
  evidence:
  - F709
  - F619
  - F207
  source: Microsoft Learn(Microsoft Sentinel、Microsoft Defender for Endpoint の文書、2026年)、Yangら(USENIX Security 2024)。1つのSOCのネットワークの検知(Zeek)の2020年12月〜2022年7月のアラート約1,443万件を著者らが分類
- id: ch2-s2
  chapter: ch2
  section: null
  question: SIEMは何を根拠にアラートを出すのか
  headline: SIEMは、最も一般的にはルールで複数のログの記録値を照合し、重要なイベントを特定する
  from:
  - Q1.1.1
  evidence:
  - F100
  - F101
  source: NIST SP 800-92(2006年)。ルール以外の相関もある
- id: ch2-s3
  chapter: ch2
  section: null
  question: EDRは何を根拠にアラートを出すのか
  headline: EDRは端末の振る舞いの記録を継続して集め、製品の例では脅威を検知するとアラートを作る
