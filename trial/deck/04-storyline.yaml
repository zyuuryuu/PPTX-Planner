- id: ch5-s1
  chapter: ch5
  section: null
  question: '演習1: このアラートを、閉じる・調べる・上げるのどれにするか'
  headline: '演習1: 承認済みの脆弱性スキャンの時刻に、社内の1台から多数の宛先への接続のアラートが届いた'
- id: ch5-s2
  chapter: ch5
  section: null
  question: 演習1の答えは何か
  headline: '演習1の答え: 一覧にある承認済みのスキャンに当てはまるため、想定内の検知として記録して閉じる'
- id: ch5-s3
  chapter: ch5
  section: null
  question: '演習2: このアラートを、閉じる・調べる・上げるのどれにするか'
  headline: '演習2: 管理ツールの定期の通信に、緩く書かれたルールが反応したアラートが届いた'
- id: ch5-s4
  chapter: ch5
  section: null
  question: 演習2の答えは何か
  headline: '演習2の答え: 検知の条件が無害な活動に反応した誤検知として、根拠を記録して閉じる'
- id: ch5-s5
  chapter: ch5
  section: null
  question: '演習3: このアラートを、閉じる・調べる・上げるのどれにするか'
  headline: '演習3: 外部から既知の攻撃の通信が届き、防がれた記録があるアラートが届いた'
- id: ch5-s6
  chapter: ch5
  section: null
  question: 演習3の答えは何か
  headline: '演習3の答え: 侵害に至らなかった攻撃の試みであり、このSOCでは最初の3か月は全て上げる'
- id: ch5-s7
  chapter: ch5
  section: null
  question: '演習4: このアラートを、閉じる・調べる・上げるのどれにするか'
  headline: '演習4: 重要なサーバで、一覧にない見慣れないプロセスが動いたアラートが届いた'
- id: ch5-s8
  chapter: ch5
  section: null
  question: 演習4の答えは何か
  headline: '演習4の答え: 閉じずに調べ、正当と確かめられなければ、経過と証拠を添えて上げる'
