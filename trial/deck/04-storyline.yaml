  - Q2.2
  evidence:
  - F303
  - F312
  source: NIST SP 800-61 Rev.3(2025年。インシデントの報告の扱い)、CyberDefenders(SOC解析者の訓練事業者)の解説(2026年)
- id: ch3-s2
  chapter: ch3
  section: null
  question: 閉じる・調べる・上げるの線は、どこに決められているのか
  headline: 閉じる・調べる・上げるの線は調べた公的な文書になく、この講義の基準は案である
  from:
  - Q3
  evidence:
  - F600
  - F610
  objection:
    claim: C3
    index: 0
  source: NIST SP 800-61 Rev.3(2025年)。インシデントの基準は組織が定めるとする
- id: ch3-s3
  chapter: ch3
  section: null
  question: この講義では、どの順で確かめるのか
  headline: 案として、まず根拠とログで3つに分け、次に影響の大きさで優先度を付ける
  from:
  - Q2
  evidence:
  - F303
  - F305
  source: NIST SP 800-61 Rev.3(2025年)、CyberDefenders(SOC解析者の訓練事業者)の解説(2026年)。標準や公的文書ではないの材料から組み立てた案
- id: ch3-s4
  chapter: ch3
  section: null
  question: アラートの根拠は、どう確かめるのか
  headline: 製品の例では、アラートは分析ルールがデータに問い合わせて出し、関わる利用者や端末を含む
  from:
  - Q1.1.1
  evidence:
  - F709
  - F710
  source: Microsoft Learn(Microsoft Sentinel の文書、2026年)
- id: ch3-s5
  chapter: ch3
  section: null
  question: 誤検知として閉じてよいのは、どんなときか
