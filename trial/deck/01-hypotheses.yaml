- id: H1
  statement: 一次解析は、まず誤検知かどうかの判定から入るべきである。届くアラートの8割は誤検知であり、誤検知のパターンを先に覚えることが、1人で判断できるようになる近道である
  proposed_by: user
- id: H2
  statement: 一次解析は、まずアラートの重大度と、対象の資産や利用者の重要度を確かめ、影響の大きいものから調べるべきである。誤検知かどうかの判定は、その後に行う
  proposed_by: session
- id: H3
  statement: 一次解析に、全てのアラートに共通する順序はない。アラートの種類ごとに定めた手順に従って確かめるべきである
  proposed_by: session
