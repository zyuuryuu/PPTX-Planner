# 問いごとの答え(工程2)。用語は語彙表に従う: 誤検知は検知の条件の誤りによるもの、想定内の検知は条件どおりだが業務上問題のない活動によるもの。
# 製品の「インシデント」は使わない。

# ---------- 末端の問い ----------
- question: Q1.1.1
  answer: SIEMは、複数のログ源のイベントを、時刻、IPアドレス、イベント種別などの記録値を照合するルールで相関させ、重要なイベントを特定する。EDRは、端末の振る舞いの記録を継続して集め、既知のパターンとの一致や、全端末の過去のデータと比べた違いを根拠に悪意のある活動を識別する
  evidence: [F100, F101, F615, F616, F617, F618]
- question: Q1.1.2
  answer: 1日に届くアラートの量は出典で大きく違い、1つの実在のSOCでは自動遮断の後も1日約13,764件、ベンダーの業界調査では1日平均4,484件、実務者20人の調査では45%が1日5,000件未満と答えている。複数のSOCにわたる代表値は見つからなかった
  evidence: [F201, F202, F203]
- question: Q1.1.3
  answer: 誤検知の割合は、出典の定義と数え方で大きく割れている。ベンダーの業界調査では、解析者がアラートの83%を「誤検知で時間をかける価値がない」と答えた。1つの実在のSOCの実測では、実際の攻撃に関連するアラートは0.01%で、攻撃の試みが27%以上、想定内の検知が49%以上を占めた。学術の調査は、誤検知と想定内の検知を分けて定義している
  evidence: [F204, F207, F219, F220, F001]
- question: Q1.1.4
  answer: 誤検知のよくある原因は、弱いシグネチャや緩く書かれたルール、正当なネットワーク管理ツールの通信、学習期間に観測されなかった保守作業などによる平常からの逸脱である。想定内の検知のよくある原因は、1つの実在のSOCの実測では、定期的な社内の脆弱性スキャン、委託した外部のペネトレーションテスト、レガシーシステムの弱い暗号、組織に固有のDNSの運用など、業務上正当な活動である
  evidence: [F208, F210, F214, F215, F216, F217, F221]
- question: Q1.2
  answer: ログの種類ごとに分かることが違う。認証サーバのログからは接続元、ユーザー名、成否、日時が、OSの監査記録からは認証の成否、ファイルアクセス、ポリシーとアカウントの変更、権限の使用が、ウイルス対策ソフトのログからは検出、駆除、隔離が分かる。OSのログは、セキュリティソフトが不審な活動を見つけた後に詳細を得るために参照されることが多い。複数のログ源の時刻は、そろえる必要があることが多い
  evidence: [F106, F107, F108, F110, F111, F113]
- question: Q1.3
  answer: MITRE ATT&CKは、実世界の観測に基づく攻撃者の戦術(目的)と技術(方法)の知識ベースであり、各技術には、その使用を見つけるためのデータや検知の方針の項目がある。防御側が検知の分析を作るときや、脅威の情報を比べるときの共通の言葉として使われる
  evidence: [F114, F116, F125, F120, F119, F124]
- question: Q2.1
  answer: NISTは、インシデントの対応を届いた順にせず、機能への影響、情報への影響、復旧のしやすさなどの要因で優先順位を付けるとする。民間のSOC向けの解説は、アラートの優先順位の要因として資産の重要度や攻撃の段階などを挙げ、SIEMが自動で付ける深刻度は人の判断の入力であって代わりではないとする
  evidence: [F300, F301, F319, F320, F305, F321, F306]
- question: Q2.2
  answer: NISTは、新しいインシデントの報告に対して、まずインシデントが起きたかを確かめる予備的な確認を行い、その後に深刻度と緊急度を見積もるとし、手順書では兆候の分析と相関情報の探索を優先順位付けより前に置く。ただしNIST自身、この順序は常に守るものではなく、種類によって変わるとする。民間のSOC向けの解説は、優先順位付けを真偽の判定より前の段階に置く
  evidence: [F303, F307, F308, F312]
- question: Q3.1.1
  answer: 公開の標準は、アラートを誤検知として閉じてよい条件を定めていない。NISTは、インシデントかを決めるときに既知の誤検知を考慮し、兆候が正当かを評価するよう述べる。製品の公式の文書と民間のSOC向けの解説は、閉じるときに、検知の条件が誤っていた場合(誤検知)と、活動は実在するが承認済みか想定内の場合(想定内の検知)を分けて分類する
  evidence: [F600, F308, F605, F607, F609, F315]
- question: Q3.1.2
  answer: 民間のSOC向けの解説は、閉じた全てのアラートに、発火した内容、調べたこと、見つかった証拠、下した判断を記録し、誤検知を検知ルールの調整や抑制に使い、ルール別の誤検知率などを週ごとに見直すとする。NISTは、監視の技術を誤検知と見逃しが許容できる水準まで調整するとする
  evidence: [F318, F324, F325, F317]
- question: Q3.2
  answer: 調査を続けるときは、影響を受けるシステム、発生源、手口を確かめるとされる(NISTとCISAの、インシデントと判断した後の初動の記述)。1件にかける時間の目安は標準になく、実務者向けの解説では一次解析の担当で12〜20分が一般的とし、その時間で判定に至らなければ要約を付けて上げるとする
  evidence: [F400, F402, F403]
- question: Q3.3.1
  answer: 公開の標準は、上げる条件の具体的な線を組織の方針に委ねている。NISTは、上げる判断を、資産の重要度、機能やデータへの影響、観測された活動の段階などのリスク評価の要因に基づかせ、インシデントかの判断が難しい場合は他の担当者と協力して決めるとする。実務者向けの資料は、重要な資産での疑い、複数のホストにまたがる横展開の証拠、持ち時間の中で判定できないこと、担当の守備範囲を超えることを上げる条件に挙げ、迷うときは上げる側に倒すとする
  evidence: [F409, F610, F401, F406, F407, F403, F405]
- question: Q3.3.3
  answer: 上げるときは、アラートの出どころとID、調べた経過、集めた証拠、現時点の判定の仮説、次に勧める手順を添えるとされる(実務者向けの資料2件)。NISTは、対応の記録に、状況、関連する兆候、各担当者の対応、影響の評価、集めた証拠、次の手順を含めるとする
  evidence: [F413, F414, F412]
- question: Q4.1
  answer: 本物の攻撃のアラートを見過ごす誤りは、アラートが頻繁に鳴る状況(Targetの事案で推定された)、チケットを閉じる圧力、過去の誤検知の経験、キューの混雑のときに起きるとされる。調査では、IT担当者の56%が過去の誤検知を理由にアラートを無視したことがあると答えた。また、分析者の判定の正答は83%だったが、理由の説明が実際の原因を反映していたのは39%だった
  evidence: [F500, F501, F502, F506, F507, F504, F503]
- question: Q4.2
  answer: 調査を続けたまま上げるのが遅れる誤りを、直接測った公開の調査は見つからなかった。上げるべきアラートは調査の操作が多く負担が大きい可能性が高いこと(5人の現地実験)、不確かなときにチケットを作って引き継ぐと答えた分析者が33%にとどまること(12人の自己申告)が報告されている
  evidence: [F508, F509]
- question: Q4.3
  answer: 上げなくてよいアラートまで上げる誤りの割合を測った調査は見つからなかった。外部委託のSOCの分析者は、能力不足と見られることや罰金を避けるため、疑わしいアラームをできる限り全て顧客に上げる圧力を受けるとの証言がある
  evidence: [F510]

# ---------- 親の問い ----------
- question: Q1.1
  answer: アラートは、SIEMやEDRが記録値の照合や平常との違いを根拠に出すため、条件どおりに反応しても実際の攻撃とは限らない。届く量は1日数千件以上の報告があり、実際の攻撃に関連するのはごく一部で、多くは誤検知か想定内の検知である。ただし割合は出典の定義で大きく割れる
  from: [Q1.1.1, Q1.1.2, Q1.1.3, Q1.1.4]
  assumes: [1つの実在のSOCの実測とベンダーの業界調査が示す傾向は、新人のSOCにも当てはまる]
- question: Q1
  answer: 新人は、アラートが何を根拠に出るのか、その多くが実際の攻撃ではないこと、ログの種類ごとに何が分かるか、攻撃の手口の分類(ATT&CK)をどう使うかを知る必要がある
  from: [Q1.1, Q1.2, Q1.3]
- question: Q2
  answer: 複数のアラートの間では、届いた順ではなく、影響の大きさと緊急度で調べる順を決める。1件の中では、まず兆候が正当か(誤検知や想定内の検知でないか)を確かめ、相関する情報を探し、その後に影響と緊急度を見積もる。ただし、この順序は常に守るものではない
  from: [Q2.1, Q2.2]
  assumes: [NISTのインシデントの優先順位と初期分析の考え方は、アラートの一次解析にも当てはまる]
- question: Q3.1
  answer: 閉じるときは、誤検知(検知の条件の誤り)か想定内の検知(業務上正当な活動)かを根拠とともに区別し、調べたことと判断を記録して、後から見直せるようにする。閉じてよい条件の具体的な線は、公開の標準にはなく、組織が決める
  from: [Q3.1.1, Q3.1.2]
- question: Q3.3
  answer: 上げる条件の具体的な線は組織が決めるが、公開の資料は判断の材料として、資産の重要度、影響、横展開の証拠、持ち時間の中で判定できないこと、守備範囲を超えることを挙げ、迷うときは上げるとする。上げるときは、経過、証拠、判定の仮説、次の手順を添える
  from: [Q3.3.1, Q3.3.3]
- question: Q3
  answer: 誤検知か想定内の検知だと根拠をもって言えるときに閉じて記録し、影響を受けるシステム、発生源、手口を持ち時間の目安の中で確かめても判定できないとき、重要な資産や横展開の疑いがあるとき、迷うときは、経過と証拠を添えて上げる。具体的な線は公開の標準になく、組織が決める
  from: [Q3.1, Q3.2, Q3.3]
- question: Q4
  answer: 新人が本物の攻撃を見過ごしやすいのは、アラートが頻繁に鳴る、キューが混む、閉じる圧力がある、過去の誤検知に慣れているときである。上げるのが遅れる誤りと、上げすぎる誤りは、公開の測定が見つからなかった
  from: [Q4.1, Q4.2, Q4.3]

# ---------- 根の問い ----------
- question: Q0
  answer: アラートを受けたら、まずそのアラートが何を根拠に出たかとログを確かめて、誤検知か想定内の検知か実際の攻撃の疑いかを根拠とともに区別し、次に影響と緊急度を見積もる。誤検知か想定内の検知だと根拠をもって言えれば記録して閉じ、持ち時間の目安の中で判定できないとき、重要な資産や横展開の疑いがあるとき、迷うときは、経過と証拠を添えて上げる。複数のアラートの間では、影響の大きさで調べる順を決める
  from: [Q1, Q2, Q3, Q4]
  assumes: [閉じる条件と上げる条件の具体的な線は組織が決める(D001)]
