# 問いごとの答え(工程2)。用語は語彙表に従う: 誤検知は検知の条件の誤りによるもの、想定内の検知は条件どおりだが業務上問題のない活動によるもの。
# 製品の「インシデント」は使わない。撤回済みの NIST SP 800-61 Rev.2 だけが支える内容は「撤回済みの Rev.2」と明示する。
# 公開資料にない基準を組み立てた部分は「案」と明示する(D001)。

# ---------- 末端の問い ----------
- question: Q1.1.1
  answer: NIST SP 800-92(2006年版)によれば、SIEMは複数のログ源のイベントを相関させて重要なイベントを特定し、相関の最も一般的な形は、時刻、IPアドレス、イベント種別などの記録値を照合するルールによるものである(統計的な方法などもある)。EDRは、米国OMBの説明では端末のデータの継続的な監視と収集に、ルールに基づく自動の分析を組み合わせたものであり、製品の例(Microsoft Defender for Endpoint)では端末の振る舞いの記録を継続して集め、脅威を検知するとアラートを作る
  evidence: [F100, F101, F615, F618, F619]
- question: Q1.1.2
  answer: 1日に届くアラートの量は出典で大きく違う。1つの実在のSOCの実測(2020年12月〜2022年7月)では、自動遮断の後も解析者が処理するアラートが1日約13,764件残った。ベンダーの業界調査(従業員1,000人超の組織の解析者2,000人の自己申告)では1日平均4,484件、実務者20人の調査では45%が1日5,000件未満と答えた。複数のSOCにわたる代表値は見つからなかった
  evidence: [F201, F202, F203]
- question: Q1.1.3
  answer: 誤検知の割合は、出典の定義と数え方で大きく割れている。ベンダーの業界調査では、解析者がアラートの83%を「誤検知で時間をかける価値がない」と答えた(誤検知と想定内の検知を分けていない)。1つの実在のSOCの実測(2020年12月〜2022年7月)では、侵害に至った攻撃に関連するアラートは0.01%で、侵害に至らなかった攻撃の試みが27%以上、想定内の検知が49%以上、分類できないものが残りを占めた。学術の調査は、誤検知と想定内の検知を分けて定義している
  evidence: [F204, F207, F219, F220]
- question: Q1.1.4
  answer: NISTの文書は、誤検知(出典の false positive。想定内の検知を含みうる)の原因として、ネットワーク型の侵入検知では弱いシグネチャや正当なネットワーク管理ツールの通信を(2003年の文書)、異常検知型では学習期間に観測されなかった保守作業などの良性の活動を挙げる。実務者の一部は、緩く書かれたシグネチャが多くの誤検知を出すと述べた。想定内の検知の原因は、1つの実在のSOCの実測では、定期的な社内の脆弱性スキャン、委託した外部のペネトレーションテスト、レガシーシステムの弱い暗号、組織に固有のDNSの運用など、業務上正当な活動である
  evidence: [F208, F210, F214, F215, F216, F217, F221]
- question: Q1.2
  answer: NIST SP 800-92(2006年版)によれば、ログの種類ごとに分かることが違う。認証サーバのログは、認証の試行ごとに接続元、ユーザー名、成否、日時を記録する。OSの監査記録は、認証の成否、ファイルアクセス、ポリシーとアカウントの変更、権限の使用などを含む(記録する事象は管理者が指定できる)。ウイルス対策ソフトは通常、検出したマルウェア、駆除の試み、隔離を記録する。OSのログは、セキュリティソフトが不審な活動を見つけた後に詳細を得るために参照されることが多い。複数の時間帯にシステムを持つ組織では、ログの時刻をそろえる必要があることが多い
  unresolved: '認証サーバのログの項目に「通常」(typically)が付いていない(checks/2-answers-4.yaml)。往復の上限(2回)のため直さない。主張に使うときはこの部分に頼らない'
  evidence: [F107, F108, F110, F111, F113]
- question: Q1.3
  answer: MITRE ATT&CKは、実世界の観測に基づく攻撃者の戦術(目的)と技術(方法)の知識ベースである。防御側が攻撃者の技術を検知する分析を作る助けになり、脅威情報の分析者には、脅威情報を比べるための共通の言葉になる。2020年版の解説では、各技術の記述に、その使用を見つけるためのデータや検知の方針の項目があるとする(検知が常に可能とは限らない)
  evidence: [F114, F116, F125, F119, F124, F120]
- question: Q2.1
  answer: NISTは、インシデントの対応を届いた順にせず、機能への影響、情報への影響、復旧のしやすさなどの要因で優先順位を付けるとする。民間のSOC向けの解説は、アラートの優先順位の要因として資産の重要度や攻撃の段階などを挙げ、SIEMが自動で付ける深刻度は人の判断の入力であって代わりではないとする
  evidence: [F300, F301, F319, F320, F305, F321, F306]
- question: Q2.2
  answer: 確かめる順序は出典で食い違う。NIST SP 800-61 Rev.3 は、新しいインシデントの報告に対して、まずインシデントが起きたかを確かめる予備的な確認を行い、その後に深刻度と緊急度を見積もるとする。撤回済みの Rev.2 の手順書も、兆候の分析と相関情報の探索を優先順位付けより前に置くが、この順序は常に守るものではなく、種類によって変わるとしていた。民間のSOC向けの解説は、優先順位付けを真偽の判定より前の段階に置く
  evidence: [F303, F307, F312]
- question: Q3.1.1
  answer: アラートを誤検知として閉じてよい条件は、NIST SP 800-61 Rev.3 にも、ほかに調べた公的な文書にも書かれていなかった。Rev.3 は、インシデントを宣言するかを決めるときに既知の誤検知を考慮するよう推奨する。製品の公式の文書と民間のSOC向けの解説には、アラートやインシデントに分類を付けるものがあるが、正確だが無害なアラートの扱いは文書によって違い、別の分類(Benign Positive、Informational, expected activity)にするものと、正しい検知(True positive)にするものがある
  evidence: [F600, F605, F607, F609, F315]
- question: Q3.1.2
  answer: 民間のSOC向けの解説は、閉じた全てのアラートに、発火した内容、調べたこと、見つかった証拠、下した判断を記録し、誤検知を検知ルールの調整や抑制に使い、ルール別の誤検知率などを週ごとに見直すとする。NISTは、監視の技術を誤検知と見逃しが許容できる水準まで調整するとする
  evidence: [F318, F324, F325, F317]
- question: Q3.2
  answer: アラートの段階で調査を続けるときに何を確かめるかを定めた公開の標準は見つからなかった。インシデントと判断した後の初動として、撤回済みの NIST SP 800-61 Rev.2 は、影響を受ける範囲、発生源、手口を確かめるとしていた。1件にかける時間の目安は標準になく、実務者向けの解説の1件が、一次解析の担当で12〜20分が一般的とし(根拠は示されていない)、その時間で判定に至らなければ要約を付けて上げるとする
  evidence: [F400, F403]
- question: Q3.3.1
  answer: 公開の標準は、上げる条件の具体的な線を組織に委ねている。NIST SP 800-61 Rev.3 は、上げる判断を、資産の重要度、機能やデータへの影響、観測された活動の段階などのリスク評価の要因に基づかせるよう推奨する。撤回済みの Rev.2 は、インシデントかの判断が難しい場合は他の担当者と協力して決める必要が生じうるとしていた。標準ではない実務者向けの資料は、重要な資産での疑い、複数のホストにまたがる横展開の証拠、持ち時間の中で判定できないこと、担当の守備範囲を超えることを上げる条件に挙げ、有志の手順書は迷うときは上げる側に倒すとする
  evidence: [F409, F610, F401, F406, F407, F403, F405]
- question: Q3.3.3
  answer: 標準ではない実務者向けの資料は、上げるときに、アラートの出どころとID、調べた経過、集めた証拠、現時点の判定の仮説、次に勧める手順を添えるとし(1件)、関連するメタデータと初期の所見を全て含め、標準の書式を使うとする(1件)。撤回済みの NIST SP 800-61 Rev.2 は、対応の記録に、状況、関連する兆候、各担当者の対応、影響の評価、集めた証拠、次の手順などを含めるとしていた
  evidence: [F413, F414, F412]
- question: Q4.1
  answer: 本物の攻撃のアラートを見過ごした事案として、2013年のTargetの侵害では、検知製品が緊急のアラートを出したが対応されなかったと、米上院の報告が報道を引いて述べ、アラートが頻繁に鳴る状況なら誤検知(出典の言い方)とみなした可能性があると推定している。アラートを無視する行動も報告されている。ベンダーのImpervaの調査では、IT担当者179人の56%が過去の誤検知(出典の言い方)を理由にアラートを無視したことがあると答え、IDCとFireEyeの調査を報じた記事では、キューが一杯のときにアラートを無視する人が3分の1を超えた。ただし、無視したアラートが本物の攻撃だったかは示されていない。1つのSOCの分析者12人に6件の事例を判定させた調査では、判定の正答は83%だったが、理由の説明が実際の原因を反映していたのは39%だった
  evidence: [F500, F501, F506, F507, F504]
- question: Q4.2
  answer: 調査を続けたまま上げるのが遅れる誤りを、直接測った公開の調査は見つからなかった。上げるべきアラートは調査の操作が多く負担が大きい可能性が高いこと(5人の現地実験)、不確かなときにチケットを作って引き継ぐと答えた分析者が33%にとどまること(12人の自己申告)が報告されている
  evidence: [F508, F509]
- question: Q4.3
  answer: 上げなくてよいアラートまで上げる誤りの割合を測った調査は見つからなかった。外部委託のSOCの分析者は、能力不足と見られることや罰金を避けるため、疑わしいアラームをできる限り全て顧客に上げる圧力を受けるとの証言がある
  evidence: [F510]

# ---------- 親の問い ----------
- question: Q1.1
  answer: アラートは、SIEMでは記録値の照合などによる相関、EDRでは端末の振る舞いの記録を根拠に出る。届く量の報告は出典によって1日数千件から1万件以上まで幅がある。1つの実在のSOCの実測では、侵害に至った攻撃に関連するアラートはごく一部で、侵害に至らなかった攻撃の試みと想定内の検知がそれぞれ大きな割合を占めた。誤検知の割合は、出典の定義と数え方で大きく割れる
  from: [Q1.1.1, Q1.1.2, Q1.1.3, Q1.1.4]
- question: Q1
  answer: 新人は、アラートが何を根拠に出るのか、アラートには誤検知、想定内の検知、侵害に至らなかった攻撃の試みが多く含まれうること、ログの種類ごとに何が分かるか、攻撃の手口の分類(ATT&CK)が何を表すかを知る必要がある
  from: [Q1.1, Q1.2, Q1.3]
- question: Q2
  answer: 複数の案件の間では、届いた順ではなく、影響の大きさなどの要因で優先順位を付けるとされる(NISTはインシデントについて、民間の解説はアラートについて述べる)。1件の中で何から確かめるかは出典で食い違い、NISTはインシデントが起きたかの確認を深刻度の見積もりより前に置き、民間の解説は優先順位付けを真偽の判定より前に置く。NISTの撤回済みの版は、順序は常に守るものではないとしていた
  from: [Q2.1, Q2.2]
- question: Q3.1
  answer: 閉じてよい条件は、調べた公的な文書に書かれていなかった。製品の文書と民間の解説には、閉じるときに分類を付けるものがあるが、正確だが無害なアラートの分類の仕方は文書によって違う。民間の解説は、調べたことと判断を記録し、誤検知を検知ルールの調整に使い、定期的に見直すとする
  unresolved: '「閉じるときに分類を付けるものがある」が子の Q3.1.1 から導けない(Q3.1.1 は「アラートやインシデントに分類を付ける」)(checks/2-answers-4.yaml)。往復の上限(2回)のため直さない。主張に使うときはこの部分に頼らない'
  from: [Q3.1.1, Q3.1.2]
  assumes: [閉じてよい条件は組織が決める(D001。上げる条件について NIST が組織の方針に委ねることから、閉じる条件にも当てはめる)]
- question: Q3.3
  answer: 上げる条件の具体的な線は組織が決める。NIST(Rev.3)は判断の材料としてリスク評価の要因(資産の重要度、影響、活動の段階など)を挙げ、標準ではない実務者向けの資料は、横展開の証拠、持ち時間の中で判定できないこと、守備範囲を超えることを挙げ、迷うときは上げる側に倒すとする。上げるときに経過、証拠、判定の仮説、次の手順を添えることも、実務者向けの資料が述べる
  from: [Q3.3.1, Q3.3.3]
- question: Q3
  answer: 閉じる、調査を続ける、上げるの具体的な線は、調べた公的な文書に書かれていなかった(上げる判断について、NIST は組織の方針で定めるとする)。公開資料にあるのは判断の材料で、閉じるときの分類(製品の文書と民間の解説)と記録(民間の解説)、調査で確かめる範囲(インシデントと判断した後の初動として、撤回済みの NIST の版)、1件の持ち時間の目安(実務者向けの解説1件)、上げる判断の要因(NIST Rev.3 と実務者向けの資料)である
  unresolved: '「NIST は組織の方針で定める」の根拠は撤回済みの Rev.2(F409)だけで、その明示がなく、子の答えにもない(checks/2-answers-4.yaml)。往復の上限(2回)のため直さない。主張に使うときはこの部分に頼らない'
  from: [Q3.1, Q3.2, Q3.3]
- question: Q4
  answer: 本物の攻撃のアラートを見過ごした事案では、頻繁に鳴るアラートを誤検知とみなした可能性が推定されている。アラートを無視する行動は、過去の誤検知の経験やキューの混雑と結び付けて報告されているが、無視したアラートが本物の攻撃だったかは示されていない。上げるのが遅れる誤りと、上げすぎる誤りは、公開の測定が見つからなかった。いずれも新人に限った調査ではない
  from: [Q4.1, Q4.2, Q4.3]

# ---------- 根の問い ----------
- question: Q0
  answer: 閉じる、調査を続ける、上げるの具体的な線は、調べた公的な文書に書かれていなかった。公開資料にある材料から組み立てた案は次の通りである。アラートを受けたら、そのアラートが何を根拠に出たかとログを確かめて、誤検知か、想定内の検知か、攻撃(侵害に至らなかった試みを含む)の疑いかを区別し、影響の大きさなどの要因で優先順位を付ける。誤検知か想定内の検知だと根拠をもって言えれば記録して閉じ、持ち時間の中で判定できないとき、重要な資産や横展開の疑いがあるとき、迷うときは、経過と証拠を添えて上げる。何から確かめるかの順序は出典で食い違う
  from: [Q1, Q2, Q3, Q4]
  assumes: [インシデントについての NIST の考え方(優先順位の要因)と、標準ではない実務者向けの資料の条件を、アラートの一次解析にも当てはめる]
