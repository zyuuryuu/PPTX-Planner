<div class="top"><div class="h">1つのSOCの実測では、侵害に至った攻撃は0.01%、攻撃の試みは27%以上、想定内は49%以上</div><div class="src">出典: Yangら(USENIX Security 2024)。1つのSOCのネットワークの検知(Zeek)の2020年12月〜2022年7月のアラート約1,443万件を著者らが分類。27%と49%は下限。分類できないものが約24%残る</div><div class="fig"><svg width="1184" height="380" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#374151"/></marker></defs><path d="M190,190 L190.0,25.0 A165,165 0 0 1 353.7,210.7 z" fill="#EA580C" stroke="#111827" stroke-width="6"/><path d="M190,190 L353.7,210.7 A165,165 0 0 1 25.3,179.6 z" fill="#0E7490" stroke="#fff" stroke-width="2"/><path d="M190,190 L25.3,179.6 A165,165 0 0 1 190.0,25.0 z" fill="#D1D5DB" stroke="#fff" stroke-width="2"/><rect x="420" y="50" width="34" height="34" fill="#7F1D1D"/><text x="468" y="77" font-size="26" text-anchor="start" fill="#111827">侵害に至った攻撃 0.01%(細すぎて円に出ない)</text><rect x="420" y="116" width="34" height="34" fill="#EA580C"/><text x="468" y="143" font-size="26" text-anchor="start" fill="#111827" font-weight="bold">攻撃の試み 27%以上</text><rect x="420" y="182" width="34" height="34" fill="#0E7490"/><text x="468" y="209" font-size="26" text-anchor="start" fill="#111827">想定内の検知 49%以上</text><rect x="420" y="248" width="34" height="34" fill="#D1D5DB"/><text x="468" y="275" font-size="26" text-anchor="start" fill="#111827">分類できないもの 約24%</text></svg></div></div>
