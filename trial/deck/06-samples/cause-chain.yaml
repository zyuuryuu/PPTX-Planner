# 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
id: ch2-s8
status: done
headline: 誤検知の原因には、弱いルールや緩く書かれたルールなど、検知の条件の誤りがある
takeaway: 誤検知の原因は、活動の側ではなく検知の条件の側にある
body:
  type: cause-chain
  chain:
  - 検知のルールが緩く書かれている
  - 無害な通信にも条件が合ってしまう
  - 誤検知
  example: 架空の例
  highlight: chain[0]
sources:
- F208
- F214
notes: NIST の文書は弱いシグネチャを原因に挙げ、実務者の一部は緩く書かれたシグネチャを挙げた。資料では「ルール」と呼ぶ。
