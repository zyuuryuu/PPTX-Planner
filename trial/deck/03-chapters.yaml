# 章構成(工程3)。研修資料の chapter_order(目標、全体像、単元ごとの説明と演習、まとめ)を出発点にした。
# 章の message は、依頼者の指定で章扉に映せる1〜2行にした。限定と条件は中のスライドで示す(D005)。
# 章の枚数の合計は47。残りの3枚を付録(omitted の3件)に充て、50枚に収める。
# 手順(C2)と基準(C3)は1つの章に入れ、確かめる段階ごとに基準を対にする(工程0の検査の提案)。
order:
  conclusion: first
  basis: structure
chapters:
  - id: ch1
    kind: intro
    title: この講義で身につけること
    message: アラートは、誤検知、想定内の検知、攻撃の疑いの3つに分ける。根拠をもって誤検知か想定内と言えるものだけを記録して閉じ、迷ったら上げる
    slides: 4
    slides_reason: 結論と講義の進め方だけを示し、説明は本論に回すため少なくする
  - id: ch2
    kind: body
    title: アラートは本物の攻撃とは限らない
    message: アラートは本物の攻撃とは限らない。1つのSOCのネットワークの検知の実測では、侵害に至らなかった攻撃の試みと想定内の検知が多くを占めた
    claims: [C1]
    slides: 11
    slides_reason: 新人は SIEM、EDR、ログの見方、攻撃の手口の分類を知らず(ブリーフ)、誤検知と想定内の検知のパターンも依頼者が残すよう求めたため、多く充てる。ログの種類(Q1.2)と攻撃の手口の分類(Q1.3)は、C1 の問い Q1 の子として、この章で扱う
  - id: ch3
    kind: body
    title: 1件のアラートの扱い方
    message: 閉じる・調べる・上げるの線は、調べた公的な文書にない。この講義は、3つに分けて根拠があるものだけを閉じ、迷ったら上げる案と、このSOCの運用を示す
    claims: [C2, C3]
    slides: 18
    slides_reason: 講義の目的そのもので、新人の3つの懸念(何を見ればよいか、閉じるのが怖い、どこまで調べたら上げるか)の全てに答える章のため、最も多く充てる。工程5で、運用を1つの流れにまとめる1枚を足した(依頼者の指示、D009)
  - id: ch4
    kind: body
    title: 誤りやすい点
    message: 解析者は誤検知に慣れると、本物の攻撃のアラートを見過ごしうる。この講義は、これを、根拠をもって言えるものだけを閉じる理由として示す
    claims: [C4]
    slides: 5
    slides_reason: 新人の懸念「間違って閉じるのが怖い」の裏側(慣れによる見過ごし)を示すが、閉じ方の手順は第3章で教えるため少なくする
  - id: ch5
    kind: closing
    title: 演習とまとめ
    message: 新人は、この講義の最後の演習で、架空のアラートを3つに分け、閉じる、調べる、上げるのどれにするかと根拠を答え、配属から3か月で1人で決められるようにする
    slides: 10
    slides_reason: 習得を演習で確かめる(ブリーフ)。架空のアラート1件につき問題と解説の2枚を4件分(8枚)と、章扉、章のまとめ(講義全体のまとめを兼ねる)の2枚を充てる
omitted:
  - question: Q4.2
    to: appendix
    reason: 上げるのが遅れる誤りを直接測った公開の調査がなく、本論で教える材料がない。限界として付録に示す
  - question: Q4.3
    to: appendix
    reason: 上げすぎる誤りの測定がなく、依頼者の運用(攻撃の試みは全て上げる)では新人の判断の対象でない。付録に示す
  - question: Q1.1.2
    to: appendix
    reason: 届く量は出典で大きく違い、新人が1件を扱う手順には要らない。数字を問われたときのために付録に示す
contradictions: []
objections:
  - claim: C1
    index: 0
    to: body
  - claim: C1
    index: 1
    to: body
  - claim: C3
    index: 0
    to: body
  - claim: C3
    index: 1
    to: body
  - claim: C3
    index: 2
    to: body
  - claim: C3
    index: 3
    to: body
