# スライド仕様: ch3(工程7)。型の見本(06-samples/)の仕様は、PMが写した。執筆のセッションは書き直さない。
- id: ch3-s1
  status: done
  headline: 何から確かめるかは出典で食い違い、NISTは確認を、民間の解説は優先付けを判定より先に置く
  takeaway: 公的な順序は1つに決まっていないため、この講義は案として順を決める
  body:
    type: table
    columns:
    - 出典
    - 対象
    - 段の順(前から)
    rows:
    - - NIST SP 800-61 Rev.3
      - インシデントの報告
      - 起きたかの確認、重さと対応の緊急度の見積もり
    - - 民間の解説
      - アラート
      - 取り込み、分類、優先付け、調べる、本物か誤検知かの判定
    highlight: columns[2]
  sources:
  - F303
  - F312
  notes: 右の列を左から読む。NISTは、新しいインシデントの報告について、起きたかを確かめた後に、重さと対応の緊急度を見積もる。民間の解説は、本物か誤検知かの判定より前に優先付けを置く。NISTの対象はアラートではなくインシデントの報告で、インシデントはNISTの語のまま載せている。民間の解説の段は判定の後にも続き、表は判定までを載せた。この解説は、どの段を飛ばしても誤って分ける危険が増すとする。次は、閉じる・調べる・上げるの線がどこに決められているか。
- id: ch3-s2
  status: done
  headline: 閉じる・調べる・上げるの線は調べた公的な文書になく、この講義の線は案とこのSOCの運用である
  takeaway: この講義の線を、公的な基準として扱わない
  body:
    type: plain-list
    title: 調べた公的な文書の線は、なし
    items:
    - text: この講義の線の出どころ
      sub:
      - 案(公開資料の材料から組み立てたもの)
      - このSOCの運用(リーダーが決めたもの)
    highlight: title
  text: NISTは、インシデントの宣言に組織が定めた基準を当てはめるとし、誤検知として閉じる条件は定めていない
  sources:
  - F600
  - F610
  notes: NIST SP 800-61 Rev.3 は、インシデントを宣言するかの判断に、組織が定めた基準を当てはめ、既知の誤検知を考慮するよう推奨する。優先度付けや上げる判断はリスク評価の要因に基づけるとし、要因は例示で、その組み合わせは組織の必要と成熟度によるとする。案は公開資料の材料から組み立てたもの、このSOCの運用はリーダーが決めたもの。1つの線が両方を使うこともある。以降のスライドは、図の上の札で案と運用を見分けられる。
- id: ch3-s3
  status: done
  headline: 案として、重大度で上げるものを除いた後、根拠とログで3つに分け、影響で優先度を付ける
  takeaway: 民間の解説とは逆に、優先度は3つに分けた後に付ける
  body:
    type: step-flow
    mark: 案
    numbering: 0
    steps:
    - name: 重大度を見る
      description:
      - 製品の重大度が High 以上なら
      - text: 上げる
        color: 上げる
      - (このSOCの運用)
      next: それ以外
    - name: 3つに分ける
      description:
      - 根拠とログで
      - 誤検知、想定内の検知、攻撃の疑い
    - name: 優先度を付ける
      description: 影響の大きさで
    highlight: steps[1]
  text: 複数のアラートの間は、届いた順ではなく優先度の順に扱う。NISTはインシデントについて述べ、この講義はアラートにも当てはめる
  sources:
  - F303
  - F305
  - F009
  notes: 最初の段はこのSOCの運用で、製品が付けた値で線を引くため、新人が自分で重大度を判断しなくてよい。分ける段を優先度の段より前に置いたのは、NISTがインシデントの報告について、起きたかの確認を重さの見積もりより前に置くことに合わせたため。NISTは、資源に限りがあるため、インシデントを届いた順に扱わないとする。次は、分ける段で使う根拠の確かめ方。
- id: ch3-s4
  status: done
  headline: 案として、アラートを出したルールの条件と、含まれる利用者や端末を、元のログと照らす
  takeaway: アラートの記載だけで、根拠があるとは判断しない
  body:
    type: step-flow
    mark: 案
    steps:
    - name: アラートを読む
      description: アラートを出したルールの条件と、アラートに含まれる利用者や端末を読む
    - name: 元のログと照らす
      description: 読んだ条件と利用者や端末を、元のログで確かめる
    highlight: steps[1]
  sources:
  - F709
  - F710
  notes: 製品の文書(Microsoft Sentinel)の例では、ルールは集めたデータに定期的に問い合わせ、探しているものを見つけるとアラートを出す。アラートは、関わる利用者、端末、アドレスなどを含む。最も一般的な種類のルールは、定めた遡りの期間の生データを調べ、結果の件数がルールの閾値を超えるとアラートを出す。ほかの種類のルールは別の動き方をする。この2段は、その仕組みから組み立てた案。次は、誤検知として閉じてよいとき。
- id: ch3-s5
  status: done
  headline: 案として、検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる
  takeaway: 正しく反応した想定内の検知は、誤検知としては閉じない
  body:
    type: plain-list
    mark: 案
    title: 誤検知として閉じてよい2つの理由
    items:
    - 検知の条件の誤り(ルールの誤り、誤った設定)
    - データの誤り
    highlight: title
  text: どちらの誤りかを根拠をもって言えないものは、誤検知として閉じない
  sources:
  - F605
  - F609
  - F220
  notes: 2つの理由は、製品の文書(Microsoft Sentinel)が閉じるときに選ばせる誤検知の分類、「アラートの論理が誤り」と「データが誤り」から取った。Yangらは、誤検知を、悪いルールや誤り、誤った設定によって無害な活動に誤って反応したアラートとし、正しく反応したが業務上説明のつく想定内の検知とは別のものとする。Microsoft Defender for Endpoint の文書も、分類の前に、アラートが正確か、誤検知か、無害かを判断するよう求める。ただし、正確だが無害なアラートの分類は、同じ会社の製品の文書の間で扱いが異なる。次は、想定内の検知として閉じてよいとき。
- id: ch3-s6
  status: done
  headline: このSOCでは、新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけ
  takeaway: 攻撃のスキャンと似て見える社内のスキャンは、一覧で見分ける
  body:
    type: statement
    mark: 運用
    text: 新人が自分で閉じてよいのは、誤検知と、リーダーが事前に一覧にした想定内の活動(承認済みのスキャン、委託した診断など)に当てはまるものだけ
    caveat: 一覧にない活動は、新人が想定内の検知として閉じる対象に入らない
    highlight: caveat
  sources:
  - F002
  - F220
  - F215
  notes: 想定内の検知は、検知の条件どおりに正しく反応したが、業務上は問題のない活動によるアラート。Yangらが調べた1つのSOCでは、定期的な社内の脆弱性スキャンが、悪性のスキャンと似た振る舞いをしながら、無視してよいアラートの原因として最初に挙げられていた。一覧は、こうした活動をリーダーが事前に書き出したもの。次は、優先度の付け方。
- id: ch3-s7
  status: done
  headline: 案として、優先度は製品の重大度だけでなく、資産の重要度、影響、活動の段階で付ける
  takeaway: 重大度が同じアラートでも、要因が違えば優先度は変わりうる
  body:
    type: plain-list
    mark: 案
    title: 優先度の要因の例
    items:
    - 資産の重要度
    - 機能への影響、データへの影響
    - 活動の段階
    highlight: title
  text: 民間の解説は、SIEMが付けた重大度は判断の材料であり、判断の代わりではないとする
  sources:
  - F610
  - F305
  - F306
  notes: 要因は NIST SP 800-61 Rev.3 の例示から取った。NISTの例示には、ほかに脅威主体の特徴と回復可能性がある。要因の間に順序や重みの定めはなく、どの要因を使うかは組織の必要と成熟度による。活動の段階は、ch2-s5 の ATT&CK の戦術で表せる。民間の解説はSIEMの重大度について述べており、この講義は製品の重大度を優先度の材料の1つとして扱う。次は、閉じるときに残すもの。
- id: ch3-s9
  status: done
  headline: 案として、閉じるときは、発火した内容、調べたこと、証拠、下した判断を記録する
  takeaway: 記録は事務の手間ではなく、後から判断をたどる材料になる
  body:
    type: plain-list
    mark: 案
    title: 閉じるときに記録する4項目
    items:
    - 発火した内容
    - 調べたこと
    - 見つかった証拠
    - 下した判断
    highlight: title
  sources:
  - F318
  notes: 民間の解説は、本物か誤検知かを問わず、閉じた全てのアラートに記録を残すとし、記録を組織の記憶と呼ぶ。誤検知として閉じるときも、想定内の検知として閉じるときも、4項目をそろえる。同じページに、閉じた判断を監査や承認する手順は書かれていない。次は、間違って閉じたらどうなるか。
- id: ch3-s10
  status: done
  headline: このSOCでは、新人が閉じたアラートは後で見直される
  takeaway: 閉じる判断は、新人1人で終わらない
  body:
    type: statement
    mark: 運用
    text: 閉じたものは、後で見直される
    caveat: 見直しの材料は、閉じるときに残した記録(ch3-s9)
    highlight: text
  sources:
  - F004
  - F318
  notes: 見直すのはリーダーかベテランで、頻度は決まっていない。民間の解説は、閉じた全てのアラートに記録を残すとするが、見直しの手順は書いていない。この講義は、その記録を見直しの材料として使う。記録の4項目がそろっていれば、見直す人が判断をたどれる。次は、どこまで調べたら上げるか。
- id: ch3-s11
  status: done
  headline: このSOCでは、配属から3か月の新人の持ち時間は1件30分で、過ぎたら見たことを付けて上げる
  takeaway: 決められないまま調べ続けず、時間で区切って上げる
  body:
    type: statement
    mark: 運用
    text: 持ち時間は、新人が1件のアラートを調べてよい時間。配属から3か月は1件30分で、過ぎたら、そこまでに見たことを付けて上げる
    caveat: 30分は測って決めた値ではなく、外の目安(一次解析の担当で{F403})より長めに取った
    highlight: text
  sources:
  - F005
  - F403
  notes: 外の目安は、実務者向けの解説記事(標準や公的文書ではない)が、Tier 1(一次解析の担当)のアラート1件について一般的とする値で、根拠となる調査は記事中で確認できていない。その記事も、時間内に判定に達しなければ、記録した要約を付けて上げ、その場で調べ続けないとする。新人は慣れていないため、リーダーがそれより長めに取った。次は、30分を待たずに上げるとき。
- id: ch3-s16
  status: done
  headline: このSOCでは、製品の重大度が High 以上のアラートは30分を待たずにすぐ上げる
  takeaway: 上げるかは、調べ始める前にも確かめる
  body:
    type: statement
    mark: 運用
    text: 重大度は、製品(SIEM、EDR)がアラートに付けた値。High 以上なら、持ち時間を待たずにすぐ上げる
    caveat: 新人が自分で重大度を判断しなくてよいように、製品の値で線を引く
    highlight: text
  sources:
  - F005
  - F009
  notes: 製品は、High、Critical などの値で重大度を付ける。このSOCでは、その値が High 以上なら、調べ始める前に上げる。優先度(ch3-s7)とは別のもので、優先度は複数のアラートのどれから扱うかの順位。次は、上げる条件の案。
- id: ch3-s12
  status: done
  headline: 案として、重要な資産での疑い、横展開の証拠、守備範囲の超過のどれかなら上げる
  takeaway: 誤検知と想定内の検知のほかは、上げる側に入る
  body:
    type: plain-list
    mark: 案
    title: 上げる条件(どれか1つで上げる)
    items:
    - 重要な資産での攻撃の疑い
    - 横展開(入り込んだ端末から別の端末へ広がること)の証拠
    - 事前に決めた自分の守備範囲を超える
    highlight: title
  sources:
  - F406
  - F407
  notes: 重要な資産は、資産の重要度の階層で上位にある資産。横展開は複数の端末にまたがる。守備範囲は、技術の範囲と、調べる権限の範囲を指し、権限の限界に達したら直ちに上げる。どちらの出典も実務者向けの解説で、標準や公的文書ではない。片方は時間の目安を書いていない。もう片方は、持ち時間の中で判定できないアラートも上げる条件に挙げる(ch3-s11)。次は、迷ったとき。
- id: ch3-s13
  status: blocked
  issue: 未起票(PMに報告)。描画の道具の flowchart は場面の全てのつながりを描こうとし、立証設計の view(start A-investigate、要素3つ)のように場面の一部だけを描くと、D-op-alert から出る道でエラーになる(unrendered)。いいえの道の条件(30分で根拠なし)も図に出ない
  headline: このSOCでは、30分調べても閉じる根拠がなく迷うなら、閉じずに上げる
  takeaway: 迷うなら、上げすぎる側に倒す
  body:
    type: flowchart
    mark: 運用
    scenario: S-newbie-ops
    start: A-investigate
    proposal_parts:
    - R-op-fp
    labels:
      A-investigate: "調べる\n(30分まで)"
      R-op-fp:
        condition: "誤検知と\n根拠をもって\n言えた?"
      R-op-inv-esc:
        condition: 30分で根拠なし
    highlight: A-escalate
  sources:
  - F005
  - F006
  - F405
  notes: 調べる段から出る道は2つだけ。誤検知と根拠をもって言えたら、記録して閉じる。言える基準は案(ch3-s5)。30分たっても閉じる根拠がなければ、見たことを付けて上げる。迷っている状態は、閉じる根拠がない状態として扱う。有志の手順書(標準ではない)も、迷うときは上げすぎる側に倒すとし、これは最も重大な場合に限らない一般の規則である。上げると決めるところまでが、新人が1人で行う判断。次は、攻撃の試みの扱い。
- id: ch3-s14
  status: done
  headline: このSOCでは、配属から3か月の新人は攻撃の試みも全て上げ、溢れたらリーダーが対処する
  takeaway: 上が溢れるかは、新人が判断に入れなくてよい
  body:
    type: statement
    mark: 運用
    text: 配属から3か月の新人は、侵害に至らなかった攻撃の試みを、全て上げる
    caveat: 上げたものが溢れるかは、リーダーの側で対処する
    highlight: text
  sources:
  - F003
  - F207
  notes: 攻撃の試みは、侵害に至らなかった攻撃によるアラート。ch2-s6 で見た1つのSOCの実測では、攻撃の試みは下限の値でも、侵害に至った攻撃({F207})よりはるかに多い。全て上げれば、上げる件数は多くなる。それでも配属から3か月は全て上げ、溢れるかはリーダーの側で対処する。新人が背負うことではない。次は、上げるときに添えるもの。
# 見本 06-samples/plain-list.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch3-s15
  status: done
  headline: 案として、上げるときは、出どころとID、調べた経過、証拠、判定の仮説、次の手順を添える
  takeaway: 文脈のない引き継ぎでは、受けた側が調べ直すことになる
  body:
    type: plain-list
    mark: 案
    title: 上げるときに添える5項目
    items:
    - アラートの出どころとID
    - 調べた経過
    - 集めた証拠
    - 現時点の判定の仮説
    - 次に勧める手順
    highlight: title
  sources:
  - F413
  - F414
  notes: 送信元のIPアドレスを書き漏らすと、受けた側が元のイベントを探し直すことになる(F414 の例)。
# 見本 06-samples/flowchart.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch3-s17
  status: done
  headline: 配属から3か月の新人は、重大度 High 以上か攻撃の試みなら上げ、一覧なら閉じ、残りは調べる
  takeaway: 上げる条件を先に見る。閉じるのは、一覧にあるか、調べて誤検知と言えたときだけ
  body:
    type: flowchart
    mark: 運用
    scenario: S-newbie-ops
    proposal_parts:
    - R-op-fp
    labels:
      D-op-alert: "届いた\nアラート"
      R-op-severe:
        condition: "重大度が\nHigh以上?"
        label: すぐ上げる
      R-op-attempt:
        condition: "攻撃の\n試み?"
      R-op-list:
        condition: 一覧にある?
      R-op-fp:
        condition: 誤検知と根拠をもって言えた
      R-op-inv-esc:
        condition: 30分で根拠なし
    highlight:
      ids:
      - R-op-severe
      - R-op-attempt
      label: 先に確かめる
  sources:
  - F002
  - F003
  - F005
  - F006
  - F007
  - F008
  - F009
  notes: 上から順に確かめ、最初に当たった道に進む。重大度は製品が付けた値。一覧にある作業でも重大度が High 以上なら上げる。
