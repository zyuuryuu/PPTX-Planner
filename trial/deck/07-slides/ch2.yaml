- id: ch2-s6
  status: done
  headline: 1つのSOCの実測では、侵害に至った攻撃は0.01%、攻撃の試みは27%以上、想定内は49%以上
  takeaway: 誤検知でも想定内でもない攻撃の試みが、少なくとも4分の1ある
  body:
    type: pie-chart
    data:
    - label: 侵害に至った攻撃
      value: F207
    - label: 攻撃の試み
      value:
        fact: F207
        as: 27
      bound: 以上
    - label: 想定内の検知
      value:
        fact: F207
        as: 49
      bound: 以上
    - label: 分類できないもの
      value:
        fact: F207
        as: 23.72
        round: 0
    highlight: 攻撃の試み
  sources:
  - F207
  notes: 27%と49%は論文が「少なくとも」とする下限。想定内の検知は明確な証拠があるものだけを数えた。
# 執筆のセッションが書いた
- id: ch2-s7
  status: done
  headline: 「8割が誤検知」に近い値は、調べた範囲ではベンダーの調査の自己申告(83%)だけだった
  takeaway: 83%の「誤検知」には、想定内の検知が含まれている可能性がある
  body:
    type: statement
    quote_of: F204
    text: 受けるアラートの{F204}は、誤検知で、時間をかける価値がない
    attribution: 大きな組織の解析者の回答。原文(英語)の日本語訳。測った値ではなく、自己申告である
    caveat: 「誤検知」の定義は示されていない
    highlight: caveat
  text: 別の論文は、誤検知と、正しく反応した想定内の検知を、分けて定義している
  sources:
  - F204
  - F220
  notes: 「アラートの8割は誤検知」という話を聞いたことがあるかもしれない。調べた範囲で8割に近い値は、このベンダーの調査で解析者が答えた{F204}だけだった。ベンダーの調査で、宣伝の目的を含むため、一次情報としては扱わない。回答者は、ベンダーが委託した調査会社が選んだ、従業員の多い大きな組織の解析者に限られる。強調したのは、この調査が「誤検知」の定義を示していない点。Yangらの論文は、想定内の検知を、組織の環境で業務上正当で許容される挙動によって説明される、正しく反応したアラートと定義し、一般に言う誤検知(悪いルール、エラー、誤った設定などで、無害な挙動に誤って反応したアラート)とは違うと述べる。調査の回答者の言う「誤検知」に想定内の検知が入っていても、区別できない。実測の内訳は ch2-s6 で示した。次の ch2-s8 では、誤検知がなぜ起きるのかを見る。
# 見本 06-samples/cause-chain.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch2-s8
  status: done
  headline: 誤検知の原因には、弱いルールや緩く書かれたルールなど、検知の条件の誤りがある
  takeaway: 誤検知の原因は、活動の側ではなく検知の条件の側にある
  body:
    type: cause-chain
    chain:
    - 検知のルールが緩く書かれている
    - 無害な通信にも条件が合ってしまう
    - 誤検知
    example: '架空の例: 「宛先のポートが443」だけを条件にしたルールは、ふつうのWebの閲覧にも合う'
    highlight: chain[0]
  sources:
  - F208
  - F214
  notes: NIST の文書は弱いシグネチャを原因に挙げ、実務者の一部は緩く書かれたシグネチャを挙げた。資料では「ルール」と呼ぶ。
# 執筆のセッションが書いた
- id: ch2-s9
  status: done
  headline: 1つのSOCの実測では、社内の脆弱性スキャンや外部の診断が想定内の検知を起こしていた
  takeaway: 攻撃と似た振る舞いでも、業務で説明できれば想定内の検知になる
  body:
    type: plain-list
    title: どちらも業務上正当な活動で、ルールは正しく反応した
    items:
    - text: 定期的な社内のスキャン(脆弱性と設定の不備の確認)
      sub:
      - 悪意のあるスキャンと似た振る舞いをするが、アラートは無視してよかった
      - 1つのSOCで、想定内の検知の共通の原因の1つ
    - text: 外部のセキュリティベンダーによる診断(ペネトレーションテストと年次の監査)
      sub:
      - 既知のベンダーのIPアドレスで、対応するアラートを見分けた
    highlight: title
  text: 想定内の検知は、ルールどおりに正しく反応したが、業務上は問題のない活動によるアラートである
  sources:
  - F215
  - F221
  notes: 2つとも1つのSOCの実測の例。どちらもルールは正しく反応しており、ルールの誤りによる誤検知とは違う。社内のスキャンは、論文が想定内の検知の最初の共通の原因として挙げたもの。論文の語は benign trigger。論文のSOCとは別に、私たちのSOC(この講義を行うSOC)では、新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけで、ch3-s6 で扱う。
