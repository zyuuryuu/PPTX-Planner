# 見本 06-samples/er-diagram.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch2-s1
  status: done
  headline: アラートは、検知の仕組みが探すものを見つけたときの知らせで、本物の攻撃とは限らない
  takeaway: アラートは「条件に合った」という知らせで、「攻撃だ」という判定ではない
  body:
    type: er-diagram
    elements:
    - E-sentinel-source
    - D-sentinel-data
    - E-sentinel-rule
    - D-sentinel-alert
    relations:
    - R-sentinel-source-data
    - R-sentinel-rule-data
    - R-sentinel-rule-alert
    labels:
      R-sentinel-source-data: 集める
      R-sentinel-rule-data: 問い合わせる
      R-sentinel-rule-alert: 生成する
    annotations:
      D-sentinel-alert: ルールが探すものを見つけたときに出る
    highlight: D-sentinel-alert
  text: 1つのSOCのネットワークの検知の実測では、侵害に至った攻撃に関連するアラートは {F207}
  sources:
  - F709
  - F619
  - F207
  notes: 製品の例は Microsoft Sentinel。ほかの製品でも、条件に合うと知らせる点は同じだが、仕組みの細部は製品ごとに違う。内訳は ch2-s6 で示す。
# 執筆のセッションが書いた
- id: ch2-s2
  status: done
  headline: SIEMは、最も一般的にはルールで複数のログの記録値を照合し、重要なイベントを特定する
  takeaway: SIEMの材料は、全てのログ源から集めたログである
  body:
    type: architecture-diagram
    elements:
    - E-log-source
    - E-siem-server
    - D-significant-event
    relations:
    - R-source-server-push
    - R-server-significant
    labels:
      R-source-server-push: ログを送る
      R-server-significant: 相関させ、特定する
    details:
      E-siem-server:
      - 相関で最も一般的なのはルール(ログ管理ソフトウェア一般の記述)
    annotations:
      E-log-source: エージェントなしの場合の例
    highlight: E-siem-server
  text: イベントは、システムやネットワークで起きた出来事そのもので、良い悪いは問わない
  sources:
  - F100
  - F101
  notes: 左のログの発生源がSIEMのサーバにログを送り、サーバが全てのログ源のデータを分析して、イベントを相関させる。強調したサーバが、このスライドの要点。サーバの中の注記のとおり、相関で最も一般的なのは、時刻、IPアドレス、イベントの種別などの記録値で複数のログ項目を照合するルールによる相関で、統計の手法や可視化の道具による相関もある。ルールは、検知の仕組みが、イベントがアラートに当たるかを決める条件のこと。右の「重要と判断されたイベント」は、まだアラートではない。出典の文書は、重要なイベントに優先順位を付けることも挙げるが、脚注によると一部のSIEM製品の機能である。次の ch2-s3 では、端末の記録を集めるEDRを見る。
# 見本 06-samples/architecture-diagram.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch2-s3
  status: done
  headline: EDRは端末の振る舞いの記録を継続して集め、製品の例では脅威を検知するとアラートを作る
  takeaway: EDRの材料は、端末の振る舞いを集め続けた記録である
  body:
    type: architecture-diagram
    elements:
    - E-endpoint
    - E-edr-agent
    - E-edr-central-db
    - E-mde
    - E-mde-sensor
    - D-mde-telemetry
    - D-mde-alert
    relations:
    - R-endpoint-agent
    - R-agent-central-db
    - R-mde-sensor
    - R-mde-alert
    groups:
    - title: EDRの要件の例(NCA)
      elements:
      - E-endpoint
      - E-edr-agent
      - E-edr-central-db
      caption: プロセス、接続、ファイルなどの端末の記録を集める
    - title: 製品の例(Microsoft Defender for Endpoint)
      elements:
      - E-mde
      - E-mde-sensor
      - D-mde-alert
      direction: TB
    labels:
      E-edr-agent: エージェント
      E-mde: Defender for Endpoint
      D-mde-telemetry: 製品が集める記録
      R-endpoint-agent: ''
      R-agent-central-db: ''
      R-mde-alert: 作る
    details:
      D-mde-telemetry:
      - プロセス
      - ネットワーク
      - ログオン
      - レジストリとファイルの変更
    highlight: groups[0]
  sources:
  - F615
  - F616
  - F618
  - F619
  notes: 左は要件の文書、右は製品の文書で、出典が違う。右の記録からアラートへの経路は出典に書かれていないので描かない。
# 執筆のセッションが書いた
- id: ch2-s4
  status: done
  headline: アラートの詳細はOSのログで確かめることが多く、認証のログは通常、接続元と成否を残す
  takeaway: アラートを確かめる材料は、アラートの外のログにある
  body:
    type: plain-list
    title: 2つのログと、そこから分かること
    items:
    - text: OSのログ
      sub:
      - 特定のホストの不審な活動の特定と調査に最も役立つ
      - セキュリティソフトが不審な活動を見つけた後に、詳細を得るために参照されることが多い
    - text: 認証のログ(ディレクトリサーバとシングルサインオンサーバを含む)
      sub:
      - 認証の試行ごとに、接続元、ユーザー名、成否、日時を通常は記録する
    highlight: items[0]
  text: ログは、イベントを書き残したものである
  sources:
  - F111
  - F108
  - F110
  - F107
  notes: 強調したのはOSのログ。セキュリティソフトが不審な活動を見つけた後に、詳細を得るためによく参照される。OSの監査記録には、認証の成功と失敗、ファイルへのアクセス、セキュリティポリシーの変更、アカウントの変更、権限の使用などが含まれる。これは例示で、記録する事象の種類は、OSによっては管理者が指定できる。認証のログからは、だれが、どこから、いつ認証を試み、成功したかが分かる。セキュリティソフトの側にもログがあり、マルウェア対策ソフトの最も一般的な形であるウイルス対策ソフトは、通常、検出したマルウェア、駆除の試み、隔離を記録する。出典の文書は、OSのログについて「しばしば」、認証サーバのログについて「通常は」と書いている。次の ch2-s5 では、アラートの活動を攻撃の手口の分類に当てはめる。
# 見本 06-samples/tree.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch2-s5
  status: done
  headline: 案として、ATT&CKの戦術で、アラートの活動が攻撃のどの段階かを表し、優先度の材料にする
  takeaway: 戦術に当てはめると、そのアラートが攻撃のどこにいるかを言える
  body:
    type: tree
    root: ATT&CK
    levels:
    - 戦術(なぜ)の例
    - 技術(どのように)の例
    children:
    - 初期アクセス
    - name: 実行
      children:
      - コマンドの実行
    - 横展開
    - 持ち出し
    aside:
      mark: 案
      text: 架空のアラート「見慣れないコマンドが動いた」は戦術「実行」に当たる。これを優先度の要因「活動の段階」に使う
    highlight: 実行
  sources:
  - F114
  - F116
  - F125
  - F610
  notes: 戦術と技術の名前は例示で、ATT&CK の全体ではない。当てはめ方と優先度へのつなぎ方は案。
# 見本 06-samples/pie-chart.yaml から
