# 第5章 演習とまとめ のスライド仕様(工程7)
# 演習の問題(s1、s3、s5、s7)の項目の値は架空で、事実のIDによらない(style.yaml の exceptions、D013)。
- id: ch5-s1
  status: done
  headline: '演習1: 一覧に載ったスキャン用の端末から、一覧の時刻に、多数の宛先への接続のアラートが届いた'
  takeaway: 端末と時刻を一覧の行と照らし、行き先と根拠を答える
  body:
    type: plain-list
    title: 演習1のアラート(架空)
    items:
    - 'ルール: 短い時間に多数の宛先への接続'
    - '接続元の端末: 端末A'
    - '時刻: 火曜 02:10'
    - '宛先の数: 1,200'
    - 'リーダーの一覧(架空)の抜粋: 脆弱性スキャン、端末A、毎週火曜 02:00〜04:00'
    highlight: items[4]
  sources: []
  notes: >-
    架空のアラートです。受講者に、閉じる、調べる、上げるのどれにするかと、その根拠を答えてもらいます。
    読み方: 上の4行がアラートの項目、最後の行がリーダーの一覧の抜粋です。
    強調した一覧の行と、アラートの接続元の端末と時刻を見比べるよう促します。
    答えは次のスライドで示します。
- id: ch5-s2
  status: done
  headline: '演習1の答え: 端末と時刻が一覧と合うため、想定内の検知として記録して閉じる'
  takeaway: 閉じる根拠は、一覧の行という確かめられるものに置く
  body:
    type: statement
    mark: 運用
    text: 接続元の端末と時刻が、一覧の脆弱性スキャンの行に当てはまる。照らした行を記録し、想定内の検知として閉じる
    caveat: '当てはめた規則(ch3-s6): 新人が想定内の検知として閉じてよいのは、リーダーの一覧にある活動だけ'
    highlight: caveat
  sources: []
  notes: >-
    ch3-s6 の規則を当てはめます。根拠は、アラートの端末と時刻が、一覧の行と両方とも合うことです。
    記録には、照らした一覧の行を書きます。
    時刻が一覧の時間帯の外であれば、一覧に当てはまらないため、想定内の検知としては閉じられません。
    次の演習2は、ルールの条件そのものに目を向ける問題です。
- id: ch5-s3
  status: done
  headline: '演習2: 管理ツールの定期の通信に、緩く書かれたルールが反応したアラートが届いた'
  takeaway: ルールの条件と反応した通信を照らし、行き先と根拠を答える
  body:
    type: plain-list
    title: 演習2のアラート(架空)
    items:
    - 'ルールの条件: 一定の間隔で繰り返す通信を、接続元を問わず検知する'
    - '接続元: 管理ツールのサーバ'
    - '通信の周期: 5分ごと(定期)'
    highlight: items[0]
  sources: []
  notes: >-
    架空のアラートです。受講者に、閉じる、調べる、上げるのどれにするかと、その根拠を答えてもらいます。
    強調したルールの条件を読み、接続元で絞っていないことに気づかせます。
    条件が緩いため、管理ツールのサーバの定期の通信にも合います。
    演習1との違い(条件どおりの反応か、条件そのものの誤りか)を考えるよう促し、次のスライドで答えを示します。
- id: ch5-s4
  status: done
  headline: '演習2の答え: 検知の条件が無害な活動に反応した誤検知として、根拠を記録して閉じる'
  takeaway: 誤検知と言う根拠は、検知の条件かデータのどこが誤りかで示す
  body:
    type: statement
    mark: 案
    text: ルールの条件が、接続元を問わず定期の通信に合うように書かれている。検知の条件の誤りと根拠をもって言えるため、誤検知として、その根拠を記録して閉じる
    caveat: '当てはめた規則(ch3-s5): 検知の条件かデータの誤りで出たと根拠をもって言えるときだけ、誤検知として閉じる'
    highlight: caveat
  sources: []
  notes: >-
    ch3-s5 の規則を当てはめます。この規則は案で、公開資料の材料からこの講義が組み立てた基準です。このSOCの運用ではありません。
    演習1は、ルールが条件どおりに正しく反応した想定内の検知でした。
    演習2は、ルールの条件そのものが緩く、無害な活動に反応した誤検知です。
    記録には、条件のどこが緩いか(接続元で絞っていないこと)を書きます。次は、外部からの攻撃の通信の演習です。
- id: ch5-s5
  status: done
  headline: '演習3: 外部から既知の攻撃の通信が届き、防がれた記録があるアラートが届いた'
  takeaway: 防がれた記録をどう扱うかを考え、行き先と根拠を答える
  body:
    type: plain-list
    title: 演習3のアラート(架空)
    items:
    - 'ルール: 既知の攻撃の通信の形に一致'
    - '接続元: 外部(社外のアドレス)'
    - '防がれた記録: 通信を遮断したと記録されている'
    highlight: items[2]
  sources: []
  notes: >-
    架空のアラートです。受講者に、閉じる、調べる、上げるのどれにするかと、その根拠を答えてもらいます。
    強調した防がれた記録を見て、防がれたことが行き先を変えるかどうかを問います。
    答えは次のスライドで示します。
- id: ch5-s6
  status: done
  headline: '演習3の答え: 侵害に至らなかった攻撃の試みで、配属から3か月の新人は全て上げる'
  takeaway: 防がれたかどうかは、新人が閉じてよい理由にならない
  body:
    type: statement
    mark: 運用
    text: 通信は防がれ、侵害に至っていないが、攻撃の試みにあたる。新人は、攻撃の試みも全て上げる
    caveat: '当てはめた規則(ch3-s14): 新人は攻撃の試みも全て上げ、溢れたらリーダーが対処する'
    highlight: caveat
  sources: []
  notes: >-
    ch3-s14 の規則を当てはめます。このSOCの運用です。
    攻撃の試みは、侵害に至らなかった攻撃によるアラートです。誤検知でも想定内の検知でもないため、閉じる対象になりません。
    防がれた記録は、上げるときに添える証拠になります。ただし、添える項目は案です(ch3-s15)。
    次の演習4は、一覧にない活動を扱います。
- id: ch5-s7
  status: done
  headline: '演習4: 重要でない業務用のPCで、一覧にない見慣れないプロセスが動いたアラートが届いた'
  takeaway: 一覧に当てはまらない活動の行き先を、根拠とともに答える
  body:
    type: plain-list
    title: 演習4のアラート(架空)
    items:
    - '端末: 業務用のPC(重要でない資産)'
    - 'プロセス名: helper_sync.exe(見慣れない名前)'
    - text: リーダーの一覧(架空)の抜粋
      sub:
      - '脆弱性スキャン: 端末A、毎週火曜 02:00〜04:00'
      - '委託した診断: 端末B、11月10日〜14日'
    - '一覧との照合: 当てはまる行がない'
    highlight: items[3]
  sources: []
  notes: >-
    架空のアラートです。受講者に、閉じる、調べる、上げるのどれにするかと、その根拠を答えてもらいます。
    強調した照合の結果を見せ、一覧のどの行にも当てはまらないことを確かめます。
    端末が重要でない資産であることも読み取らせ、それが行き先を変えるかを問います。
    答えは次のスライドで示します。
- id: ch5-s8
  status: done
  headline: '演習4の答え: 閉じずに調べ、30分の中で誤検知と根拠をもって言えなければ、見たことを付けて上げる'
  takeaway: 資産が重要でないことは、閉じる根拠にならない
  body:
    type: statement
    mark: 運用
    text: 一覧に当てはまらないため、想定内の検知としては閉じられない。持ち時間の中で調べ、誤検知と根拠をもって言えなければ、見たことを付けて上げる
    caveat: '当てはめた規則: ch3-s11(持ち時間)、ch3-s13(迷うなら上げる)、ch3-s6(想定内の検知として閉じてよいのは一覧にある活動だけ)。誤検知と言える基準は案(ch3-s5)'
    highlight: caveat
  sources: []
  notes: >-
    3つの規則を順に当てはめます。いずれもこのSOCの運用です。ただし、誤検知と言える基準は案です(ch3-s5)。
    1つ目に、一覧に当てはまる行がないため、想定内の検知としては閉じられません(ch3-s6)。
    2つ目に、新人の持ち時間の中で調べます(ch3-s11)。
    3つ目に、持ち時間の中で閉じる根拠がなく迷うなら、閉じずに、見たことを付けて上げます(ch3-s13)。
    端末が重要でない資産であることは、閉じてよい理由にはなりません。
