# スライド仕様: ch4(工程7)。型の見本(06-samples/)の仕様は、PMが写した。執筆のセッションは書き直さない。
# 見本 06-samples/statement.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch4-s1
  status: done
  headline: 2013年のTargetの侵害では、緊急のアラートが出たが対応がなかったと報告されている
  takeaway: 検知の仕組みが攻撃を捉えていても、アラートを扱う人の側で見過ごしは起こりうる
  body:
    type: statement
    text: 侵入を検知する製品は、データを持ち出すためのマルウェアが導入されるたびに緊急のアラートを出したが、Targetのセキュリティチームは対応しなかった
    caveat: 報告は公開情報にもとづき、新たな技術的事実は示していない
    highlight: text
  sources:
  - F500
  notes: 報告は報道(Bloomberg Businessweek)を引いてこの経過を述べている。強調したいのは、検知の製品はアラートを出していた、という点である。見落としたのは検知の仕組みではなく、アラートを受けた側だった。報告によれば、チームはマルウェアを自動で削除する機能も許可していなかった。では、なぜ対応がなかったのか。次のスライドで、報告の推定を見る。
- id: ch4-s2
  status: done
  headline: 米上院の報告は、アラートが頻繁だったなら、誤検知とみなされた可能性があると推定する
  takeaway: 見過ごしの原因は確かめられていないが、慣れが見過ごしにつながりうる
  body:
    type: statement
    quote_of: F501
    text: システムが頻繁に警報を鳴らしていたのであれば、職員はこのアラートを誤検知とみなした可能性がある
    attribution: 報告の原文(英語)の日本語訳。報道を引いた記述
    caveat: 推定であり、確認された原因ではない
    highlight: caveat
  sources:
  - F501
  notes: 報告は報道(Bloomberg Businessweek)を引いて推定を述べている。報告自身は原因を確かめていない。
- id: ch4-s3
  status: done
  headline: ベンダーの調査では、IT専門職の56%が、過去の誤検知を理由にアラートを無視したと答えた
  takeaway: 過去の誤検知の経験が、次のアラートを無視する理由になりうる
  body:
    type: statement
    text: 回答者の{F506}
    caveat: ベンダー(Imperva)の調査で、製品の宣伝を含む。回答者はSOCの解析者に限らず、回答は自己申告
    highlight: text
  sources:
  - F506
  notes: 大きく示した値は、過去の誤検知を理由にアラートを無視したことがある、と答えた回答者の割合である。強調したいのは、半数を超える回答者がそう答えた点である。ただし、調査はベンダーが自社の製品の宣伝を含めて公表したもので、回答者はSOCの解析者に限らず、回答は自己申告である。無視したアラートが本物の攻撃だったかどうかは、この調査には示されていない。また、回答者の言う誤検知は原文の false positive で、この講義の誤検知の定義と同じとは限らない。前のスライドまでの事案と合わせ、誤検知に慣れると、本物の攻撃のアラートを見過ごしうる。だから、閉じてよいのは根拠をもって誤検知か想定内の検知と言えるものだけになる。
