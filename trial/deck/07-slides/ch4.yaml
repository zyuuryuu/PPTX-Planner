- id: ch4-s3
  status: blocked
  issue: null   # Issue の番号は PM が付ける
  headline: ベンダーの調査では、IT専門職の56%が、過去の誤検知を理由にアラートを無視したと答えた
  reason: >-
    型 pie-chart(holds: partition、proportional)に要る残りの区分の値がない。F506 は「無視したことがある」の56%だけを述べ、
    残り(無視したことがない、または無回答)の値は statement、quote、qualifiers のどれにもない。
    56%だけでは構成比の合計が100%にならず、描画の道具がエラーを出す(「構成比の合計が 56% で、100% にならない」)。
    {fact: F506, as: 44} は事実の本文に44がないためエラーになる。差を計算して書くのは、事実にない数値を置くことになる。
    また、ラベル(無視したことがある/ない)に style.yaml の色の割り当てがなく、灰色で描いた警告が出る。
    立証設計の show は「1本の帯で示す」とあり、型(円グラフ)とも合わない。
    直し方の候補: 残りの値を台帳の事実として足す(回答の内訳が出典にあるか、または100から引いた値を派生の事実として認めるか)、
    色の割り当てを足す、あるいは型を statement に変える。どれにするかは上流の判断。
