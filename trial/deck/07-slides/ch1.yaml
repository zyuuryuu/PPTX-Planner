# スライド仕様: ch1(工程7)。型の見本(06-samples/)の仕様は、PMが写した。執筆のセッションは書き直さない。
# 見本 06-samples/step-flow.yaml から
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
  # 型の見本のスライド仕様(工程6)。工程7でそのまま使う。
- id: ch1-s1
  status: done
  headline: 重大度 High 以上はまず上げ、残りを3つに分けて、閉じる・調べる・上げるを決める
  takeaway: 最初に重大度を見る。残りを3つに分け、それから行き先を決める
  body:
    type: step-flow
    numbering: 0
    steps:
    - name: 重大度を見る
      description:
      - 製品の重大度が High 以上なら
      - text: まず上げる
        color: 上げる
      next: それ以外
    - name: 3つに分ける
      description:
      - 誤検知
      - 想定内の検知
      - 攻撃の疑い
    - name: 行き先を決める
      description: 閉じる、調べる、上げる
    highlight: steps[0]
  sources:
  - F009
  notes: この順は第3章の最後の流れ図と同じ。区分と行き先はひとつずつ対応するわけではなく、どの区分がどの行き先になるかは第3章で扱う。
- id: ch1-s2
  status: done
  headline: 根拠をもって誤検知か想定内と言えるものだけを記録して閉じ、迷ったら上げる
  takeaway: 閉じてよいのは誤検知と想定内の検知だけで、攻撃の疑いは閉じない
  body:
    type: statement
    text: 想定内の検知は、リーダーが作った一覧に当てはまるものだけを閉じる。案として、誤検知は、根拠をもって誤検知と言えるものだけを閉じる
    caveat: どちらとも言えないものは閉じずに調べ、持ち時間まで調べても迷うなら上げる
    highlight: text
  sources: []
  notes: 閉じてよい2つの条件を順に読み上げ、どちらも「だけ」が付くことを強調する。一覧は第3章(ch3-s6)、誤検知の根拠は第2章(ch2-s8)で扱う。どのアラートを調べ、どれを上げるかの詳しい流れは第3章の最後(ch3-s17)で示す。「間違って閉じるのが怖い」という不安には、根拠が言えなければ閉じない、という線で答える。次の章では、アラートとは何かから始める。
