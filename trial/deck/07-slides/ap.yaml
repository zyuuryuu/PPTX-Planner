- id: ap-s2
  status: done
  headline: 上げるのが遅れる誤りも、上げすぎる誤りも、割合を測った公開の調査は見つからなかった
  takeaway: 近い調査が示したのは、調べる操作の数、引き継ぐと答えた割合、上げる圧力の証言である
  body:
    type: statement
    text: Kerstenらの実験では、上げるべきアラートは、そうでないものより、調べる操作が平均で多かった。Moosmannらの事前調査では、不確かなときにチケットを作って引き継ぐと答えたのは、解析者12人のうち{F509}だった。Alahmadiらの聞き取りでは、外部委託のSOC(MSSP)の解析者が、疑わしいアラートをできる限り全て顧客に上げる圧力を語った。
    caveat: 上げるのが遅れる誤りの割合はKerstenらとMoosmannらで、上げすぎる誤りの割合はAlahmadiらで、測られていない
    highlight: caveat
  sources:
  - F508
  - F509
  - F510
  notes: >-
    ch3-s11 の持ち時間で上げる決まりについて、誤りの割合を問われたときに使う。
    近い調査を1つずつ、何を測ったかで読む。
    Kerstenらは、商用SOCと協力した think-aloud(考えを声に出しながら作業してもらう)実験で、一次解析を担う解析者(出典の語で Tier-1)5人が400件を調べた様子を記録した(F508)。上げるべきアラートはそうでないものより調べる操作が平均で多いため、解析者はそこに時間と認知の負担をかける可能性が高い、というのは著者らの推論である。上げるのが遅れる誤りを直接測った結果ではない。
    Moosmannらの数字は、SOC解析者12人が事前の質問票に答えた自己申告で、同僚に相談するは92%、自分で調べるは71%だった(F509)。実際に上げるのが遅れたかは測っておらず、著者らも一般化を主張していない。
    Alahmadiらは実務者21人の質的調査で、顧客に報告する立場のMSSPの解析者が、能力不足と見られることや罰金を避けるために、疑わしいアラートをできる限り全て上げる圧力を受けると述べた証言(参加者A1、A2、D6、E7)を挙げている(F510)。上げすぎの割合は測っていない。
    強調するのは下の枠で、上げるのが遅れる誤りの割合はKerstenらとMoosmannらで、上げすぎる誤りの割合はAlahmadiらで、測られていない、という点である。
