# テストの場面と、期待する結果(工程4)。
- scenario: 主な読み手の通読
  expected: 各章の出口で、定めた到達点の通りの状態になる。最後に、アラートを誤検知、想定内の検知、攻撃の疑いの3つに分け、根拠をもって誤検知か想定内と言えるものだけを記録して閉じ、迷ったら上げることと、このSOCの運用(閉じてよい範囲、攻撃の試みは最初の3か月は全て上げる、閉じたものは後で見直される)を述べられる。演習の4件で、閉じる・調べる・上げると根拠を答えられる。未回答の疑問がない
- scenario: 反対の立場の通読
  expected: 「8割は誤検知なので誤検知の見分け方で足りる」「環境を知らずに想定内と言えるのか」「公的な基準がないのに教えてよいのか」「1人で決められるのか」「攻撃の試みを全て上げると溢れる」「間違って閉じたら取り返しがつかない」の全てに、本編で答えを得る
- scenario: 要約だけ
  expected: アラートを3つに分け、根拠をもって誤検知か想定内と言えるものだけを記録して閉じ、迷ったら上げる、という結論を述べられる。理由は要約の文に含めない(D004)
- scenario: 途中から
  applicable: false
  reason: 講義で映して口頭で説明する資料で、配布して途中から読ませない
- scenario: 発表の通し
  expected: ノートを話として順に読んで、話が切れずにつながる。90分の講義2回(区切りは第3章の途中)に収まる
- scenario: 過去の指摘
  expected: 依頼者の過去の指摘が再発していない。3つの行き先が「閉じる・調べる・上げる」で揃っている。誤検知と想定内の検知を混同していない。製品の「インシデント」を資料の「インシデント」と混同していない。章扉と要約の文が1〜2行である。新人に見せない言葉(依頼者、同意など)がない
