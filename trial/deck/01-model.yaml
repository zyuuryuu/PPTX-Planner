scenarios:
  - id: S-siem-agent
    name: SIEM でエージェント型でログを集め、アラートを出すまで(NIST SP 800-92)
    steps: [R-agent-server, R-server-significant, R-siem-alert]
    evidence: [F703, F100, F705]
    note: 最後の段(R-siem-alert)はログ管理基盤一般の記述(F705)で、主体は SIEMサーバではなく SIEM(基盤)とした。発生源からエージェントへの段は出典にない
  - id: S-siem-agentless-push
    name: SIEM でエージェントなし(push)でログを集め、アラートを出すまで(NIST SP 800-92)
    steps: [R-source-server-push, R-server-significant, R-siem-alert]
    evidence: [F702, F100, F705]
    note: 最後の段(R-siem-alert)はログ管理基盤一般の記述(F705)
  - id: S-siem-agentless-pull
    name: SIEM でエージェントなし(pull)でログを集め、アラートを出すまで(NIST SP 800-92)
    steps: [R-server-source-pull, R-server-significant, R-siem-alert]
    evidence: [F702, F100, F705]
    note: 最後の段(R-siem-alert)はログ管理基盤一般の記述(F705)
  - id: S-sentinel
    name: Microsoft Sentinel でデータを集め、アラートとインシデントにするまで
    steps: [R-sentinel-source-data, R-sentinel-rule-data, R-sentinel-rule-alert, R-sentinel-alert-incident]
    evidence: [F709]
    note: Microsoft Sentinel
  - id: S-edr-collect
    name: EDR が端末のデータを集めるまで(NCA)
    steps: [R-endpoint-agent, R-agent-central-db]
    evidence: [F616]
    note: NCA の要件。この後の分析への経路は出典にないため、S-edr-detect と分けた
  - id: S-edr-detect
    name: EDR が脅威を識別し、職員に通知するまで(NCA)
    steps: [R-edr-detection, R-edr-notify]
    evidence: [F617, F707]
    note: NCA の要件。順序の根拠は 4-7 の「潜在的な脅威を識別したときに通知する」(F707)
  - id: S-mde
    name: Microsoft Defender for Endpoint が脅威を検知し、アラートとインシデントにするまで
    steps: [R-mde-alert, R-mde-alert-incident]
    evidence: [F619]
    note: Microsoft Defender for Endpoint。テレメトリの収集(R-endpoint-mde)が検知の前に来ることは出典に書かれていないため、含めない
  - id: S-symantec
    name: Symantec EDR が端末の事象から悪意のある可能性のある振る舞いを識別するまで
    steps: [R-sep-symedr, R-symedr-malicious]
    evidence: [F620]
    note: Symantec EDR(NIST SP 1800-24C の構築例)
