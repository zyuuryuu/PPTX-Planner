    - 'deck-types.md#置き場と追加'
    - 'deck-types.md#付属する定義'
    - 'vocabulary.md#スライドの区分'
    - 'organization.md#設計セッション'
    - 'organization.md#ユーザーとのやり取り'
    - 'rework.md#役割'
    - 'rework.md#不合格のときの手順'
  checks: [K00-01, K00-02, K00-03, K00-04, K00-05, K00-06, K00-08, K00-09]
  next: [create-style]

# inputs: 資料の型の定義と個人の表現規約も読む。どちらもファイル名の定めがない
