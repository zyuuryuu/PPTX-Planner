# 工程表(下書き)。工程の文書(stages/)を、作業に分けた一覧。
# 作業は、1つの担当が、決まった入力から決まった成果物を作る、ひとまとまりの仕事である。
# 正本は工程の文書である。この表は、工程の文書と検査の台帳(checks.yaml)から起こした下書きで、食い違う場合は工程の文書に従う。
# 起こしたときの数、割り当たらなかった見出し、決められなかった点は、tasks-draft-report.md にある。
#
# 項目:
#   id          変わらない短い英語の名前
#   stage       工程の番号。複数の工程で行う作業は並べる
#   name        日本語の名前
#   role        担当。user(ユーザー) / designer(設計セッション) / pm(PM) / collector(収集セッション) /
#               writer(執筆のセッション) / inspector(検査セッション) / reader(読み手の役のセッション) / machine(機械)。
#               文書に定めがない作業は null
#   inputs      読む成果物のファイル名
#   outputs     作る、または書き換える成果物のファイル名
#   sections    手順が書かれている、工程の文書の見出し
#   references  手順を行うのに読む、工程の文書の外の文書と見出し
#   checks      担当が自分で満たす、または判定する検査のID
#   next        次に行う作業の id。分かれる場合と、順序の定めがない場合は並べる
# 「#」で始まる行は、文書から決められなかった点と、作業を行う条件の覚え書きである。
# 合格条件、開始の条件、終了の条件の見出しは sections に入れていない。条件は checks のIDで渡す。

count: 100
tasks:

# ---- 工程0

