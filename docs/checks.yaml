  judge: inspector

- id: K00-06
  stage: 0
  target: "ブリーフ: 全体"
  check: "検査セッションがブリーフだけを読んで、「誰に、何のために、何の問いに答える資料か」を要約する。その要約が自分の意図と合っている"
