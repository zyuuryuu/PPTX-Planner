  judge: machine

- id: K00-02
  stage: 0
  target: "ブリーフ: 主な読み手、目的、答えるべき問いの状態"
  check: "主な読み手、目的、答えるべき問いが確定である。この3つは未定を認めない"
  judge: machine

- id: K00-03
  stage: 0
