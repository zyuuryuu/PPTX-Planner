- id: K00-08
  stage: 0
  target: "ブリーフ: 外に出せない情報"
  check: "「外に出せない情報」が確定である。画像を使う資料では、未定を認めない"
  judge: machine

- id: K00-09
  stage: 0
  target: "ブリーフ: 全体"
  check: "ブリーフの内容に同意する"
